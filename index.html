nt-size=\"12\">negative<\/text><\/svg>"}], "pitfalls": ["Don't forget + c on indefinite integrals.", "If the curve crosses the axis, split the integral at the root.", "You can't integrate a product or quotient term by term: expand or simplify first."], "examples": [{"q": "Find the area enclosed by y = x² − 4x and the x-axis.", "steps": ["Roots: x(x − 4) = 0, so x = 0 and x = 4.", "∫₀⁴ (x² − 4x) dx = [x³/3 − 2x²]₀⁴ = 64/3 − 32 = −32/3.", "The region is below the axis, so the area is the magnitude."], "a": "32/3 square units"}, {"q": "dy/dx = 6x² − 2 and the curve passes through (1, 5). Find y.", "steps": ["y = 2x³ − 2x + c.", "At (1, 5): 5 = 2 − 2 + c, so c = 5."], "a": "y = 2x³ − 2x + 5"}], "questions": [{"q": "Find ∫ 6x² dx.", "o": ["12x + c", "2x³ + c", "6x³ + c", "3x² + c"], "a": 1, "e": "6 × x³/3 = 2x³, plus c."}, {"q": "Find ∫ (4x³ + 2x) dx.", "o": ["x⁴ + x² + c", "12x² + 2 + c", "4x⁴ + 2x² + c", "x⁴ + 2x² + c"], "a": 0, "e": "4x⁴/4 + 2x²/2 = x⁴ + x²."}, {"q": "Find ∫ x^(−2) dx.", "o": ["−2x⁻³ + c", "x⁻¹ + c", "−x⁻¹ + c", "x⁻³/3 + c"], "a": 2, "e": "x⁻¹/(−1) = −1/x."}, {"q": "Find ∫ √x dx.", "o": ["½x^(−1/2) + c", "x^(3/2) + c", "(3/2)x^(3/2) + c", "(2/3)x^(3/2) + c"], "a": 3, "e": "x^(1/2) integrates to x^(3/2) ÷ (3/2) = (2/3)x^(3/2)."}, {"q": "Evaluate ∫₀² 3x² dx.", "o": ["8", "12", "6", "4"], "a": 0, "e": "[x³]₀² = 8 − 0 = 8."}, {"q": "Evaluate ∫₁³ (2x + 1) dx.", "o": ["8", "10", "12", "6"], "a": 1, "e": "[x² + x]₁³ = (9 + 3) − (1 + 1) = 10."}, {"q": "Why is + c needed in indefinite integration?", "o": ["To make the answer positive", "Because c = 0 always", "Because constants differentiate to zero, so any constant could have been there", "To find the area"], "a": 2, "e": "Many functions have the same derivative, differing by a constant."}, {"q": "dy/dx = 2x + 3 and the curve passes through (0, 4). Find y.", "o": ["y = x² + 3x", "y = 2x² + 3x + 4", "y = x² + 4", "y = x² + 3x + 4"], "a": 3, "e": "y = x² + 3x + c, and at x = 0, y = 4, so c = 4."}, {"q": "A definite integral of a curve gives a negative value. What does this mean?", "o": ["The region is below the x-axis", "The answer is wrong", "The curve has no area", "The curve is above the x-axis"], "a": 0, "e": "Integrals count area below the axis as negative."}, {"q": "Find ∫ (x + 1)² dx.", "o": ["(x + 1)³ + c", "x³/3 + x² + x + c", "x³/3 + x + c", "2(x + 1) + c"], "a": 1, "e": "Expand: x² + 2x + 1, then integrate term by term."}, {"q": "Find the area under y = x² from x = 0 to x = 3.", "o": ["27", "3", "9", "6"], "a": 2, "e": "[x³/3]₀³ = 27/3 = 9."}, {"q": "Find ∫ (x³ + x)/x dx.", "o": ["(x⁴/4 + x²/2)/(x²/2) + c", "x³ + c", "x² + 1 + c", "x³/3 + x + c"], "a": 3, "e": "Simplify first: x² + 1, then integrate."}, {"q": "Evaluate ∫₁⁴ x^(−1/2) dx.", "o": ["2", "4", "1", "3"], "a": 0, "e": "[2x^(1/2)]₁⁴ = 4 − 2 = 2."}, {"q": "The area between y = 4 − x² and the x-axis is:", "o": ["16/3", "32/3", "8", "16"], "a": 1, "e": "Roots ±2. ∫₋₂² (4 − x²) dx = [4x − x³/3] = (8 − 8/3) − (−8 + 8/3) = 32/3."}, {"q": "How do you find the area between two curves that cross at x = a and x = b?", "o": ["Add the integrals of each", "Multiply the integrals", "Integrate (upper curve − lower curve) from a to b", "Integrate the lower curve only"], "a": 2, "e": "The difference in heights gives the height of each thin strip."}, {"q": "Find the area between y = x and y = x² from x = 0 to x = 1.", "o": ["1/2", "1/3", "1", "1/6"], "a": 3, "e": "∫₀¹ (x − x²) dx = ½ − ⅓ = 1/6."}, {"q": "Integration is the reverse of which process?", "o": ["Differentiation", "Expansion", "Factorisation", "Logarithms"], "a": 0, "e": "This is the Fundamental Theorem of Calculus."}, {"q": "Find ∫ 5 dx.", "o": ["5 + c", "5x + c", "0", "5x²/2 + c"], "a": 1, "e": "5 = 5x⁰, which integrates to 5x."}, {"q": "y = x³ − x crosses the x-axis at −1, 0 and 1. What is the total area enclosed with the axis from x = −1 to x = 1?", "o": ["0", "1/4", "1/2", "1"], "a": 2, "e": "Each part has area ¼ (one above, one below). The integral gives 0, but the total area is ½."}, {"q": "Evaluate ∫₂³ 6/x² dx.", "o": ["−1", "6", "3", "1"], "a": 3, "e": "[−6/x]₂³ = −2 − (−3) = 1."}, {"q": "f′(x) = 3x² − 4 and f(2) = 7. Find f(x).", "o": ["x³ − 4x + 7", "x³ − 4x", "3x³ − 4x + 7", "x³ − 4x + 15"], "a": 0, "e": "f(x) = x³ − 4x + c. f(2) = 8 − 8 + c = 7, so c = 7."}, {"q": "Find ∫ (2/x³) dx.", "o": ["−1/x⁴ + c", "−1/x² + c", "1/x² + c", "−6/x⁴ + c"], "a": 1, "e": "2x⁻³ → 2x⁻²/(−2) = −x⁻²."}]}, {"id": "p10", "order": 10, "year": 1, "section": "P", "badge": "J", "spec": "J", "title": "Vectors", "desc": "Vectors in two dimensions, magnitude and direction, unit vectors, position vectors, and using vectors to solve geometric problems.", "practicals": [], "summary": [{"h": "Vector basics", "p": ["A **vector** has **magnitude** and **direction**. A **scalar** has only magnitude.", "Write vectors as **ai + bj** or as column vectors (a, b).", "Add and subtract component by component. Multiplying by a scalar changes the length (and reverses direction if negative).", "Two vectors are **parallel** if one is a scalar multiple of the other."]}, {"h": "Magnitude and direction", "p": ["`|ai + bj| = √(a² + b²)`", "Direction: the angle with the positive x-axis is found using tan θ = b/a (draw a sketch to check the quadrant).", "A **unit vector** has magnitude 1: unit vector in the direction of **a** is **a**/|**a**|."]}, {"h": "Position vectors and geometry", "fig": "vectors", "cap": "With position vectors a and b, the vector from A to B is b − a (go back along a, then along b). The midpoint M of AB has position vector a + ½(b − a) = ½(a + b).", "p": ["The **position vector** of A is **OA** = **a**.", "`AB = OB − OA = b − a`", "Distance between A and B = |**b** − **a**|.", "Midpoint M of AB: **OM** = ½(**a** + **b**).", "Points are **collinear** if the vectors between them are parallel and share a point."], "svg": "<svg role=\"img\" aria-label=\"With position vectors a and b, the vector from A to B is b − a (go back along a, then along b). The midpoint M of AB has position vector a + ½(b − a) = ½(a + b).\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 290\"><defs><marker id=\"f-vectors-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-vectors-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-vectors-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-vectors-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><circle cx=\"60\" cy=\"260\" r=\"3.5\" class=\"cf\"/><text x=\"52\" y=\"276\" text-anchor=\"end\" font-size=\"14\">O<\/text><text x=\"172\" y=\"72\" text-anchor=\"end\" font-size=\"14\">A<\/text><text x=\"408\" y=\"186\" font-size=\"14\">B<\/text><line x1=\"60\" y1=\"260\" x2=\"180\" y2=\"80\" class=\"ac\" marker-end=\"url(#f-vectors-aa)\"/><text x=\"100\" y=\"160\" class=\"ta\" text-anchor=\"end\" font-size=\"16\">a<\/text><line x1=\"60\" y1=\"260\" x2=\"400\" y2=\"180\" class=\"ac\" marker-end=\"url(#f-vectors-aa)\"/><text x=\"240\" y=\"240\" class=\"ta\" text-anchor=\"middle\" font-size=\"16\">b<\/text><line x1=\"180\" y1=\"80\" x2=\"400\" y2=\"180\" class=\"gl\" marker-end=\"url(#f-vectors-ag)\"/><text x=\"300\" y=\"112\" class=\"tg\" font-size=\"15\">AB = b − a<\/text><circle cx=\"290\" cy=\"130\" r=\"4\" class=\"gf\"/><text x=\"280\" y=\"152\" class=\"tg\" text-anchor=\"end\" font-size=\"13\">M<\/text><line x1=\"60\" y1=\"260\" x2=\"290\" y2=\"130\" class=\"lm\" marker-end=\"url(#f-vectors-am)\"/><\/svg>"}], "pitfalls": ["AB = **b − a**, not a − b. Think 'end minus start'.", "For direction, check the quadrant: tan⁻¹ gives an angle between −90° and 90°.", "Parallel vectors can point in opposite directions (negative scalar multiple)."], "examples": [{"q": "A has position vector 2i + 3j and B has position vector 6i − j. Find |AB|.", "steps": ["AB = (6 − 2)i + (−1 − 3)j = 4i − 4j.", "|AB| = √(16 + 16) = √32."], "a": "4√2"}, {"q": "Find the unit vector in the direction of 3i − 4j.", "steps": ["|3i − 4j| = √(9 + 16) = 5.", "Divide by 5."], "a": "(3/5)i − (4/5)j"}], "questions": [{"q": "Find (3i + 2j) + (i − 5j).", "o": ["2i + 7j", "4i − 3j", "4i + 7j", "3i − 10j"], "a": 1, "e": "Add components: (3 + 1)i + (2 − 5)j."}, {"q": "Find the magnitude of 5i + 12j.", "o": ["13", "17", "√17", "169"], "a": 0, "e": "√(25 + 144) = √169 = 13."}, {"q": "Find 3(2i − j).", "o": ["5i + 2j", "6i − j", "6i − 3j", "2i − 3j"], "a": 2, "e": "Multiply each component by 3."}, {"q": "Which vector is parallel to 2i − 3j?", "o": ["3i − 2j", "2i + 3j", "−3i + 2j", "−4i + 6j"], "a": 3, "e": "−4i + 6j = −2(2i − 3j)."}, {"q": "What is the unit vector in the direction of 6i + 8j?", "o": ["0.6i + 0.8j", "6i + 8j", "0.8i + 0.6j", "i + j"], "a": 0, "e": "Magnitude 10, so divide each component by 10."}, {"q": "A = (1, 4) and B = (5, 2). What is vector AB?", "o": ["−4i + 2j", "4i − 2j", "6i + 6j", "4i + 2j"], "a": 1, "e": "b − a = (5 − 1)i + (2 − 4)j."}, {"q": "Find the angle 3i + 3j makes with the positive x-axis.", "o": ["30°", "60°", "45°", "90°"], "a": 2, "e": "tan θ = 3/3 = 1, so θ = 45°."}, {"q": "What is the position vector of the midpoint of A(2i + 6j) and B(4i − 2j)?", "o": ["6i + 4j", "i − 4j", "2i − 8j", "3i + 2j"], "a": 3, "e": "½(a + b) = ½(6i + 4j) = 3i + 2j."}, {"q": "What is a scalar?", "o": ["A quantity with magnitude only", "A quantity with direction only", "A unit vector", "A position vector"], "a": 0, "e": "E.g. speed and distance are scalars; velocity and displacement are vectors."}, {"q": "Find |−2i + j|.", "o": ["√3", "√5", "3", "1"], "a": 1, "e": "√(4 + 1) = √5."}, {"q": "Find the distance between A(1, 1) and B(4, 5) using vectors.", "o": ["7", "25", "5", "√7"], "a": 2, "e": "AB = 3i + 4j, |AB| = 5."}, {"q": "2i + kj is parallel to 4i + 10j. Find k.", "o": ["10", "20", "2", "5"], "a": 3, "e": "4i + 10j = 2(2i + 5j), so k = 5."}, {"q": "Find the angle between 4i − 3j and the positive x-axis (below the axis).", "o": ["36.9° below the x-axis", "53.1° below", "36.9° above", "143.1°"], "a": 0, "e": "tan θ = 3/4, θ ≈ 36.9°, and the j-component is negative."}, {"q": "Points A, B, C with AB = 2i + j and BC = 6i + 3j. What can you conclude?", "o": ["AB is perpendicular to BC", "A, B and C are collinear", "AB = BC", "Nothing"], "a": 1, "e": "BC = 3AB, so they're parallel, and they share point B."}, {"q": "Find a − b if a = 4i + j and b = i − 2j.", "o": ["5i − j", "3i − j", "3i + 3j", "−3i − 3j"], "a": 2, "e": "(4 − 1)i + (1 − (−2))j = 3i + 3j."}, {"q": "A vector has magnitude 10 and direction 30° above the positive x-axis. What is it in component form?", "o": ["5i + 5√3j", "10i + 10j", "8.66i − 5j", "5√3i + 5j"], "a": 3, "e": "10cos 30° = 5√3 and 10sin 30° = 5."}, {"q": "What is the magnitude of a unit vector?", "o": ["1", "0", "It depends", "√2"], "a": 0, "e": "By definition, a unit vector has length 1."}, {"q": "OA = a and OB = b. What is BA?", "o": ["b − a", "a − b", "a + b", "−a − b"], "a": 1, "e": "BA = OA − OB = a − b."}, {"q": "Find |3i − 4j| × 2.", "o": ["14", "7", "10", "25"], "a": 2, "e": "|3i − 4j| = 5, so 10."}, {"q": "M is the midpoint of AB. Which is OM?", "o": ["b − a", "a + b", "2(a + b)", "a + ½(b − a)"], "a": 3, "e": "OM = OA + ½AB = a + ½(b − a) = ½(a + b)."}, {"q": "Which of these is a vector quantity?", "o": ["Velocity", "Speed", "Mass", "Time"], "a": 0, "e": "Velocity has size and direction."}, {"q": "Find the angle between −i + √3 j and the positive x-axis.", "o": ["60°", "120°", "30°", "150°"], "a": 1, "e": "The vector is in the second quadrant. tan⁻¹(√3) = 60°, so the angle is 180° − 60° = 120°."}]}, {"id": "s1", "order": 11, "year": 1, "section": "S", "badge": "K·L", "spec": "K, L", "title": "Sampling and data presentation", "desc": "Populations and samples, sampling methods, the large data set, measures of location and spread, outliers, diagrams, and correlation.", "practicals": [], "summary": [{"h": "Sampling", "p": ["A **population** is the whole set of items of interest. A **sample** is a subset. A **census** measures every member.", "**Simple random sampling**: every sample of size n is equally likely (e.g. random number generator).", "**Systematic**: every kth item from a list, starting at a random point.", "**Stratified**: the population is split into groups (strata) and sampled in **proportion** to group size.", "**Quota**: interviewer picks people to fill quotas for each group. Non-random, may be biased.", "**Opportunity**: whoever is available. Easy but likely to be biased.", "Be familiar with the AQA **large data set** and its context."]}, {"h": "Measures of location and spread", "p": ["**Mean** x̄ = Σx/n. **Median**: middle value. **Mode**: most common.", "**Range**, **interquartile range** (IQR = Q₃ − Q₁), **variance** and **standard deviation**.", "`Variance = Σx²/n − x̄²` and `standard deviation = √variance`.", "**Coding**: if y = (x − a)/b, then ȳ = (x̄ − a)/b and σᵧ = σₓ/b.", "**Outliers**: often defined as more than 1.5 × IQR beyond the quartiles, or more than 2 standard deviations from the mean."]}, {"h": "Diagrams", "fig": "box-plot", "cap": "A box plot shows the median, the quartiles and the spread. Here IQR = 24, so any value above 58 + 1.5 × 24 = 94 is an outlier; the whisker stops at the largest value that isn't one.", "p": ["**Histograms**: frequency density = frequency ÷ class width. **Area** represents frequency.", "**Box plots** show min, Q₁, median, Q₃, max (and outliers).", "**Cumulative frequency** graphs estimate the median and quartiles.", "**Scatter diagrams** show **correlation** between two variables. Correlation doesn't imply causation.", "A **regression line** of y on x can be used to predict y within the data range (**interpolation**). Predicting outside the range (**extrapolation**) is unreliable."], "svg": "<svg role=\"img\" aria-label=\"A box plot shows the median, the quartiles and the spread. Here IQR = 24, so any value above 58 + 1.5 × 24 = 94 is an outlier; the whisker stops at the largest value that isn&#x27;t one.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 222\"><defs><marker id=\"f-boxplot-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-boxplot-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-boxplot-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-boxplot-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"40\" y1=\"160\" x2=\"448\" y2=\"160\" class=\"ln\" marker-end=\"url(#f-boxplot-ah)\"/><line x1=\"40\" y1=\"160\" x2=\"40\" y2=\"166\" class=\"ln\"/><text x=\"40\" y=\"182\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">0<\/text><line x1=\"120\" y1=\"160\" x2=\"120\" y2=\"166\" class=\"ln\"/><text x=\"120\" y=\"182\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">20<\/text><line x1=\"200\" y1=\"160\" x2=\"200\" y2=\"166\" class=\"ln\"/><text x=\"200\" y=\"182\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">40<\/text><line x1=\"280\" y1=\"160\" x2=\"280\" y2=\"166\" class=\"ln\"/><text x=\"280\" y=\"182\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">60<\/text><line x1=\"360\" y1=\"160\" x2=\"360\" y2=\"166\" class=\"ln\"/><text x=\"360\" y=\"182\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">80<\/text><line x1=\"440\" y1=\"160\" x2=\"440\" y2=\"166\" class=\"ln\"/><text x=\"440\" y=\"182\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">100<\/text><line x1=\"88\" y1=\"90\" x2=\"176\" y2=\"90\" class=\"ln\"/><line x1=\"272\" y1=\"90\" x2=\"360\" y2=\"90\" class=\"ln\"/><line x1=\"88\" y1=\"78\" x2=\"88\" y2=\"102\" class=\"ln\"/><line x1=\"360\" y1=\"78\" x2=\"360\" y2=\"102\" class=\"ln\"/><rect x=\"176\" y=\"66\" width=\"96\" height=\"48\" rx=\"2\" class=\"at\"/><line x1=\"224\" y1=\"66\" x2=\"224\" y2=\"114\" class=\"ac thick\"/><text x=\"432\" y=\"95\" text-anchor=\"middle\" font-size=\"16\">×<\/text><text x=\"432\" y=\"76\" class=\"tm\" text-anchor=\"middle\" font-size=\"11\">outlier<\/text><text x=\"88\" y=\"72\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">min<\/text><text x=\"176\" y=\"58\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">Q₁<\/text><text x=\"224\" y=\"58\" class=\"ta\" text-anchor=\"middle\" font-size=\"12\">median<\/text><text x=\"272\" y=\"58\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">Q₃<\/text><text x=\"360\" y=\"72\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">max<\/text><line x1=\"176\" y1=\"132\" x2=\"272\" y2=\"132\" class=\"ln\" marker-end=\"url(#f-boxplot-ah)\" marker-start=\"url(#f-boxplot-ah)\"/><text x=\"224\" y=\"148\" text-anchor=\"middle\" font-size=\"12\">IQR = Q₃ − Q₁ = 24<\/text><text x=\"240\" y=\"212\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">outlier rule: more than 1.5 × IQR beyond a quartile (58 + 36 = 94)<\/text><\/svg>"}], "pitfalls": ["On a histogram, use **frequency density**, not frequency, on the vertical axis.", "Stratified sampling needs the **proportion** in each stratum.", "Correlation does **not** prove that one variable causes the other."], "examples": [{"q": "Ten values have Σx = 50 and Σx² = 290. Find the mean and standard deviation.", "steps": ["Mean = 50/10 = 5.", "Variance = 290/10 − 5² = 29 − 25 = 4."], "a": "Mean 5, standard deviation 2"}, {"q": "A school has 300 boys and 200 girls. A stratified sample of 50 is needed. How many girls?", "steps": ["Girls are 200/500 = 2/5 of the population.", "2/5 × 50 = 20."], "a": "20 girls"}], "questions": [{"q": "What is a census?", "o": ["A random sample", "A survey of every member of the population", "A stratified sample", "A sample of 10%"], "a": 1, "e": "A census measures the whole population."}, {"q": "What is an advantage of a census over a sample?", "o": ["It gives completely accurate results for the population", "It is quicker", "It is cheaper", "It is easier with large populations"], "a": 0, "e": "But it can be time-consuming, expensive, and impossible if testing destroys items."}, {"q": "Which sampling method selects every 10th name from a list after a random start?", "o": ["Simple random", "Quota", "Systematic", "Opportunity"], "a": 2, "e": "Systematic sampling uses a regular interval."}, {"q": "A population has 400 adults and 100 children. A stratified sample of 20 is taken. How many children?", "o": ["10", "5", "2", "4"], "a": 3, "e": "100/500 × 20 = 4."}, {"q": "What is a disadvantage of opportunity sampling?", "o": ["It is likely to be unrepresentative (biased)", "It is expensive", "It needs a sampling frame", "It takes too long"], "a": 0, "e": "It only includes people who happen to be available."}, {"q": "Which sampling method is non-random?", "o": ["Simple random", "Quota", "Systematic", "Stratified"], "a": 1, "e": "In quota sampling, the interviewer chooses who to include."}, {"q": "Find the mean of 3, 7, 8, 10, 12.", "o": ["8", "10", "7.5", "40"], "a": 0, "e": "Sum = 40, n = 5, mean = 8."}, {"q": "Σx = 60, Σx² = 400, n = 10. What is the variance?", "o": ["40", "36", "4", "2"], "a": 2, "e": "400/10 − 6² = 40 − 36 = 4."}, {"q": "The variance of a data set is 9. What is the standard deviation?", "o": ["81", "4.5", "9", "3"], "a": 3, "e": "Standard deviation = √9 = 3."}, {"q": "Q₁ = 12, Q₃ = 20. Using 1.5 × IQR, what is the upper outlier limit?", "o": ["32", "28", "30", "24"], "a": 0, "e": "IQR = 8. 20 + 1.5 × 8 = 32."}, {"q": "On a histogram, what does the area of each bar represent?", "o": ["Frequency density", "Frequency", "Class width", "Cumulative frequency"], "a": 1, "e": "Area is proportional to frequency."}, {"q": "A class 10 ≤ x < 15 has frequency 20. What is its frequency density?", "o": ["20", "2", "4", "100"], "a": 2, "e": "20 ÷ 5 = 4."}, {"q": "Data are coded using y = x − 50. The mean of y is 3. What is the mean of x?", "o": ["3", "47", "−47", "53"], "a": 3, "e": "x̄ = ȳ + 50 = 53."}, {"q": "Data are coded using y = x/10. The standard deviation of y is 1.5. What is the standard deviation of x?", "o": ["15", "0.15", "1.5", "150"], "a": 0, "e": "σₓ = 10 × σᵧ = 15. Adding constants doesn't affect spread, but scaling does."}, {"q": "What does a box plot NOT show?", "o": ["The median", "The mean", "The quartiles", "The range"], "a": 1, "e": "Box plots show the five-number summary, not the mean."}, {"q": "A scatter diagram shows points close to a line sloping downwards. What type of correlation is this?", "o": ["Strong positive", "No correlation", "Strong negative", "Weak positive"], "a": 2, "e": "Downward slope means negative correlation; close to a line means strong."}, {"q": "Why is extrapolation from a regression line unreliable?", "o": ["The line is always wrong", "Correlation is always weak", "It uses the mean", "The relationship may not continue outside the range of the data"], "a": 3, "e": "We have no evidence about the relationship beyond the data collected."}, {"q": "Ice cream sales and drowning numbers are positively correlated. What is the most sensible conclusion?", "o": ["A third factor, such as hot weather, may affect both", "Ice cream causes drowning", "Drowning causes ice cream sales", "The data are wrong"], "a": 0, "e": "Correlation does not imply causation."}, {"q": "Find the median of 4, 9, 2, 7, 5, 11.", "o": ["7", "6", "5", "5.5"], "a": 1, "e": "Ordered: 2, 4, 5, 7, 9, 11. Median = (5 + 7)/2 = 6."}, {"q": "A value is more than 2 standard deviations above the mean. What might it be considered?", "o": ["The median", "The mode", "An outlier", "The upper quartile"], "a": 2, "e": "A common rule is that values beyond mean ± 2σ are outliers."}, {"q": "What is a sampling frame?", "o": ["The sample size", "A diagram", "The sampling method", "A list of all members of the population that can be sampled"], "a": 3, "e": "Simple random and systematic sampling need a sampling frame."}, {"q": "Which measure of location is least affected by outliers?", "o": ["Median", "Mean", "Range", "Standard deviation"], "a": 0, "e": "The median depends only on the middle values."}]}, {"id": "s2", "order": 12, "year": 1, "section": "S", "badge": "M", "spec": "M", "title": "Probability", "desc": "Mutually exclusive and independent events, Venn diagrams, tree diagrams, two-way tables and the addition rule.", "practicals": [], "summary": [{"h": "Basic rules", "p": ["Probabilities lie between 0 and 1. P(A′) = 1 − P(A), where A′ is 'not A'.", "`P(A ∪ B) = P(A) + P(B) − P(A ∩ B)` (addition rule).", "∪ means 'or' (union). ∩ means 'and' (intersection)."]}, {"h": "Mutually exclusive and independent events", "p": ["**Mutually exclusive**: A and B can't both happen. `P(A ∩ B) = 0`, so `P(A ∪ B) = P(A) + P(B)`.", "**Independent**: one event doesn't affect the other. `P(A ∩ B) = P(A) × P(B)`.", "To **test** for independence, check whether P(A) × P(B) equals P(A ∩ B)."]}, {"h": "Diagrams", "fig": "venn", "cap": "The overlap is P(A ∩ B) = 0.2. P(A) = 0.5 and P(B) = 0.45, and P(A ∪ B) = P(A) + P(B) − P(A ∩ B) = 0.75. All four regions add up to 1. Since 0.5 × 0.45 ≠ 0.2, A and B aren't independent.", "p": ["**Venn diagrams** show overlapping events. Fill in the intersection first, then work outwards. All regions add to 1.", "**Tree diagrams**: multiply along branches for 'and', add the end results for 'or'.", "**Without replacement**, probabilities on later branches change.", "**Two-way tables** show counts for two categories. Use totals to find probabilities."], "svg": "<svg role=\"img\" aria-label=\"The overlap is P(A ∩ B) = 0.2. P(A) = 0.5 and P(B) = 0.45, and P(A ∪ B) = P(A) + P(B) − P(A ∩ B) = 0.75. All four regions add up to 1. Since 0.5 × 0.45 ≠ 0.2, A and B aren&#x27;t independent.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 274\"><defs><marker id=\"f-venn-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-venn-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-venn-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-venn-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><rect x=\"30\" y=\"20\" width=\"420\" height=\"220\" rx=\"8\" class=\"bx\"/><text x=\"440\" y=\"40\" class=\"tm\" text-anchor=\"end\" font-size=\"14\">S<\/text><circle cx=\"190\" cy=\"130\" r=\"80\" class=\"at\"/><circle cx=\"290\" cy=\"130\" r=\"80\" class=\"at\"/><text x=\"150\" y=\"134\" text-anchor=\"middle\" font-size=\"16\">0.3<\/text><text x=\"240\" y=\"134\" class=\"ta\" text-anchor=\"middle\" font-size=\"16\">0.2<\/text><text x=\"330\" y=\"134\" text-anchor=\"middle\" font-size=\"16\">0.25<\/text><text x=\"410\" y=\"220\" class=\"tm\" text-anchor=\"middle\" font-size=\"14\">0.25<\/text><text x=\"130\" y=\"60\" text-anchor=\"middle\" font-size=\"16\">A<\/text><text x=\"350\" y=\"60\" text-anchor=\"middle\" font-size=\"16\">B<\/text><text x=\"240\" y=\"262\" text-anchor=\"middle\" font-size=\"13\">P(A ∪ B) = 0.3 + 0.2 + 0.25 = 0.75;  P(A ∩ B) = 0.2<\/text><\/svg>"}], "pitfalls": ["Don't add probabilities of events that can overlap without subtracting the intersection.", "Mutually exclusive and independent are **different** ideas. Mutually exclusive events (with non-zero probabilities) can't be independent.", "On a tree diagram, each set of branches from one point must sum to 1."], "examples": [{"q": "P(A) = 0.4, P(B) = 0.5 and P(A ∪ B) = 0.7. Are A and B independent?", "steps": ["P(A ∩ B) = 0.4 + 0.5 − 0.7 = 0.2.", "P(A) × P(B) = 0.4 × 0.5 = 0.2.", "These are equal."], "a": "Yes, A and B are independent."}, {"q": "A bag has 3 red and 2 blue balls. Two are taken without replacement. Find P(both red).", "steps": ["P(first red) = 3/5.", "P(second red | first red) = 2/4.", "Multiply: 3/5 × 2/4 = 6/20."], "a": "3/10"}], "questions": [{"q": "P(A) = 0.35. What is P(A′)?", "o": ["0.35", "0.65", "0.30", "1.35"], "a": 1, "e": "P(A′) = 1 − 0.35 = 0.65."}, {"q": "A and B are mutually exclusive, with P(A) = 0.2 and P(B) = 0.5. What is P(A ∪ B)?", "o": ["0.7", "0.1", "0.6", "0.3"], "a": 0, "e": "Add, since they can't both happen."}, {"q": "A and B are independent, with P(A) = 0.3 and P(B) = 0.6. What is P(A ∩ B)?", "o": ["0.9", "0.3", "0.18", "0.5"], "a": 2, "e": "Multiply: 0.3 × 0.6 = 0.18."}, {"q": "P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.1. Find P(A ∪ B).", "o": ["0.9", "1.0", "0.2", "0.8"], "a": 3, "e": "0.5 + 0.4 − 0.1 = 0.8."}, {"q": "For mutually exclusive events A and B, what is P(A ∩ B)?", "o": ["0", "1", "P(A) × P(B)", "P(A) + P(B)"], "a": 0, "e": "They can't both happen."}, {"q": "Which condition shows A and B are independent?", "o": ["P(A ∩ B) = 0", "P(A ∩ B) = P(A) × P(B)", "P(A) + P(B) = 1", "P(A ∪ B) = 1"], "a": 1, "e": "This is the definition of independence."}, {"q": "A fair die is rolled twice. What is the probability of two sixes?", "o": ["1/6", "1/12", "1/36", "2/6"], "a": 2, "e": "Independent rolls: 1/6 × 1/6 = 1/36."}, {"q": "A coin is tossed 3 times. What is the probability of at least one head?", "o": ["1/2", "3/8", "1/8", "7/8"], "a": 3, "e": "1 − P(no heads) = 1 − 1/8 = 7/8."}, {"q": "A bag has 4 red and 6 green sweets. Two are taken without replacement. What is P(both green)?", "o": ["1/3", "9/25", "3/5", "2/5"], "a": 0, "e": "6/10 × 5/9 = 30/90 = 1/3."}, {"q": "On a tree diagram, how do you find P(A and then B)?", "o": ["Add along the branches", "Multiply along the branches", "Subtract", "Divide"], "a": 1, "e": "Multiply along a path for 'and'."}, {"q": "In a Venn diagram, P(A only) = 0.3, P(A ∩ B) = 0.2 and P(B only) = 0.25. What is P(neither)?", "o": ["0.75", "0.5", "0.25", "0.2"], "a": 2, "e": "1 − (0.3 + 0.2 + 0.25) = 0.25."}, {"q": "From the previous question, what is P(B)?", "o": ["0.25", "0.2", "0.5", "0.45"], "a": 3, "e": "P(B) = B only + intersection = 0.25 + 0.2 = 0.45."}, {"q": "In a class of 30, 18 study French, 12 study Spanish and 5 study both. How many study neither?", "o": ["5", "0", "25", "10"], "a": 0, "e": "French or Spanish = 18 + 12 − 5 = 25. Neither = 30 − 25 = 5."}, {"q": "P(A) = 0.6, P(B) = 0.5, P(A ∩ B) = 0.3. Are A and B independent?", "o": ["No", "Yes, because 0.6 × 0.5 = 0.3", "No, because they overlap", "Cannot tell"], "a": 1, "e": "P(A) × P(B) = 0.3 = P(A ∩ B)."}, {"q": "Can two events with non-zero probabilities be both mutually exclusive and independent?", "o": ["Yes, always", "Only if P(A) = P(B)", "No, because P(A ∩ B) = 0 but P(A) × P(B) > 0", "Only for dice"], "a": 2, "e": "If one happens, the other definitely can't, so they affect each other."}, {"q": "On a tree diagram, what must the probabilities on branches from a single point add up to?", "o": ["0", "It depends", "0.5", "1"], "a": 3, "e": "One of the outcomes must happen."}, {"q": "Two-way table: 40 of 100 students are left-handed; 15 of these wear glasses. What is P(left-handed and glasses)?", "o": ["0.15", "0.375", "0.4", "0.55"], "a": 0, "e": "15 out of 100 students."}, {"q": "What does A ∪ B mean?", "o": ["A and B", "A or B (or both)", "Not A", "A given B"], "a": 1, "e": "Union means at least one of the events happens."}, {"q": "A spinner gives red with probability 0.3. It is spun twice. What is P(exactly one red)?", "o": ["0.09", "0.21", "0.42", "0.6"], "a": 2, "e": "P(RN) + P(NR) = 0.3 × 0.7 + 0.7 × 0.3 = 0.42."}, {"q": "What does A ∩ B′ mean?", "o": ["Neither A nor B", "A or B", "B but not A", "A but not B"], "a": 3, "e": "In A and not in B."}, {"q": "A card is drawn from a standard pack. What is P(red or a king)?", "o": ["28/52", "30/52", "26/52", "2/52"], "a": 0, "e": "26 + 4 − 2 = 28 cards (two red kings counted once)."}, {"q": "P(A) = 0.7. P(B) = 0.6. What is the smallest possible value of P(A ∩ B)?", "o": ["0", "0.3", "0.42", "0.1"], "a": 1, "e": "P(A ∪ B) ≤ 1, so P(A ∩ B) ≥ 0.7 + 0.6 − 1 = 0.3."}]}, {"id": "s3", "order": 13, "year": 1, "section": "S", "badge": "N", "spec": "N", "title": "The binomial distribution", "desc": "Discrete random variables, conditions for a binomial model, calculating binomial probabilities, cumulative probabilities, and the mean and variance.", "practicals": [], "summary": [{"h": "Discrete random variables", "p": ["A **discrete random variable** X takes separate values, each with a probability. The probabilities sum to 1.", "A probability distribution can be shown as a table or a function, e.g. P(X = x) = kx."]}, {"h": "Binomial model", "fig": "binomial", "cap": "X ~ B(10, 0.3): 10 independent trials, each with P(success) = 0.3. The most likely value is 3, which is also the mean np. P(X = 3) = 10C3 × 0.3³ × 0.7⁷ = 0.2668.", "p": ["X ~ B(n, p) when there are: a **fixed number** of trials n; each trial has **two outcomes** (success/failure); a **constant probability** p of success; and trials are **independent**.", "`P(X = r) = ⁿCᵣ pʳ (1 − p)ⁿ⁻ʳ`", "Use your calculator's **binomial pdf** for P(X = r) and **binomial cdf** for P(X ≤ r)."], "svg": "<svg role=\"img\" aria-label=\"X ~ B(10, 0.3): 10 independent trials, each with P(success) = 0.3. The most likely value is 3, which is also the mean np. P(X = 3) = 10C3 × 0.3³ × 0.7⁷ = 0.2668.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 260\"><defs><marker id=\"f-binomial-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-binomial-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-binomial-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-binomial-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"50\" y1=\"220\" x2=\"448\" y2=\"220\" class=\"ln\" marker-end=\"url(#f-binomial-ah)\"/><line x1=\"50\" y1=\"220\" x2=\"50\" y2=\"22\" class=\"ln\" marker-end=\"url(#f-binomial-ah)\"/><text x=\"448\" y=\"212\" class=\"tm\" text-anchor=\"end\">x<\/text><text x=\"58\" y=\"26\" class=\"tm\">P(X = x)<\/text><rect x=\"61.9\" y=\"202.1\" width=\"24\" height=\"17.9\" rx=\"2\" class=\"bx\"/><text x=\"73.9\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">0<\/text><rect x=\"96.2\" y=\"143.3\" width=\"24\" height=\"76.7\" rx=\"2\" class=\"bx\"/><text x=\"108.2\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">1<\/text><rect x=\"130.4\" y=\"72.1\" width=\"24\" height=\"147.9\" rx=\"2\" class=\"bx\"/><text x=\"142.4\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">2<\/text><rect x=\"164.6\" y=\"51\" width=\"24\" height=\"169\" rx=\"2\" class=\"at\"/><text x=\"176.6\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">3<\/text><rect x=\"198.8\" y=\"93.3\" width=\"24\" height=\"126.7\" rx=\"2\" class=\"bx\"/><text x=\"210.8\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">4<\/text><rect x=\"233\" y=\"154.8\" width=\"24\" height=\"65.2\" rx=\"2\" class=\"bx\"/><text x=\"245\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">5<\/text><rect x=\"267.2\" y=\"196.7\" width=\"24\" height=\"23.3\" rx=\"2\" class=\"bx\"/><text x=\"279.2\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">6<\/text><rect x=\"301.4\" y=\"214.3\" width=\"24\" height=\"5.7\" rx=\"2\" class=\"bx\"/><text x=\"313.4\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">7<\/text><rect x=\"335.6\" y=\"219.1\" width=\"24\" height=\"0.9\" rx=\"2\" class=\"bx\"/><text x=\"347.6\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">8<\/text><rect x=\"369.8\" y=\"219.9\" width=\"24\" height=\"0.1\" rx=\"2\" class=\"bx\"/><text x=\"381.8\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">9<\/text><rect x=\"404.1\" y=\"220\" width=\"24\" height=\"0\" rx=\"2\" class=\"bx\"/><text x=\"416.1\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">10<\/text><line x1=\"45\" y1=\"156.7\" x2=\"50\" y2=\"156.7\" class=\"ln\"/><text x=\"41\" y=\"161.7\" class=\"tm\" text-anchor=\"end\">0.1<\/text><line x1=\"45\" y1=\"93.3\" x2=\"50\" y2=\"93.3\" class=\"ln\"/><text x=\"41\" y=\"98.3\" class=\"tm\" text-anchor=\"end\">0.2<\/text><line x1=\"45\" y1=\"30\" x2=\"50\" y2=\"30\" class=\"ln\"/><text x=\"41\" y=\"35\" class=\"tm\" text-anchor=\"end\">0.3<\/text><line x1=\"176.6\" y1=\"36.3\" x2=\"176.6\" y2=\"51\" class=\"lm\"/><text x=\"182.6\" y=\"39.5\" class=\"ta\" font-size=\"13\">mean np = 3<\/text><text x=\"433.2\" y=\"80.7\" text-anchor=\"end\" font-size=\"14\">X ~ B(10, 0.3)<\/text><text x=\"433.2\" y=\"98.7\" class=\"tm\" text-anchor=\"end\" font-size=\"12\">P(X = 3) = 0.2668<\/text><\/svg>"}, {"h": "Cumulative probabilities", "p": ["`P(X < r) = P(X ≤ r − 1)`", "`P(X ≥ r) = 1 − P(X ≤ r − 1)`", "`P(a ≤ X ≤ b) = P(X ≤ b) − P(X ≤ a − 1)`"]}, {"h": "Mean and variance", "p": ["`E(X) = np`", "`Var(X) = np(1 − p)` (Year 2 also uses this).", "Criticise models: e.g. trials may not be independent, or p may not be constant."]}], "pitfalls": ["P(X ≥ 4) = 1 − P(X ≤ **3**), not 1 − P(X ≤ 4).", "Check 'more than' (>) vs 'at least' (≥) carefully.", "State the distribution with its parameters, e.g. X ~ B(20, 0.3), before calculating."], "examples": [{"q": "X ~ B(10, 0.3). Find P(X = 3) to 4 d.p.", "steps": ["P(X = 3) = ¹⁰C₃ × 0.3³ × 0.7⁷.", "= 120 × 0.027 × 0.0823543..."], "a": "0.2668"}, {"q": "X ~ B(10, 0.3). Find P(X ≥ 4).", "steps": ["P(X ≥ 4) = 1 − P(X ≤ 3).", "P(X ≤ 3) = 0.6496 (calculator)."], "a": "0.3504"}], "questions": [{"q": "Which is NOT a condition for a binomial distribution?", "o": ["A fixed number of trials", "The outcomes must be equally likely", "Independent trials", "A constant probability of success"], "a": 1, "e": "p doesn't have to be 0.5; it just has to stay the same."}, {"q": "X ~ B(5, 0.5). What is P(X = 2)?", "o": ["0.3125", "0.5", "0.25", "0.1563"], "a": 0, "e": "⁵C₂ × 0.5² × 0.5³ = 10 × 1/32 = 0.3125."}, {"q": "X ~ B(8, 0.2). What is P(X = 0) to 4 d.p.?", "o": ["0.2", "0", "0.1678", "0.8322"], "a": 2, "e": "0.8⁸ = 0.1678."}, {"q": "X ~ B(8, 0.2). What is P(X ≥ 1) to 4 d.p.?", "o": ["0.2", "0.1678", "0.9", "0.8322"], "a": 3, "e": "1 − P(X = 0) = 1 − 0.1678 = 0.8322."}, {"q": "X ~ B(20, 0.25). What is E(X)?", "o": ["5", "20", "0.25", "3.75"], "a": 0, "e": "E(X) = np = 20 × 0.25 = 5."}, {"q": "X ~ B(20, 0.25). What is Var(X)?", "o": ["5", "3.75", "1.94", "15"], "a": 1, "e": "np(1 − p) = 20 × 0.25 × 0.75 = 3.75."}, {"q": "How is P(X ≥ 6) written using a cumulative probability?", "o": ["1 − P(X ≤ 6)", "P(X ≤ 6)", "1 − P(X ≤ 5)", "P(X ≤ 5)"], "a": 2, "e": "X ≥ 6 is the complement of X ≤ 5."}, {"q": "How is P(X < 4) written as a cumulative probability?", "o": ["P(X ≤ 4)", "1 − P(X ≤ 4)", "1 − P(X ≤ 3)", "P(X ≤ 3)"], "a": 3, "e": "For whole numbers, X < 4 means X ≤ 3."}, {"q": "X ~ B(10, 0.3). Find P(X ≤ 2) to 4 d.p.", "o": ["0.3828", "0.2335", "0.6172", "0.1493"], "a": 0, "e": "Using the binomial cdf: 0.3828."}, {"q": "X ~ B(10, 0.4). How do you find P(2 ≤ X ≤ 4)?", "o": ["P(X ≤ 4) − P(X ≤ 2)", "P(X ≤ 4) − P(X ≤ 1)", "P(X ≤ 4) + P(X ≤ 2)", "1 − P(X ≤ 4)"], "a": 1, "e": "Subtract everything up to 1 from everything up to 4. The value is 0.5867."}, {"q": "X ~ B(12, 0.1). Find P(X ≤ 1) to 3 d.p.", "o": ["0.282", "0.377", "0.659", "0.341"], "a": 2, "e": "P(0) + P(1) = 0.9¹² + 12 × 0.1 × 0.9¹¹ ≈ 0.282 + 0.377 = 0.659."}, {"q": "Why might the number of girls in families of 4 not be well modelled by B(4, 0.5)?", "o": ["n is too small", "There are more than two outcomes", "The trials are not fixed", "The probability of a girl may not be exactly 0.5, or births may not be independent"], "a": 3, "e": "Model assumptions should always be checked."}, {"q": "What is ⁿCᵣ pʳ (1 − p)ⁿ⁻ʳ?", "o": ["P(X = r) for X ~ B(n, p)", "E(X)", "Var(X)", "P(X ≤ r)"], "a": 0, "e": "This is the binomial probability formula."}, {"q": "A dice is rolled 12 times and X is the number of sixes. Which model is suitable?", "o": ["B(6, 1/12)", "B(12, 1/6)", "B(12, 1/2)", "B(1/6, 12)"], "a": 1, "e": "12 independent trials, p = 1/6 of a six each time."}, {"q": "X ~ B(n, 0.4) and E(X) = 8. What is n?", "o": ["8", "3.2", "20", "32"], "a": 2, "e": "np = 8, so n = 8 ÷ 0.4 = 20."}, {"q": "For a discrete random variable, what must the probabilities sum to?", "o": ["0", "The mean", "n", "1"], "a": 3, "e": "All possible outcomes together have probability 1."}, {"q": "P(X = x) = kx for x = 1, 2, 3, 4. Find k.", "o": ["1/10", "1/4", "1/24", "10"], "a": 0, "e": "k(1 + 2 + 3 + 4) = 10k = 1."}, {"q": "X ~ B(10, 0.3). Find P(X = 3) to 4 d.p.", "o": ["0.3", "0.2668", "0.6496", "0.0090"], "a": 1, "e": "¹⁰C₃ × 0.3³ × 0.7⁷ = 0.2668."}, {"q": "X ~ B(10, 0.3). P(X ≤ 3) = 0.6496. What is P(X ≥ 4)?", "o": ["0.6496", "0.2668", "0.3504", "0.0504"], "a": 2, "e": "1 − 0.6496 = 0.3504."}, {"q": "What does p represent in B(n, p)?", "o": ["The number of trials", "The number of successes", "The variance", "The probability of success on each trial"], "a": 3, "e": "n is the number of trials and p the probability of success."}, {"q": "X ~ B(6, 0.5). Which value of X is most likely?", "o": ["3", "0", "6", "1"], "a": 0, "e": "The distribution is symmetric about np = 3."}, {"q": "A multiple-choice test has 10 questions with 4 options each. A student guesses all. What is the expected number correct?", "o": ["4", "2.5", "10", "0.25"], "a": 1, "e": "E(X) = 10 × 0.25 = 2.5."}]}, {"id": "s4", "order": 14, "year": 1, "section": "S", "badge": "O", "spec": "O", "title": "Hypothesis testing (binomial)", "desc": "Null and alternative hypotheses, significance levels, one- and two-tailed tests, test statistics, p-values, critical regions and actual significance levels.", "practicals": [], "summary": [{"h": "Language of hypothesis testing", "p": ["A **hypothesis test** uses a sample to decide whether there is evidence to reject a claim about a population parameter, here p.", "**Null hypothesis H₀**: the assumed value, e.g. H₀: p = 0.3.", "**Alternative hypothesis H₁**: what you suspect: p > 0.3 or p < 0.3 (**one-tailed**), or p ≠ 0.3 (**two-tailed**).", "**Significance level**: the probability threshold for rejecting H₀, e.g. 5%.", "**Test statistic**: the observed value from the sample, e.g. X = 10."]}, {"h": "Carrying out a test", "p": ["Assume H₀ is true, so X ~ B(n, p).", "**p-value method**: find the probability of getting a result **at least as extreme** as the observed value. If it is **less than** the significance level, **reject H₀**.", "For a **two-tailed** test, compare each tail with **half** the significance level.", "Write a **conclusion in context**, using non-assertive language: 'There is sufficient evidence to suggest that...'"]}, {"h": "Critical regions", "fig": "critical-region", "cap": "X ~ B(20, 0.5), testing H₁: p < 0.5 at the 5% level. P(X ≤ 5) = 0.0207 is below 0.05 but P(X ≤ 6) = 0.0577 isn't, so the critical region is X ≤ 5. The actual significance level is 2.07%.", "p": ["The **critical region** is the set of values that would lead to rejecting H₀.", "The **critical value** is the first value in the critical region.", "The **actual significance level** is the probability of being in the critical region when H₀ is true. It is usually a bit less than the stated level."], "svg": "<svg role=\"img\" aria-label=\"X ~ B(20, 0.5), testing H₁: p &lt; 0.5 at the 5% level. P(X ≤ 5) = 0.0207 is below 0.05 but P(X ≤ 6) = 0.0577 isn&#x27;t, so the critical region is X ≤ 5. The actual significance level is 2.07%.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 290\"><defs><marker id=\"f-criticalregion-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-criticalregion-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-criticalregion-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-criticalregion-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"50\" y1=\"230\" x2=\"458\" y2=\"230\" class=\"ln\" marker-end=\"url(#f-criticalregion-ah)\"/><line x1=\"50\" y1=\"230\" x2=\"50\" y2=\"22\" class=\"ln\" marker-end=\"url(#f-criticalregion-ah)\"/><text x=\"458\" y=\"222\" class=\"tm\" text-anchor=\"end\">x<\/text><text x=\"58\" y=\"26\" class=\"tm\">P(X = x)<\/text><rect x=\"56.1\" y=\"230\" width=\"14\" height=\"0\" rx=\"2\" class=\"at\"/><rect x=\"74.8\" y=\"230\" width=\"14\" height=\"0\" rx=\"2\" class=\"at\"/><rect x=\"93.5\" y=\"229.8\" width=\"14\" height=\"0.2\" rx=\"2\" class=\"at\"/><rect x=\"112.2\" y=\"228.9\" width=\"14\" height=\"1.1\" rx=\"2\" class=\"at\"/><rect x=\"130.9\" y=\"225.1\" width=\"14\" height=\"4.9\" rx=\"2\" class=\"at\"/><rect x=\"149.5\" y=\"214.4\" width=\"14\" height=\"15.6\" rx=\"2\" class=\"at\"/><rect x=\"168.2\" y=\"191.1\" width=\"14\" height=\"38.9\" rx=\"2\" class=\"bx\"/><rect x=\"186.9\" y=\"152.2\" width=\"14\" height=\"77.8\" rx=\"2\" class=\"bx\"/><rect x=\"205.6\" y=\"103.5\" width=\"14\" height=\"126.5\" rx=\"2\" class=\"bx\"/><rect x=\"224.3\" y=\"61.4\" width=\"14\" height=\"168.6\" rx=\"2\" class=\"bx\"/><rect x=\"243\" y=\"44.5\" width=\"14\" height=\"185.5\" rx=\"2\" class=\"bx\"/><rect x=\"261.7\" y=\"61.4\" width=\"14\" height=\"168.6\" rx=\"2\" class=\"bx\"/><rect x=\"280.4\" y=\"103.5\" width=\"14\" height=\"126.5\" rx=\"2\" class=\"bx\"/><rect x=\"299.1\" y=\"152.2\" width=\"14\" height=\"77.8\" rx=\"2\" class=\"bx\"/><rect x=\"317.8\" y=\"191.1\" width=\"14\" height=\"38.9\" rx=\"2\" class=\"bx\"/><rect x=\"336.5\" y=\"214.4\" width=\"14\" height=\"15.6\" rx=\"2\" class=\"bx\"/><rect x=\"355.1\" y=\"225.1\" width=\"14\" height=\"4.9\" rx=\"2\" class=\"bx\"/><rect x=\"373.8\" y=\"228.9\" width=\"14\" height=\"1.1\" rx=\"2\" class=\"bx\"/><rect x=\"392.5\" y=\"229.8\" width=\"14\" height=\"0.2\" rx=\"2\" class=\"bx\"/><rect x=\"411.2\" y=\"230\" width=\"14\" height=\"0\" rx=\"2\" class=\"bx\"/><rect x=\"429.9\" y=\"230\" width=\"14\" height=\"0\" rx=\"2\" class=\"bx\"/><text x=\"63.1\" y=\"248\" class=\"tm\" text-anchor=\"middle\">0<\/text><text x=\"156.5\" y=\"248\" class=\"tm\" text-anchor=\"middle\">5<\/text><text x=\"250\" y=\"248\" class=\"tm\" text-anchor=\"middle\">10<\/text><text x=\"343.5\" y=\"248\" class=\"tm\" text-anchor=\"middle\">15<\/text><text x=\"436.9\" y=\"248\" class=\"tm\" text-anchor=\"middle\">20<\/text><line x1=\"55.6\" y1=\"262\" x2=\"164\" y2=\"262\" class=\"ac\"/><text x=\"109.8\" y=\"280\" class=\"ta\" text-anchor=\"middle\" font-size=\"13\">critical region X ≤ 5<\/text><text x=\"306.1\" y=\"51.1\" font-size=\"12\">P(X ≤ 5) = 0.0207 ✓<\/text><text x=\"306.1\" y=\"69.1\" class=\"tm\" font-size=\"12\">P(X ≤ 6) = 0.0577 ✗<\/text><text x=\"306.1\" y=\"87.1\" class=\"tm\" font-size=\"12\">(5% level)<\/text><\/svg>"}], "pitfalls": ["Hypotheses are about the **population parameter p**, not the sample.", "Compare P(X ≥ observed) for an upper test, or P(X ≤ observed) for a lower test, not P(X = observed).", "Never say 'H₀ is true' or 'proved'. Say there is or isn't sufficient evidence."], "examples": [{"q": "Past records say 30% of customers buy a dessert. In a sample of 20, 10 buy one. Test at the 5% level whether the proportion has increased.", "steps": ["H₀: p = 0.3. H₁: p > 0.3. Under H₀, X ~ B(20, 0.3).", "P(X ≥ 10) = 1 − P(X ≤ 9) = 0.0480.", "0.0480 < 0.05, so reject H₀."], "a": "There is sufficient evidence at the 5% level to suggest that the proportion buying a dessert has increased."}, {"q": "X ~ B(20, 0.4). Find the critical region for a lower-tailed test at the 5% level.", "steps": ["P(X ≤ 3) = 0.0160 and P(X ≤ 4) = 0.0510.", "0.0510 > 0.05, so 4 isn't in the critical region."], "a": "Critical region X ≤ 3 (actual significance level 1.6%)."}], "questions": [{"q": "What does the null hypothesis H₀ state?", "o": ["The value you suspect is true", "The assumed value of the parameter, which is tested", "That the result is significant", "The sample proportion"], "a": 1, "e": "H₀ is assumed true unless there is enough evidence against it."}, {"q": "A coin is suspected to be biased towards heads. Which hypotheses are correct?", "o": ["H₀: p = 0.5, H₁: p > 0.5", "H₀: p > 0.5, H₁: p = 0.5", "H₀: p = 0.5, H₁: p ≠ 0.5", "H₀: p = 0.5, H₁: p < 0.5"], "a": 0, "e": "The suspicion is specifically 'more heads', so a one-tailed upper test."}, {"q": "A test is set up to check whether a dice is biased (in either direction) for sixes. What type of test is this?", "o": ["One-tailed, upper", "One-tailed, lower", "Two-tailed", "Not a hypothesis test"], "a": 2, "e": "H₁: p ≠ 1/6, so two-tailed."}, {"q": "In a two-tailed test at the 5% level, what probability is each tail compared with?", "o": ["5%", "10%", "1%", "2.5%"], "a": 3, "e": "The significance level is split between the two tails."}, {"q": "H₀: p = 0.3, H₁: p > 0.3, n = 20, observed X = 10. P(X ≥ 10) = 0.048. Conclusion at 5%?", "o": ["Reject H₀: evidence that p > 0.3", "Accept H₁ as proved", "Do not reject H₀", "The test is invalid"], "a": 0, "e": "0.048 < 0.05, so there is sufficient evidence to reject H₀."}, {"q": "H₀: p = 0.5, H₁: p > 0.5, n = 15, X = 12. P(X ≥ 12) = 0.0176. Conclusion at 1%?", "o": ["Reject H₀", "Do not reject H₀: insufficient evidence at the 1% level", "Accept that p > 0.5", "Prove p = 0.5"], "a": 1, "e": "0.0176 > 0.01, so there is not enough evidence at the 1% level."}, {"q": "What is a critical region?", "o": ["The values of p", "The observed value", "The set of values of the test statistic that would lead to rejecting H₀", "The significance level"], "a": 2, "e": "If the observed value is in the critical region, reject H₀."}, {"q": "X ~ B(20, 0.3). P(X ≥ 9) = 0.1133, P(X ≥ 10) = 0.0480. What is the upper critical region at 5%?", "o": ["X ≥ 9", "X ≥ 11", "X ≤ 10", "X ≥ 10"], "a": 3, "e": "The smallest value where the tail probability is below 0.05 is 10."}, {"q": "For the critical region X ≥ 10 under B(20, 0.3), what is the actual significance level?", "o": ["4.8%", "5%", "11.3%", "10%"], "a": 0, "e": "The actual significance level is P(X ≥ 10) = 0.048."}, {"q": "X ~ B(20, 0.4). P(X ≤ 3) = 0.0160, P(X ≤ 4) = 0.0510. What is the lower critical region at 5%?", "o": ["X ≤ 4", "X ≤ 3", "X ≤ 5", "X ≥ 3"], "a": 1, "e": "P(X ≤ 4) exceeds 0.05, so the region is X ≤ 3."}, {"q": "What is the test statistic in a binomial hypothesis test?", "o": ["The significance level", "The value of p", "The observed number of successes in the sample", "The critical value"], "a": 2, "e": "E.g. X = 10 successes in the sample."}, {"q": "Which conclusion is correctly worded?", "o": ["H₀ is false", "This proves the coin is biased", "H₀ is true", "There is sufficient evidence at the 5% level to suggest the coin is biased"], "a": 3, "e": "Use non-assertive language and put the conclusion in context."}, {"q": "Why is the actual significance level often less than the stated level?", "o": ["Because the binomial distribution is discrete, so tail probabilities jump in steps", "Because of rounding errors", "Because n is too small", "It's always equal"], "a": 0, "e": "There's usually no value that gives exactly 5%."}, {"q": "In a hypothesis test, what is p?", "o": ["The sample proportion", "The population parameter (probability of success)", "The p-value", "The critical value"], "a": 1, "e": "Hypotheses are always about the population parameter."}, {"q": "A p-value is 0.03 in a one-tailed test at 5%. What do you do?", "o": ["Do not reject H₀", "Accept H₀", "Reject H₀", "Repeat the test"], "a": 2, "e": "0.03 < 0.05, so the result is significant."}, {"q": "In an upper-tailed test with X = 7 observed, which probability do you calculate?", "o": ["P(X = 7)", "P(X ≤ 7)", "P(X < 7)", "P(X ≥ 7)"], "a": 3, "e": "The probability of a result at least as extreme as the one observed."}, {"q": "A new drug is claimed to have a higher cure rate than 0.6. Which is H₁?", "o": ["p > 0.6", "p < 0.6", "p = 0.6", "p ≠ 0.6"], "a": 0, "e": "The claim is that the rate has increased."}, {"q": "What does a 5% significance level mean?", "o": ["There's a 5% chance H₁ is true", "There's a 5% probability of rejecting H₀ when it is actually true", "95% of samples are significant", "The sample is 5% of the population"], "a": 1, "e": "It's the threshold probability for deciding a result is unusual under H₀."}, {"q": "H₀: p = 0.4, H₁: p < 0.4, n = 20, X = 3 observed. P(X ≤ 3) = 0.016. Conclusion at 5%?", "o": ["Do not reject H₀", "Accept H₀", "Reject H₀: evidence that p < 0.4", "Inconclusive"], "a": 2, "e": "0.016 < 0.05, so reject H₀."}, {"q": "Why do we assume H₀ is true when calculating probabilities?", "o": ["Because it is always correct", "Because H₁ can't be tested", "To make the test two-tailed", "To see how unlikely the observed result would be if H₀ were true"], "a": 3, "e": "If the result would be very unlikely under H₀, that is evidence against it."}, {"q": "What happens to the critical region if the significance level is reduced from 5% to 1%?", "o": ["It gets smaller (more extreme values only)", "It gets bigger", "It stays the same", "It disappears"], "a": 0, "e": "Stronger evidence is needed, so fewer values are in the critical region."}, {"q": "Under H₀, X ~ B(20, 0.3). The critical region is X ≥ 10. Observed X = 9. Conclusion?", "o": ["Reject H₀", "Do not reject H₀: 9 is not in the critical region", "Accept H₁", "Change to a two-tailed test"], "a": 1, "e": "The observed value must be in the critical region to reject H₀."}]}, {"id": "m1", "order": 15, "year": 1, "section": "M", "badge": "P·Q", "spec": "P, Q", "title": "Units and kinematics", "desc": "SI units, modelling assumptions, displacement, velocity and acceleration, motion graphs, the constant acceleration (suvat) equations, and vertical motion under gravity.", "practicals": [], "summary": [{"h": "Quantities and modelling", "p": ["SI units: metre (m), second (s), kilogram (kg). Derived: velocity m s⁻¹, acceleration m s⁻², force newton (N = kg m s⁻²).", "**Scalars**: distance, speed, time, mass. **Vectors**: displacement, velocity, acceleration, force.", "Modelling assumptions: **particle** (no size, no rotation), **smooth** (no friction), **light** (no mass), **inextensible** string, **no air resistance**."]}, {"h": "Motion graphs", "fig": "vt-graph", "cap": "On a velocity–time graph, the gradient is the acceleration and the area under the graph is the displacement. Here: ½ × 2.5 × 10 + 4.5 × 10 + ½ × 3 × 10 = 12.5 + 45 + 15 = 72.5 m.", "p": ["**Displacement–time**: gradient = **velocity**.", "**Velocity–time**: gradient = **acceleration**. **Area under** the graph = **displacement**."], "svg": "<svg role=\"img\" aria-label=\"On a velocity–time graph, the gradient is the acceleration and the area under the graph is the displacement. Here: ½ × 2.5 × 10 + 4.5 × 10 + ½ × 3 × 10 = 12.5 + 45 + 15 = 72.5 m.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 270\"><defs><marker id=\"f-vtgraph-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-vtgraph-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-vtgraph-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-vtgraph-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><path d=\"M50,250 L50,250 L53.1,243.9 L56.2,237.8 L59.2,231.7 L62.3,225.6 L65.4,219.4 L68.5,213.3 L71.6,207.2 L74.7,201.1 L77.8,195 L80.8,188.9 L83.9,182.8 L87,176.7 L90.1,170.6 L93.2,164.4 L96.2,158.3 L99.3,152.2 L102.4,146.1 L105.5,140 L108.6,133.9 L111.7,127.8 L114.8,121.7 L117.8,115.6 L120.9,109.4 L124,103.3 L127.1,97.2 L130.2,91.1 L133.2,85 L136.3,78.9 L139.4,72.8 L142.5,66.7 L145.6,66.7 L148.7,66.7 L151.8,66.7 L154.8,66.7 L157.9,66.7 L161,66.7 L164.1,66.7 L167.2,66.7 L170.2,66.7 L173.3,66.7 L176.4,66.7 L179.5,66.7 L182.6,66.7 L185.7,66.7 L188.8,66.7 L191.8,66.7 L194.9,66.7 L198,66.7 L201.1,66.7 L204.2,66.7 L207.2,66.7 L210.3,66.7 L213.4,66.7 L216.5,66.7 L219.6,66.7 L222.7,66.7 L225.8,66.7 L228.8,66.7 L231.9,66.7 L235,66.7 L238.1,66.7 L241.2,66.7 L244.2,66.7 L247.3,66.7 L250.4,66.7 L253.5,66.7 L256.6,66.7 L259.7,66.7 L262.8,66.7 L265.8,66.7 L268.9,66.7 L272,66.7 L275.1,66.7 L278.2,66.7 L281.2,66.7 L284.3,66.7 L287.4,66.7 L290.5,66.7 L293.6,66.7 L296.7,66.7 L299.8,66.7 L302.8,66.7 L305.9,66.7 L309,66.7 L312.1,71.8 L315.2,76.9 L318.2,81.9 L321.3,87 L324.4,92.1 L327.5,97.2 L330.6,102.3 L333.7,107.4 L336.8,112.5 L339.8,117.6 L342.9,122.7 L346,127.8 L349.1,132.9 L352.2,138 L355.2,143.1 L358.3,148.1 L361.4,153.2 L364.5,158.3 L367.6,163.4 L370.7,168.5 L373.8,173.6 L376.8,178.7 L379.9,183.8 L383,188.9 L386.1,194 L389.2,199.1 L392.2,204.2 L395.3,209.3 L398.4,214.4 L401.5,219.4 L404.6,224.5 L407.7,229.6 L410.8,234.7 L413.8,239.8 L416.9,244.9 L420,250 L420,250 Z\" class=\"at\" stroke=\"none\"/><line x1=\"50\" y1=\"250\" x2=\"428\" y2=\"250\" class=\"ln\" marker-end=\"url(#f-vtgraph-ah)\"/><line x1=\"50\" y1=\"250\" x2=\"50\" y2=\"22\" class=\"ln\" marker-end=\"url(#f-vtgraph-ah)\"/><text x=\"58\" y=\"26\" class=\"tm\">v / m s⁻¹<\/text><text x=\"434\" y=\"255\" class=\"tm\" font-size=\"12\">t / s<\/text><path d=\"M50,250 L142.5,66.7 L309,66.7 L420,250\" class=\"ac\"/><line x1=\"142.5\" y1=\"250\" x2=\"142.5\" y2=\"255\" class=\"ln\"/><text x=\"142.5\" y=\"270\" class=\"tm\" text-anchor=\"middle\">2.5<\/text><line x1=\"309\" y1=\"250\" x2=\"309\" y2=\"255\" class=\"ln\"/><text x=\"309\" y=\"270\" class=\"tm\" text-anchor=\"middle\">7<\/text><line x1=\"420\" y1=\"250\" x2=\"420\" y2=\"255\" class=\"ln\"/><text x=\"420\" y=\"270\" class=\"tm\" text-anchor=\"middle\">10<\/text><line x1=\"45\" y1=\"66.7\" x2=\"50\" y2=\"66.7\" class=\"ln\"/><text x=\"41\" y=\"71.7\" class=\"tm\" text-anchor=\"end\">10<\/text><text x=\"61.1\" y=\"50.2\" font-size=\"12\">gradient = acceleration<\/text><text x=\"227.6\" y=\"162\" class=\"ta\" text-anchor=\"middle\" font-size=\"13\">area = displacement<\/text><text x=\"227.6\" y=\"180\" class=\"ta\" text-anchor=\"middle\" font-size=\"13\">= 72.5 m<\/text><text x=\"373.8\" y=\"110.7\" font-size=\"12\">deceleration<\/text><\/svg>"}, {"h": "Constant acceleration (suvat)", "p": ["s = displacement, u = initial velocity, v = final velocity, a = acceleration, t = time.", "`v = u + at`", "`s = ½(u + v)t`", "`s = ut + ½at²`", "`s = vt − ½at²`", "`v² = u² + 2as`", "Pick the equation with the four quantities you need (three known, one unknown)."]}, {"h": "Vertical motion", "p": ["Objects moving freely under gravity have acceleration **g = 9.8 m s⁻²** downwards (unless told otherwise).", "Choose a positive direction (e.g. up) and keep signs consistent: if up is positive, a = −9.8.", "At the **highest point**, the velocity is **zero**."]}], "pitfalls": ["Convert units first: km h⁻¹ to m s⁻¹ (divide by 3.6).", "Be consistent with **signs** in vertical motion.", "suvat only works for **constant** acceleration."], "examples": [{"q": "A car accelerates uniformly from 5 m s⁻¹ to 25 m s⁻¹ in 8 s. Find the acceleration and the distance travelled.", "steps": ["a = (v − u)/t = (25 − 5)/8 = 2.5 m s⁻².", "s = ½(u + v)t = ½(5 + 25)(8) = 120 m."], "a": "2.5 m s⁻², 120 m"}, {"q": "A ball is thrown vertically upwards at 14 m s⁻¹. Find its maximum height (g = 9.8 m s⁻²).", "steps": ["Up positive: u = 14, v = 0, a = −9.8.", "v² = u² + 2as: 0 = 196 − 19.6s."], "a": "s = 10 m"}], "questions": [{"q": "What is the SI unit of acceleration?", "o": ["m s⁻¹", "m s⁻²", "N", "kg m s⁻¹"], "a": 1, "e": "Acceleration is change in velocity (m s⁻¹) per second."}, {"q": "What does modelling an object as a particle mean?", "o": ["Its size can be ignored, and it doesn't rotate", "It has no mass", "It moves at constant speed", "It has no weight"], "a": 0, "e": "All its mass is treated as concentrated at a single point."}, {"q": "On a velocity–time graph, what does the area under the graph represent?", "o": ["Acceleration", "Speed", "Displacement", "Time"], "a": 2, "e": "Velocity × time gives displacement."}, {"q": "On a displacement–time graph, what does the gradient represent?", "o": ["Acceleration", "Distance", "Force", "Velocity"], "a": 3, "e": "Rate of change of displacement is velocity."}, {"q": "u = 3 m s⁻¹, a = 2 m s⁻², t = 5 s. Find v.", "o": ["13 m s⁻¹", "10 m s⁻¹", "8 m s⁻¹", "25 m s⁻¹"], "a": 0, "e": "v = u + at = 3 + 10 = 13 m s⁻¹."}, {"q": "u = 0, a = 4 m s⁻², t = 3 s. Find s.", "o": ["12 m", "18 m", "36 m", "6 m"], "a": 1, "e": "s = ut + ½at² = 0 + ½ × 4 × 9 = 18 m."}, {"q": "u = 10 m s⁻¹, v = 0, s = 25 m. Find a.", "o": ["−4 m s⁻²", "4 m s⁻²", "−2 m s⁻²", "2 m s⁻²"], "a": 2, "e": "v² = u² + 2as: 0 = 100 + 50a, so a = −2 m s⁻²."}, {"q": "Convert 72 km h⁻¹ into m s⁻¹.", "o": ["72 m s⁻¹", "7.2 m s⁻¹", "259 m s⁻¹", "20 m s⁻¹"], "a": 3, "e": "72 ÷ 3.6 = 20 m s⁻¹."}, {"q": "A stone is dropped from rest and falls for 2 s. How far does it fall? (g = 9.8)", "o": ["19.6 m", "9.8 m", "39.2 m", "4.9 m"], "a": 0, "e": "s = ½ × 9.8 × 2² = 19.6 m."}, {"q": "What is the velocity of a ball at the highest point of its vertical motion?", "o": ["9.8 m s⁻¹", "0", "Maximum", "Equal to the starting speed"], "a": 1, "e": "It momentarily stops before falling back."}, {"q": "A ball is thrown up at 19.6 m s⁻¹. How long does it take to reach its highest point?", "o": ["1 s", "4 s", "2 s", "19.6 s"], "a": 2, "e": "v = u + at: 0 = 19.6 − 9.8t, so t = 2 s."}, {"q": "Which suvat equation doesn't involve t?", "o": ["v = u + at", "s = ut + ½at²", "s = ½(u + v)t", "v² = u² + 2as"], "a": 3, "e": "Use v² = u² + 2as when time isn't given or needed."}, {"q": "Which suvat equation doesn't involve a?", "o": ["s = ½(u + v)t", "v = u + at", "v² = u² + 2as", "s = vt − ½at²"], "a": 0, "e": "s = ½(u + v)t uses average velocity."}, {"q": "A train decelerates from 30 m s⁻¹ to rest over 450 m. Find the deceleration.", "o": ["2 m s⁻²", "1 m s⁻²", "0.5 m s⁻²", "15 m s⁻²"], "a": 1, "e": "0 = 900 + 2a(450), so a = −1 m s⁻², a deceleration of 1 m s⁻²."}, {"q": "What does 'smooth' mean in a mechanics model?", "o": ["No air resistance", "Constant speed", "No friction", "No mass"], "a": 2, "e": "A smooth surface exerts no frictional force."}, {"q": "What does 'light' mean for a string or rod?", "o": ["It is inextensible", "It is smooth", "It is short", "Its mass can be ignored"], "a": 3, "e": "Tension is then the same throughout a light string."}, {"q": "A v–t graph is a straight line from (0, 4) to (6, 16). What is the acceleration?", "o": ["2 m s⁻²", "4 m s⁻²", "12 m s⁻²", "2.67 m s⁻²"], "a": 0, "e": "Gradient = (16 − 4) ÷ 6 = 2 m s⁻²."}, {"q": "Using the same graph, from (0, 4) to (6, 16), what is the displacement?", "o": ["96 m", "60 m", "120 m", "72 m"], "a": 1, "e": "Area of trapezium = ½(4 + 16) × 6 = 60 m."}, {"q": "Which quantity is a scalar?", "o": ["Velocity", "Displacement", "Speed", "Acceleration"], "a": 2, "e": "Speed has magnitude only."}, {"q": "A ball is thrown up at 7 m s⁻¹ from a cliff 14 m high. Taking up as positive, which values are correct for when it hits the sea?", "o": ["s = 14, a = 9.8", "s = 14, a = −9.8", "s = −14, a = 9.8", "s = −14, a = −9.8"], "a": 3, "e": "The sea is 14 m below the start (s = −14), and gravity acts downwards (a = −9.8)."}, {"q": "Why can't suvat be used when a car's acceleration varies?", "o": ["The suvat equations assume constant acceleration", "It needs radians", "It only works vertically", "It only works for particles at rest"], "a": 0, "e": "Variable acceleration needs calculus (Year 2)."}, {"q": "A cyclist travels at a constant 8 m s⁻¹ for 15 s. How far does she travel?", "o": ["23 m", "120 m", "60 m", "1.9 m"], "a": 1, "e": "Constant velocity: s = vt = 120 m."}]}, {"id": "m2", "order": 16, "year": 1, "section": "M", "badge": "R", "spec": "R", "title": "Forces and Newton's laws", "desc": "Types of force, force diagrams, resultant forces and equilibrium, Newton's three laws, F = ma, connected particles, lifts and pulleys.", "practicals": [], "summary": [{"h": "Forces", "p": ["**Weight** W = mg acts downwards. **Normal reaction** R acts perpendicular to a surface. **Tension** acts along a string, away from the object. **Thrust** pushes along a rod. **Friction** opposes motion.", "Draw a clear **force diagram** with all forces labelled.", "The **resultant force** is the vector sum of all forces. If it is zero, the object is in **equilibrium** (at rest or constant velocity)."]}, {"h": "Newton's laws", "p": ["**First law**: an object stays at rest or moves with constant velocity unless acted on by a resultant force.", "**Second law**: `F = ma`, where F is the **resultant** force in newtons.", "**Third law**: for every action there is an equal and opposite reaction (on a different object).", "Resolve forces in the direction of motion and use F = ma. Perpendicular to the motion, forces balance."]}, {"h": "Connected particles", "fig": "pulley", "cap": "Both particles have the same acceleration a, and the light inextensible string has the same tension T throughout. Write F = ma for each particle separately, in its own direction of motion, then solve the two equations together.", "p": ["For two particles joined by a light inextensible string, both have the **same acceleration** and the **tension is the same** throughout.", "Write F = ma for **each particle** separately, or for the **whole system** (tension is then internal and cancels).", "**Smooth pulleys**: tension is the same on both sides.", "**Lifts**: for a person of mass m in a lift accelerating upwards at a, R − mg = ma."], "svg": "<svg role=\"img\" aria-label=\"Both particles have the same acceleration a, and the light inextensible string has the same tension T throughout. Write F = ma for each particle separately, in its own direction of motion, then solve the two equations together.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 326\"><defs><marker id=\"f-pulley-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-pulley-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-pulley-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-pulley-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><rect x=\"20\" y=\"150\" width=\"300\" height=\"16\" rx=\"2\" class=\"bx\"/><text x=\"30\" y=\"190\" class=\"tm\" font-size=\"12\">smooth table<\/text><rect x=\"120\" y=\"104\" width=\"60\" height=\"46\" rx=\"4\" class=\"at\"/><text x=\"150\" y=\"132\" class=\"ta\" text-anchor=\"middle\" font-size=\"14\">A (m₁)<\/text><circle cx=\"340\" cy=\"150\" r=\"18\" class=\"bx\"/><line x1=\"180\" y1=\"128\" x2=\"338\" y2=\"132\" class=\"ln\"/><line x1=\"358\" y1=\"150\" x2=\"358\" y2=\"220\" class=\"ln\"/><rect x=\"330\" y=\"220\" width=\"56\" height=\"46\" rx=\"4\" class=\"gt\"/><text x=\"358\" y=\"248\" class=\"tg\" text-anchor=\"middle\" font-size=\"13\">B (m₂)<\/text><line x1=\"184\" y1=\"120\" x2=\"240\" y2=\"120\" class=\"ln\" marker-end=\"url(#f-pulley-ah)\"/><text x=\"214\" y=\"112\" text-anchor=\"middle\" font-size=\"15\">T<\/text><line x1=\"372\" y1=\"214\" x2=\"372\" y2=\"172\" class=\"ln\" marker-end=\"url(#f-pulley-ah)\"/><text x=\"380\" y=\"196\" font-size=\"15\">T<\/text><line x1=\"358\" y1=\"268\" x2=\"358\" y2=\"316\" class=\"gl\" marker-end=\"url(#f-pulley-ag)\"/><text x=\"366\" y=\"306\" class=\"tg\" font-size=\"14\">m₂g<\/text><line x1=\"150\" y1=\"168\" x2=\"150\" y2=\"212\" class=\"lm\" marker-end=\"url(#f-pulley-am)\"/><text x=\"158\" y=\"206\" class=\"tm\" font-size=\"13\">m₁g<\/text><line x1=\"150\" y1=\"102\" x2=\"150\" y2=\"60\" class=\"lm\" marker-end=\"url(#f-pulley-am)\"/><text x=\"158\" y=\"70\" class=\"tm\" font-size=\"13\">R<\/text><line x1=\"410\" y1=\"230\" x2=\"410\" y2=\"270\" class=\"ac\" marker-end=\"url(#f-pulley-aa)\"/><text x=\"418\" y=\"254\" class=\"ta\" font-size=\"15\">a<\/text><line x1=\"190\" y1=\"92\" x2=\"240\" y2=\"92\" class=\"ac\" marker-end=\"url(#f-pulley-aa)\"/><text x=\"250\" y=\"96\" class=\"ta\" font-size=\"15\">a<\/text><text x=\"20\" y=\"30\" font-size=\"14\">A: T = m₁a<\/text><text x=\"20\" y=\"50\" font-size=\"14\">B: m₂g − T = m₂a<\/text><\/svg>"}], "pitfalls": ["Use the **resultant** force in F = ma, not just one force.", "Mass in kg, weight in newtons: W = mg.", "Newton's third law pairs act on **different** objects, so they don't cancel on a single force diagram."], "examples": [{"q": "A 5 kg box is pulled along a smooth floor by a horizontal force of 20 N. Find its acceleration.", "steps": ["Resultant force = 20 N (smooth, so no friction).", "F = ma: 20 = 5a."], "a": "a = 4 m s⁻²"}, {"q": "Particles of mass 3 kg and 2 kg hang either side of a smooth pulley. Find the acceleration and tension (g = 9.8).", "steps": ["Whole system: (3 − 2)g = (3 + 2)a, so 9.8 = 5a, a = 1.96 m s⁻².", "For the 2 kg particle (moving up): T − 2g = 2a.", "T = 2(9.8) + 2(1.96) = 19.6 + 3.92 = 23.52."], "a": "a = 1.96 m s⁻², T = 23.5 N (3 s.f.)"}], "questions": [{"q": "What is the weight of a 6 kg mass? (g = 9.8)", "o": ["6 N", "58.8 N", "0.61 N", "15.8 N"], "a": 1, "e": "W = mg = 6 × 9.8 = 58.8 N."}, {"q": "What does Newton's first law state?", "o": ["An object stays at rest or moves with constant velocity unless acted on by a resultant force", "F = ma", "Every action has an equal and opposite reaction", "Weight = mg"], "a": 0, "e": "No resultant force means no change in velocity."}, {"q": "A 2 kg object has a resultant force of 10 N. What is its acceleration?", "o": ["20 m s⁻²", "0.2 m s⁻²", "5 m s⁻²", "12 m s⁻²"], "a": 2, "e": "a = F/m = 10/2 = 5 m s⁻²."}, {"q": "An object moves at constant velocity. What is the resultant force?", "o": ["Equal to its weight", "Positive", "Equal to friction", "Zero"], "a": 3, "e": "Constant velocity means zero acceleration, so the resultant force is zero."}, {"q": "Forces of 12 N (right) and 5 N (left) act on a 3.5 kg particle. Find its acceleration.", "o": ["2 m s⁻² to the right", "4.9 m s⁻² to the right", "2 m s⁻² to the left", "3.4 m s⁻² to the right"], "a": 0, "e": "Resultant = 7 N right. a = 7/3.5 = 2 m s⁻²."}, {"q": "What is the normal reaction on a 4 kg box resting on a horizontal floor? (g = 9.8)", "o": ["4 N", "39.2 N", "0 N", "9.8 N"], "a": 1, "e": "Vertical equilibrium: R = mg = 39.2 N."}, {"q": "Two particles connected by a light inextensible string. Which statement is true?", "o": ["They have different accelerations", "The tension is different at each end", "They have the same acceleration and the tension is the same throughout", "The string has weight"], "a": 2, "e": "Inextensible means equal accelerations; light means equal tension."}, {"q": "A car of mass 1200 kg accelerates at 1.5 m s⁻². The resistance is 400 N. Find the driving force.", "o": ["1800 N", "1400 N", "400 N", "2200 N"], "a": 3, "e": "F − 400 = 1200 × 1.5 = 1800, so F = 2200 N."}, {"q": "A 60 kg person stands in a lift accelerating upwards at 2 m s⁻². What is the normal reaction? (g = 9.8)", "o": ["708 N", "588 N", "468 N", "120 N"], "a": 0, "e": "R − 60g = 60 × 2, so R = 588 + 120 = 708 N."}, {"q": "The same 60 kg person is in a lift accelerating downwards at 2 m s⁻². What is the normal reaction?", "o": ["708 N", "468 N", "588 N", "120 N"], "a": 1, "e": "60g − R = 60 × 2, so R = 588 − 120 = 468 N."}, {"q": "What does Newton's third law say about the Earth pulling a ball down?", "o": ["Nothing pulls back", "The ball's weight cancels it", "The ball pulls the Earth up with an equal force", "The normal reaction is the pair"], "a": 2, "e": "Third-law pairs act on different bodies: the ball on the Earth, the Earth on the ball."}, {"q": "What is the SI unit of force?", "o": ["kg", "J", "W", "N"], "a": 3, "e": "1 N = 1 kg m s⁻²."}, {"q": "Particles of 5 kg and 3 kg hang over a smooth pulley. Find the acceleration. (g = 9.8)", "o": ["2.45 m s⁻²", "4.9 m s⁻²", "1.96 m s⁻²", "9.8 m s⁻²"], "a": 0, "e": "(5 − 3)g = 8a, so a = 19.6/8 = 2.45 m s⁻²."}, {"q": "For the 5 kg and 3 kg pulley system with a = 2.45 m s⁻², what is the tension?", "o": ["29.4 N", "36.75 N", "49 N", "7.35 N"], "a": 1, "e": "For the 3 kg particle: T − 3g = 3a, so T = 29.4 + 7.35 = 36.75 N."}, {"q": "A car (1000 kg) tows a trailer (500 kg) with a light rigid towbar. Driving force 3000 N, no resistance. Find the acceleration.", "o": ["3 m s⁻²", "6 m s⁻²", "2 m s⁻²", "1 m s⁻²"], "a": 2, "e": "Whole system: 3000 = 1500a, so a = 2 m s⁻²."}, {"q": "Using the previous question, what is the tension in the towbar?", "o": ["3000 N", "2000 N", "1500 N", "1000 N"], "a": 3, "e": "Trailer only: T = 500 × 2 = 1000 N."}, {"q": "What happens to the tension calculations if a string is modelled as light?", "o": ["Tension is the same throughout the string", "Tension is zero", "Tension equals weight", "The string can stretch"], "a": 0, "e": "A light string has no mass, so no force is needed to accelerate it."}, {"q": "A box is in equilibrium. Which is true?", "o": ["It must be at rest", "The resultant force is zero", "Only gravity acts", "It accelerates"], "a": 1, "e": "Equilibrium means the forces balance; it may be at rest or at constant velocity."}, {"q": "A force of 30 N acts on a 10 kg mass on a rough surface. Friction is 10 N. Find the acceleration.", "o": ["3 m s⁻²", "4 m s⁻²", "2 m s⁻²", "1 m s⁻²"], "a": 2, "e": "Resultant = 20 N, a = 20/10 = 2 m s⁻²."}, {"q": "A particle accelerates from rest at 3 m s⁻² for 4 s due to a 15 N resultant force. What is its mass?", "o": ["45 kg", "3 kg", "12 kg", "5 kg"], "a": 3, "e": "m = F/a = 15/3 = 5 kg."}, {"q": "On a force diagram, in which direction does the normal reaction act?", "o": ["Perpendicular to the surface, away from it", "Vertically down", "Along the surface", "In the direction of motion"], "a": 0, "e": "The surface pushes back on the object at right angles to the surface."}, {"q": "What does 'inextensible' mean for a string?", "o": ["It has no mass", "It doesn't stretch, so connected objects have the same acceleration", "It is smooth", "It can't break"], "a": 1, "e": "If the string can't stretch, both ends move together."}]}, {"id": "p11", "order": 17, "year": 2, "section": "P", "badge": "A·B", "spec": "A, B", "title": "Proof by contradiction and functions", "desc": "Proof by contradiction, domain and range, composite and inverse functions, modulus functions and combined transformations.", "practicals": [], "summary": [{"h": "Proof by contradiction", "p": ["Assume the **opposite** of what you want to prove, then show this leads to a **contradiction**.", "Classic proofs: √2 is irrational; there are infinitely many primes.", "Structure: 'Assume ... Then ... This contradicts ... So the original statement is true.'"]}, {"h": "Functions", "p": ["A **function** maps each input to exactly **one** output. **One-to-one** functions have an inverse; many-to-one functions don't (unless the domain is restricted).", "**Domain**: the set of allowed inputs. **Range**: the set of outputs.", "**Composite**: fg(x) means apply **g first**, then f: fg(x) = f(g(x)).", "**Inverse** f⁻¹(x): swap x and y, then rearrange. The graph of f⁻¹ is the **reflection of f in y = x**. Domain of f⁻¹ = range of f."]}, {"h": "Modulus", "fig": "modulus", "cap": "To sketch y = |f(x)|, draw y = f(x) and reflect any part below the x-axis up into it. Here the V has its vertex at (2, 0). To solve |2x − 4| = k, find where a horizontal line meets both arms.", "p": ["|x| is the **absolute value** of x: always ≥ 0.", "**y = |f(x)|**: reflect the parts **below the x-axis** upwards.", "**y = f(|x|)**: take the part for x ≥ 0 and **reflect it in the y-axis**.", "Solve |f(x)| = g(x) by considering f(x) = g(x) and −f(x) = g(x), and **check** solutions (often with a sketch)."], "svg": "<svg role=\"img\" aria-label=\"To sketch y = |f(x)|, draw y = f(x) and reflect any part below the x-axis up into it. Here the V has its vertex at (2, 0). To solve |2x − 4| = k, find where a horizontal line meets both arms.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 300\"><defs><marker id=\"f-modulus-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-modulus-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-modulus-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-modulus-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"50\" y1=\"176\" x2=\"438\" y2=\"176\" class=\"ln\" marker-end=\"url(#f-modulus-ah)\"/><line x1=\"113.3\" y1=\"280\" x2=\"113.3\" y2=\"12\" class=\"ln\" marker-end=\"url(#f-modulus-ah)\"/><text x=\"438\" y=\"168\" class=\"tm\" text-anchor=\"end\">x<\/text><text x=\"121.3\" y=\"16\" class=\"tm\">y<\/text><path d=\"M100.7,290.4 L102.7,288.7 L104.8,287 L106.8,285.3 L108.9,283.6 L111,281.9 L113,280.3 L115.1,278.6 L117.1,276.9 L119.2,275.2 L121.2,273.5 L123.3,271.8 L125.4,270.1 L127.4,268.4 L129.5,266.7 L131.5,265.1 L133.6,263.4 L135.7,261.7 L137.7,260 L139.8,258.3 L141.8,256.6 L143.9,254.9 L145.9,253.2 L148,251.5 L150.1,249.8 L152.1,248.2 L154.2,246.5 L156.2,244.8 L158.3,243.1 L160.4,241.4 L162.4,239.7 L164.5,238 L166.5,236.3 L168.6,234.6 L170.7,232.9 L172.7,231.2 L174.8,229.6 L176.8,227.9 L178.9,226.2 L180.9,224.5 L183,2
