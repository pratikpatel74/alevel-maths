2 L318.2,72.5 L320.5,73.8 L322.8,75.2 L325.1,76.7 L327.4,78.2 L329.8,79.8 L332.1,81.4 L334.4,83.1 L336.7,84.8 L339,86.6 L341.3,88.5 L343.6,90.4 L345.9,92.3 L348.2,94.4 L350.6,96.5 L352.9,98.6 L355.2,100.8 L357.5,103 L359.8,105.4 L362.1,107.7 L364.4,110.1 L366.8,112.6 L369.1,115.2 L371.4,117.8 L373.7,120.4 L376,123.1 L378.3,125.9 L380.6,128.7 L382.9,131.6 L385.2,134.5 L387.6,137.5 L389.9,140.6 L392.2,143.7 L394.5,146.9 L396.8,150.1 L399.1,153.4 L401.4,156.7 L403.8,160.1 L406.1,163.6 L408.4,167.1 L410.7,170.6 L413,174.3 L415.3,177.9 L417.6,181.7 L419.9,185.5 L422.2,189.3 L424.6,193.2 L426.9,197.2 L429.2,201.2 L431.5,205.3 L433.8,209.4 L436.1,213.6 L438.4,217.9 L440.8,222.2 L443.1,226.6 L445.4,231 L447.7,235.5 L450,240\" class=\"lm\"/><line x1=\"80\" y1=\"240\" x2=\"139.2\" y2=\"148\" class=\"ac\" marker-end=\"url(#f-projectile-aa)\"/><text x=\"145.2\" y=\"148\" class=\"ta\" font-size=\"16\">U<\/text><line x1=\"80\" y1=\"242\" x2=\"139.2\" y2=\"242\" class=\"gl\" marker-end=\"url(#f-projectile-ag)\"/><text x=\"109.6\" y=\"260\" class=\"tg\" text-anchor=\"middle\" font-size=\"13\">U cos θ<\/text><line x1=\"78\" y1=\"240\" x2=\"78\" y2=\"148\" class=\"gl\" marker-end=\"url(#f-projectile-ag)\"/><text x=\"72\" y=\"194\" class=\"tg\" text-anchor=\"end\" font-size=\"13\">U sin θ<\/text><path d=\"M110,240 A30,30 0 0 0 96.2,214.8\" class=\"ln\"/><text x=\"116\" y=\"230\" font-size=\"14\">θ<\/text><line x1=\"265\" y1=\"240\" x2=\"265\" y2=\"57.4\" class=\"lm\"/><text x=\"271\" y=\"162.4\" class=\"tm\" font-size=\"12\">max height:<\/text><text x=\"271\" y=\"178.4\" class=\"tm\" font-size=\"12\">vertical v = 0<\/text><line x1=\"80\" y1=\"274\" x2=\"450\" y2=\"274\" class=\"ln\" marker-end=\"url(#f-projectile-ah)\" marker-start=\"url(#f-projectile-ah)\"/><text x=\"265\" y=\"290\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">range: vertical displacement = 0<\/text><\/svg>"}, {"h": "Key results", "p": ["**Maximum height**: vertical velocity is zero. `0 = (U sin θ)² − 2gH`, so `H = U² sin²θ / 2g`.", "**Time of flight** (landing at the same level): y = 0, so `T = 2U sin θ / g`.", "**Range**: `R = (U cos θ) × T = U² sin 2θ / g`. Maximum range at θ = 45°.", "**Trajectory equation**: eliminate t to get `y = x tan θ − gx² / (2U² cos²θ)`.", "Speed at any time: `√(v_x² + v_y²)`. Direction: `tan α = v_y / v_x`."]}], "pitfalls": ["Horizontal acceleration is **zero**. Only the vertical motion uses g.", "Take **upwards as positive** and use a = −g, or be consistent with your chosen direction.", "Range and time-of-flight formulas only apply when landing at the **same height**. Otherwise use suvat directly."], "examples": [{"q": "A ball is kicked from the ground at 20 m s⁻¹ at 30° above the horizontal. Find the time of flight and the range (g = 9.8).", "steps": ["Vertical component: 20 sin 30° = 10 m s⁻¹. Horizontal: 20 cos 30° = 17.32 m s⁻¹.", "Vertically, y = 0: 0 = 10t − 4.9t², so t = 10/4.9 = 2.04 s.", "Range = 17.32 × 2.041 = 35.3 m."], "a": "Time ≈ 2.04 s, range ≈ 35.3 m"}, {"q": "A stone is thrown horizontally at 15 m s⁻¹ from the top of a 20 m cliff. How far from the base does it land? (g = 9.8)", "steps": ["Vertically: initial vertical velocity 0. 20 = ½(9.8)t², so t² = 4.08, t = 2.02 s.", "Horizontally: x = 15 × 2.02 = 30.3 m."], "a": "About 30.3 m from the base"}], "questions": [{"q": "In projectile motion (no air resistance), what is the horizontal acceleration?", "o": ["g", "0", "−g", "Depends on the angle"], "a": 1, "e": "No horizontal force acts, so horizontal velocity is constant."}, {"q": "A projectile is launched at 30 m s⁻¹ at 60° above the horizontal. What is the horizontal component of velocity?", "o": ["15 m s⁻¹", "26.0 m s⁻¹", "30 m s⁻¹", "17.3 m s⁻¹"], "a": 0, "e": "30 cos 60° = 15 m s⁻¹."}, {"q": "A projectile is launched at 30 m s⁻¹ at 60° above the horizontal. What is the vertical component?", "o": ["15 m s⁻¹", "17.3 m s⁻¹", "26.0 m s⁻¹", "30 m s⁻¹"], "a": 2, "e": "30 sin 60° = 25.98 ≈ 26.0 m s⁻¹."}, {"q": "At the maximum height of a projectile, what is true?", "o": ["Speed is zero", "Horizontal velocity is zero", "Acceleration is zero", "Vertical velocity is zero"], "a": 3, "e": "It is still moving horizontally, but momentarily has no vertical velocity."}, {"q": "A ball is projected with vertical component 14.7 m s⁻¹. How long does it take to reach maximum height? (g = 9.8)", "o": ["1.5 s", "3.0 s", "0.67 s", "14.7 s"], "a": 0, "e": "v = u + at: 0 = 14.7 − 9.8t, so t = 1.5 s."}, {"q": "Using the same vertical component of 14.7 m s⁻¹, what is the maximum height? (g = 9.8)", "o": ["22.05 m", "11.0 m", "7.35 m", "14.7 m"], "a": 1, "e": "v² = u² + 2as: 0 = 14.7² − 19.6H, so H = 216.09/19.6 = 11.0 m."}, {"q": "What is the formula for the time of flight of a projectile landing at its launch height?", "o": ["U sin θ / g", "U cos θ / g", "2U sin θ / g", "U² sin 2θ / g"], "a": 2, "e": "Solve 0 = (U sin θ)t − ½gt² for the non-zero t."}, {"q": "At what angle of projection is the range greatest (same launch and landing height)?", "o": ["30°", "60°", "90°", "45°"], "a": 3, "e": "R = U² sin 2θ / g is greatest when sin 2θ = 1, so θ = 45°."}, {"q": "A stone is thrown horizontally from a cliff. What is its initial vertical velocity?", "o": ["0", "g", "The throw speed", "It depends on the cliff height"], "a": 0, "e": "Thrown horizontally means all initial velocity is horizontal."}, {"q": "A ball falls 44.1 m from rest. How long does it take? (g = 9.8)", "o": ["9.0 s", "3.0 s", "4.5 s", "2.1 s"], "a": 1, "e": "44.1 = 4.9t², t² = 9, t = 3 s."}, {"q": "A ball is thrown horizontally at 12 m s⁻¹ and lands after 2.5 s. How far does it travel horizontally?", "o": ["4.8 m", "14.5 m", "30 m", "60 m"], "a": 2, "e": "x = 12 × 2.5 = 30 m."}, {"q": "Which is a modelling assumption for projectiles?", "o": ["The projectile spins", "Air resistance is large", "g changes with height", "The projectile is a particle with no air resistance"], "a": 3, "e": "These simplify the model so only gravity acts."}, {"q": "After 2 s, a projectile has v_x = 8 m s⁻¹ and v_y = −6 m s⁻¹. What is its speed?", "o": ["10 m s⁻¹", "14 m s⁻¹", "2 m s⁻¹", "48 m s⁻¹"], "a": 0, "e": "√(8² + 6²) = 10 m s⁻¹."}, {"q": "With v_x = 8 m s⁻¹ and v_y = −6 m s⁻¹, what angle does the velocity make with the horizontal?", "o": ["53.1° above", "36.9° below", "36.9° above", "53.1° below"], "a": 1, "e": "tan α = 6/8, α = 36.9°. v_y is negative, so it's moving below the horizontal."}, {"q": "What is the range of a projectile launched at 20 m s⁻¹ at 45° (g = 9.8)?", "o": ["20.4 m", "28.9 m", "40.8 m", "81.6 m"], "a": 2, "e": "R = U² sin 90° / g = 400/9.8 = 40.8 m."}, {"q": "Which equation gives the vertical displacement of a projectile at time t?", "o": ["y = (U cos θ)t", "y = U sin θ − gt", "y = ½gt²", "y = (U sin θ)t − ½gt²"], "a": 3, "e": "Constant acceleration −g with initial vertical velocity U sin θ."}, {"q": "Doubling the launch speed of a projectile (same angle) multiplies the range by:", "o": ["4", "2", "√2", "8"], "a": 0, "e": "R ∝ U², so doubling U gives 4 times the range."}, {"q": "Two balls are released at the same time from the same height: one dropped, one thrown horizontally. Which lands first?", "o": ["The dropped ball", "They land at the same time", "The thrown ball", "It depends on the throw speed"], "a": 1, "e": "Vertical motion is identical (both start with zero vertical velocity)."}, {"q": "What is the trajectory of a projectile (no air resistance)?", "o": ["A straight line", "A circle", "A parabola", "A hyperbola"], "a": 2, "e": "y is a quadratic function of x."}, {"q": "A projectile is launched at 25 m s⁻¹ at 30°. What is its time of flight to the same level? (g = 9.8)", "o": ["1.28 s", "4.42 s", "5.10 s", "2.55 s"], "a": 3, "e": "T = 2 × 25 sin 30° / 9.8 = 25/9.8 = 2.55 s."}, {"q": "How does air resistance affect the real range compared with the model?", "o": ["The real range is shorter", "The real range is longer", "No difference", "It doubles"], "a": 0, "e": "Air resistance slows the projectile, reducing its range."}, {"q": "A ball is projected at 10 m s⁻¹ at 30° from a height of 2 m. When it lands on the ground, what is its vertical displacement?", "o": ["+2 m", "−2 m", "0 m", "10 m"], "a": 1, "e": "Taking up as positive from the launch point, the ground is 2 m below: s = −2 m."}]}, {"id": "m4", "order": 33, "year": 2, "section": "M", "badge": "Q", "spec": "Q", "title": "Variable acceleration and vectors in kinematics", "desc": "Using calculus for displacement, velocity and acceleration as functions of time, and kinematics with vectors in two dimensions.", "practicals": [], "summary": [{"h": "Calculus in kinematics", "fig": "kinematics-calculus", "cap": "When acceleration isn't constant, suvat doesn't apply. Differentiate to go from displacement to velocity to acceleration; integrate (adding a constant, found from initial conditions) to go back.", "p": ["When acceleration is **not constant**, suvat can't be used. Use calculus.", "**Differentiate** to go down: `v = ds/dt`, `a = dv/dt = d²s/dt²`.", "**Integrate** to go up: `v = ∫a dt`, `s = ∫v dt`. Use **initial conditions** to find the constant of integration.", "**Maximum or minimum displacement**: set v = 0. **Maximum velocity**: set a = 0.", "Distance travelled may differ from displacement if the particle **changes direction**: find when v = 0 and split the integral."], "svg": "<svg role=\"img\" aria-label=\"When acceleration isn&#x27;t constant, suvat doesn&#x27;t apply. Differentiate to go from displacement to velocity to acceleration; integrate (adding a constant, found from initial conditions) to go back.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 288\"><defs><marker id=\"f-kinematicscalculus-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-kinematicscalculus-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-kinematicscalculus-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-kinematicscalculus-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><rect x=\"120\" y=\"18\" width=\"240\" height=\"50\" rx=\"6\" class=\"bx\"/><text x=\"240\" y=\"39\" text-anchor=\"middle\" font-size=\"14\">displacement s<\/text><text x=\"240\" y=\"58\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">s = t³ − 6t²<\/text><rect x=\"120\" y=\"108\" width=\"240\" height=\"50\" rx=\"6\" class=\"bx\"/><text x=\"240\" y=\"129\" text-anchor=\"middle\" font-size=\"14\">velocity v<\/text><text x=\"240\" y=\"148\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">v = ds/dt = 3t² − 12t<\/text><rect x=\"120\" y=\"198\" width=\"240\" height=\"50\" rx=\"6\" class=\"bx\"/><text x=\"240\" y=\"219\" text-anchor=\"middle\" font-size=\"14\">acceleration a<\/text><text x=\"240\" y=\"238\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">a = dv/dt = 6t − 12<\/text><line x1=\"120\" y1=\"68\" x2=\"120\" y2=\"108\" class=\"ac\" marker-end=\"url(#f-kinematicscalculus-aa)\"/><text x=\"112\" y=\"94\" class=\"ta\" text-anchor=\"end\" font-size=\"12\">differentiate<\/text><line x1=\"360\" y1=\"108\" x2=\"360\" y2=\"68\" class=\"gl\" marker-end=\"url(#f-kinematicscalculus-ag)\"/><text x=\"368\" y=\"94\" class=\"tg\" font-size=\"12\">integrate<\/text><text x=\"368\" y=\"110\" class=\"tg\" font-size=\"11\">(+ c)<\/text><line x1=\"120\" y1=\"158\" x2=\"120\" y2=\"198\" class=\"ac\" marker-end=\"url(#f-kinematicscalculus-aa)\"/><text x=\"112\" y=\"184\" class=\"ta\" text-anchor=\"end\" font-size=\"12\">differentiate<\/text><line x1=\"360\" y1=\"198\" x2=\"360\" y2=\"158\" class=\"gl\" marker-end=\"url(#f-kinematicscalculus-ag)\"/><text x=\"368\" y=\"184\" class=\"tg\" font-size=\"12\">integrate<\/text><text x=\"368\" y=\"200\" class=\"tg\" font-size=\"11\">(+ c)<\/text><text x=\"240\" y=\"276\" text-anchor=\"middle\" font-size=\"13\">at rest: v = 0 → t = 0 or t = 4<\/text><\/svg>"}, {"h": "Vectors in kinematics", "p": ["Position, velocity and acceleration can be vectors, e.g. `r = (2t² i + 3t j)` m.", "Differentiate or integrate **each component** separately: `v = dr/dt`, `a = dv/dt`.", "With constant acceleration, suvat works in vector form: `v = u + at`, `r = ut + ½at²`.", "**Speed** is the magnitude of velocity: `|v| = √(x² + y²)`."]}], "pitfalls": ["Don't use suvat unless acceleration is **constant**.", "Always add **+ c** when integrating, then use given conditions to find it.", "Speed is the **magnitude** of the velocity vector. Direction is found with tan."], "examples": [{"q": "A particle moves in a straight line with v = 3t² − 12t + 9 m s⁻¹. Find when it is instantaneously at rest and its acceleration at t = 4.", "steps": ["At rest: 3t² − 12t + 9 = 0, so t² − 4t + 3 = 0, (t − 1)(t − 3) = 0.", "t = 1 s and t = 3 s.", "a = dv/dt = 6t − 12. At t = 4: a = 24 − 12 = 12."], "a": "At rest at t = 1 s and t = 3 s; a = 12 m s⁻² at t = 4"}, {"q": "A particle has a = (2i − 4j) m s⁻² and starts at rest at the origin. Find its velocity and speed at t = 3.", "steps": ["v = u + at = 0 + 3(2i − 4j) = 6i − 12j.", "Speed = √(6² + 12²) = √180 = 13.4 m s⁻¹."], "a": "v = 6i − 12j m s⁻¹, speed ≈ 13.4 m s⁻¹"}], "questions": [{"q": "How is velocity found from displacement s(t)?", "o": ["Integrate s", "Differentiate s with respect to t", "Divide s by t", "Multiply s by t"], "a": 1, "e": "v = ds/dt."}, {"q": "s = t³ − 6t² + 4. What is v?", "o": ["3t² − 12t", "t⁴/4 − 2t³ + 4t", "3t² − 12t + 4", "6t − 12"], "a": 0, "e": "Differentiate each term: 3t² − 12t."}, {"q": "v = 4t − 3. What is a?", "o": ["4t", "2t² − 3t", "4", "−3"], "a": 2, "e": "a = dv/dt = 4."}, {"q": "a = 6t and the particle starts from rest. What is v?", "o": ["6", "6t + c with c unknown", "3t", "3t²"], "a": 3, "e": "v = ∫6t dt = 3t² + c. At t = 0, v = 0, so c = 0."}, {"q": "Why can't suvat be used when a = 2t?", "o": ["The acceleration isn't constant", "The acceleration is negative", "It is a vector", "t must be positive"], "a": 0, "e": "suvat equations assume constant acceleration."}, {"q": "v = 3t² − 12. When is the particle at rest (t > 0)?", "o": ["t = 4", "t = 2", "t = 12", "t = 3"], "a": 1, "e": "3t² = 12, t² = 4, t = 2."}, {"q": "v = 2t + 1 and s = 0 when t = 0. What is s at t = 3?", "o": ["7 m", "9 m", "12 m", "10 m"], "a": 2, "e": "s = t² + t, so s(3) = 9 + 3 = 12 m."}, {"q": "How is maximum velocity found when v is a function of t?", "o": ["Set v = 0", "Set s = 0", "Integrate a", "Set a = 0 and solve"], "a": 3, "e": "At a maximum of v, dv/dt = a = 0."}, {"q": "v = 6t − t². What is the maximum velocity?", "o": ["9 m s⁻¹", "6 m s⁻¹", "3 m s⁻¹", "12 m s⁻¹"], "a": 0, "e": "a = 6 − 2t = 0 at t = 3. v(3) = 18 − 9 = 9 m s⁻¹."}, {"q": "r = (t² i + 4t j) m. What is the velocity?", "o": ["(t i + 4 j)", "(2t i + 4 j)", "(2 i)", "(2t i + 4t j)"], "a": 1, "e": "Differentiate each component: 2t and 4."}, {"q": "v = (3i + 4j) m s⁻¹. What is the speed?", "o": ["7 m s⁻¹", "12 m s⁻¹", "5 m s⁻¹", "25 m s⁻¹"], "a": 2, "e": "√(3² + 4²) = 5 m s⁻¹."}, {"q": "u = (2i + j), a = (i − j), t = 2. What is v (constant acceleration)?", "o": ["(3i)", "(2i + j)", "(i + 3j)", "(4i − j)"], "a": 3, "e": "v = u + at = (2i + j) + 2(i − j) = 4i − j."}, {"q": "u = 0, a = (2i + 6j), t = 3. What is the displacement r (constant acceleration)?", "o": ["(9i + 27j)", "(6i + 18j)", "(3i + 9j)", "(18i + 54j)"], "a": 0, "e": "r = ½at² = ½(2i + 6j)(9) = 9i + 27j."}, {"q": "v = (4t i − 3 j). What is the acceleration?", "o": ["(4t i)", "(4 i)", "(2t² i − 3t j)", "(4 i − 3 j)"], "a": 1, "e": "Differentiate: 4 and 0."}, {"q": "v = 4 − t². Why might the distance travelled in 0 ≤ t ≤ 3 differ from the displacement?", "o": ["Acceleration is constant", "v is always positive", "The particle changes direction at t = 2", "Distance is always smaller"], "a": 2, "e": "v = 0 at t = 2, so the integral must be split to find total distance."}, {"q": "a = 2t − 4. The particle starts with v = 3 at t = 0. What is v?", "o": ["2t − 4", "t² − 4t", "t² + 3", "t² − 4t + 3"], "a": 3, "e": "v = t² − 4t + c, with c = 3."}, {"q": "s = 2t³ − 9t² + 12t. At which times is the particle at rest?", "o": ["t = 1 and t = 2", "t = 2 and t = 3", "t = 0 only", "t = 1.5"], "a": 0, "e": "v = 6t² − 18t + 12 = 6(t − 1)(t − 2) = 0."}, {"q": "What does the gradient of a velocity–time graph represent?", "o": ["Displacement", "Acceleration", "Speed", "Distance"], "a": 1, "e": "a = dv/dt is the gradient."}, {"q": "What does the area under a velocity–time graph represent?", "o": ["Acceleration", "Speed", "Displacement", "Force"], "a": 2, "e": "s = ∫v dt is the area under the graph."}, {"q": "r = (3t i + (2t² − 5) j). When is the particle due east of the origin (j-component zero)?", "o": ["t = 5", "t = 2.5", "t = 0", "t = √2.5 ≈ 1.58"], "a": 3, "e": "2t² − 5 = 0 gives t² = 2.5, t ≈ 1.58 s."}, {"q": "v = (6i − 8j). What angle does the velocity make with the i direction?", "o": ["53.1° below i", "36.9° below i", "53.1° above i", "36.9° above i"], "a": 0, "e": "tan α = 8/6, α = 53.1°. The j-component is negative, so it's below."}, {"q": "a = 12t² and v = 0, s = 0 at t = 0. What is s?", "o": ["4t³", "t⁴", "12t⁴", "24t"], "a": 1, "e": "v = 4t³, then s = t⁴."}]}, {"id": "m5", "order": 34, "year": 2, "section": "M", "badge": "R", "spec": "R", "title": "Friction, inclined planes and resolving forces", "desc": "Resolving forces into components, equilibrium, the model of friction F ≤ μR, motion on rough and smooth inclined planes, and connected particles with friction.", "practicals": [], "summary": [{"h": "Resolving forces", "p": ["A force F at angle θ to the horizontal has components `F cos θ` (horizontal) and `F sin θ` (vertical).", "In **equilibrium**, the resultant force is zero, so components balance in **each** direction.", "On an **inclined plane** at angle α, resolve **parallel** and **perpendicular** to the slope. Weight has components `mg sin α` down the slope and `mg cos α` into the slope."]}, {"h": "Friction", "p": ["Friction **opposes** motion or the tendency to move.", "**Model**: `F ≤ μR`, where μ is the **coefficient of friction** and R is the normal reaction.", "When the object is moving or on the point of moving (**limiting equilibrium**), `F = μR`.", "Smooth surface: μ = 0."]}, {"h": "Inclined planes", "fig": "inclined-plane", "cap": "Resolve parallel and perpendicular to the slope. Perpendicular: R = mg cos θ. Parallel: the weight component mg sin θ acts down the slope; friction acts up the slope if the particle would slide down. Limiting friction: F = μR.", "p": ["Perpendicular to the slope: `R = mg cos α` (plus or minus components of any other forces).", "Parallel: use `F = ma` along the slope, with friction acting up or down the slope opposite to the motion.", "A particle on a rough slope is on the point of sliding when `mg sin α = μ mg cos α`, so `μ = tan α`."], "svg": "<svg role=\"img\" aria-label=\"Resolve parallel and perpendicular to the slope. Perpendicular: R = mg cos θ. Parallel: the weight component mg sin θ acts down the slope; friction acts up the slope if the particle would slide down. Limiting friction: F = μR.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 300\"><defs><marker id=\"f-inclinedplane-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-inclinedplane-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-inclinedplane-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-inclinedplane-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><path d=\"M30,290 L440,290 L440,72 Z\" class=\"bx\"/><path d=\"M90,290 A60,60 0 0 0 83,261.8\" class=\"ln\"/><text x=\"102\" y=\"280\" font-size=\"15\">θ<\/text><path d=\"M219.1,189.5 L280.9,156.6 L261.2,119.5 L199.4,152.4 Z\" class=\"at\"/><line x1=\"240.1\" y1=\"154.5\" x2=\"240.1\" y2=\"266.5\" class=\"ln\" marker-end=\"url(#f-inclinedplane-ah)\"/><text x=\"248.1\" y=\"272.5\" font-size=\"14\">mg<\/text><line x1=\"240.1\" y1=\"154.5\" x2=\"195.1\" y2=\"69.7\" class=\"ac\" marker-end=\"url(#f-inclinedplane-aa)\"/><text x=\"201.1\" y=\"69.7\" class=\"ta\" font-size=\"14\">R<\/text><line x1=\"240.1\" y1=\"154.5\" x2=\"324.9\" y2=\"109.4\" class=\"gl\" marker-end=\"url(#f-inclinedplane-ag)\"/><text x=\"330.9\" y=\"109.4\" class=\"tg\" font-size=\"14\">F (friction)<\/text><line x1=\"240.1\" y1=\"154.5\" x2=\"174.8\" y2=\"189.2\" class=\"lm\" marker-end=\"url(#f-inclinedplane-am)\"/><text x=\"166.8\" y=\"205.2\" class=\"tm\" text-anchor=\"end\" font-size=\"13\">mg sin θ<\/text><line x1=\"240.1\" y1=\"154.5\" x2=\"270.2\" y2=\"211\" class=\"lm\" marker-end=\"url(#f-inclinedplane-am)\"/><text x=\"278.2\" y=\"227\" class=\"tm\" font-size=\"13\">mg cos θ<\/text><\/svg>"}], "pitfalls": ["R isn't always mg. Find it by resolving perpendicular to the surface, including other forces.", "Friction acts **opposite** to the direction of motion (or of the tendency to move).", "Use `F = μR` only when moving or on the point of moving. Otherwise `F ≤ μR`."], "examples": [{"q": "A 4 kg block rests on a rough horizontal surface (μ = 0.3). A horizontal force of 20 N is applied. Find the acceleration (g = 9.8).", "steps": ["R = 4g = 39.2 N.", "Maximum friction = 0.3 × 39.2 = 11.76 N. 20 > 11.76, so the block moves.", "F = ma: 20 − 11.76 = 4a, so a = 2.06 m s⁻²."], "a": "a ≈ 2.06 m s⁻²"}, {"q": "A 2 kg particle slides down a smooth slope at 30°. Find its acceleration (g = 9.8).", "steps": ["Component of weight down the slope = 2g sin 30° = 9.8 N.", "F = ma: 9.8 = 2a."], "a": "a = 4.9 m s⁻²"}], "questions": [{"q": "A force of 50 N acts at 30° to the horizontal. What is its horizontal component?", "o": ["25 N", "43.3 N", "50 N", "28.9 N"], "a": 1, "e": "50 cos 30° = 43.3 N."}, {"q": "A force of 50 N acts at 30° to the horizontal. What is its vertical component?", "o": ["25 N", "43.3 N", "57.7 N", "86.6 N"], "a": 0, "e": "50 sin 30° = 25 N."}, {"q": "What is the model of friction?", "o": ["F = mg", "F = ma", "F ≤ μR", "F = μmg always"], "a": 2, "e": "Friction can take any value up to the limiting value μR."}, {"q": "When does F = μR?", "o": ["Always", "Only when at rest", "Only on smooth surfaces", "When the object is moving or on the point of moving"], "a": 3, "e": "This is limiting friction."}, {"q": "A 5 kg block is on a rough horizontal surface with μ = 0.4. What is the maximum friction? (g = 9.8)", "o": ["19.6 N", "2 N", "49 N", "12.25 N"], "a": 0, "e": "R = 5 × 9.8 = 49 N. F = 0.4 × 49 = 19.6 N."}, {"q": "What is the component of weight acting down a slope at angle α?", "o": ["mg cos α", "mg sin α", "mg tan α", "mg"], "a": 1, "e": "The component parallel to the slope is mg sin α."}, {"q": "What is the normal reaction on a particle of mass m resting on a slope at angle α (no other forces)?", "o": ["mg", "mg sin α", "mg cos α", "mg tan α"], "a": 2, "e": "Resolving perpendicular to the slope: R = mg cos α."}, {"q": "A particle is on the point of sliding down a rough slope at angle α. What is μ?", "o": ["sin α", "cos α", "1/tan α", "tan α"], "a": 3, "e": "mg sin α = μ mg cos α, so μ = tan α."}, {"q": "A 3 kg particle slides down a smooth slope inclined at 20°. What is its acceleration? (g = 9.8)", "o": ["3.35 m s⁻²", "9.21 m s⁻²", "9.8 m s⁻²", "1.12 m s⁻²"], "a": 0, "e": "a = g sin 20° = 9.8 × 0.342 = 3.35 m s⁻²."}, {"q": "What does a smooth surface mean in modelling?", "o": ["μ = 1", "No friction (μ = 0)", "Very rough", "The object is light"], "a": 1, "e": "A smooth surface exerts no friction."}, {"q": "In which direction does friction act on a block being pulled to the right?", "o": ["Right", "Up", "Left", "Down"], "a": 2, "e": "Friction opposes the motion."}, {"q": "A 10 kg block is pulled by a force of 40 N at 30° above the horizontal on a rough surface. What is R? (g = 9.8)", "o": ["98 N", "118 N", "78 N", "64.4 N"], "a": 2, "e": "Vertically: R + 40 sin 30° = 98, so R = 98 − 20 = 78 N."}, {"q": "In equilibrium, what is the resultant force?", "o": ["Zero", "Equal to the weight", "Equal to friction", "Positive"], "a": 0, "e": "All forces balance in every direction."}, {"q": "A block on a rough horizontal surface (μ = 0.5, R = 20 N) is pushed by 6 N. What is the friction force?", "o": ["10 N", "6 N", "20 N", "0 N"], "a": 1, "e": "Maximum friction is 10 N. The push is only 6 N, so friction is 6 N and the block stays still."}, {"q": "A 2 kg particle on a rough slope at 30° (μ = 0.2) slides down. What is the friction force? (g = 9.8)", "o": ["9.8 N", "1.96 N", "3.39 N", "16.97 N"], "a": 2, "e": "R = 2g cos 30° = 16.97 N. F = 0.2 × 16.97 = 3.39 N."}, {"q": "Using the previous question, what is the acceleration down the slope?", "o": ["4.9 m s⁻²", "6.4 m s⁻²", "1.7 m s⁻²", "3.2 m s⁻²"], "a": 3, "e": "2g sin 30° − 3.39 = 9.8 − 3.39 = 6.41. a = 6.41/2 = 3.2 m s⁻²."}, {"q": "Three forces act on a particle in equilibrium. What can be said about them?", "o": ["Their vector sum is zero", "They must be equal", "They act in the same direction", "They are all perpendicular"], "a": 0, "e": "The resultant is zero, so they form a closed triangle."}, {"q": "What happens to R when a force pulls a block upwards at an angle?", "o": ["It increases", "It decreases", "It stays equal to mg", "It becomes zero"], "a": 1, "e": "The upward component of the pull supports part of the weight."}, {"q": "A particle rests on a rough slope. Which way does friction act?", "o": ["Down the slope", "Perpendicular to the slope", "Up the slope", "There is no friction"], "a": 2, "e": "The particle tends to slide down, so friction acts up the slope."}, {"q": "What is the coefficient of friction if a 4 kg block needs exactly 15.68 N to start moving on a horizontal surface? (g = 9.8)", "o": ["0.25", "0.5", "0.16", "0.4"], "a": 3, "e": "μ = F/R = 15.68/39.2 = 0.4."}, {"q": "Which is a modelling assumption when using F = μR?", "o": ["μ is constant for the two surfaces in contact", "Friction is zero", "R always equals mg", "Friction increases with speed"], "a": 0, "e": "The model treats μ as a constant for given surfaces."}, {"q": "A 6 kg particle hangs in equilibrium from two strings. What is the total vertical component of tension? (g = 9.8)", "o": ["6 N", "58.8 N", "29.4 N", "117.6 N"], "a": 1, "e": "Vertical components must balance the weight: 6 × 9.8 = 58.8 N."}]}, {"id": "m6", "order": 35, "year": 2, "section": "M", "badge": "S", "spec": "S", "title": "Moments", "desc": "Moments of a force, equilibrium of rigid bodies, uniform and non-uniform rods, tilting, and ladder problems.", "practicals": [], "summary": [{"h": "Moments", "p": ["The **moment** of a force about a point = `force × perpendicular distance` from the point to the line of action of the force. Units **N m**.", "Moments can be **clockwise** or **anticlockwise**.", "If a force acts at an angle, use its perpendicular component, or the perpendicular distance: `moment = Fd sin θ`."]}, {"h": "Equilibrium of rigid bodies", "p": ["A rigid body is in equilibrium when: **resultant force = 0** (forces balance in every direction) **and** the **sum of moments about any point = 0**.", "Take moments about a point where an **unknown force acts**, so it disappears from the equation.", "A **uniform** rod's weight acts at its **centre**. For a **non-uniform** rod, the centre of mass is elsewhere and may need to be found."]}, {"h": "Tilting and ladders", "fig": "ladder", "cap": "A uniform ladder of length L against a smooth wall: the wall gives only a horizontal reaction S, the ground gives a normal reaction R and friction F towards the wall. Take moments about the foot to remove R and F from the equation.", "p": ["When a rod is **on the point of tilting** about a support, the reaction at the **other** support is **zero**.", "**Ladders**: a ladder against a smooth wall has a horizontal reaction at the wall and a normal reaction plus friction at the ground. Resolve and take moments (usually about the foot)."], "svg": "<svg role=\"img\" aria-label=\"A uniform ladder of length L against a smooth wall: the wall gives only a horizontal reaction S, the ground gives a normal reaction R and friction F towards the wall. Take moments about the foot to remove R and F from the equation.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 330\"><defs><marker id=\"f-ladder-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-ladder-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-ladder-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-ladder-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"30\" y1=\"300\" x2=\"450\" y2=\"300\" class=\"ln thick\"/><line x1=\"400\" y1=\"300\" x2=\"400\" y2=\"20\" class=\"ln thick\"/><text x=\"408\" y=\"34\" class=\"tm\" font-size=\"12\">smooth wall<\/text><text x=\"40\" y=\"318\" class=\"tm\" font-size=\"12\">rough ground<\/text><line x1=\"170\" y1=\"300\" x2=\"400\" y2=\"60\" class=\"ln\" stroke-width=\"7\" stroke-linecap=\"round\"/><line x1=\"285\" y1=\"180\" x2=\"285\" y2=\"260\" class=\"gl\" marker-end=\"url(#f-ladder-ag)\"/><text x=\"293\" y=\"258\" class=\"tg\" font-size=\"15\">W<\/text><circle cx=\"285\" cy=\"180\" r=\"4\" class=\"gf\"/><line x1=\"400\" y1=\"60\" x2=\"320\" y2=\"60\" class=\"ac\" marker-end=\"url(#f-ladder-aa)\"/><text x=\"316\" y=\"52\" class=\"ta\" text-anchor=\"end\" font-size=\"15\">S<\/text><line x1=\"170\" y1=\"300\" x2=\"170\" y2=\"210\" class=\"ac\" marker-end=\"url(#f-ladder-aa)\"/><text x=\"162\" y=\"208\" class=\"ta\" text-anchor=\"end\" font-size=\"15\">R<\/text><line x1=\"170\" y1=\"294\" x2=\"250\" y2=\"294\" class=\"ac\" marker-end=\"url(#f-ladder-aa)\"/><text x=\"256\" y=\"290\" class=\"ta\" font-size=\"15\">F<\/text><path d=\"M216,300 A46,46 0 0 0 201.8,266.8\" class=\"ln\"/><text x=\"224\" y=\"286\" font-size=\"14\">θ<\/text><text x=\"30\" y=\"40\" font-size=\"14\">Resolve: F = S, R = W<\/text><text x=\"30\" y=\"60\" font-size=\"14\">Moments about the foot:<\/text><text x=\"30\" y=\"80\" font-size=\"14\">W × (L/2) cos θ = S × L sin θ<\/text><\/svg>"}], "pitfalls": ["Use the **perpendicular** distance, not the distance along the rod, when a force is at an angle.", "On the point of tilting about one support, the reaction at the **other** support is zero.", "Choose your pivot to eliminate unknowns, and state 'taking moments about A'."], "examples": [{"q": "A uniform rod AB of length 4 m and mass 10 kg rests on supports at A and B. A 5 kg mass sits 1 m from A. Find the reactions (g = 9.8).", "steps": ["Weight of rod 10g acts at 2 m from A. The 5 kg mass is at 1 m from A.", "Moments about A: R_B × 4 = 10g × 2 + 5g × 1 = 25g, so R_B = 6.25g = 61.25 N.", "Resolving vertically: R_A + R_B = 15g, so R_A = 15g − 6.25g = 8.75g = 85.75 N."], "a": "R_A ≈ 85.8 N, R_B ≈ 61.3 N"}, {"q": "A uniform plank of length 6 m and mass 20 kg rests on supports 1 m from each end. How far beyond a support can a 40 kg person stand before it tilts?", "steps": ["On the point of tilting about the right support C, the reaction at the left support is zero.", "The plank's weight acts at the centre, 2 m left of C. Person at distance x to the right of C.", "Moments about C: 20g × 2 = 40g × x, so x = 1 m."], "a": "1 m beyond the support, which is the end of the plank"}], "questions": [{"q": "What is the moment of a 20 N force acting perpendicular to a rod at 3 m from the pivot?", "o": ["6.67 N m", "60 N m", "23 N m", "17 N m"], "a": 1, "e": "Moment = 20 × 3 = 60 N m."}, {"q": "What are the units of a moment?", "o": ["N m", "N", "N/m", "kg m"], "a": 0, "e": "Force (N) × distance (m)."}, {"q": "What two conditions are needed for a rigid body to be in equilibrium?", "o": ["Zero velocity and zero acceleration", "Equal forces on each end", "Resultant force zero and sum of moments zero", "Moments clockwise only"], "a": 2, "e": "Forces must balance and the total moment about any point must be zero."}, {"q": "Where does the weight of a uniform rod act?", "o": ["At one end", "At a third of its length", "It depends on the supports", "At its centre"], "a": 3, "e": "Uniform means the mass is evenly distributed."}, {"q": "A 10 N force acts at 30° to a rod, 2 m from the pivot. What is its moment?", "o": ["10 N m", "17.3 N m", "20 N m", "5 N m"], "a": 0, "e": "Moment = 10 × 2 × sin 30° = 10 N m."}, {"q": "Why do we take moments about the point where an unknown force acts?", "o": ["It makes the force larger", "The unknown force has zero moment about that point, so it is eliminated", "It's always the centre", "To find the weight"], "a": 1, "e": "A force has no moment about a point on its line of action."}, {"q": "A rod is on the point of tilting about support B. What is the reaction at the other support A?", "o": ["Equal to the weight", "Equal to the reaction at B", "Zero", "Half the weight"], "a": 2, "e": "The rod is about to lift off A, so A exerts no force."}, {"q": "A 4 m uniform rod of weight 30 N is pivoted at its centre. A 10 N weight hangs 1.5 m from the centre. Where must a 15 N weight hang on the other side to balance?", "o": ["1.5 m", "2 m", "0.5 m", "1 m"], "a": 3, "e": "10 × 1.5 = 15 × d, so d = 1 m."}, {"q": "A uniform 2 m rod of weight 40 N rests on supports at its ends. What is the reaction at each support?", "o": ["20 N", "40 N", "80 N", "10 N"], "a": 0, "e": "By symmetry, each support takes half the weight."}, {"q": "A uniform rod AB, 5 m long, weight 50 N, rests on supports at A and 1 m from B. What is the reaction at the support near B?", "o": ["50 N", "31.25 N", "18.75 N", "25 N"], "a": 1, "e": "Moments about A: R × 4 = 50 × 2.5, so R = 31.25 N."}, {"q": "What is a non-uniform rod?", "o": ["A rod with no weight", "A bent rod", "A rod whose centre of mass is not at its midpoint", "A rod with friction"], "a": 2, "e": "Its mass isn't evenly distributed, so its weight acts elsewhere."}, {"q": "A ladder rests against a smooth wall. What force does the wall exert?", "o": ["Friction only", "A vertical force", "Both friction and a normal reaction", "A normal reaction perpendicular to the wall (horizontal)"], "a": 3, "e": "A smooth wall can't exert friction, so only a horizontal reaction acts."}, {"q": "For a ladder on rough ground against a smooth wall, what balances the wall's reaction horizontally?", "o": ["Friction at the ground", "The weight", "The normal reaction at the ground", "Nothing"], "a": 0, "e": "Resolving horizontally: friction at the foot equals the wall reaction."}, {"q": "A ladder on rough ground: what balances the weight vertically?", "o": ["The wall reaction", "The normal reaction at the ground", "Friction at the ground", "Tension"], "a": 1, "e": "Resolving vertically: R(ground) = weight (if the wall is smooth)."}, {"q": "Clockwise moments are 120 N m and anticlockwise m /* ---------- Quiz ---------- */
const DRAW = 10;
let Q = null, timerInterval = null;
function renderQuiz(u, retry) {
  clearInterval(timerInterval);
  let pool = u.questions.map((q, i) => Object.assign({ _id: i }, q));
  if (retry) {
    const m = store.get('missed_' + u.id, []);
    const p2 = pool.filter(q => m.includes(q._id));
    if (p2.length) pool = p2;
  } else store.del('missed_' + u.id);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  Q = { u, qs: pool.slice(0, Math.min(DRAW, pool.length)), cur: 0, score: 0, answered: false, done: false, timer: store.get('timer', false), secs: 60 };
  const cls = secClass(u);
  $('#app').innerHTML = topbar(`<button class="pill-btn ${Q.timer ? 'active' : ''}" id="timer-btn" onclick="toggleTimer()">Timer: ${Q.timer ? 'On' : 'Off'}</button><a class="pill-btn" href="#hub">← Hub</a>`) + `
  <main class="quiz wrap ${cls}"><div class="quiz-head"><div class="page-eyebrow">${esc(u.section.includes('.') ? u.section : SEC_NAMES[u.section])} · Spec ${esc(u.spec)}</div><h1 class="page-title">${esc(u.title)}</h1>
  <p class="page-sub">${retry ? 'Retrying the questions you missed' : `10 questions drawn from a pool of ${u.questions.length}`} · <a href="#s-${u.id}">Read the summary</a></p></div>
  <div id="qa"></div></main>` + footer();
  drawQ();
}
function drawQ() {
  const q = Q.qs[Q.cur], L = ['A', 'B', 'C', 'D'];
  Q.answered = false;
  $('#qa').innerHTML = `<div class="prog-label"><span>Question ${Q.cur + 1} of ${Q.qs.length}</span><span>Score: ${Q.score}</span></div>
  <div class="prog"><div style="width:${(Q.cur + 1) / Q.qs.length * 100}%"></div></div>
  <div class="q-card"><div class="q-num"><span>Question ${Q.cur + 1}</span>${Q.timer ? `<span class="q-timer" id="q-timer">60s</span>` : ''}</div>
  <div class="q-text">${fmt(q.q)}</div><div class="options">${q.o.map((o, i) => `<button class="option" id="opt${i}" onclick="pick(${i})"><span class="letter">${L[i]}</span><span>${fmt(o)}</span></button>`).join('')}</div>
  <div id="fb"></div></div>
  <div class="quiz-foot"><span class="key-hint">Keys: 1–4 to answer · Enter for next</span><button class="btn-next" id="next" hidden onclick="nextQ()">Next →</button></div>`;
  if (Q.timer) startTimer();
}
function startTimer() {
  clearInterval(timerInterval); Q.secs = 60;
  timerInterval = setInterval(() => {
    Q.secs--; const el = $('#q-timer');
    if (el) { el.textContent = Q.secs + 's'; if (Q.secs <= 10) el.classList.add('warn'); }
    if (Q.secs <= 0) { clearInterval(timerInterval); pick(-1); }
  }, 1000);
}
function pick(i) {
  if (!Q || Q.answered || Q.done) return;
  Q.answered = true; clearInterval(timerInterval);
  const q = Q.qs[Q.cur];
  document.querySelectorAll('.option').forEach(b => b.disabled = true);
  const ok = i === q.a;
  if (ok) Q.score++;
  else {
    if (i >= 0) $('#opt' + i).classList.add('wrong');
    const m = store.get('missed_' + Q.u.id, []); if (!m.includes(q._id)) { m.push(q._id); store.set('missed_' + Q.u.id, m); }
  }
  $('#opt' + q.a).classList.add('correct');
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'correct' : 'wrong'}"><b>${ok ? 'Correct.' : i === -1 ? "Time's up." : 'Not quite.'}</b> ${fmt(q.e)}</div>`;
  const nb = $('#next'); nb.hidden = false; nb.textContent = Q.cur < Q.qs.length - 1 ? 'Next →' : 'See results'; nb.focus({ preventScroll: true });
  document.querySelector('.prog-label span:last-child').textContent = 'Score: ' + Q.score;
}
function nextQ() { if (!Q.answered) return; Q.cur++; if (Q.cur >= Q.qs.length) return showResult(); drawQ(); window.scrollTo(0, 0); }
function showResult() {
  Q.done = true; clearInterval(timerInterval);
  const pct = Math.round(Q.score / Q.qs.length * 100);
  store.set('last_' + Q.u.id, { score: Q.score, total: Q.qs.length, pct, date: new Date().toISOString() });
  const missed = store.get('missed_' + Q.u.id, []).length;
  const msg = pct >= 80 ? 'Excellent. This topic is in good shape.' : pct >= 60 ? 'Good effort. Read the explanations for the ones you missed.' : 'Worth another pass through the summary, then retry.';
  $('#qa').innerHTML = `<div class="result"><div class="result-score">${Q.score}/${Q.qs.length}</div><div class="result-pct">${pct}% correct</div><div class="result-msg">${msg}</div>
  <div class="actions"><button class="btn primary" onclick="renderQuiz(Q.u,false)">New quiz</button>${missed ? `<button class="btn warn" onclick="renderQuiz(Q.u,true)">Retry ${missed} missed</button>` : ''}<a class="btn" href="#s-${Q.u.id}">Summary</a><a class="btn" href="#hub">Hub</a></div></div>`;
}
function toggleTimer() {
  Q.timer = !Q.timer; store.set('timer', Q.timer);
  const b = $('#timer-btn'); b.textContent = 'Timer: ' + (Q.timer ? 'On' : 'Off'); b.classList.toggle('active', Q.timer);
}
document.addEventListener('keydown', e => {
  if (!Q || Q.done || !$('#qa')) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (!Q.answered && ['1', '2', '3', '4'].includes(e.key)) pick(+e.key - 1);
  else if (Q.answered && (e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.id !== 'next') { e.preventDefault(); nextQ(); }
});

/* ---------- Router ---------- */
function route() {
  clearInterval(timerInterval); Q = null;
  const h = location.hash.replace('#', '');
  let m;
  if ((m = h.match(/^q-(.+)$/)) && unitById(m[1])) renderQuiz(unitById(m[1]), false);
  else if ((m = h.match(/^s-(.+)$/)) && unitById(m[1])) renderSummary(unitById(m[1]));
  else if (h === 'practicals') renderPracticals();
  else if ((m = h.match(/^rp-(\d+)$/))) renderPracticals(m[1]);
  else renderHub();
  if (!/^rp-/.test(h)) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
