acket (x) changes happen in reverse order to how they appear; outside changes act on y.", "E.g. y = 2f(x − 3) + 1: translate right 3, stretch vertically by 2, then translate up 1."]}], "pitfalls": ["fg(x) means **g first**. Order matters.", "When solving modulus equations, always check solutions in the original equation.", "The domain of f⁻¹ is the **range** of f."], "examples": [{"q": "Prove by contradiction that √2 is irrational.", "steps": ["Assume √2 = a/b, where a and b are integers with no common factors.", "Then 2 = a²/b², so a² = 2b². So a² is even, so a is even: a = 2k.", "Then 4k² = 2b², so b² = 2k², so b is even.", "a and b are both even, contradicting 'no common factors'."], "a": "So √2 is irrational. ∎"}, {"q": "f(x) = 3x − 1 and g(x) = x². Find fg(2) and f⁻¹(x).", "steps": ["g(2) = 4, so fg(2) = f(4) = 11.", "y = 3x − 1, so x = (y + 1)/3."], "a": "fg(2) = 11, f⁻¹(x) = (x + 1)/3"}], "questions": [{"q": "In a proof by contradiction, what is the first step?", "o": ["Check a few examples", "Assume the opposite of what you want to prove", "Find a counter-example", "Use exhaustion"], "a": 1, "e": "Then show the assumption leads to something impossible."}, {"q": "f(x) = 2x + 1, g(x) = x². What is fg(3)?", "o": ["19", "49", "10", "13"], "a": 0, "e": "g(3) = 9, then f(9) = 19."}, {"q": "f(x) = 2x + 1, g(x) = x². What is gf(3)?", "o": ["19", "13", "49", "36"], "a": 2, "e": "f(3) = 7, then g(7) = 49."}, {"q": "Find the inverse of f(x) = (x − 5)/2.", "o": ["f⁻¹(x) = 2x − 5", "f⁻¹(x) = (x + 5)/2", "f⁻¹(x) = 2/(x − 5)", "f⁻¹(x) = 2x + 5"], "a": 3, "e": "y = (x − 5)/2, so x = 2y + 5."}, {"q": "How is the graph of y = f⁻¹(x) related to y = f(x)?", "o": ["Reflection in y = x", "Reflection in the x-axis", "Reflection in the y-axis", "Rotation by 90°"], "a": 0, "e": "Inputs and outputs swap, so x and y swap."}, {"q": "f(x) = x² for x ∈ ℝ. Why doesn't f have an inverse?", "o": ["It has no range", "It is many-to-one (e.g. f(2) = f(−2))", "It isn't continuous", "x² can't be rearranged"], "a": 1, "e": "An inverse needs a one-to-one function. Restricting the domain to x ≥ 0 fixes this."}, {"q": "f(x) = eˣ. What is the range of f?", "o": ["f(x) ∈ ℝ", "f(x) ≥ 0", "f(x) > 0", "f(x) ≥ 1"], "a": 2, "e": "eˣ is always positive but never reaches 0."}, {"q": "f(x) = ln x, x > 0. What is f⁻¹(x)?", "o": ["1/ln x", "−ln x", "ln(1/x)", "eˣ"], "a": 3, "e": "ln and exp are inverse functions."}, {"q": "Evaluate |−7| + |3|.", "o": ["10", "−4", "4", "−10"], "a": 0, "e": "|−7| = 7 and |3| = 3."}, {"q": "How is y = |f(x)| obtained from y = f(x)?", "o": ["Reflect the part for x < 0 in the y-axis", "Reflect any part below the x-axis in the x-axis", "Reflect the whole graph in y = x", "Translate up"], "a": 1, "e": "Negative y-values become positive."}, {"q": "How is y = f(|x|) obtained from y = f(x)?", "o": ["Reflect parts below the x-axis", "Reflect in y = x", "Keep the graph for x ≥ 0 and reflect it in the y-axis", "Translate left"], "a": 2, "e": "f(|x|) is symmetric about the y-axis."}, {"q": "Solve |2x − 3| = 5.", "o": ["x = 4 only", "x = −1 only", "x = 1 or x = −4", "x = 4 or x = −1"], "a": 3, "e": "2x − 3 = 5 gives x = 4. 2x − 3 = −5 gives x = −1."}, {"q": "Solve |x − 1| < 3.", "o": ["−2 < x < 4", "x < 4", "x < −2 or x > 4", "−4 < x < 2"], "a": 0, "e": "−3 < x − 1 < 3, so −2 < x < 4."}, {"q": "What is the domain of f⁻¹ if the range of f is f(x) ≥ 2?", "o": ["x ≤ 2", "x ≥ 2", "x ∈ ℝ", "x > 0"], "a": 1, "e": "The domain of the inverse is the range of the original."}, {"q": "y = f(x) has a maximum at (2, 3). Where is the maximum of y = 2f(x + 1)?", "o": ["(3, 6)", "(1, 3)", "(1, 6)", "(2, 6)"], "a": 2, "e": "Translate left 1: (1, 3). Then stretch vertically by 2: (1, 6)."}, {"q": "What is ff(x) if f(x) = 1/x (x ≠ 0)?", "o": ["1/x²", "x²", "1", "x"], "a": 3, "e": "f(f(x)) = 1/(1/x) = x. This function is self-inverse."}, {"q": "f(x) = x + 4 and g(x) = 3x. Solve fg(x) = gf(x).", "o": ["No solutions", "x = 0", "x = 4", "All x"], "a": 0, "e": "fg(x) = 3x + 4, gf(x) = 3x + 12. These are never equal."}, {"q": "Proof that there are infinitely many primes begins by assuming:", "o": ["There are infinitely many primes", "There is a largest prime (finitely many primes)", "All numbers are prime", "2 is the only even prime"], "a": 1, "e": "Then multiply all primes and add 1 to reach a contradiction."}, {"q": "f(x) = √(x − 2). What is the domain of f?", "o": ["x > 2", "x ∈ ℝ", "x ≥ 2", "x ≥ 0"], "a": 2, "e": "You can't take the square root of a negative number."}, {"q": "The function f(x) = 2x + 3 has domain 0 ≤ x ≤ 5. What is its range?", "o": ["0 ≤ f(x) ≤ 5", "f(x) ≥ 3", "2 ≤ f(x) ≤ 13", "3 ≤ f(x) ≤ 13"], "a": 3, "e": "f(0) = 3 and f(5) = 13, and f is increasing."}, {"q": "Solve |x| = 2x − 3.", "o": ["x = 3", "x = 1", "x = 3 or x = 1", "No solution"], "a": 0, "e": "x = 2x − 3 gives x = 3 ✓. −x = 2x − 3 gives x = 1, but then |1| = 1 and 2(1) − 3 = −1 ✗."}, {"q": "Which transformation maps y = f(x) to y = f(x − 2) + 5?", "o": ["Translation by (−2, 5)", "Translation by (2, 5)", "Translation by (2, −5)", "Stretch"], "a": 1, "e": "f(x − 2) moves right 2, + 5 moves up 5."}]}, {"id": "p12", "order": 18, "year": 2, "section": "P", "badge": "B·D", "spec": "B, D", "title": "Partial fractions and the general binomial expansion", "desc": "Splitting rational expressions into partial fractions, and expanding (a + bx)ⁿ for any rational n with its validity.", "practicals": [], "summary": [{"h": "Partial fractions", "p": ["Split a fraction with a factorised denominator into simpler fractions.", "Distinct linear factors: `(…)/[(x + a)(x + b)] = A/(x + a) + B/(x + b)`.", "Repeated factor: `(…)/[(x + a)(x + b)²] = A/(x + a) + B/(x + b) + C/(x + b)²`.", "Multiply through by the denominator, then **substitute** convenient values of x (or compare coefficients) to find A, B, C.", "If the numerator's degree ≥ the denominator's, divide first (improper fraction)."]}, {"h": "General binomial expansion", "p": ["`(1 + x)ⁿ = 1 + nx + n(n − 1)x²/2! + n(n − 1)(n − 2)x³/3! + ...` for **any rational n**.", "For negative or fractional n, the series is **infinite** and only **valid for |x| < 1**.", "For (a + bx)ⁿ, take out aⁿ first: `aⁿ(1 + bx/a)ⁿ`, valid for **|bx/a| < 1**, i.e. |x| < |a/b|.", "Partial fractions can be combined with binomial expansions to expand more complex expressions."]}], "pitfalls": ["Always state the **range of validity** for negative or fractional n.", "When taking out a factor, raise it to the power n: (4 + x)^(1/2) = 2(1 + x/4)^(1/2).", "Repeated factors need a term for **each** power of the repeated factor."], "examples": [{"q": "Express (5x + 1)/[(x + 1)(x − 1)] in partial fractions.", "steps": ["5x + 1 = A(x − 1) + B(x + 1).", "x = 1: 6 = 2B, so B = 3.", "x = −1: −4 = −2A, so A = 2."], "a": "2/(x + 1) + 3/(x − 1)"}, {"q": "Expand (1 − 2x)⁻¹ up to x³ and state the validity.", "steps": ["n = −1, replace x with −2x.", "1 + (−1)(−2x) + (−1)(−2)(−2x)²/2 + (−1)(−2)(−3)(−2x)³/6.", "= 1 + 2x + 4x² + 8x³."], "a": "1 + 2x + 4x² + 8x³ + ..., valid for |x| < ½"}], "questions": [{"q": "Express 1/[(x + 2)(x + 3)] in partial fractions.", "o": ["1/(x + 3) − 1/(x + 2)", "1/(x + 2) − 1/(x + 3)", "1/(x + 2) + 1/(x + 3)", "2/(x + 2) − 3/(x + 3)"], "a": 1, "e": "1 = A(x + 3) + B(x + 2). x = −2: A = 1. x = −3: B = −1."}, {"q": "What form of partial fractions is used for (3x + 2)/[(x − 1)(x + 2)²]?", "o": ["A/(x − 1) + B/(x + 2) + C/(x + 2)²", "A/(x − 1) + B/(x + 2)²", "A/(x − 1) + B/(x + 2)", "(Ax + B)/(x + 2)²"], "a": 0, "e": "A repeated factor needs terms for each power."}, {"q": "Express (x + 7)/[(x + 1)(x − 2)] in partial fractions.", "o": ["2/(x + 1) + 3/(x − 2)", "3/(x + 1) − 2/(x − 2)", "−2/(x + 1) + 3/(x − 2)", "2/(x + 1) − 3/(x − 2)"], "a": 2, "e": "x + 7 = A(x − 2) + B(x + 1). x = 2: 9 = 3B, B = 3. x = −1: 6 = −3A, A = −2."}, {"q": "When must you divide before finding partial fractions?", "o": ["Always", "When the denominator has a repeated factor", "When the numerator is negative", "When the degree of the numerator is at least the degree of the denominator"], "a": 3, "e": "Improper fractions need algebraic division first."}, {"q": "Expand (1 + x)⁻¹ up to x³.", "o": ["1 − x + x² − x³", "1 + x + x² + x³", "1 − x − x² − x³", "1 + x − x² + x³"], "a": 0, "e": "n = −1: 1 + (−1)x + (−1)(−2)x²/2 + (−1)(−2)(−3)x³/6."}, {"q": "For what values of x is the expansion of (1 + x)^(1/2) valid?", "o": ["All x", "|x| < 1", "x > 0", "|x| < 2"], "a": 1, "e": "For non-positive-integer n, the expansion is valid for |x| < 1."}, {"q": "Expand (1 + x)^(1/2) up to x².", "o": ["1 + x/2 + x²/4", "1 + x/2 + x²/8", "1 + x/2 − x²/8", "1 − x/2 − x²/8"], "a": 2, "e": "n(n − 1)/2 = (½)(−½)/2 = −1/8."}, {"q": "For what values of x is the expansion of (1 − 3x)⁻² valid?", "o": ["|x| < 3", "|x| < 1", "x < 1/3", "|x| < 1/3"], "a": 3, "e": "|−3x| < 1, so |x| < 1/3."}, {"q": "Write (4 + x)^(1/2) in the form k(1 + x/4)^(1/2). What is k?", "o": ["2", "4", "1/2", "16"], "a": 0, "e": "4^(1/2) = 2."}, {"q": "Expand (2 + x)⁻¹ up to x².", "o": ["½ + x/4 + x²/8", "½ − x/4 + x²/8", "2 − x + x²", "½ − x/2 + x²/2"], "a": 1, "e": "½(1 + x/2)⁻¹ = ½(1 − x/2 + x²/4) = ½ − x/4 + x²/8."}, {"q": "What is the validity of the expansion of (2 + x)⁻¹?", "o": ["|x| < 1", "|x| < ½", "|x| < 2", "All x"], "a": 2, "e": "|x/2| < 1, so |x| < 2."}, {"q": "What is the coefficient of x² in (1 − 2x)⁻¹?", "o": ["−4", "2", "−2", "4"], "a": 3, "e": "(1 − 2x)⁻¹ = 1 + 2x + 4x² + ..."}, {"q": "Expand (1 + 4x)^(−1/2) up to x.", "o": ["1 − 2x", "1 + 2x", "1 − x/2", "1 + 4x"], "a": 0, "e": "1 + (−½)(4x) = 1 − 2x."}, {"q": "Why does the expansion of (1 + x)ⁿ terminate when n is a positive integer?", "o": ["Because |x| < 1", "Because the coefficients eventually include a factor (n − n) = 0", "Because x is small", "It doesn't terminate"], "a": 1, "e": "From term n + 2 onwards, each coefficient contains a factor of zero."}, {"q": "Express (2x)/[(x − 1)(x + 1)] in partial fractions.", "o": ["2/(x − 1) + 2/(x + 1)", "1/(x − 1) − 1/(x + 1)", "1/(x − 1) + 1/(x + 1)", "2/(x − 1) − 2/(x + 1)"], "a": 2, "e": "2x = A(x + 1) + B(x − 1). x = 1: A = 1. x = −1: B = 1."}, {"q": "Use (1 + x)^(1/2) ≈ 1 + x/2 − x²/8 with x = 0.02 to estimate √1.02.", "o": ["1.0201", "1.01", "1.02", "1.00995"], "a": 3, "e": "1 + 0.01 − 0.00005 = 1.00995."}, {"q": "(3x + 4)/[x(x + 2)] = A/x + B/(x + 2). Find A.", "o": ["2", "1", "4", "−1"], "a": 0, "e": "3x + 4 = A(x + 2) + Bx. x = 0: 4 = 2A, so A = 2."}, {"q": "For the previous question, find B.", "o": ["2", "1", "3", "−2"], "a": 1, "e": "x = −2: −2 = −2B, so B = 1."}, {"q": "What is the coefficient of x² in (1 + x)^(−3)?", "o": ["−3", "3", "6", "−6"], "a": 2, "e": "(−3)(−4)/2 = 6."}, {"q": "Expand (1 − x)^(−2) up to x².", "o": ["1 − 2x + 3x²", "1 + 2x − 3x²", "1 − 2x − 3x²", "1 + 2x + 3x²"], "a": 3, "e": "1 + (−2)(−x) + (−2)(−3)(−x)²/2 = 1 + 2x + 3x²."}, {"q": "To expand (3x + 1)/[(1 + x)(1 − 2x)], what is the best first step?", "o": ["Split into partial fractions, then expand each term", "Multiply the denominators out", "Expand the numerator", "Divide by x"], "a": 0, "e": "Each partial fraction can then be expanded as a binomial."}, {"q": "The expansion of (1 + ax)ⁿ begins 1 − 6x + 27x². Which pair gives this?", "o": ["n = 2, a = −3", "n = −2, a = 3", "n = −3, a = 2", "n = 3, a = −2"], "a": 1, "e": "na = −6 and n(n − 1)a²/2 = 27. n = −2, a = 3: na = −6 ✓, (−2)(−3)(9)/2 = 27 ✓."}]}, {"id": "p13", "order": 19, "year": 2, "section": "P", "badge": "D", "spec": "D", "title": "Sequences and series", "desc": "nth terms and recurrence relations, increasing, decreasing and periodic sequences, sigma notation, arithmetic and geometric sequences and series, and sum to infinity.", "practicals": [], "summary": [{"h": "Sequences", "p": ["A sequence can be defined by an **nth term** formula, e.g. uₙ = 3n + 1, or a **recurrence relation**, e.g. uₙ₊₁ = 2uₙ − 1, u₁ = 3.", "**Increasing**: uₙ₊₁ > uₙ for all n. **Decreasing**: uₙ₊₁ < uₙ. **Periodic**: terms repeat with period k (uₙ₊ₖ = uₙ).", "**Sigma notation**: Σ (r = 1 to n) of f(r) means add f(1) + f(2) + ... + f(n)."]}, {"h": "Arithmetic sequences and series", "p": ["Constant **common difference d**.", "`uₙ = a + (n − 1)d`", "`Sₙ = n/2 [2a + (n − 1)d] = n/2 (a + l)`, where l is the last term.", "Sum of the first n integers: n(n + 1)/2."]}, {"h": "Geometric sequences and series", "fig": "geometric-series", "cap": "With a = 1 and r = ½, each term halves, so the partial sums Sₙ get ever closer to 2 without reaching it. A geometric series converges only when |r| < 1, and then S∞ = a ÷ (1 − r).", "p": ["Constant **common ratio r**.", "`uₙ = arⁿ⁻¹`", "`Sₙ = a(1 − rⁿ)/(1 − r)` (or a(rⁿ − 1)/(r − 1))", "A geometric series **converges** if **|r| < 1**. Then `S∞ = a/(1 − r)`.", "To find n in a geometric problem, you will usually need **logarithms**."], "svg": "<svg role=\"img\" aria-label=\"With a = 1 and r = ½, each term halves, so the partial sums Sₙ get ever closer to 2 without reaching it. A geometric series converges only when |r| &lt; 1, and then S∞ = a ÷ (1 − r).\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 260\"><defs><marker id=\"f-geometricseries-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-geometricseries-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-geometricseries-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-geometricseries-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"50\" y1=\"230\" x2=\"448\" y2=\"230\" class=\"ln\" marker-end=\"url(#f-geometricseries-ah)\"/><line x1=\"50\" y1=\"230\" x2=\"50\" y2=\"22\" class=\"ln\" marker-end=\"url(#f-geometricseries-ah)\"/><text x=\"448\" y=\"222\" class=\"tm\" text-anchor=\"end\">n<\/text><text x=\"58\" y=\"26\" class=\"tm\">Sₙ<\/text><rect x=\"64.5\" y=\"139.1\" width=\"28\" height=\"90.9\" rx=\"2\" class=\"at\"/><text x=\"78.5\" y=\"248\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">1<\/text><rect x=\"112.1\" y=\"93.6\" width=\"28\" height=\"136.4\" rx=\"2\" class=\"at\"/><text x=\"126.1\" y=\"248\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">2<\/text><rect x=\"159.7\" y=\"70.9\" width=\"28\" height=\"159.1\" rx=\"2\" class=\"at\"/><text x=\"173.7\" y=\"248\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">3<\/text><rect x=\"207.2\" y=\"59.5\" width=\"28\" height=\"170.5\" rx=\"2\" class=\"at\"/><text x=\"221.2\" y=\"248\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">4<\/text><rect x=\"254.8\" y=\"53.9\" width=\"28\" height=\"176.1\" rx=\"2\" class=\"at\"/><text x=\"268.8\" y=\"248\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">5<\/text><rect x=\"302.3\" y=\"51\" width=\"28\" height=\"179\" rx=\"2\" class=\"at\"/><text x=\"316.3\" y=\"248\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">6<\/text><rect x=\"349.9\" y=\"49.6\" width=\"28\" height=\"180.4\" rx=\"2\" class=\"at\"/><text x=\"363.9\" y=\"248\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">7<\/text><rect x=\"397.5\" y=\"48.9\" width=\"28\" height=\"181.1\" rx=\"2\" class=\"at\"/><text x=\"411.5\" y=\"248\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">8<\/text><line x1=\"50\" y1=\"48.2\" x2=\"440\" y2=\"48.2\" class=\"ac\"/><text x=\"440\" y=\"40.2\" class=\"ta\" text-anchor=\"end\" font-size=\"13\">S∞ = a ÷ (1 − r) = 2<\/text><text x=\"173.7\" y=\"40.2\" text-anchor=\"middle\" font-size=\"14\">1 + ½ + ¼ + …<\/text><line x1=\"45\" y1=\"139.1\" x2=\"50\" y2=\"139.1\" class=\"ln\"/><text x=\"41\" y=\"144.1\" class=\"tm\" text-anchor=\"end\">1<\/text><line x1=\"45\" y1=\"48.2\" x2=\"50\" y2=\"48.2\" class=\"ln\"/><text x=\"41\" y=\"53.2\" class=\"tm\" text-anchor=\"end\">2<\/text><\/svg>"}], "pitfalls": ["The nth term uses **(n − 1)**, not n.", "S∞ only exists for |r| < 1.", "When solving rⁿ > k with logs and r < 1, log r is negative, so the inequality **reverses**."], "examples": [{"q": "An arithmetic series has first term 5 and common difference 3. Find the sum of the first 20 terms.", "steps": ["S₂₀ = 20/2 [2(5) + 19(3)].", "= 10 [10 + 57] = 670."], "a": "670"}, {"q": "A geometric series has a = 12 and r = 0.75. Find the sum to infinity.", "steps": ["|r| < 1, so it converges.", "S∞ = 12/(1 − 0.75) = 12/0.25."], "a": "48"}], "questions": [{"q": "Find the 10th term of the arithmetic sequence 4, 7, 10, ...", "o": ["30", "31", "34", "28"], "a": 1, "e": "u₁₀ = 4 + 9 × 3 = 31."}, {"q": "Find the sum of the first 10 terms of 4, 7, 10, ...", "o": ["175", "155", "310", "185"], "a": 0, "e": "S₁₀ = 5[8 + 27] = 175."}, {"q": "Find the common ratio of 81, 27, 9, ...", "o": ["3", "−3", "1/3", "54"], "a": 2, "e": "27/81 = 1/3."}, {"q": "Find the 6th term of the geometric sequence 2, 6, 18, ...", "o": ["162", "54", "1458", "486"], "a": 3, "e": "u₆ = 2 × 3⁵ = 486."}, {"q": "Find the sum of the first 5 terms of 3, 6, 12, ...", "o": ["93", "48", "96", "45"], "a": 0, "e": "S₅ = 3(2⁵ − 1)/(2 − 1) = 3 × 31 = 93."}, {"q": "For which values of r does a geometric series have a sum to infinity?", "o": ["r > 1", "|r| < 1", "r > 0", "All r"], "a": 1, "e": "The terms must get smaller for the series to converge."}, {"q": "Find S∞ for 8 + 4 + 2 + 1 + ...", "o": ["15", "∞", "16", "32"], "a": 2, "e": "a = 8, r = ½: S∞ = 8/(1 − ½) = 16."}, {"q": "uₙ₊₁ = 2uₙ − 1, u₁ = 3. Find u₃.", "o": ["5", "17", "11", "9"], "a": 3, "e": "u₂ = 5, u₃ = 9."}, {"q": "Evaluate Σ (r = 1 to 4) of r².", "o": ["30", "16", "10", "100"], "a": 0, "e": "1 + 4 + 9 + 16 = 30."}, {"q": "What is the sum of the integers from 1 to 100?", "o": ["10 000", "5050", "5000", "10 100"], "a": 1, "e": "n(n + 1)/2 = 100 × 101/2 = 5050."}, {"q": "uₙ₊₁ = 1/uₙ with u₁ = 2. Describe the sequence.", "o": ["Increasing", "Decreasing", "Periodic with period 2", "Arithmetic"], "a": 2, "e": "2, ½, 2, ½, ... repeats every 2 terms."}, {"q": "An arithmetic sequence has u₃ = 11 and u₇ = 23. Find d.", "o": ["12", "4", "6", "3"], "a": 3, "e": "4d = 23 − 11 = 12, so d = 3."}, {"q": "A geometric series has a = 5 and S∞ = 20. Find r.", "o": ["3/4", "1/4", "4", "−3/4"], "a": 0, "e": "20 = 5/(1 − r), so 1 − r = 1/4, r = 3/4."}, {"q": "How many terms of 2 + 4 + 8 + ... are needed for the sum to exceed 1000?", "o": ["10", "9", "8", "11"], "a": 1, "e": "Sₙ = 2(2ⁿ − 1) > 1000, so 2ⁿ > 501. 2⁹ = 512, so n = 9."}, {"q": "Which formula gives the sum of an arithmetic series with first term a and last term l?", "o": ["n(a + l)", "a(1 − rⁿ)/(1 − r)", "n/2 (a + l)", "a + (n − 1)d"], "a": 2, "e": "The average of the first and last term, times the number of terms."}, {"q": "Is the sequence uₙ = 5 − 2n increasing or decreasing?", "o": ["Increasing", "Periodic", "Neither", "Decreasing"], "a": 3, "e": "Each term is 2 less than the one before."}, {"q": "A ball bounces to 80% of its previous height, starting from 5 m. What is the total distance travelled downwards?", "o": ["25 m", "20 m", "4 m", "45 m"], "a": 0, "e": "Downward drops: 5 + 4 + 3.2 + ... = 5/(1 − 0.8) = 25 m."}, {"q": "Evaluate Σ (r = 1 to 20) of (3r + 2).", "o": ["660", "670", "630", "640"], "a": 1, "e": "Arithmetic: first term 5, last term 62, n = 20. S = 10(5 + 62) = 670."}, {"q": "A salary starts at £20 000 and rises by 3% each year. What is the salary in year 5?", "o": ["£23 000", "£23 185.48", "£22 510.18", "£24 000"], "a": 2, "e": "u₅ = 20 000 × 1.03⁴ = £22 510.18."}, {"q": "Solve 0.9ⁿ < 0.1 for the smallest integer n.", "o": ["n = 21", "n = 10", "n = 9", "n = 22"], "a": 3, "e": "n > ln 0.1 / ln 0.9 = 21.85 (inequality reverses since ln 0.9 < 0). So n = 22."}, {"q": "What is the nth term of an arithmetic sequence?", "o": ["a + (n − 1)d", "a + nd", "arⁿ⁻¹", "n/2(2a + (n − 1)d)"], "a": 0, "e": "Start at a and add d, (n − 1) times."}, {"q": "A geometric series has r = −½ and a = 6. Find S∞.", "o": ["12", "4", "3", "−12"], "a": 1, "e": "6/(1 − (−½)) = 6/1.5 = 4."}]}, {"id": "p14", "order": 20, "year": 2, "section": "P", "badge": "E", "spec": "E", "title": "Radians and trigonometric functions", "desc": "Radian measure, arc length and sector area, small-angle approximations, sec, cosec and cot, and inverse trig functions.", "practicals": [], "summary": [{"h": "Radians", "fig": "radians", "cap": "One radian is the angle where the arc length equals the radius. With θ in radians, arc length s = rθ and sector area = ½r²θ. Convert using π radians = 180°.", "p": ["**π radians = 180°**. To convert degrees to radians, multiply by π/180.", "Key values: 30° = π/6, 45° = π/4, 60° = π/3, 90° = π/2, 360° = 2π.", "**Arc length**: `s = rθ`. **Sector area**: `A = ½r²θ` (θ in radians).", "**Segment area** = sector − triangle = ½r²(θ − sin θ)."], "svg": "<svg role=\"img\" aria-label=\"One radian is the angle where the arc length equals the radius. With θ in radians, arc length s = rθ and sector area = ½r²θ. Convert using π radians = 180°.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 240\"><defs><marker id=\"f-radians-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-radians-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-radians-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-radians-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><path d=\"M120,220 L300,220 A180,180 0 0 0 217.3,68.5 Z\" class=\"at\"/><path d=\"M300,220 A180,180 0 0 0 217.3,68.5\" class=\"ac thick\"/><path d=\"M160,220 A40,40 0 0 0 141.6,186.3\" class=\"ln\"/><text x=\"170\" y=\"204\" font-size=\"15\">θ<\/text><text x=\"210\" y=\"240\" text-anchor=\"middle\" font-size=\"15\">r<\/text><text x=\"190\" y=\"110\" text-anchor=\"end\" font-size=\"15\">r<\/text><text x=\"290\" y=\"133.7\" class=\"ta\" font-size=\"14\">arc s = rθ<\/text><text x=\"330\" y=\"30\" font-size=\"14\">θ in radians<\/text><text x=\"330\" y=\"52\" font-size=\"14\">area = ½r²θ<\/text><text x=\"330\" y=\"74\" class=\"tm\" font-size=\"13\">π rad = 180°<\/text><text x=\"330\" y=\"94\" class=\"tm\" font-size=\"13\">1 rad ≈ 57.3°<\/text><text x=\"190\" y=\"180\" class=\"ta\" text-anchor=\"middle\" font-size=\"13\">½r²θ<\/text><\/svg>"}, {"h": "Small-angle approximations (θ in radians)", "p": ["`sin θ ≈ θ`", "`cos θ ≈ 1 − θ²/2`", "`tan θ ≈ θ`"]}, {"h": "Reciprocal functions", "p": ["`sec θ = 1/cos θ`, `cosec θ = 1/sin θ`, `cot θ = 1/tan θ = cos θ/sin θ`.", "Identities: `1 + tan²θ = sec²θ` and `1 + cot²θ = cosec²θ`.", "Graphs of sec and cosec have asymptotes where cos or sin is zero, and range |y| ≥ 1."]}, {"h": "Inverse trig functions", "p": ["**arcsin x**: domain −1 ≤ x ≤ 1, range −π/2 ≤ y ≤ π/2.", "**arccos x**: domain −1 ≤ x ≤ 1, range 0 ≤ y ≤ π.", "**arctan x**: domain all real x, range −π/2 < y < π/2.", "Their graphs are reflections of the restricted sin, cos and tan graphs in y = x."]}], "pitfalls": ["Use **radians** in s = rθ, A = ½r²θ, small-angle approximations and calculus.", "sec is 1/cos (not 1/sin). Remember: the third letter matches: **s**e**c** → **c**os, **c**o**s**ec → **s**in.", "Check your calculator mode before every trig calculation."], "examples": [{"q": "A sector has radius 6 cm and angle 1.2 radians. Find the arc length and area.", "steps": ["s = rθ = 6 × 1.2 = 7.2 cm.", "A = ½r²θ = ½ × 36 × 1.2 = 21.6 cm²."], "a": "7.2 cm and 21.6 cm²"}, {"q": "Use small-angle approximations to simplify (1 − cos 2θ)/(θ sin θ).", "steps": ["cos 2θ ≈ 1 − (2θ)²/2 = 1 − 2θ².", "1 − cos 2θ ≈ 2θ².", "θ sin θ ≈ θ²."], "a": "≈ 2"}], "questions": [{"q": "Convert 120° to radians.", "o": ["π/3", "2π/3", "3π/2", "4π/3"], "a": 1, "e": "120 × π/180 = 2π/3."}, {"q": "Convert 5π/6 radians to degrees.", "o": ["150°", "120°", "300°", "135°"], "a": 0, "e": "5π/6 × 180/π = 150°."}, {"q": "Find the arc length of a sector with radius 10 cm and angle 0.5 radians.", "o": ["50 cm", "25 cm", "5 cm", "20 cm"], "a": 2, "e": "s = rθ = 10 × 0.5 = 5 cm."}, {"q": "Find the area of a sector with radius 4 cm and angle π/4.", "o": ["π cm²", "4π cm²", "8π cm²", "2π cm²"], "a": 3, "e": "A = ½ × 16 × π/4 = 2π cm²."}, {"q": "What is the small-angle approximation for cos θ?", "o": ["1 − θ²/2", "θ", "1", "1 − θ"], "a": 0, "e": "cos θ ≈ 1 − θ²/2 for small θ in radians."}, {"q": "Use small angles to approximate sin 0.1.", "o": ["0.01", "0.1", "0.995", "1"], "a": 1, "e": "sin θ ≈ θ = 0.1."}, {"q": "What is sec θ?", "o": ["1/sin θ", "1/tan θ", "1/cos θ", "sin θ/cos θ"], "a": 2, "e": "sec θ = 1/cos θ."}, {"q": "Which identity is correct?", "o": ["1 + sec²θ = tan²θ", "sin²θ + sec²θ = 1", "1 + cosec²θ = cot²θ", "1 + tan²θ = sec²θ"], "a": 3, "e": "Divide sin²θ + cos²θ = 1 by cos²θ."}, {"q": "What is the exact value of cosec(π/6)?", "o": ["2", "1/2", "2/√3", "√3"], "a": 0, "e": "sin(π/6) = ½, so cosec = 2."}, {"q": "What is the range of y = sec x?", "o": ["−1 ≤ y ≤ 1", "y ≤ −1 or y ≥ 1", "y > 0", "All real y"], "a": 1, "e": "Since |cos x| ≤ 1, |sec x| ≥ 1."}, {"q": "What is the range of arccos x?", "o": ["−π/2 ≤ y ≤ π/2", "−π ≤ y ≤ π", "0 ≤ y ≤ π", "0 ≤ y ≤ 2π"], "a": 2, "e": "The cos function is restricted to 0 to π so it's one-to-one."}, {"q": "Evaluate arcsin(½) in radians.", "o": ["π/3", "π/4", "5π/6", "π/6"], "a": 3, "e": "sin(π/6) = ½."}, {"q": "What is the domain of arctan x?", "o": ["All real x", "−1 ≤ x ≤ 1", "x ≥ 0", "−π/2 < x < π/2"], "a": 0, "e": "tan takes every real value, so arctan is defined for all real x."}, {"q": "Solve sec x = 2 for 0 ≤ x < 2π.", "o": ["π/6, 11π/6", "π/3, 5π/3", "π/3, 2π/3", "π/6, 5π/6"], "a": 1, "e": "cos x = ½, so x = π/3 or 2π − π/3 = 5π/3."}, {"q": "Simplify 1 + cot²θ.", "o": ["sec²θ", "tan²θ", "cosec²θ", "1"], "a": 2, "e": "Divide sin²θ + cos²θ = 1 by sin²θ."}, {"q": "Find the area of the segment cut off by a chord in a circle of radius 2, angle π/2.", "o": ["π", "π − 1", "2", "π − 2"], "a": 3, "e": "½r²(θ − sin θ) = 2(π/2 − 1) = π − 2."}, {"q": "Using small-angle approximations, simplify (sin 3θ)/(2θ).", "o": ["3/2", "3θ/2", "2/3", "1"], "a": 0, "e": "sin 3θ ≈ 3θ, so 3θ/2θ = 3/2."}, {"q": "Why must θ be in radians for small-angle approximations?", "o": ["Degrees are too large", "The approximations come from the radian definition of the functions (e.g. sin θ ≈ θ only for radians)", "Calculators require it", "They don't need radians"], "a": 1, "e": "In degrees, sin 1° ≈ 0.0175, not 1."}, {"q": "What is the exact value of cot(π/4)?", "o": ["0", "√2", "1", "√3"], "a": 2, "e": "tan(π/4) = 1, so cot = 1."}, {"q": "Solve cosec x = −2 for 0 ≤ x < 2π.", "o": ["π/6, 5π/6", "7π/6, 5π/3", "4π/3, 5π/3", "7π/6, 11π/6"], "a": 3, "e": "sin x = −½, so x = π + π/6 = 7π/6 or 2π − π/6 = 11π/6."}, {"q": "A sector has area 12 cm² and radius 4 cm. Find the angle.", "o": ["1.5 radians", "3 radians", "0.75 radians", "6 radians"], "a": 0, "e": "12 = ½ × 16 × θ, so θ = 1.5."}, {"q": "Solve tan²x = 3 for 0 ≤ x < π.", "o": ["π/3 only", "π/3 and 2π/3", "π/6 and 5π/6", "π/4 and 3π/4"], "a": 1, "e": "tan x = ±√3: x = π/3 or 2π/3 in [0, π)."}]}, {"id": "p15", "order": 21, "year": 2, "section": "P", "badge": "E", "spec": "E", "title": "Trigonometric identities", "desc": "Compound angle and double angle formulae, the R cos(θ ± α) and R sin(θ ± α) forms, proving identities and solving equations.", "practicals": [], "summary": [{"h": "Compound angle formulae", "p": ["`sin(A ± B) = sin A cos B ± cos A sin B`", "`cos(A ± B) = cos A cos B ∓ sin A sin B`", "`tan(A ± B) = (tan A ± tan B)/(1 ∓ tan A tan B)`"]}, {"h": "Double angle formulae", "p": ["`sin 2A = 2 sin A cos A`", "`cos 2A = cos²A − sin²A = 2cos²A − 1 = 1 − 2sin²A`", "`tan 2A = 2tan A/(1 − tan²A)`", "Choose the cos 2A version that leaves the equation in a single trig function."]}, {"h": "R cos(θ ± α) and R sin(θ ± α)", "fig": "r-alpha", "cap": "Expanding R sin(θ + α) = R sin θ cos α + R cos θ sin α and matching with 4 sin θ + 3 cos θ gives R cos α = 4 and R sin α = 3. These are the sides of a right-angled triangle, so R = 5 and tan α = 3 ÷ 4.", "p": ["`a sin θ + b cos θ = R sin(θ + α)`, where `R = √(a² + b²)` and `tan α = b/a`.", "Expand R sin(θ + α) = R sin θ cos α + R cos θ sin α, and compare coefficients: R cos α = a, R sin α = b.", "The maximum value is **R** and the minimum is **−R**. Use this to find max/min and to solve equations."], "svg": "<svg role=\"img\" aria-label=\"Expanding R sin(θ + α) = R sin θ cos α + R cos θ sin α and matching with 4 sin θ + 3 cos θ gives R cos α = 4 and R sin α = 3. These are the sides of a right-angled triangle, so R = 5 and tan α = 3 ÷ 4.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 256\"><defs><marker id=\"f-ralpha-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-ralpha-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-ralpha-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-ralpha-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><path d=\"M60,220 L360,220 L360,60 Z\" class=\"at\"/><rect x=\"344\" y=\"204\" width=\"16\" height=\"16\" rx=\"0\" class=\"lm\"/><text x=\"210\" y=\"244\" text-anchor=\"middle\" font-size=\"13\">R cos α = a  (here a = 4)<\/text><text x=\"372\" y=\"145\" font-size=\"13\">R sin α = b<\/text><text x=\"372\" y=\"163\" class=\"tm\" font-size=\"12\">(here b = 3)<\/text><text x=\"196\" y=\"126\" class=\"ta\" text-anchor=\"end\" font-size=\"16\">R<\/text><path d=\"M120,220 A60,60 0 0 0 112.9,191.8\" class=\"ln\"/><text x=\"130\" y=\"210\" font-size=\"15\">α<\/text><text x=\"20\" y=\"28\" font-size=\"14\">4 sin θ + 3 cos θ = R sin(θ + α)<\/text><text x=\"20\" y=\"48\" class=\"tm\" font-size=\"12\">R = √(4² + 3²) = 5, tan α = 3 ÷ 4, α ≈ 36.9°<\/text><\/svg>"}, {"h": "Proving identities", "p": ["Start from **one side** (usually the more complicated) and work towards the other.", "Useful tools: sin²θ + cos²θ = 1, 1 + tan²θ = sec²θ, double angle formulae, writing everything in terms of sin and cos."]}], "pitfalls": ["The cos compound formula has the **opposite** sign: cos(A + B) has a minus.", "Find α from tan α = b/a, but check signs from R cos α and R sin α.", "When solving R sin(θ + α) = k, adjust the interval for θ + α first."], "examples": [{"q": "Express 3 sin θ + 4 cos θ in the form R sin(θ + α), with 0 < α < 90°.", "steps": ["R = √(9 + 16) = 5.", "R cos α = 3 and R sin α = 4, so tan α = 4/3.", "α = 53.13°."], "a": "5 sin(θ + 53.1°)"}, {"q": "Show that sin 75° = (√6 + √2)/4.", "steps": ["sin(45° + 30°) = sin 45° cos 30° + cos 45° sin 30°.", "= (√2/2)(√3/2) + (√2/2)(1/2) = (√6 + √2)/4."], "a": "As required. ∎"}], "questions": [{"q": "Expand sin(A + B).", "o": ["sin A sin B + cos A cos B", "sin A cos B + cos A sin B", "sin A cos B − cos A sin B", "cos A cos B − sin A sin B"], "a": 1, "e": "This is the compound angle formula for sine."}, {"q": "Expand cos(A + B).", "o": ["cos A cos B − sin A sin B", "cos A cos B + sin A sin B", "sin A cos B + cos A sin B", "cos A sin B − sin A cos B"], "a": 0, "e": "Note the minus sign for cos(A + B)."}, {"q": "What is sin 2A?", "o": ["2 sin A", "sin²A − cos²A", "2 sin A cos A", "sin A cos A"], "a": 2, "e": "From sin(A + A)."}, {"q": "Which is NOT an expression for cos 2A?", "o": ["cos²A − sin²A", "2cos²A − 1", "1 − 2sin²A", "2 sin A cos A"], "a": 3, "e": "2 sin A cos A is sin 2A."}, {"q": "Find the exact value of cos 15° using cos(45° − 30°).", "o": ["(√6 + √2)/4", "(√6 − √2)/4", "(√3 − 1)/2", "√2/4"], "a": 0, "e": "cos 45° cos 30° + sin 45° sin 30° = (√6 + √2)/4."}, {"q": "Express 4 sin θ + 3 cos θ as R sin(θ + α). Find R.", "o": ["7", "5", "1", "25"], "a": 1, "e": "R = √(16 + 9) = 5."}, {"q": "For 4 sin θ + 3 cos θ = R sin(θ + α), find tan α.", "o": ["4/3", "4/5", "3/4", "3/5"], "a": 2, "e": "R cos α = 4 and R sin α = 3, so tan α = 3/4."}, {"q": "What is the maximum value of 5 sin(θ + 0.6)?", "o": ["1", "0.6", "5.6", "5"], "a": 3, "e": "sin has maximum 1, so 5 sin(...) has maximum 5."}, {"q": "What is the minimum value of 2 + 3 cos(θ − α)?", "o": ["−1", "−3", "2", "5"], "a": 0, "e": "cos has minimum −1, so 2 − 3 = −1."}, {"q": "Write cos 2θ in terms of sin θ only.", "o": ["2sin²θ − 1", "1 − 2sin²θ", "sin²θ − 1", "1 − sin²θ"], "a": 1, "e": "cos 2θ = 1 − 2sin²θ."}, {"q": "Solve sin 2x = sin x for 0 ≤ x ≤ 180°.", "o": ["0°, 180° only", "60° only", "0°, 60°, 180°", "30°, 150°"], "a": 2, "e": "2 sin x cos x − sin x = 0, so sin x(2cos x − 1) = 0. sin x = 0: 0°, 180°. cos x = ½: 60°."}, {"q": "Simplify 2 sin 3x cos 3x.", "o": ["sin 3x", "cos 6x", "2 sin 6x", "sin 6x"], "a": 3, "e": "2 sin A cos A = sin 2A with A = 3x."}, {"q": "Simplify 1 − 2sin²(2θ).", "o": ["cos 4θ", "cos 2θ", "sin 4θ", "cos²2θ"], "a": 0, "e": "1 − 2sin²A = cos 2A with A = 2θ."}, {"q": "Find tan(A + B) when tan A = 1/2 and tan B = 1/3.", "o": ["5/6", "1", "1/6", "5/7"], "a": 1, "e": "(½ + ⅓)/(1 − ⅙) = (5/6)/(5/6) = 1."}, {"q": "When proving an identity, what is the usual strategy?", "o": ["Work on both sides at once and cross-multiply", "Substitute a value of θ", "Start from one side and manipulate it into the other side", "Square both sides"], "a": 2, "e": "Substituting a value only checks one case; it isn't a proof."}, {"q": "Express cos θ − √3 sin θ as R cos(θ + α). Find R.", "o": ["4", "√3", "1", "2"], "a": 3, "e": "R = √(1 + 3) = 2."}, {"q": "For cos θ − √3 sin θ = R cos(θ + α), find α (0 < α < π/2).", "o": ["π/3", "π/6", "π/4", "2π/3"], "a": 0, "e": "R cos α = 1, R sin α = √3, so tan α = √3, α = π/3."}, {"q": "Write sin²x in terms of cos 2x.", "o": ["(1 + cos 2x)/2", "(1 − cos 2x)/2", "1 − cos 2x", "cos 2x − 1"], "a": 1, "e": "From cos 2x = 1 − 2sin²x. This is useful for integrating sin²x."}, {"q": "Write cos²x in terms of cos 2x.", "o": ["(1 − cos 2x)/2", "2cos 2x − 1", "(1 + cos 2x)/2", "cos 2x + 1"], "a": 2, "e": "From cos 2x = 2cos²x − 1."}, {"q": "What is tan 2A?", "o": ["2 tan A", "tan²A − 1", "2tan A/(1 + tan²A)", "2tan A/(1 − tan²A)"], "a": 3, "e": "From tan(A + A)."}, {"q": "Solve cos 2x = cos x for 0 ≤ x < 360°.", "o": ["0°, 120°, 240°", "0° only", "60°, 300°", "120°, 240°"], "a": 0, "e": "2cos²x − cos x − 1 = 0, so (2cos x + 1)(cos x − 1) = 0. cos x = 1: 0°. cos x = −½: 120°, 240°."}, {"q": "What is sin(A − B)?", "o": ["sin A cos B + cos A sin B", "sin A cos B − cos A sin B", "cos A cos B − sin A sin B", "sin A sin B − cos A cos B"], "a": 1, "e": "Replace B with −B in the sin(A + B) formula."}]}, {"id": "p16", "order": 22, "year": 2, "section": "P", "badge": "C", "spec": "C", "title": "Parametric equations", "desc": "Defining curves parametrically, converting between parametric and Cartesian forms, sketching parametric curves and modelling with parametric equations.", "practicals": [], "summary": [{"h": "Parametric equations", "fig": "parametric", "cap": "Each value of the parameter t gives one point (t², 2t). Eliminating t (t = y ÷ 2, so x = y² ÷ 4) gives the Cartesian equation y² = 4x.", "p": ["Both x and y are given in terms of a third variable, the **parameter** (often t or θ): x = f(t), y = g(t).", "Each value of t gives a point (x, y) on the curve. The **domain** of t controls which part of the curve is drawn."], "svg": "<svg role=\"img\" aria-label=\"Each value of the parameter t gives one point (t², 2t). Eliminating t (t = y ÷ 2, so x = y² ÷ 4) gives the Cartesian equation y² = 4x.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 300\"><defs><marker id=\"f-parametric-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-parametric-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-parametric-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-parametric-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"60\" y1=\"150\" x2=\"428\" y2=\"150\" class=\"ln\" marker-end=\"url(#f-parametric-ah)\"/><line x1=\"78\" y1=\"280\" x2=\"78\" y2=\"12\" class=\"ln\" marker-end=\"url(#f-parametric-ah)\"/><text x=\"428\" y=\"142\" class=\"tm\" text-anchor=\"end\">x<\/text><text x=\"86\" y=\"16\" class=\"tm\">y<\/text><path d=\"M402,270 L396.6,269 L391.3,268 L386,267 L380.8,266 L375.6,265 L370.4,264 L365.3,263 L360.2,262 L355.2,261 L350.2,260 L345.3,259 L340.4,258 L335.6,257 L330.8,256 L326.1,255 L321.4,254 L316.7,253 L312.1,252 L307.5,251 L303,250 L298.5,249 L294.1,248 L289.7,247 L285.4,246 L281.1,245 L276.8,244 L272.6,243 L268.4,242 L264.3,241 L260.2,240 L256.2,239 L252.2,238 L248.3,237 L244.4,236 L240.6,235 L236.8,234 L233,233 L22 386,33 L391.3,32 L396.6,31 L402,30\" class=\"ac\"/><circle cx=\"402\" cy=\"270\" r=\"4\" class=\"af\"/><text x=\"394\" y=\"286\" class=\"tm\" text-anchor=\"end\" font-size=\"11\">t = −3<\/text><circle cx=\"222\" cy=\"230\" r=\"4\" class=\"af\"/><text x=\"214\" y=\"246\" class=\"tm\" text-anchor=\"end\" font-size=\"11\">t = −2<\/text><circle cx=\"114\" cy=\"190\" r=\"4\" class=\"af\"/><text x=\"124\" y=\"180\" class=\"tm\" font-size=\"11\">t = −1<\/text><circle cx=\"78\" cy=\"150\" r=\"4\" class=\"af\"/><text x=\"68\" y=\"142\" class=\"tm\" text-anchor=\"end\" font-size=\"11\">t = 0<\/text><circle cx=\"114\" cy=\"110\" r=\"4\" class=\"af\"/><text x=\"124\" y=\"130\" class=\"tm\" font-size=\"11\">t = 1<\/text><circle cx=\"222\" cy=\"70\" r=\"4\" class=\"af\"/><text x=\"214\" y=\"62\" class=\"tm\" text-anchor=\"end\" font-size=\"11\">t = 2<\/text><circle cx=\"402\" cy=\"30\" r=\"4\" class=\"af\"/><text x=\"394\" y=\"22\" class=\"tm\" text-anchor=\"end\" font-size=\"11\">t = 3<\/text><text x=\"114\" y=\"28\" font-size=\"14\">x = t², y = 2t<\/text><text x=\"114\" y=\"46\" class=\"ta\" font-size=\"13\">Cartesian: y² = 4x<\/text><\/svg>"}, {"h": "Converting to Cartesian form", "p": ["**Eliminate** the parameter: rearrange one equation for t and substitute into the other.", "For trig parameters, use identities: e.g. x = 3cos θ, y = 3sin θ gives x² + y² = 9 (circle).", "x = a + r cos θ, y = b + r sin θ is a circle centre (a, b), radius r.", "The range of x and y in Cartesian form comes from the parametric domain."]}, {"h": "Applications", "p": ["To find where a parametric curve meets a line or axis, substitute the parametric expressions into the line's equation and solve for t.", "Parametric equations are used to model motion, e.g. projectiles: x = ut cos α, y = ut sin α − ½gt².", "Differentiating parametric equations (dy/dx = (dy/dt)/(dx/dt)) is covered in Further differentiation."]}], "pitfalls": ["After converting, state any **restrictions** on x or y from the parameter's domain.", "Use the right trig identity: sin² + cos² = 1 or 1 + tan² = sec².", "To find where a curve crosses the x-axis, set **y = 0** and solve for t, then find x."], "examples": [{"q": "Find the Cartesian equation of x = t + 1, y = t² − 2.", "steps": ["t = x − 1.", "y = (x − 1)² − 2."], "a": "y = x² − 2x − 1"}, {"q": "A curve has x = 2cos t, y = 5sin t. Find its Cartesian equation.", "steps": ["cos t = x/2 and sin t = y/5.", "cos²t + sin²t = 1 gives x²/4 + y²/25 = 1."], "a": "x²/4 + y²/25 = 1 (an ellipse)"}], "questions": [{"q": "What is a parameter in parametric equations?", "o": ["A constant", "A third variable that both x and y depend on", "The gradient", "The y-intercept"], "a": 1, "e": "E.g. t in x = t², y = 2t."}, {"q": "x = 2t, y = t². Find the point where t = 3.", "o": ["(6, 9)", "(9, 6)", "(3, 9)", "(6, 6)"], "a": 0, "e": "x = 6, y = 9."}, {"q": "Find the Cartesian equation of x = 2t, y = t².", "o": ["y = 2x²", "y = x/2", "y = x²/4", "y = 4x²"], "a": 2, "e": "t = x/2, so y = x²/4."}, {"q": "Find the Cartesian equation of x = 3cos θ, y = 3sin θ.", "o": ["x + y = 3", "y = 3x", "x² − y² = 9", "x² + y² = 9"], "a": 3, "e": "x² + y² = 9(cos²θ + sin²θ) = 9."}, {"q": "x = 1 + 2cos θ, y = −3 + 2sin θ describes what?", "o": ["A circle, centre (1, −3), radius 2", "A circle, centre (−1, 3), radius 2", "A circle, centre (1, −3), radius 4", "An ellipse"], "a": 0, "e": "(x − 1)² + (y + 3)² = 4."}, {"q": "x = t + 2, y = 3t − 1. Find the Cartesian equation.", "o": ["y = 3x + 5", "y = 3x − 7", "y = x + 1", "y = 3x − 1"], "a": 1, "e": "t = x − 2, so y = 3(x − 2) − 1 = 3x − 7."}, {"q": "x = t², y = 2t − 1. Where does the curve cross the y-axis?", "o": ["(1, 0)", "(0, 1)", "(0, −1)", "(−1, 0)"], "a": 2, "e": "x = 0 gives t = 0, so y = −1."}, {"q": "x = t², y = t³. Find the Cartesian equation.", "o": ["y = x^(2/3)", "y = x²", "y = x³", "y² = x³"], "a": 3, "e": "t = y^(1/3), x = y^(2/3), so x³ = y²."}, {"q": "x = sec t, y = tan t. Which identity gives the Cartesian equation?", "o": ["1 + tan²t = sec²t, so x² − y² = 1", "sin²t + cos²t = 1", "1 + cot²t = cosec²t", "cos 2t = 1 − 2sin²t"], "a": 0, "e": "sec²t − tan²t = 1, so x² − y² = 1."}, {"q": "x = 2t, y = 4/t (t ≠ 0). Find the Cartesian equation.", "o": ["y = 2x", "xy = 8", "y = 8x", "xy = 2"], "a": 1, "e": "t = x/2, so y = 4/(x/2) = 8/x."}, {"q": "x = 3t − 1, y = t + 4. Where does the curve meet the line y = x?", "o": ["(4, 4)", "(5, 5)", "(6.5, 6.5)", "(2, 2)"], "a": 2, "e": "t + 4 = 3t − 1, so t = 2.5. x = 6.5, y = 6.5."}, {"q": "x = cos t, y = sin 2t. Write y in terms of x (for sin t ≥ 0).", "o": ["y = 2x", "y = x²", "y = 2x²", "y = 2x√(1 − x²)"], "a": 3, "e": "sin 2t = 2 sin t cos t = 2x√(1 − x²) when sin t ≥ 0."}, {"q": "x = t², 0 ≤ t ≤ 3. What is the range of x?", "o": ["0 ≤ x ≤ 9", "0 ≤ x ≤ 3", "x ≥ 0", "−9 ≤ x ≤ 9"], "a": 0, "e": "x increases from 0 to 9 as t goes from 0 to 3."}, {"q": "A projectile moves with x = 20t, y = 15t − 4.9t². When does it land (y = 0, t > 0)?", "o": ["t = 15 s", "t ≈ 3.06 s", "t ≈ 1.53 s", "t = 20 s"], "a": 1, "e": "t(15 − 4.9t) = 0, so t = 15/4.9 ≈ 3.06 s."}, {"q": "For the projectile x = 20t, y = 15t − 4.9t², how far does it travel horizontally?", "o": ["30.6 m", "15.3 m", "61.2 m", "300 m"], "a": 2, "e": "x = 20 × 3.061 ≈ 61.2 m."}, {"q": "x = 4cos θ, y = 3sin θ. What shape is the curve?", "o": ["A circle", "A parabola", "A straight line", "An ellipse"], "a": 3, "e": "x²/16 + y²/9 = 1, an ellipse."}, {"q": "x = t − 1, y = t² + 1. Find where the curve meets the x-axis.", "o": ["It never meets the x-axis", "(−1, 0)", "(0, 1)", "(1, 0)"], "a": 0, "e": "y = t² + 1 is always at least 1."}, {"q": "x = e^t, y = e^(2t). Find the Cartesian equation.", "o": ["y = 2x", "y = x², x > 0", "y = eˣ", "y = ln x"], "a": 1, "e": "e^(2t) = (e^t)² = x². Since e^t > 0, x > 0."}, {"q": "Why might parametric equations be useful for modelling motion?", "o": ["They avoid all calculation", "They only work for circles", "They give both x and y positions as functions of time", "They remove gravity"], "a": 2, "e": "The parameter t can represent time."}, {"q": "x = 2t + 1, y = t − 3 for −1 ≤ t ≤ 2. What is the domain of x in the Cartesian form?", "o": ["−1 ≤ x ≤ 2", "−3 ≤ x ≤ 2", "x ≥ −1", "−1 ≤ x ≤ 5"], "a": 3, "e": "t = −1 gives x = −1; t = 2 gives x = 5."}, {"q": "x = 3 + t, y = 2 − 2t. What is the gradient of this line?", "o": ["−2", "2", "−1/2", "3"], "a": 0, "e": "t = x − 3, y = 2 − 2(x − 3) = 8 − 2x. Gradient −2."}, {"q": "x = cos 2t, y = sin t. Find the Cartesian equation.", "o": ["x = 1 − y", "x = 1 − 2y²", "x² + y² = 1", "x = 2y² − 1"], "a": 1, "e": "cos 2t = 1 − 2sin²t."}]}, {"id": "p17", "order": 23, "year": 2, "section": "P", "badge": "G", "spec": "G", "title": "Differentiation techniques", "desc": "Derivatives of eˣ, ln x, aˣ and trig functions, the chain, product and quotient rules, and differentiating inverse functions.", "practicals": [], "summary": [{"h": "Standard derivatives", "p": ["`d/dx (eᵏˣ) = keᵏˣ`, `d/dx (ln x) = 1/x`, `d/dx (aˣ) = aˣ ln a`.", "`d/dx (sin kx) = k cos kx`, `d/dx (cos kx) = −k sin kx`, `d/dx (tan kx) = k sec²kx`.", "Also from the formula book: d/dx (sec x) = sec x tan x, d/dx (cosec x) = −cosec x cot x, d/dx (cot x) = −cosec²x.", "Trig derivatives only work with x in **radians**.", "sin x and cos x can be differentiated from first principles using small-angle approximations."]}, {"h": "Chain rule", "p": ["For a function of a function: `dy/dx = dy/du × du/dx`.", "E.g. y = (3x + 1)⁵: dy/dx = 5(3x + 1)⁴ × 3 = 15(3x + 1)⁴.", "`d/dx [ln f(x)] = f′(x)/f(x)` and `d/dx [e^f(x)] = f′(x)e^f(x)`.", "Inverse: `dx/dy = 1 ÷ (dy/dx)`."]}, {"h": "Product and quotient rules", "p": ["**Product rule**: y = uv, `dy/dx = u dv/dx + v du/dx`.", "**Quotient rule**: y = u/v, `dy/dx = (v du/dx − u dv/dx)/v²`."]}], "pitfalls": ["Don't forget to multiply by the **derivative of the inside** in the chain rule.", "The quotient rule has a **minus** and the order matters: v u′ − u v′.", "d/dx (ln 3x) = 1/x, not 3/x, because ln 3x = ln 3 + ln x."], "examples": [{"q": "Differentiate y = x² sin x.", "steps": ["u = x², v = sin x; u′ = 2x, v′ = cos x.", "dy/dx = x² cos x + 2x sin x."], "a": "x² cos x + 2x sin x"}, {"q": "Differentiate y = eˣ/(x + 1).", "steps": ["u = eˣ, v = x + 1; u′ = eˣ, v′ = 1.", "dy/dx = [(x + 1)eˣ − eˣ]/(x + 1)²."], "a": "xeˣ/(x + 1)²"}], "questions": [{"q": "Differentiate y = e^(5x).", "o": ["e^(5x)", "5e^(5x)", "5x e^(5x)", "e^(5x)/5"], "a": 1, "e": "d/dx (eᵏˣ) = keᵏˣ."}, {"q": "Differentiate y = ln x.", "o": ["1/x", "ln x/x", "x", "eˣ"], "a": 0, "e": "A standard result."}, {"q": "Differentiate y = sin 3x.", "o": ["cos 3x", "−3 cos 3x", "3 cos 3x", "3 sin 3x"], "a": 2, "e": "d/dx (sin kx) = k cos kx."}, {"q": "Differentiate y = cos 2x.", "o": ["2 sin 2x", "sin 2x", "−sin 2x", "−2 sin 2x"], "a": 3, "e": "d/dx (cos kx) = −k sin kx."}, {"q": "Differentiate y = (2x + 1)⁴.", "o": ["8(2x + 1)³", "4(2x + 1)³", "2(2x + 1)³", "8(2x + 1)⁴"], "a": 0, "e": "Chain rule: 4(2x + 1)³ × 2."}, {"q": "Differentiate y = ln(x² + 1).", "o": ["1/(x² + 1)", "2x/(x² + 1)", "2x ln(x² + 1)", "x/(x² + 1)"], "a": 1, "e": "f′(x)/f(x) = 2x/(x² + 1)."}, {"q": "Differentiate y = e^(x²).", "o": ["e^(x²)", "x²e^(x²−1)", "2x e^(x²)", "2e^(x²)"], "a": 2, "e": "Chain rule: e^(x²) × 2x."}, {"q": "Differentiate y = 2ˣ.", "o": ["x 2ˣ⁻¹", "2ˣ", "2ˣ/ln 2", "2ˣ ln 2"], "a": 3, "e": "d/dx (aˣ) = aˣ ln a."}, {"q": "Differentiate y = x eˣ.", "o": ["eˣ(x + 1)", "eˣ", "x eˣ", "eˣ + 1"], "a": 0, "e": "Product rule: x eˣ + eˣ."}, {"q": "Differentiate y = x³ ln x.", "o": ["3x²/x", "3x² ln x + x²", "x² ln x", "3x² ln x + x³"], "a": 1, "e": "u = x³, v = ln x. 3x² ln x + x³ × 1/x = 3x² ln x + x²."}, {"q": "Differentiate y = sin x/x.", "o": ["cos x/1", "(x cos x + sin x)/x²", "(x cos x − sin x)/x²", "(sin x − x cos x)/x²"], "a": 2, "e": "Quotient rule: (v u′ − u v′)/v² = (x cos x − sin x)/x²."}, {"q": "Differentiate y = tan 4x.", "o": ["sec²4x", "4 tan 4x", "−4 sec²4x", "4 sec²4x"], "a": 3, "e": "d/dx (tan kx) = k sec²kx."}, {"q": "Differentiate y = ln(5x).", "o": ["1/x", "5/x", "1/(5x)", "5 ln x"], "a": 0, "e": "ln 5x = ln 5 + ln x, so the derivative is 1/x."}, {"q": "x = y³ + y. Find dy/dx in terms of y.", "o": ["3y² + 1", "1/(3y² + 1)", "3y²", "y³"], "a": 1, "e": "dx/dy = 3y² + 1, so dy/dx = 1/(3y² + 1)."}, {"q": "Differentiate y = √(1 + 2x).", "o": ["½(1 + 2x)^(−1/2)", "2(1 + 2x)^(−1/2)", "(1 + 2x)^(−1/2)", "(1 + 2x)^(1/2)"], "a": 2, "e": "½(1 + 2x)^(−1/2) × 2 = (1 + 2x)^(−1/2)."}, {"q": "Find the gradient of y = eˣ sin x at x = 0.", "o": ["0", "2", "e", "1"], "a": 3, "e": "dy/dx = eˣ sin x + eˣ cos x = 0 + 1 = 1 at x = 0."}, {"q": "What is the quotient rule for y = u/v?", "o": ["(v u′ − u v′)/v²", "(u v′ − v u′)/v²", "u′/v′", "(u′v + uv′)/v²"], "a": 0, "e": "Remember the order: v du/dx minus u dv/dx, over v squared."}, {"q": "Differentiate y = sin²x.", "o": ["cos²x", "2 sin x cos x", "2 cos x", "−2 sin x cos x"], "a": 1, "e": "Chain rule: 2 sin x × cos x (= sin 2x)."}, {"q": "Why must x be in radians when differentiating trig functions?", "o": ["Calculators require it", "Degrees don't have derivatives", "The results like d/dx(sin x) = cos x come from small-angle approximations, which only hold in radians", "It's a convention only"], "a": 2, "e": "In degrees, extra factors of π/180 would appear."}, {"q": "Differentiate y = e^(−x) cos x.", "o": ["e^(−x) sin x", "−e^(−x)(cos x − sin x)", "e^(−x)(cos x − sin x)", "−e^(−x)(cos x + sin x)"], "a": 3, "e": "−e^(−x) cos x + e^(−x)(−sin x) = −e^(−x)(cos x + sin x)."}, {"q": "Differentiate y = sec x.", "o": ["sec x tan x", "sec²x", "−sec x tan x", "cosec x"], "a": 0, "e": "A standard result from the formula book."}, {"q": "Differentiate y = 1/(x² + 3).", "o": ["1/(2x)", "−2x/(x² + 3)²", "2x/(x² + 3)²", "−1/(x² + 3)²"], "a": 1, "e": "(x² + 3)⁻¹ → −(x² + 3)⁻² × 2x."}]}, {"id": "p18", "order": 24, "year": 2, "section": "P", "badge": "G", "spec": "G", "title": "Further differentiation", "desc": "Parametric and implicit differentiation, connected rates of change, points of inflection, and convex and concave curves.", "practicals": [], "summary": [{"h": "Parametric differentiation", "p": ["`dy/dx = (dy/dt) ÷ (dx/dt)`", "Find tangents and normals by evaluating at a particular t."]}, {"h": "Implicit differentiation", "p": ["Differentiate every term with respect to x. When differentiating a function of y, multiply by **dy/dx**: `d/dx (y²) = 2y dy/dx`.", "Use the **product rule** for terms like xy: `d/dx (xy) = x dy/dx + y`.", "Collect dy/dx terms on one side and factorise."]}, {"h": "Connected rates of change", "p": ["Link rates using the chain rule, e.g. `dV/dt = dV/dr × dr/dt`.", "Form differential equations from statements like 'the rate of change of P is proportional to P': dP/dt = kP."]}, {"h": "Second derivatives, concavity and inflection", "fig": "concavity", "cap": "y = x³ − 3x. Where f″(x) < 0 the curve is concave (gold) and where f″(x) > 0 it is convex (accent). At the point of inflection f″(x) = 0 and changes sign. Here f″(x) = 6x, so the inflection is at x = 0.", "p": ["**Convex** (curving upwards, like ∪): f″(x) > 0. **Concave** (like ∩): f″(x) < 0.", "A **point of inflection** is where the curve changes from convex to concave (or vice versa): f″(x) = 0 **and changes sign**.", "A **stationary point of inflection** also has f′(x) = 0."], "svg": "<svg role=\"img\" aria-label=\"y = x³ − 3x. Where f″(x) &lt; 0 the curve is concave (gold) and where f″(x) &gt; 0 it is convex (accent). At the point of inflection f″(x) = 0 and changes sign. Here f″(x) = 6x, so the inflection is at x = 0.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 300\"><defs><marker id=\"f-concavity-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-concavity-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 .", "o": ["2t", "2t/3", "3/(2t)", "t²/3"], "a": 1, "e": "dy/dx = (2t)/(3)."}, {"q": "x = cos t, y = sin t. Find dy/dx.", "o": ["−cot t", "tan t", "cot t", "−tan t"], "a": 0, "e": "dy/dx = cos t/(−sin t) = −cot t."}, {"q": "Differentiate y³ with respect to x.", "o": ["3y²", "3y²x", "3y² dy/dx", "y³ dy/dx"], "a": 2, "e": "Chain rule: d/dy (y³) × dy/dx."}, {"q": "Differentiate xy with respect to x.", "o": ["y", "x dy/dx", "dy/dx", "x dy/dx + y"], "a": 3, "e": "Product rule on x and y."}, {"q": "Find dy/dx for x² + y² = 25.", "o": ["−x/y", "x/y", "−y/x", "2x + 2y"], "a": 0, "e": "2x + 2y dy/dx = 0, so dy/dx = −x/y."}, {"q": "For x² + y² = 25, what is the gradient at (3, 4)?", "o": ["3/4", "−3/4", "4/3", "−4/3"], "a": 1, "e": "−x/y = −3/4."}, {"q": "Find dy/dx for eʸ = x.", "o": ["eʸ", "x", "1/x", "ln x"], "a": 2, "e": "eʸ dy/dx = 1, so dy/dx = 1/eʸ = 1/x."}, {"q": "A sphere's radius increases at 0.1 cm s⁻¹. How fast is the volume increasing when r = 5 cm? (V = 4πr³/3)", "o": ["100π cm³ s⁻¹", "π cm³ s⁻¹", "20π cm³ s⁻¹", "10π cm³ s⁻¹"], "a": 3, "e": "dV/dr = 4πr² = 100π. dV/dt = 100π × 0.1 = 10π."}, {"q": "The rate of decrease of temperature T is proportional to T. Which equation is correct?", "o": ["dT/dt = −kT", "dT/dt = kT", "T = −kt", "dT/dt = −k"], "a": 0, "e": "'Decrease' gives a negative sign, with k > 0."}, {"q": "When is a curve convex?", "o": ["When f′(x) > 0", "When f″(x) > 0", "When f″(x) < 0", "When f(x) > 0"], "a": 1, "e": "Convex curves bend upwards, so the gradient increases."}, {"q": "What is a point of inflection?", "o": ["Any point where f′(x) = 0", "A maximum", "A point where the curve changes between convex and concave", "Where f(x) = 0"], "a": 2, "e": "f″(x) changes sign there."}, {"q": "Find the x-coordinate of the point of inflection of y = x³ − 6x².", "o": ["x = 0", "x = 4", "x = 6", "x = 2"], "a": 3, "e": "y″ = 6x − 12 = 0 at x = 2, and it changes sign."}, {"q": "For y = x⁴, f″(0) = 0. Is x = 0 a point of inflection?", "o": ["No, because f″(x) = 12x² doesn't change sign", "Yes, because f″(0) = 0", "Yes, because it's stationary", "Cannot tell"], "a": 0, "e": "y = x⁴ is convex on both sides of 0, so x = 0 is a minimum, not an inflection."}, {"q": "On what interval is y = x³ concave?", "o": ["x > 0", "x < 0", "All x", "x = 0 only"], "a": 1, "e": "y″ = 6x < 0 when x < 0."}, {"q": "x = t + 1/t, y = t − 1/t. Find dy/dx at t = 2.", "o": ["1", "3/5", "5/3", "−1"], "a": 2, "e": "dx/dt = 1 − 1/t² = 3/4, dy/dt = 1 + 1/t² = 5/4. dy/dx = 5/3."}, {"q": "Find dy/dx for y² = 4x.", "o": ["4", "2y", "y/2", "2/y"], "a": 3, "e": "2y dy/dx = 4, so dy/dx = 2/y."}, {"q": "Area A = πr². dr/dt = 2. Find dA/dt when r = 3.", "o": ["12π", "6π", "18π", "9π"], "a": 0, "e": "dA/dr = 2πr = 6π. dA/dt = 6π × 2 = 12π."}, {"q": "A stationary point of inflection must satisfy:", "o": ["f′(x) ≠ 0", "f′(x) = 0 and f″(x) changes sign", "f″(x) > 0", "f(x) = 0"], "a": 1, "e": "E.g. y = x³ at x = 0."}, {"q": "Find dy/dx for x²y = 6.", "o": ["−x/(2y)", "6/x²", "−2y/x", "−y/(2x)"], "a": 2, "e": "2xy + x² dy/dx = 0, so dy/dx = −2xy/x² = −2y/x."}, {"q": "For a parametric curve, how do you find where the tangent is horizontal?", "o": ["Set dx/dt = 0", "Set x = 0", "Set y = 0", "Set dy/dt = 0 (with dx/dt ≠ 0)"], "a": 3, "e": "Horizontal tangent means dy/dx = 0."}, {"q": "y = sin x on 0 < x < 2π. Where is the point of inflection?", "o": ["x = π", "x = π/2", "x = 3π/2", "There isn't one"], "a": 0, "e": "y″ = −sin x = 0 at x = π, and it changes sign there."}, {"q": "x = e^t, y = e^(2t). Find dy/dx.", "o": ["e^t", "2e^t", "2", "e^(2t)"], "a": 1, "e": "dy/dx = 2e^(2t)/e^t = 2e^t."}]}, {"id": "p19", "order": 25, "year": 2, "section": "P", "badge": "H", "spec": "H", "title": "Integration techniques", "desc": "Integrating eˣ, 1/x and trig functions, reverse chain rule, integration by substitution, integration by parts, and integrating using partial fractions and identities.", "practicals": [], "summary": [{"h": "Standard integrals", "p": ["`∫ eᵏˣ dx = (1/k)eᵏˣ + c`", "`∫ 1/x dx = ln|x| + c`", "`∫ cos kx dx = (1/k) sin kx + c` and `∫ sin kx dx = −(1/k) cos kx + c`", "`∫ sec²kx dx = (1/k) tan kx + c`", "`∫ (ax + b)ⁿ dx = (ax + b)ⁿ⁺¹/[a(n + 1)] + c`"]}, {"h": "Reverse chain rule", "p": ["`∫ f′(x)/f(x) dx = ln|f(x)| + c`", "`∫ f′(x)[f(x)]ⁿ dx = [f(x)]ⁿ⁺¹/(n + 1) + c`", "Spot when the numerator is (a multiple of) the derivative of the denominator."]}, {"h": "Substitution and parts", "p": ["**Substitution**: let u = g(x), find du/dx, replace dx and all x terms. For definite integrals, **change the limits** too.", "**Integration by parts**: `∫ u (dv/dx) dx = uv − ∫ v (du/dx) dx`.", "Choose u to be the part that gets **simpler** when differentiated (e.g. a polynomial), except with ln x, where u = ln x.", "Sometimes parts is used twice (e.g. x² eˣ)."]}, {"h": "Using identities and partial fractions", "p": ["Use partial fractions to split rational functions, then integrate each term to get logs.", "Use trig identities: e.g. `sin²x = ½(1 − cos 2x)` and `cos²x = ½(1 + cos 2x)`. tan²x = sec²x − 1."]}], "pitfalls": ["∫ 1/x dx = ln|x|. Use modulus when x could be negative.", "Change the limits in a definite substitution, or substitute back before using the original limits.", "In integration by parts, the derivative of u should be simpler than u."], "examples": [{"q": "Find ∫ x eˣ dx.", "steps": ["u = x, dv/dx = eˣ, so du/dx = 1, v = eˣ.", "∫ x eˣ dx = x eˣ − ∫ eˣ dx."], "a": "x eˣ − eˣ + c"}, {"q": "Find ∫₀^(π/2) sin²x dx.", "steps": ["sin²x = ½(1 − cos 2x).", "∫ = [½x − ¼ sin 2x] from 0 to π/2.", "= (π/4 − 0) − 0."], "a": "π/4"}], "questions": [{"q": "Find ∫ e^(3x) dx.", "o": ["3e^(3x) + c", "⅓e^(3x) + c", "e^(3x) + c", "e^(4x)/4 + c"], "a": 1, "e": "∫ eᵏˣ dx = (1/k)eᵏˣ + c."}, {"q": "Find ∫ 5/x dx.", "o": ["5 ln|x| + c", "5x⁻² + c", "ln|5x| + c", "−5/x² + c"], "a": 0, "e": "∫ 1/x dx = ln|x|, multiplied by 5."}, {"q": "Find ∫ cos 2x dx.", "o": ["2 sin 2x + c", "−½ sin 2x + c", "½ sin 2x + c", "sin 2x + c"], "a": 2, "e": "∫ cos kx dx = (1/k) sin kx."}, {"q": "Find ∫ sin 3x dx.", "o": ["⅓ cos 3x + c", "−3 cos 3x + c", "3 cos 3x + c", "−⅓ cos 3x + c"], "a": 3, "e": "∫ sin kx dx = −(1/k) cos kx."}, {"q": "Find ∫ 2x/(x² + 1) dx.", "o": ["ln(x² + 1) + c", "2 ln(x² + 1) + c", "x² ln x + c", "1/(x² + 1) + c"], "a": 0, "e": "The numerator is the derivative of the denominator."}, {"q": "Find ∫ (2x + 1)⁵ dx.", "o": ["(2x + 1)⁶/6 + c", "(2x + 1)⁶/12 + c", "10(2x + 1)⁴ + c", "(2x + 1)⁶ + c"], "a": 1, "e": "(2x + 1)⁶/(2 × 6)."}, {"q": "Find ∫ sec²x dx.", "o": ["sec x tan x + c", "sec³x/3 + c", "tan x + c", "−cot x + c"], "a": 2, "e": "d/dx (tan x) = sec²x."}, {"q": "Find ∫ x eˣ dx.", "o": ["x eˣ + c", "x² eˣ/2 + c", "eˣ + c", "x eˣ − eˣ + c"], "a": 3, "e": "By parts with u = x."}, {"q": "For ∫ x ln x dx by parts, which should be u?", "o": ["u = ln x", "u = x", "u = x ln x", "Either"], "a": 0, "e": "ln x is hard to integrate but easy to differentiate."}, {"q": "Find ∫ x ln x dx.", "o": ["x² ln x + c", "½x² ln x − ¼x² + c", "ln x/x + c", "½x² ln x + c"], "a": 1, "e": "u = ln x, v = x²/2: ½x² ln x − ∫ ½x dx = ½x² ln x − ¼x² + c."}, {"q": "Evaluate ∫₁^e 1/x dx.", "o": ["e", "0", "1", "e − 1"], "a": 2, "e": "[ln x]₁^e = 1 − 0 = 1."}, {"q": "Which identity helps to integrate cos²x?", "o": ["cos²x = 1 − sin x", "cos²x = 2cos x", "cos²x = sec²x − 1", "cos²x = ½(1 + cos 2x)"], "a": 3, "e": "This turns cos²x into terms that integrate directly."}, {"q": "Find ∫ tan²x dx.", "o": ["tan x − x + c", "tan³x/3 + c", "sec²x + c", "tan x + x + c"], "a": 0, "e": "tan²x = sec²x − 1."}, {"q": "Using u = x² + 1, find ∫ 2x (x² + 1)³ dx.", "o": ["(x² + 1)⁴ + c", "(x² + 1)⁴/4 + c", "2(x² + 1)⁴ + c", "x²(x² + 1)⁴ + c"], "a": 1, "e": "du = 2x dx, so ∫ u³ du = u⁴/4."}, {"q": "Find ∫ 1/(2x + 3) dx.", "o": ["ln|2x + 3| + c", "2 ln|2x + 3| + c", "½ ln|2x + 3| + c", "−1/(2x + 3)² + c"], "a": 2, "e": "∫ 1/(ax + b) dx = (1/a) ln|ax + b|."}, {"q": "Express and integrate 1/[(x + 1)(x + 2)].", "o": ["ln|x + 1| + ln|x + 2| + c", "ln|(x + 1)(x + 2)| + c", "1/(x + 1) − 1/(x + 2) + c", "ln|(x + 1)/(x + 2)| + c"], "a": 3, "e": "1/(x + 1) − 1/(x + 2), so ln|x + 1| − ln|x + 2|."}, {"q": "Evaluate ∫₀^(π/2) cos x dx.", "o": ["1", "0", "−1", "π/2"], "a": 0, "e": "[sin x]₀^(π/2) = 1 − 0."}, {"q": "In a definite integral by substitution, what must you do with the limits?", "o": ["Leave them unchanged", "Change them to the corresponding values of u", "Double them", "Remove them"], "a": 1, "e": "Or substitute back to x before using the original limits."}, {"q": "Find ∫ cos x/sin x dx.", "o": ["−ln|sin x| + c", "ln|cos x| + c", "ln|sin x| + c", "tan x + c"], "a": 2, "e": "The numerator is the derivative of the denominator."}, {"q": "Evaluate ∫₀^(π/2) sin²x dx.", "o": ["π/2", "1", "½", "π/4"], "a": 3, "e": "[½x − ¼ sin 2x]₀^(π/2) = π/4."}, {"q": "How many times is integration by parts needed for ∫ x² eˣ dx?", "o": ["Twice", "Once", "Three times", "It can't be done"], "a": 0, "e": "Each application reduces the power of x by 1."}, {"q": "Find ∫ e^(2x) + 1/x dx.", "o": ["2e^(2x) + ln x + c", "½e^(2x) + ln|x| + c", "e^(2x) − 1/x² + c", "½e^(2x) − 1/x² + c"], "a": 1, "e": "Integrate each term separately."}]}, {"id": "p20", "order": 26, "year": 2, "section": "P", "badge": "H", "spec": "H", "title": "Differential equations and areas", "desc": "Integration as the limit of a sum, areas between curves, areas under parametric curves, and solving first-order separable differential equations in context.", "practicals": [], "summary": [{"h": "Integration as the limit of a sum", "fig": "limit-of-sum", "cap": "The area under a curve is approximated by thin rectangles of width δx and height y. As δx → 0 the total Σ y δx becomes the exact area, written ∫ y dx from a to b.", "p": ["The area under a curve is the limit of the sum of thin rectangles: `∫ₐᵇ y dx = lim (δx→0) Σ y δx`."], "svg": "<svg role=\"img\" aria-label=\"The area under a curve is approximated by thin rectangles of width δx and height y. As δx → 0 the total Σ y δx becomes the exact area, written ∫ y dx from a to b.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 296\"><defs><marker id=\"f-limitofsum-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-limitofsum-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-limitofsum-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-limitofsum-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"50\" y1=\"260\" x2=\"438\" y2=\"260\" class=\"ln\" marker-end=\"url(#f-limitofsum-ah)\"/><line x1=\"50\" y1=\"260\" x2=\"50\" y2=\"12\" class=\"ln\" marker-end=\"url(#f-limitofsum-ah)\"/><text x=\"438\" y=\"252\" class=\"tm\" text-anchor=\"end\">x<\/text><text x=\"58\" y=\"16\" class=\"tm\">y<\/text><rect x=\"93.2\" y=\"209\" width=\"43.2\" height=\"51\" rx=\"0\" class=\"at\"/><rect x=\"136.4\" y=\"200\" width=\"43.2\" height=\"60\" rx=\"0\" class=\"at\"/><rect x=\"179.5\" y=\"185\" width=\"43.2\" height=\"75\" rx=\"0\" class=\"at\"/><rect x=\"222.7\" y=\"164\" width=\"43.2\" height=\"96\" rx=\"0\" class=\"at\"/><rect x=\"265.9\" y=\"137\" width=\"43.2\" height=\"123\" rx=\"0\" class=\"at\"/><rect x=\"309.1\" y=\"104\" width=\"43.2\" height=\"156\" rx=\"0\" class=\"at\"/><rect x=\"352.3\" y=\"65\" width=\"43.2\" height=\"195\" rx=\"0\" class=\"at\"/><path d=\"M50,212 L52.3,212 L54.6,212 L57,211.9 L59.3,211.9 L61.6,211.8 L63.9,211.7 L66.2,211.6 L68.6,211.4 L70.9,211.3 L73.2,211.1 L75.5,211 L77.9,210.8 L80.2,210.5 L82.5,210.3 L84.8,210 L87.1,209.8 L89.5,209.5 L91.8,209.2 L94.1,208.9 L96.4,208.5 L98.7,208.2 L101.1,207.8 L103.4,207.4 L105.7,207 L108,206.6 L110.3,206.1 L112.7,205.7 L115,205.2 L117.3,204.7 L119.6,204.2 L122,203.7 L124.3,203.1 L126.6,202.6 L128.9,202 L131.2,201.4 L133.6,200.8 L135.9,200.1 L138.2,199.5 L140.5,198.8 L142.8,198.1 L145.2,197.4 L147.5,196.7 L149.8,196 L152.1,195.2 L154.4,194.4 L156.8,193.7 L159.1,192.9 L161.4,192 L163.7,191.2 L166.1,190.3 L168.4,189.5 L170.7,188.6 L173,187.7 L175.3,186.7 L177.7,185.8 L180,184.8 L182.3,183.8 L184.6,182.8 L186.9,181.8 L189.3,180.8 L191.6,179.7 L193.9,178.7 L196.2,177.6 L198.5,176.5 L200.9,175.4 L203.2,174.2 L205.5,173.1 L207.8,171.9 L210.2,170.7 L212.5,169.5 L214.8,168.3 L217.1,167.1 L219.4,165.8 L221.8,164.5 L224.1,163.2 L226.4,161.9 L228.7,160.6 L231,159.3 L233.4,157.9 L235.7,156.5 L238,155.1 L240.3,153.7 L242.6,152.3 L245,150.8 L247.3,149.4 L249.6,147.9 L251.9,146.4 L254.2,144.9 L256.6,143.3 L258.9,141.8 L261.2,140.2 L263.5,138.6 L265.9,137 L268.2,135.4 L270.5,133.8 L272.8,132.1 L275.1,130.5 L277.5,128.8 L279.8,127.1 L282.1,125.3 L284.4,123.6 L286.7,121.8 L289.1,120 L291.4,118.3 L293.7,116.4 L296,114.6 L298.3,112.8 L300.7,110.9 L303,109 L305.3,107.1 L307.6,105.2 L310,103.3 L312.3,101.3 L314.6,99.4 L316.9,97.4 L319.2,95.4 L321.6,93.4 L323.9,91.3 L326.2,89.3 L328.5,87.2 L330.8,85.1 L333.2,83 L335.5,80.9 L337.8,78.7 L340.1,76.6 L342.4,74.4 L344.8,72.2 L347.1,70 L349.4,67.8 L351.7,65.5 L354.1,63.3 L356.4,61 L358.7,58.7 L361,56.4 L363.3,54 L365.7,51.7 L368,49.3 L370.3,46.9 L372.6,44.5 L374.9,42.1 L377.3,39.7 L379.6,37.2 L381.9,34.8 L384.2,32.3 L386.5,29.8 L388.9,27.3 L391.2,24.7 L393.5,22.2 L395.8,19.6 L398.2,17 L400.5,14.4 L402.8,11.8 L405.1,9.1 L407.4,6.4 L409.8,3.8 L412.1,1.1 L414.4,-1.6 L416.7,-4.4 L419,-7.1 L421.4,-9.9\" class=\"ln\"/><line x1=\"265.9\" y1=\"272\" x2=\"309.1\" y2=\"272\" class=\"ln\" marker-end=\"url(#f-limitofsum-ah)\" marker-start=\"url(#f-limitofsum-ah)\"/><text x=\"287.5\" y=\"290\" text-anchor=\"middle\" font-size=\"13\">δx<\/text><text x=\"93.2\" y=\"280\" text-anchor=\"middle\" font-size=\"13\">a<\/text><text x=\"395.5\" y=\"280\" text-anchor=\"middle\" font-size=\"13\">b<\/text><text x=\"67.3\" y=\"39.2\" font-size=\"14\">Σ y δx → ∫ y dx as δx → 0<\/text><\/svg>"}, {"h": "Areas", "p": ["**Between two curves**: ∫ (upper − lower) dx between intersection points.", "**Parametric curves**: `Area = ∫ y (dx/dt) dt`, with limits in **t**."]}, {"h": "Separable differential equations", "p": ["A **first-order separable** equation can be written `dy/dx = f(x) g(y)`.", "**Separate** the variables: `∫ 1/g(y) dy = ∫ f(x) dx`, then integrate both sides and add **one** constant.", "The **general solution** contains a constant. A **particular solution** uses given values to find it.", "Example: dy/dx = ky gives ln|y| = kx + c, so y = Aeᵏˣ (exponential growth or decay)."]}, {"h": "Modelling", "p": ["Form the equation from words: 'rate of change of N is proportional to N' gives dN/dt = kN.", "Interpret the solution in context, including limitations (e.g. a population can't grow forever)."]}], "pitfalls": ["Only one + c is needed after integrating both sides.", "When exponentiating ln|y| = kx + c, the constant becomes a **multiplier**: y = Aeᵏˣ.", "For parametric areas, change the limits to t values."], "examples": [{"q": "Solve dy/dx = 2xy, given y = 3 when x = 0.", "steps": ["Separate: ∫ 1/y dy = ∫ 2x dx.", "ln|y| = x² + c, so y = Ae^(x²).", "y = 3 at x = 0 gives A = 3."], "a": "y = 3e^(x²)"}, {"q": "Find the area enclosed by y = x² and y = 2x.", "steps": ["Intersections: x² = 2x, so x = 0 and x = 2.", "∫₀² (2x − x²) dx = [x² − x³/3]₀².", "= 4 − 8/3."], "a": "4/3"}], "questions": [{"q": "Which is a separable differential equation?", "o": ["dy/dx = x + y", "dy/dx = xy²", "dy/dx = sin(x + y)", "dy/dx = x² + y²"], "a": 1, "e": "xy² is a product of a function of x and a function of y."}, {"q": "What is the general solution of dy/dx = 3y?", "o": ["y = Ae^(3x)", "y = 3x + c", "y = e^(3x)", "y = 3eˣ + c"], "a": 0, "e": "ln|y| = 3x + c, so y = Ae^(3x)."}, {"q": "Solve dy/dx = x/y.", "o": ["y = x + c", "y² = x + c", "y² = x² + c", "y = ln x + c"], "a": 2, "e": "∫ y dy = ∫ x dx gives y²/2 = x²/2 + c, so y² = x² + C."}, {"q": "What is the difference between a general and a particular solution?", "o": ["There is no difference", "A particular solution has more constants", "A general solution has no constant", "A general solution contains an arbitrary constant; a particular solution uses given conditions to find it"], "a": 3, "e": "Initial conditions pin down the constant."}, {"q": "A population grows at a rate proportional to its size. Which equation models this?", "o": ["dP/dt = kP", "dP/dt = k", "P = kt", "dP/dt = −kP²"], "a": 0, "e": "Proportional to its size means dP/dt = kP, k > 0."}, {"q": "dP/dt = 0.2P, P = 100 when t = 0. Find P when t = 5.", "o": ["200", "100e ≈ 272", "100e^0.2 ≈ 122", "500"], "a": 1, "e": "P = 100e^(0.2t). At t = 5, P = 100e¹ ≈ 272."}, {"q": "Find the area enclosed between y = x and y = x².", "o": ["1/2", "1/3", "1/6", "1"], "a": 2, "e": "∫₀¹ (x − x²) dx = ½ − ⅓ = 1/6."}, {"q": "What is the formula for the area under a parametric curve?", "o": ["∫ x dy", "∫ y dt", "∫ (dy/dt) dx", "∫ y (dx/dt) dt"], "a": 3, "e": "Since dx = (dx/dt) dt."}, {"q": "x = t², y = 2t for 0 ≤ t ≤ 2. Find the area under the curve.", "o": ["32/3", "16/3", "8", "4"], "a": 0, "e": "∫₀² 2t × 2t dt = ∫ 4t² dt = [4t³/3]₀² = 32/3."}, {"q": "Solve dy/dx = eˣ/y, given y = 2 when x = 0.", "o": ["y = eˣ + 1", "y² = 2eˣ + 2", "y = 2eˣ", "y² = eˣ + 3"], "a": 1, "e": "y²/2 = eˣ + c. At (0, 2): 2 = 1 + c, c = 1. So y² = 2eˣ + 2."}, {"q": "What does integration as the limit of a sum mean?", "o": ["Integration adds constants", "Integration is the same as differentiation", "Area is the limit of the sum of thin rectangles as their width tends to zero", "The integral is always a whole number"], "a": 2, "e": "∫ y dx = lim Σ y δx."}, {"q": "How many arbitrary constants appear in the general solution of a first-order separable equation?", "o": ["Two", "None", "It depends on the equation", "One"], "a": 3, "e": "Combine the constants from both sides into one."}, {"q": "A liquid cools at a rate proportional to the temperature difference with the room: dθ/dt = −k(θ − 20). What happens as t → ∞?", "o": ["θ → 20", "θ → 0", "θ → ∞", "θ oscillates"], "a": 0, "e": "The solution is θ = 20 + Ae^(−kt), which tends to room temperature."}, {"q": "Solve dy/dx = y cos x.", "o": ["y = A cos x", "y = Ae^(sin x)", "y = sin x + c", "y = Ae^(cos x)"], "a": 1, "e": "ln|y| = sin x + c."}, {"q": "The area between y = 4 − x² and y = 0 is split by the y-axis. What is the area for x from 0 to 2?", "o": ["32/3", "8", "16/3", "4"], "a": 2, "e": "[4x − x³/3]₀² = 8 − 8/3 = 16/3."}, {"q": "Why might an exponential model for population growth become inaccurate?", "o": ["The constant is wrong", "Integration is approximate", "Populations always decrease", "Resources are limited, so growth slows over time"], "a": 3, "e": "Real populations level off at a carrying capacity."}, {"q": "Solve dy/dx = 2y, y = 5 when x = 0.", "o": ["y = 5e^(2x)", "y = 2e^(5x)", "y = 5 + 2x", "y = e^(2x) + 4"], "a": 0, "e": "y = Ae^(2x), A = 5."}, {"q": "To solve dy/dx = (1 + y²)/x, what is the first step?", "o": ["Integrate both sides directly", "Separate: ∫ 1/(1 + y²) dy = ∫ 1/x dx", "Multiply by x²", "Differentiate again"], "a": 1, "e": "Get all y terms with dy and all x terms with dx."}, {"q": "The rate at which a radioactive mass m decays is proportional to m. If m halves in 10 years, what is k in dm/dt = −km?", "o": ["0.1", "10 ln 2", "(ln 2)/10", "ln 10"], "a": 2, "e": "m = m₀e^(−kt). ½ = e^(−10k), so k = ln 2/10 ≈ 0.0693."}, {"q": "Find the area enclosed by y = x² and y = 4.", "o": ["8", "16", "16/3", "32/3"], "a": 3, "e": "∫₋₂² (4 − x²) dx = 32/3."}, {"q": "In ln|y| = 2x + c, what is y in terms of x?", "o": ["y = Ae^(2x)", "y = e^(2x) + c", "y = 2x + eᶜ", "y = A + e^(2x)"], "a": 0, "e": "y = e^(2x + c) = eᶜ e^(2x) = Ae^(2x)."}, {"q": "What is the area between y = sin x and the x-axis from 0 to π?", "o": ["1", "2", "0", "π"], "a": 1, "e": "[−cos x]₀^π = 1 + 1 = 2."}]}, {"id": "p21", "order": 27, "year": 2, "section": "P", "badge": "I", "spec": "I", "title": "Numerical methods", "desc": "Locating roots by change of sign, fixed-point iteration with staircase and cobweb diagrams, the Newton–Raphson method, and the trapezium rule.", "practicals": [], "summary": [{"h": "Locating roots", "p": ["If f(x) is **continuous** on [a, b] and f(a) and f(b) have **opposite signs**, there is a root between a and b.", "Change of sign can fail if the function is discontinuous (e.g. an asymptote) or if there are two roots close together."]}, {"h": "Iteration", "p": ["Rearrange f(x) = 0 into **x = g(x)**, then use `xₙ₊₁ = g(xₙ)`.", "**Staircase** diagrams (converging from one side) and **cobweb** diagrams (alternating sides) show convergence.", "Iteration converges if |g′(x)| < 1 near the root. Different rearrangements can converge or diverge."]}, {"h": "Newton–Raphson", "fig": "newton-raphson", "cap": "f(x) = x³ − 2x − 2. Start at x₀ = 2.6, follow the tangent down to the x-axis to get x₁ = 2.032, then repeat from x₁. It fails if f′(x) is close to 0 near the starting point (the tangent is nearly flat).", "p": ["`xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ)`", "Uses the tangent at xₙ to estimate where the curve meets the x-axis.", "It **fails** if f′(xₙ) = 0 (stationary point) and can be unreliable if the starting value is near a turning point."], "svg": "<svg role=\"img\" aria-label=\"f(x) = x³ − 2x − 2. Start at x₀ = 2.6, follow the tangent down to the x-axis to get x₁ = 2.032, then repeat from x₁. It fails if f′(x) is close to 0 near the starting point (the tangent is nearly flat).\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 290\"><defs><marker id=\"f-newtonraphson-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-newtonraphson-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-newtonraphson-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-newtonraphson-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"40\" y1=\"218.6\" x2=\"448\" y2=\"218.6\" class=\"ln\" marker-end=\"url(#f-newtonraphson-ah)\"/><line x1=\"40\" y1=\"260\" x2=\"40\" y2=\"12\" class=\"ln\" marker-end=\"url(#f-newtonraphson-ah)\"/><text x=\"448\" y=\"210.6\" class=\"tm\" text-anchor=\"end\">x<\/text><text x=\"48\" y=\"16\" class=\"tm\">y<\/text><path d=\"M77.5,261.2 L79.4,261.6 L81.3,262.1 L83.2,262.5 L85.2,262.9 L87.1,263.3 L89,263.7 L90.9,264.1 L92.8,264.5 L94.7,264.8 L96.6,265.2 L98.6,265.5 L100.5,265.9 L102.4,266.2 L104.3,266.5 L106.2,266.8 L108.1,267.1 L110,267.4 L112,267.6 L113.9,267.9 L115.8,268.1 L117.7,268.3 L119.6,268.5 L121.5,268.7 L123.4,268.9 L125.4,269.1 L127.3,269.2 L129.2,269.3 L131.1,269.4 L133,269.5 L134.9,269.6 L136.8,269.7 L138.8,269.7 L140.7,269.7 L142.6,269.7 L144.5,269.7 L146.4,269.7 L148.3,269.6 L150.2,269.6 L152.1,269.5 L154.1,269.4 L156,269.2 L157.9,269.1 L159.8,268.9 L161.7,268.7 L163.6,268.5 L165.5,268.2 L167.5,267.9 L169.4,267.6 L171.3,267.3 L173.2,267 L175.1,266.6 L177,266.2 L178.9,265.8 L180.9,265.3 L182.8,264.9 L184.7,264.4 L186.6,263.8 L188.5,263.3 L190.4,262.7 L192.3,262.1 L194.3,261.5 L196.2,260.8 L198.1,260.1 L200,259.4 L201.9,258.6 L203.8,257.8 L205.7,257 L207.7,256.2 L209.6,255.3 L211.5,254.4 L213.4,253.5 L215.3,252.5 L217.2,251.5 L219.1,250.4 L221.1,249.4 L223,248.3 L224.9,247.1 L226.8,246 L228.7,244.7 L230.6,243.5 L232.5,242.2 L23
