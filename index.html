,148.7 L323.5,147.3 L324.1,145.8 L324.7,144.4 L325.3,142.9 L325.9,141.5 L326.5,140 L327.1,138.6 L327.7,137.1 L328.3,135.7 L328.9,134.2 L329.5,132.8 L330.1,131.3 L330.7,129.8 L331.3,128.4 L331.9,126.9 L332.5,125.5 L333.1,124 L333.7,122.6 L334.3,121.1 L334.9,119.7 L335.5,118.2 L336.1,116.8 L336.7,115.3 L337.3,113.9 L337.9,112.4 L338.5,111 L339.1,109.5 L339.7,108.1 L340.3,106.6 L340.9,105.2 L341.5,103.7 L342.1,102.3 L342.7,100.8 L343.3,99.4 L343.9,97.9 L344.5,96.5 L345.1,95 L345.7,93.6 L346.3,92.1 L346.9,90.7 L347.5,89.2 L348.1,87.8 L348.7,86.3 L349.3,84.8 L349.9,83.4 L350.5,81.9 L351.1,80.5 L351.7,79 L352.3,77.6 L352.9,76.1 L353.5,74.7 L354.1,73.2 L354.7,71.8 L355.3,70.3 L355.9,68.9 L356.5,67.4 L357.1,66 L357.7,64.5 L358.3,63.1 L358.9,61.6 L359.5,60.2 L360.1,58.7 L360.7,57.3 L361.3,55.8 L361.9,54.4 L362.5,52.9 L363.1,51.5 L363.7,50 L364.3,48.6 L364.9,47.1 L365.5,45.7 L366.1,44.2 L366.7,42.8 L367.3,41.3 L367.9,39.8 L368.5,38.4 L369.1,36.9 L369.7,35.5 L370.3,34 L370.9,32.6 L371.5,31.1 L372.1,29.7 L372.7,28.2 L373.3,26.8 L373.9,25.3 L374.5,23.9 L375.1,22.4 L375.7,21 L376.3,19.5 L376.9,18.1 L377.5,16.6\" class=\"ac\"/><circle cx=\"294\" cy=\"218.6\" r=\"4\" class=\"af\"/><text x=\"365\" y=\"238.6\" text-anchor=\"middle\" font-size=\"14\">x₀<\/text><text x=\"288\" y=\"238.6\" class=\"ta\" text-anchor=\"middle\" font-size=\"14\">x₁<\/text><circle cx=\"261.2\" cy=\"218.6\" r=\"4\" class=\"gf\"/><text x=\"253.2\" y=\"208.6\" class=\"tg\" text-anchor=\"end\" font-size=\"13\">root<\/text><text x=\"58.8\" y=\"44.8\" font-size=\"15\">x₁ = x₀ − f(x₀) ÷ f′(x₀)<\/text><text x=\"373\" y=\"60.9\" class=\"ta\" font-size=\"12\">tangent at x₀<\/text><\/svg>"}, {"h": "Trapezium rule", "p": ["`∫ₐᵇ y dx ≈ (h/2)[y₀ + 2(y₁ + y₂ + ... + yₙ₋₁) + yₙ]`, where `h = (b − a)/n`.", "**Overestimates** for convex curves (curving up) and **underestimates** for concave curves.", "Increasing the number of strips improves accuracy."]}], "pitfalls": ["To show a root to a given accuracy, test the **bounds** (e.g. 1.235 and 1.245) for a sign change.", "In the trapezium rule, n strips need n + 1 ordinates.", "Use radians in calculus-based numerical methods with trig functions."], "examples": [{"q": "Use Newton–Raphson with x₀ = 2 to find x₁ for f(x) = x² − 5.", "steps": ["f(2) = −1 and f′(x) = 2x, so f′(2) = 4.", "x₁ = 2 − (−1)/4 = 2.25."], "a": "x₁ = 2.25"}, {"q": "Use the trapezium rule with 2 strips to estimate ∫₀² x² dx.", "steps": ["h = 1. Ordinates: y₀ = 0, y₁ = 1, y₂ = 4.", "≈ ½[0 + 2(1) + 4] = 3.", "The exact value is 8/3, so it's an overestimate (the curve is convex)."], "a": "3"}], "questions": [{"q": "f(1) = −2 and f(2) = 3, and f is continuous. What can you conclude?", "o": ["There is no root", "There is a root between 1 and 2", "The root is 1.5", "f has a turning point"], "a": 1, "e": "A sign change for a continuous function means a root lies in the interval."}, {"q": "Why might the change of sign method fail for f(x) = 1/(x − 3) between 2 and 4?", "o": ["The function has a discontinuity (asymptote) at x = 3", "f(2) = f(4)", "There are two roots", "It is continuous"], "a": 0, "e": "The sign changes but there's no root, only an asymptote."}, {"q": "What is the Newton–Raphson formula?", "o": ["xₙ₊₁ = f(xₙ)/f′(xₙ)", "xₙ₊₁ = xₙ + f(xₙ)/f′(xₙ)", "xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ)", "xₙ₊₁ = g(xₙ)"], "a": 2, "e": "Subtract f over f′ from the current estimate."}, {"q": "When does Newton–Raphson fail?", "o": ["When f(xₙ) = 0", "When x₀ is negative", "When f is continuous", "When f′(xₙ) = 0"], "a": 3, "e": "You'd divide by zero: the tangent is horizontal and never meets the x-axis."}, {"q": "f(x) = x³ − 2x − 5, x₀ = 2. Find x₁ using Newton–Raphson.", "o": ["2.1", "2.2", "1.9", "2.05"], "a": 0, "e": "f(2) = −1, f′(x) = 3x² − 2 = 10. x₁ = 2 + 0.1 = 2.1."}, {"q": "xₙ₊₁ = √(xₙ + 3), x₀ = 2. Find x₁ to 3 d.p.", "o": ["2.000", "2.236", "2.302", "5.000"], "a": 1, "e": "√5 = 2.236."}, {"q": "What does a cobweb diagram show?", "o": ["Divergence only", "Convergence from one side", "Iterations that alternate either side of the root", "A trapezium rule estimate"], "a": 2, "e": "Staircase diagrams approach from one side; cobwebs spiral in."}, {"q": "When does fixed-point iteration xₙ₊₁ = g(xₙ) converge near a root?", "o": ["When g′(x) > 1", "Always", "Never", "When |g′(x)| < 1 near the root"], "a": 3, "e": "If the gradient of g is too steep, the iterates move away."}, {"q": "Using the trapezium rule with 4 strips on [0, 2], what is h?", "o": ["0.5", "2", "4", "0.25"], "a": 0, "e": "h = (2 − 0)/4 = 0.5."}, {"q": "The trapezium rule is used on a convex curve. Is the estimate an over- or underestimate?", "o": ["Underestimate", "Overestimate", "Exact", "Cannot tell"], "a": 1, "e": "The chords lie above a convex curve."}, {"q": "How can the trapezium rule's accuracy be improved?", "o": ["Use fewer strips", "Use degrees", "Use more strips (smaller h)", "Subtract h"], "a": 2, "e": "Thinner trapezia fit the curve more closely."}, {"q": "To show a root is 1.24 to 2 d.p., which values do you test?", "o": ["1.23 and 1.25", "1.2 and 1.3", "1.24 only", "1.235 and 1.245"], "a": 3, "e": "A sign change between these bounds shows the root rounds to 1.24."}, {"q": "Using the trapezium rule with ordinates y₀ = 1, y₁ = 2, y₂ = 5 and h = 1, estimate the integral.", "o": ["5", "8", "10", "4"], "a": 0, "e": "½[1 + 2(2) + 5] = ½ × 10 = 5."}, {"q": "x³ − x − 1 = 0 is rearranged as x = ∛(x + 1). With x₀ = 1, find x₁ to 3 d.p.", "o": ["1.000", "1.260", "1.325", "2.000"], "a": 1, "e": "∛2 = 1.260."}, {"q": "Newton–Raphson uses which geometric idea?", "o": ["The area under the curve", "A chord between two points", "The tangent at the current point meeting the x-axis", "Reflection in y = x"], "a": 2, "e": "The tangent's x-intercept gives the next estimate."}, {"q": "f(x) = x² − 2, x₀ = 1. Find x₁ using Newton–Raphson.", "o": ["1", "2", "1.414", "1.5"], "a": 3, "e": "f(1) = −1, f′(1) = 2, x₁ = 1 + 0.5 = 1.5."}, {"q": "Why might change of sign fail to detect roots?", "o": ["If two roots are close together, there may be no sign change over the interval", "Because f is continuous", "Because roots are integers", "It never fails"], "a": 0, "e": "E.g. a curve dipping below the axis and back within the interval."}, {"q": "Estimate ∫₀¹ eˣ dx using the trapezium rule with 1 strip.", "o": ["1.718", "1.859", "2.718", "1"], "a": 1, "e": "½(e⁰ + e¹) = ½(1 + 2.718) = 1.859 (exact value 1.718)."}, {"q": "How many ordinates are needed for the trapezium rule with 6 strips?", "o": ["6", "5", "7", "12"], "a": 2, "e": "n strips need n + 1 ordinates."}, {"q": "An iteration gives x₁ = 1.5, x₂ = 1.8, x₃ = 2.5, x₄ = 4.1. What is happening?", "o": ["It is converging", "It is periodic", "It has found the root", "It is diverging"], "a": 3, "e": "The values are moving further apart."}, {"q": "A curve is concave on [a, b]. The trapezium rule gives:", "o": ["An underestimate", "An overestimate", "The exact value", "A negative value"], "a": 0, "e": "The chords lie below a concave curve."}, {"q": "f(x) = eˣ − 3, x₀ = 1. Find x₁ using Newton–Raphson to 3 d.p.", "o": ["1.000", "1.104", "1.099", "0.896"], "a": 1, "e": "f(1) = e − 3 = −0.2817, f′(1) = e = 2.7183. x₁ = 1 + 0.1036 = 1.104."}]}, {"id": "p22", "order": 28, "year": 2, "section": "P", "badge": "J", "spec": "J", "title": "Vectors in three dimensions", "desc": "3D vectors using i, j, k, magnitude, distance between points, position vectors, and solving geometric problems in 3D.", "practicals": [], "summary": [{"h": "3D vectors", "fig": "vectors-3d", "cap": "A point in 3D is reached by moving along x, then y, then z. Its position vector is 3i + 4j + 2k and its distance from the origin is √(3² + 4² + 2²) = √29.", "p": ["In 3D, vectors are written **ai + bj + ck** or as a column (a, b, c). k is the unit vector in the z-direction.", "Add, subtract and multiply by scalars component by component, as in 2D.", "`|ai + bj + ck| = √(a² + b² + c²)`", "Distance between (x₁, y₁, z₁) and (x₂, y₂, z₂) = √[(x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²]."], "svg": "<svg role=\"img\" aria-label=\"A point in 3D is reached by moving along x, then y, then z. Its position vector is 3i + 4j + 2k and its distance from the origin is √(3² + 4² + 2²) = √29.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 284\"><defs><marker id=\"f-vectors3d-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-vectors3d-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-vectors3d-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-vectors3d-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"170\" y1=\"200\" x2=\"79.2\" y2=\"257.8\" class=\"ln\" marker-end=\"url(#f-vectors3d-ah)\"/><text x=\"73.2\" y=\"271.8\" class=\"tm\" text-anchor=\"end\" font-size=\"13\">x (i)<\/text><line x1=\"170\" y1=\"200\" x2=\"335\" y2=\"200\" class=\"ln\" marker-end=\"url(#f-vectors3d-ah)\"/><text x=\"343\" y=\"196\" class=\"tm\" font-size=\"13\">y (j)<\/text><line x1=\"170\" y1=\"200\" x2=\"170\" y2=\"35\" class=\"ln\" marker-end=\"url(#f-vectors3d-ah)\"/><text x=\"178\" y=\"31\" class=\"tm\" font-size=\"13\">z (k)<\/text><line x1=\"254\" y1=\"242\" x2=\"254\" y2=\"137\" class=\"lm\"/><line x1=\"104\" y1=\"242\" x2=\"254\" y2=\"242\" class=\"lm\"/><line x1=\"320\" y1=\"200\" x2=\"254\" y2=\"242\" class=\"lm\"/><line x1=\"170\" y1=\"200\" x2=\"254\" y2=\"137\" class=\"ac\" marker-end=\"url(#f-vectors3d-aa)\"/><circle cx=\"254\" cy=\"137\" r=\"4\" class=\"af\"/><text x=\"262\" y=\"131\" class=\"ta\" font-size=\"14\">P(3, 4, 2)<\/text><text x=\"300\" y=\"40\" font-size=\"14\">OP = 3i + 4j + 2k<\/text><text x=\"300\" y=\"60\" class=\"tm\" font-size=\"12\">|OP| = √(3² + 4² + 2²) = √29<\/text><\/svg>"}, {"h": "Geometry with vectors", "p": ["Position vectors: **AB = b − a**.", "Points are **collinear** if AB is a multiple of BC (sharing point B).", "Use vectors to show shapes are parallelograms (opposite sides equal vectors) and to find midpoints.", "The angle a vector makes with an axis: cos θₓ = a/|v| for the x-axis.", "Vectors are also used in mechanics for forces, velocities and accelerations."]}], "pitfalls": ["Include the k component in every magnitude calculation.", "AB = b − a (end minus start).", "A vector parallel to another must have **all** components in the same ratio."], "examples": [{"q": "Find the distance between A(1, 2, 3) and B(4, −2, 15).", "steps": ["AB = 3i − 4j + 12k.", "|AB| = √(9 + 16 + 144) = √169."], "a": "13"}, {"q": "Find the angle between 2i + 3j − k and the positive x-axis.", "steps": ["|v| = √(4 + 9 + 1) = √14.", "cos θ = 2/√14."], "a": "θ ≈ 57.7°"}], "questions": [{"q": "Find (2i − j + 3k) + (i + 4j − k).", "o": ["i + 3j + 2k", "3i + 3j + 2k", "3i + 5j + 4k", "2i − 4j − 3k"], "a": 1, "e": "Add component by component."}, {"q": "Find |2i + 3j + 6k|.", "o": ["7", "11", "49", "√11"], "a": 0, "e": "√(4 + 9 + 36) = √49 = 7."}, {"q": "A = (1, 0, 2), B = (3, 4, 2). Find AB.", "o": ["4i + 4j + 4k", "−2i − 4j", "2i + 4j", "2i + 4j + 2k"], "a": 2, "e": "b − a = (2, 4, 0) = 2i + 4j."}, {"q": "Find the distance between (0, 0, 0) and (1, 2, 2).", "o": ["5", "√5", "9", "3"], "a": 3, "e": "√(1 + 4 + 4) = 3."}, {"q": "Which vector is parallel to i − 2j + 3k?", "o": ["−2i + 4j − 6k", "2i − 4j + 3k", "i + 2j + 3k", "3i − 2j + k"], "a": 0, "e": "−2(i − 2j + 3k)."}, {"q": "Find the unit vector in the direction of 2i − 2j + k.", "o": ["2i − 2j + k", "(2i − 2j + k)/3", "(2i − 2j + k)/9", "(2i − 2j + k)/√5"], "a": 1, "e": "Magnitude = √(4 + 4 + 1) = 3."}, {"q": "OA = 3i + j − 2k and OB = i + 5j + 4k. What is the position vector of the midpoint of AB?", "o": ["4i + 6j + 2k", "−2i + 4j + 6k", "2i + 3j + k", "i + 2j + 3k"], "a": 2, "e": "½(a + b) = ½(4i + 6j + 2k)."}, {"q": "What is the unit vector in the z-direction?", "o": ["i", "j", "z", "k"], "a": 3, "e": "i, j and k are along the x, y and z axes."}, {"q": "AB = 2i + j − k and BC = 6i + 3j − 3k. What can you conclude about A, B, C?", "o": ["They are collinear", "They form a right angle", "AB = BC", "Nothing"], "a": 0, "e": "BC = 3AB, so they are parallel and share point B."}, {"q": "Find the angle between 3i + 4k and the z-axis.", "o": ["53.1°", "36.9°", "90°", "45°"], "a": 1, "e": "|v| = 5, cos θ = 4/5, θ ≈ 36.9°."}, {"q": "Find 2(i − j + k) − (3i + j).", "o": ["−i − 3j", "−i − j + 2k", "−i − 3j + 2k", "5i − j + 2k"], "a": 2, "e": "2i − 2j + 2k − 3i − j = −i − 3j + 2k."}, {"q": "ABCD is a parallelogram. Which must be true?", "o": ["AB = CD", "AB = AC", "AB = BD", "AB = DC"], "a": 3, "e": "Opposite sides are equal and parallel, in the same direction: AB = DC."}, {"q": "Find |−i + 4j − 8k|.", "o": ["9", "√65", "81", "11"], "a": 0, "e": "√(1 + 16 + 64) = √81 = 9."}, {"q": "The vector ai + 2j + 3k has magnitude 7. Find the positive value of a.", "o": ["2", "6", "4", "√20"], "a": 1, "e": "a² + 4 + 9 = 49, so a² = 36."}, {"q": "Find the distance between (2, −1, 3) and (5, 3, 3).", "o": ["7", "25", "5", "√7"], "a": 2, "e": "√(9 + 16 + 0) = 5."}, {"q": "pi + 4j + qk is parallel to 2i + 8j − 6k. Find p and q.", "o": ["p = 2, q = −6", "p = 4, q = 3", "p = 1, q = 3", "p = 1, q = −3"], "a": 3, "e": "Half of 2i + 8j − 6k is i + 4j − 3k."}, {"q": "What is the position vector of the point (3, −1, 5)?", "o": ["3i − j + 5k", "3i + j + 5k", "−3i + j − 5k", "3i − 5k"], "a": 0, "e": "The coordinates become the i, j, k components."}, {"q": "Which formula gives the magnitude of a 3D vector ai + bj + ck?", "o": ["a + b + c", "√(a² + b² + c²)", "a² + b² + c²", "√(a + b + c)"], "a": 1, "e": "Pythagoras in three dimensions."}, {"q": "OA = i + 2j + 3k. M is the midpoint of OA. What is OM?", "o": ["2i + 4j + 6k", "i + 2j + 3k", "0.5i + j + 1.5k", "−i − 2j − 3k"], "a": 2, "e": "OM = ½OA."}, {"q": "Find the angle between 2i + 3j − k and the positive x-axis.", "o": ["74.5°", "36.7°", "105.5°", "57.7°"], "a": 3, "e": "cos θ = 2/√14 ≈ 0.5345, θ ≈ 57.7°."}, {"q": "A force F = 3i − 2j + 6k N. What is its magnitude?", "o": ["7 N", "49 N", "11 N", "√13 N"], "a": 0, "e": "√(9 + 4 + 36) = 7."}, {"q": "Points A(1, 1, 1) and B(3, 5, 7). Which point is on the line AB, beyond B, with AC = 2AB?", "o": ["(4, 9, 13)", "(5, 9, 13)", "(3, 5, 7)", "(6, 10, 14)"], "a": 1, "e": "AB = 2i + 4j + 6k. OC = a + 2AB = (1 + 4, 1 + 8, 1 + 12) = (5, 9, 13)."}]}, {"id": "s5", "order": 29, "year": 2, "section": "S", "badge": "M", "spec": "M", "title": "Conditional probability", "desc": "Conditional probability notation and formula, using Venn diagrams, tree diagrams and two-way tables, testing independence, and modelling with probability.", "practicals": [], "summary": [{"h": "Conditional probability", "p": ["P(A | B) means 'the probability of A **given** that B has happened'.", "`P(A | B) = P(A ∩ B) / P(B)`", "Rearranged: `P(A ∩ B) = P(A | B) × P(B)`.", "From a two-way table, restrict to the row or column for B, then find the proportion that are also A.", "From a Venn diagram, P(A | B) = (region in both A and B) ÷ (total of B)."]}, {"h": "Tree diagrams", "fig": "tree-diagram", "cap": "R = it rains (0.3), L = late. The second branches are conditional probabilities, e.g. P(L | R) = 0.9. Multiply along branches, add the outcomes you want: P(L) = 0.55. Then P(R | L) = P(R ∩ L) ÷ P(L).", "p": ["Second-stage branches are **conditional** probabilities, e.g. P(late | rain).", "To find P(first event | outcome), use P(A | B) = P(A ∩ B)/P(B), adding all paths that give B."], "svg": "<svg role=\"img\" aria-label=\"R = it rains (0.3), L = late. The second branches are conditional probabilities, e.g. P(L | R) = 0.9. Multiply along branches, add the outcomes you want: P(L) = 0.55. Then P(R | L) = P(R ∩ L) ÷ P(L).\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 296\"><defs><marker id=\"f-treediagram-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-treediagram-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-treediagram-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-treediagram-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><circle cx=\"30\" cy=\"140\" r=\"4\" class=\"cf\"/><line x1=\"30\" y1=\"140\" x2=\"170\" y2=\"70\" class=\"ln\"/><line x1=\"30\" y1=\"140\" x2=\"170\" y2=\"210\" class=\"ln\"/><text x=\"95\" y=\"92\" text-anchor=\"end\" font-size=\"13\">0.3<\/text><text x=\"95\" y=\"200\" text-anchor=\"end\" font-size=\"13\">0.7<\/text><text x=\"180\" y=\"75\" font-size=\"15\">R<\/text><text x=\"180\" y=\"215\" font-size=\"15\">R′<\/text><line x1=\"200\" y1=\"70\" x2=\"330\" y2=\"34\" class=\"ac\"/><text x=\"265\" y=\"46\" class=\"ta\" text-anchor=\"middle\" font-size=\"13\">0.9<\/text><text x=\"338\" y=\"39\" font-size=\"15\">L<\/text><line x1=\"200\" y1=\"70\" x2=\"330\" y2=\"106\" class=\"ln\"/><text x=\"265\" y=\"82\" text-anchor=\"middle\" font-size=\"13\">0.1<\/text><text x=\"338\" y=\"111\" font-size=\"15\">L′<\/text><line x1=\"200\" y1=\"210\" x2=\"330\" y2=\"174\" class=\"ac\"/><text x=\"265\" y=\"186\" class=\"ta\" text-anchor=\"middle\" font-size=\"13\">0.4<\/text><text x=\"338\" y=\"179\" font-size=\"15\">L<\/text><line x1=\"200\" y1=\"210\" x2=\"330\" y2=\"246\" class=\"ln\"/><text x=\"265\" y=\"222\" text-anchor=\"middle\" font-size=\"13\">0.6<\/text><text x=\"338\" y=\"251\" font-size=\"15\">L′<\/text><text x=\"380\" y=\"39\" class=\"ta\" font-size=\"13\">0.27<\/text><text x=\"380\" y=\"111\" class=\"tm\" font-size=\"13\">0.03<\/text><text x=\"380\" y=\"179\" class=\"ta\" font-size=\"13\">0.28<\/text><text x=\"380\" y=\"251\" class=\"tm\" font-size=\"13\">0.42<\/text><text x=\"240\" y=\"284\" text-anchor=\"middle\" font-size=\"13\">P(L) = 0.27 + 0.28 = 0.55;  P(R | L) = 0.27 ÷ 0.55 ≈ 0.491<\/text><\/svg>"}, {"h": "Independence", "p": ["A and B are independent if `P(A | B) = P(A)`, or equivalently P(A ∩ B) = P(A) × P(B)."]}, {"h": "Modelling", "p": ["Probability models make assumptions, e.g. equally likely outcomes, independence. Discuss whether these are realistic."]}], "pitfalls": ["P(A | B) is not the same as P(B | A).", "Divide by P(B), the event that is **given**, not P(A).", "In a two-way table, the 'given' restricts you to one row or column total."], "examples": [{"q": "P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.1. Find P(A | B) and P(B | A).", "steps": ["P(A | B) = 0.1/0.4 = 0.25.", "P(B | A) = 0.1/0.5 = 0.2."], "a": "0.25 and 0.2"}, {"q": "It rains on 30% of days. If it rains, P(late) = 0.4; if not, P(late) = 0.1. Given she was late, find P(rain).", "steps": ["P(rain and late) = 0.3 × 0.4 = 0.12.", "P(late) = 0.12 + 0.7 × 0.1 = 0.19.", "P(rain | late) = 0.12/0.19."], "a": "≈ 0.632"}], "questions": [{"q": "What does P(A | B) mean?", "o": ["P(A and B)", "The probability of A given that B has occurred", "The probability of B given A", "P(A or B)"], "a": 1, "e": "The vertical line means 'given'."}, {"q": "What is the formula for P(A | B)?", "o": ["P(A ∩ B)/P(B)", "P(A ∩ B)/P(A)", "P(A) × P(B)", "P(A) + P(B)"], "a": 0, "e": "Divide the joint probability by the probability of the given event."}, {"q": "P(A ∩ B) = 0.12, P(B) = 0.3. Find P(A | B).", "o": ["0.036", "0.42", "0.4", "0.18"], "a": 2, "e": "0.12/0.3 = 0.4."}, {"q": "P(A | B) = 0.6 and P(B) = 0.5. Find P(A ∩ B).", "o": ["1.1", "0.1", "1.2", "0.3"], "a": 3, "e": "P(A ∩ B) = P(A | B) × P(B) = 0.3."}, {"q": "Of 50 students, 20 play football. 8 of the footballers also play tennis. Find P(tennis | football).", "o": ["0.4", "0.16", "0.8", "0.2"], "a": 0, "e": "8 out of the 20 footballers."}, {"q": "In the same group, 15 students play tennis in total. Find P(football | tennis).", "o": ["8/20", "8/15", "15/50", "8/50"], "a": 1, "e": "8 out of the 15 tennis players."}, {"q": "Which condition shows A and B are independent?", "o": ["P(A | B) = P(B)", "P(A | B) = 0", "P(A | B) = P(A)", "P(A | B) = 1"], "a": 2, "e": "Knowing B happened doesn't change the probability of A."}, {"q": "P(A) = 0.4, P(B) = 0.5, P(A ∩ B) = 0.2. Find P(A | B).", "o": ["0.2", "0.5", "0.8", "0.4"], "a": 3, "e": "0.2/0.5 = 0.4, which equals P(A), so A and B are independent."}, {"q": "In a Venn diagram, A only = 0.2, A ∩ B = 0.15, B only = 0.35. Find P(A | B).", "o": ["0.3", "0.15", "0.43", "0.5"], "a": 0, "e": "P(B) = 0.5. P(A | B) = 0.15/0.5 = 0.3."}, {"q": "Using the same Venn diagram, find P(B | A).", "o": ["0.15", "0.43", "0.35", "0.5"], "a": 1, "e": "P(A) = 0.35. P(B | A) = 0.15/0.35 ≈ 0.43."}, {"q": "On a tree diagram, what do the second-stage branches usually show?", "o": ["Joint probabilities", "Unconditional probabilities", "Conditional probabilities given the first outcome", "Cumulative probabilities"], "a": 2, "e": "E.g. P(late | rain)."}, {"q": "P(rain) = 0.3, P(late | rain) = 0.4, P(late | no rain) = 0.1. Find P(late).", "o": ["0.5", "0.12", "0.07", "0.19"], "a": 3, "e": "0.3 × 0.4 + 0.7 × 0.1 = 0.12 + 0.07 = 0.19."}, {"q": "Using the previous question, find P(rain | late) to 3 d.p.", "o": ["0.632", "0.12", "0.4", "0.368"], "a": 0, "e": "0.12/0.19 ≈ 0.632."}, {"q": "Is P(A | B) always equal to P(B | A)?", "o": ["Yes, always", "No, only when P(A) = P(B) (or P(A ∩ B) = 0)", "Only for independent events", "Only for mutually exclusive events"], "a": 1, "e": "They have different denominators: P(B) and P(A)."}, {"q": "A bag has 5 red and 3 blue counters. Two are drawn without replacement. Find P(second red | first red).", "o": ["5/8", "5/7", "4/7", "4/8"], "a": 2, "e": "After a red is removed, 4 red remain out of 7."}, {"q": "P(A | B′) means:", "o": ["P(A and not B)", "P(not A given B)", "P(B given A)", "P(A given that B did not happen)"], "a": 3, "e": "B′ is the complement of B."}, {"q": "P(A) = 0.6, P(B | A) = 0.5, P(B | A′) = 0.25. Find P(B).", "o": ["0.4", "0.75", "0.3", "0.1"], "a": 0, "e": "0.6 × 0.5 + 0.4 × 0.25 = 0.3 + 0.1 = 0.4."}, {"q": "Using the previous question, find P(A | B).", "o": ["0.5", "0.75", "0.3", "0.6"], "a": 1, "e": "P(A ∩ B) = 0.3. P(A | B) = 0.3/0.4 = 0.75."}, {"q": "P(A | B) = 0 for events with non-zero probabilities. What can you say?", "o": ["A and B are independent", "A always happens", "A and B are mutually exclusive", "B never happens"], "a": 2, "e": "If B happens, A can't, so P(A ∩ B) = 0."}, {"q": "A test detects a disease 95% of the time when present. 2% have the disease. 5% of healthy people test positive. Find P(positive).", "o": ["0.95", "0.05", "0.019", "0.068"], "a": 3, "e": "0.02 × 0.95 + 0.98 × 0.05 = 0.019 + 0.049 = 0.068."}, {"q": "Using the previous question, what is P(disease | positive) to 2 d.p.?", "o": ["0.28", "0.95", "0.02", "0.72"], "a": 0, "e": "0.019/0.068 ≈ 0.28. Most positives are false positives when a disease is rare."}, {"q": "What is a common assumption in probability models that might not hold in practice?", "o": ["Probabilities add to 1", "Events are independent", "P(A) ≥ 0", "There are outcomes"], "a": 1, "e": "Real events, like weather on consecutive days, are often linked."}]}, {"id": "s6", "order": 30, "year": 2, "section": "S", "badge": "N", "spec": "N", "title": "The normal distribution", "desc": "Properties of the normal distribution, finding probabilities, the standard normal Z, inverse normal, finding unknown μ or σ, and the normal approximation to the binomial.", "practicals": [], "summary": [{"h": "Properties", "fig": "normal-curve", "cap": "The normal curve is symmetrical about the mean μ. About 68% of values lie within 1 standard deviation of the mean and about 95% within 2. Points of inflection are at μ ± σ.", "p": ["X ~ N(μ, σ²) is a **continuous** distribution: bell-shaped, **symmetric** about the mean μ, with mean = median = mode.", "About **68%** of values lie within 1σ of μ, **95%** within 2σ, and **99.7%** within 3σ.", "Points of inflection are at μ ± σ.", "For continuous distributions, P(X = a) = 0, so P(X < a) = P(X ≤ a)."], "svg": "<svg role=\"img\" aria-label=\"The normal curve is symmetrical about the mean μ. About 68% of values lie within 1 standard deviation of the mean and about 95% within 2. Points of inflection are at μ ± σ.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 260\"><defs><marker id=\"f-normalcurve-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-normalcurve-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-normalcurve-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-normalcurve-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><path d=\"M123.3,230 L123.3,206 L125.3,204.4 L127.2,202.6 L129.2,200.8 L131.1,198.9 L133.1,197 L135,194.9 L136.9,192.8 L138.9,190.5 L140.8,188.2 L142.8,185.8 L144.7,183.3 L146.7,180.7 L148.6,178 L150.6,175.3 L152.5,172.4 L154.4,169.5 L156.4,166.5 L158.3,1 76.8,84.6 L279.4,88.8 L282,93.2 L284.6,97.7 L287.2,102.3 L289.9,107 L292.5,111.7 L295.1,116.5 L297.8,121.4 L300.4,126.2 L303,131 L305.6,135.8 L308.3,140.6 L310.9,145.2 L313.5,149.8 L316.1,154.3 L318.8,158.7 L321.4,163 L324,167.1 L326.6,171.1 L329.3,175 L331.9,178.7 L334.5,182.3 L337.1,185.7 L339.8,188.9 L342.4,192 L345,194.9 L347.6,197.7 L350.2,200.3 L352.9,202.7 L355.5,205 L358.1,207.2 L360.8,209.2 L363.4,211.1 L366,212.8 L368.6,214.4 L371.2,215.9 L373.9,217.3 L376.5,218.5 L379.1,219.7 L381.8,220.7 L384.4,221.7 L387,222.6 L389.6,223.4 L392.2,224.1 L394.9,224.8 L397.5,225.4 L400.1,225.9 L402.8,226.4 L405.4,226.8 L408,227.2 L410.6,227.5 L413.2,227.8 L415.9,228.1 L418.5,228.4 L421.1,228.6 L423.8,228.8 L426.4,228.9 L429,229.1 L431.6,229.2 L434.2,229.3 L436.9,229.4 L439.5,229.5 L442.1,229.6 L444.8,229.6 L447.4,229.7 L450,229.7\" class=\"ln\"/><text x=\"123.3\" y=\"250\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">μ − 2σ<\/text><text x=\"181.7\" y=\"250\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">μ − σ<\/text><text x=\"240\" y=\"250\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">μ<\/text><text x=\"298.3\" y=\"250\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">μ + σ<\/text><text x=\"356.7\" y=\"250\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">μ + 2σ<\/text><text x=\"240\" y=\"154.4\" class=\"ta\" text-anchor=\"middle\" font-size=\"15\">68%<\/text><text x=\"88.3\" y=\"141.1\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">95% between<\/text><text x=\"88.3\" y=\"157.1\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">μ − 2σ and μ + 2σ<\/text><line x1=\"240\" y1=\"230\" x2=\"240\" y2=\"52.7\" class=\"lm\"/><\/svg>"}, {"h": "Calculating probabilities", "p": ["Use your calculator's **normal cdf** with lower bound, upper bound, μ and σ (not σ²).", "**Standard normal**: Z ~ N(0, 1). `Z = (X − μ)/σ`.", "**Inverse normal**: find the value with a given probability below it.", "To find an unknown μ or σ: write the probability using Z, find the z-value with inverse normal, then solve `(x − μ)/σ = z`."]}, {"h": "Normal approximation to the binomial", "p": ["If X ~ B(n, p) with **n large** and **p close to 0.5**, then X ≈ N(np, np(1 − p)).", "Use a **continuity correction**: P(X ≤ 45) becomes P(Y < 45.5); P(X < 45) becomes P(Y < 44.5).", "Judge whether a normal model is suitable from the shape of the data, e.g. a histogram that is roughly symmetric and bell-shaped."]}], "pitfalls": ["Enter **σ**, not σ², into your calculator.", "Use a continuity correction when approximating a **discrete** distribution with the normal.", "Sketch the curve and shade the region to check your answer is sensible."], "examples": [{"q": "X ~ N(50, 4²). Find P(45 < X < 55).", "steps": ["Normal cdf with lower 45, upper 55, μ = 50, σ = 4."], "a": "0.7887"}, {"q": "X ~ N(μ, 3²) and P(X < 20) = 0.8. Find μ.", "steps": ["P(Z < (20 − μ)/3) = 0.8.", "Inverse normal: z = 0.8416.", "(20 − μ)/3 = 0.8416, so μ = 20 − 2.525."], "a": "μ ≈ 17.48"}], "questions": [{"q": "Which is a property of the normal distribution?", "o": ["It is skewed", "It is symmetric about the mean", "The mean is larger than the median", "It is discrete"], "a": 1, "e": "Mean = median = mode, and the curve is bell-shaped."}, {"q": "Approximately what percentage of a normal distribution lies within 2 standard deviations of the mean?", "o": ["95%", "68%", "99.7%", "50%"], "a": 0, "e": "The 68–95–99.7 rule."}, {"q": "X ~ N(50, 4²). Find P(X < 55) to 4 d.p.", "o": ["0.1056", "0.7887", "0.8944", "0.9772"], "a": 2, "e": "Using the normal cdf: 0.8944."}, {"q": "X ~ N(50, 16). Find P(X > 58) to 4 d.p.", "o": ["0.9772", "0.1587", "0.0456", "0.0228"], "a": 3, "e": "58 is 2σ above the mean (σ = 4). P = 0.0228."}, {"q": "X ~ N(50, 16). What value of σ should you enter into your calculator?", "o": ["4", "16", "256", "8"], "a": 0, "e": "The second parameter is the variance σ² = 16, so σ = 4."}, {"q": "For a continuous distribution, what is P(X = 30)?", "o": ["It depends on μ", "0", "1", "0.5"], "a": 1, "e": "A single point has zero width, so zero probability."}, {"q": "What is the standard normal distribution?", "o": ["N(1, 0)", "N(0, 0)", "N(0, 1)", "N(1, 1)"], "a": 2, "e": "Z ~ N(0, 1), with mean 0 and standard deviation 1."}, {"q": "X ~ N(100, 15²). Find the z-value for x = 130.", "o": ["1", "30", "0.5", "2"], "a": 3, "e": "z = (130 − 100)/15 = 2."}, {"q": "Find P(Z < 1.5) to 4 d.p.", "o": ["0.9332", "0.0668", "0.8664", "0.5"], "a": 0, "e": "From the standard normal cdf."}, {"q": "Find a such that P(Z < a) = 0.95.", "o": ["1.96", "1.6449", "1.2816", "0.95"], "a": 1, "e": "Inverse normal of 0.95 gives 1.6449."}, {"q": "Find a such that P(−a < Z < a) = 0.95.", "o": ["1.6449", "2.5758", "1.96", "1.2816"], "a": 2, "e": "Each tail is 0.025, so P(Z < a) = 0.975, giving a = 1.96."}, {"q": "X ~ N(μ, 3²) and P(X < 20) = 0.8. Find μ to 2 d.p.", "o": ["22.52", "20.84", "17.60", "17.48"], "a": 3, "e": "(20 − μ)/3 = 0.8416, so μ = 20 − 2.52 = 17.48."}, {"q": "X ~ N(30, σ²) and P(X > 36) = 0.1. Find σ to 3 s.f.", "o": ["4.68", "6.00", "2.34", "7.69"], "a": 0, "e": "(36 − 30)/σ = 1.2816, so σ = 6/1.2816 ≈ 4.68."}, {"q": "When can B(n, p) be approximated by a normal distribution?", "o": ["When n is small", "When n is large and p is close to 0.5", "When p is close to 0 or 1", "Always"], "a": 1, "e": "Then the binomial is roughly symmetric and bell-shaped."}, {"q": "X ~ B(100, 0.4). Which normal distribution approximates it?", "o": ["N(40, 40)", "N(100, 0.4)", "N(40, 24)", "N(40, 0.24)"], "a": 2, "e": "μ = np = 40, σ² = np(1 − p) = 24."}, {"q": "Using a continuity correction, P(X ≤ 45) for binomial X becomes what for normal Y?", "o": ["P(Y < 44.5)", "P(Y < 45)", "P(Y > 45.5)", "P(Y < 45.5)"], "a": 3, "e": "X ≤ 45 includes 45, so extend half a unit to 45.5."}, {"q": "Using a continuity correction, P(X > 20) for binomial X becomes:", "o": ["P(Y > 20.5)", "P(Y > 19.5)", "P(Y > 20)", "P(Y < 20.5)"], "a": 0, "e": "X > 20 means X ≥ 21, which starts at 20.5."}, {"q": "Why is a continuity correction needed?", "o": ["Because the normal is skewed", "Because a discrete distribution is being approximated by a continuous one", "To make the mean larger", "Because σ is unknown"], "a": 1, "e": "Each whole number is represented by an interval of width 1."}, {"q": "X ~ N(50, 4²). Find P(45 < X < 55) to 4 d.p.", "o": ["0.8944", "0.6827", "0.7887", "0.9545"], "a": 2, "e": "Normal cdf between 45 and 55: 0.7887."}, {"q": "Where are the points of inflection on a normal curve?", "o": ["At μ", "At μ ± 2σ", "At μ ± 3σ", "At μ ± σ"], "a": 3, "e": "The curve changes from concave to convex one standard deviation from the mean."}, {"q": "Find P(Z > −0.8) to 4 d.p.", "o": ["0.7881", "0.2119", "0.5", "0.8"], "a": 0, "e": "By symmetry, P(Z > −0.8) = P(Z < 0.8) = 0.7881."}, {"q": "A data set has a histogram that is strongly skewed to the right. Is a normal model suitable?", "o": ["Yes, always", "No, because the normal distribution is symmetric", "Yes, if the mean is positive", "Only for large samples"], "a": 1, "e": "A normal model needs a roughly symmetric, bell-shaped distribution."}]}, {"id": "s7", "order": 31, "year": 2, "section": "S", "badge": "O", "spec": "L, O", "title": "Correlation and hypothesis testing", "desc": "The product moment correlation coefficient, testing for correlation, the distribution of the sample mean, and testing a normal mean.", "practicals": [], "summary": [{"h": "Correlation", "fig": "correlation", "cap": "The product moment correlation coefficient r measures how close the points are to a straight line: near +1 or −1 is strong linear correlation, near 0 is none. Test H₀: ρ = 0 against the critical value for your sample size.", "p": ["The **product moment correlation coefficient (PMCC)**, r, measures the strength of **linear** correlation: −1 ≤ r ≤ 1.", "r close to 1: strong positive. Close to −1: strong negative. Close to 0: little or no linear correlation.", "Calculate r using a calculator's statistics mode."], "svg": "<svg role=\"img\" aria-label=\"The product moment correlation coefficient r measures how close the points are to a straight line: near +1 or −1 is strong linear correlation, near 0 is none. Test H₀: ρ = 0 against the critical value for your sample size.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 224\"><defs><marker id=\"f-correlation-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-correlation-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-correlation-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-correlation-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"14\" y1=\"166\" x2=\"150\" y2=\"166\" class=\"ln\"/><line x1=\"14\" y1=\"166\" x2=\"14\" y2=\"30\" class=\"ln\"/><text x=\"82\" y=\"20\" text-anchor=\"middle\" font-size=\"13\">positive<\/text><circle cx=\"60.4\" cy=\"102.6\" r=\"3.2\" class=\"af\"/><circle cx=\"29.7\" cy=\"122.2\" r=\"3.2\" class=\"af\"/><circle cx=\"86.4\" cy=\"97.9\" r=\"3.2\" class=\"af\"/><circle cx=\"82.9\" cy=\"93.4\" r=\"3.2\" class=\"af\"/><circle cx=\"25.4\" cy=\"148.5\" r=\"3.2\" class=\"af\"/><circle cx=\"31.9\" cy=\"135.8\" r=\"3.2\" class=\"af\"/><circle cx=\"72.8\" cy=\"101.8\" r=\"3.2\" class=\"af\"/><circle cx=\"48.1\" cy=\"131.9\" r=\"3.2\" class=\"af\"/><circle cx=\"97.6\" cy=\"66.9\" r=\"3.2\" class=\"af\"/><circle cx=\"69.4\" cy=\"114.5\" r=\"3.2\" class=\"af\"/><circle cx=\"140.3\" cy=\"34.1\" r=\"3.2\" class=\"af\"/><circle cx=\"56.2\" cy=\"110.1\" r=\"3.2\" class=\"af\"/><circle cx=\"38.5\" cy=\"123.3\" r=\"3.2\" class=\"af\"/><circle cx=\"120.7\" cy=\"58.4\" r=\"3.2\" class=\"af\"/><circle cx=\"42.9\" cy=\"147.9\" r=\"3.2\" class=\"af\"/><circle cx=\"66.4\" cy=\"121\" r=\"3.2\" class=\"af\"/><circle cx=\"87.8\" cy=\"88.5\" r=\"3.2\" class=\"af\"/><circle cx=\"46\" cy=\"124.8\" r=\"3.2\" class=\"af\"/><circle cx=\"104.1\" cy=\"92\" r=\"3.2\" class=\"af\"/><circle cx=\"92.5\" cy=\"83.9\" r=\"3.2\" class=\"af\"/><circle cx=\"76.3\" cy=\"110.8\" r=\"3.2\" class=\"af\"/><circle cx=\"106.4\" cy=\"53.2\" r=\"3.2\" class=\"af\"/><text x=\"82\" y=\"190\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">r close to +1<\/text><line x1=\"170\" y1=\"166\" x2=\"306\" y2=\"166\" class=\"ln\"/><line x1=\"170\" y1=\"166\" x2=\"170\" y2=\"30\" class=\"ln\"/><text x=\"238\" y=\"20\" text-anchor=\"middle\" font-size=\"13\">negative<\/text><circle cx=\"206.7\" cy=\"89.2\" r=\"3.2\" class=\"af\"/><circle cx=\"283.9\" cy=\"143\" r=\"3.2\" class=\"af\"/><circle cx=\"266.1\" cy=\"130.4\" r=\"3.2\" class=\"af\"/><circle cx=\"191.3\" cy=\"34.1\" r=\"3.2\" class=\"af\"/><circle cx=\"228\" cy=\"89.6\" r=\"3.2\" class=\"af\"/><circle cx=\"236.6\" cy=\"105.5\" r=\"3.2\" class=\"af\"/><circle cx=\"181.6\" cy=\"65.4\" r=\"3.2\" class=\"af\"/><circle cx=\"246.9\" cy=\"127.3\" r=\"3.2\" class=\"af\"/><circle cx=\"284\" cy=\"143.8\" r=\"3.2\" class=\"af\"/><circle cx=\"249.6\" cy=\"86\" r=\"3.2\" class=\"af\"/><circle cx=\"247.8\" cy=\"133.4\" r=\"3.2\" class=\"af\"/><circle cx=\"292.4\" cy=\"133.8\" r=\"3.2\" class=\"af\"/><circle cx=\"234.8\" cy=\"98.2\" r=\"3.2\" class=\"af\"/><circle cx=\"262.7\" cy=\"122.3\" r=\"3.2\" class=\"af\"/><circle cx=\"256\" cy=\"84.6\" r=\"3.2\" class=\"af\"/><circle cx=\"211.6\" cy=\"78.1\" r=\"3.2\" class=\"af\"/><circle cx=\"224\" cy=\"88.4\" r=\"3.2\" class=\"af\"/><circle cx=\"233.3\" cy=\"97\" r=\"3.2\" class=\"af\"/><circle cx=\"197.4\" cy=\"61.6\" r=\"3.2\" class=\"af\"/><circle cx=\"270.8\" cy=\"120.8\" r=\"3.2\" class=\"af\"/><circle cx=\"192.6\" cy=\"61.5\" r=\"3.2\" class=\"af\"/><circle cx=\"283.5\" cy=\"119.5\" r=\"3.2\" class=\"af\"/><text x=\"238\" y=\"190\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">r close to −1<\/text><line x1=\"326\" y1=\"166\" x2=\"462\" y2=\"166\" class=\"ln\"/><line x1=\"326\" y1=\"166\" x2=\"326\" y2=\"30\" class=\"ln\"/><text x=\"394\" y=\"20\" text-anchor=\"middle\" font-size=\"13\">none<\/text><circle cx=\"342.7\" cy=\"104.2\" r=\"3.2\" class=\"af\"/><circle cx=\"400.1\" cy=\"51.1\" r=\"3.2\" class=\"af\"/><circle cx=\"433.1\" cy=\"53.4\" r=\"3.2\" class=\"af\"/><circle cx=\"366.9\" cy=\"108.4\" r=\"3.2\" class=\"af\"/><circle cx=\"376.7\" cy=\"51\" r=\"3.2\" class=\"af\"/><circle cx=\"450\" cy=\"140.7\" r=\"3.2\" class=\"af\"/><circle cx=\"354.4\" cy=\"130.8\" r=\"3.2\" class=\"af\"/><circle cx=\"361.4\" cy=\"99.8\" r=\"3.2\" class=\"af\"/><circle cx=\"404.9\" cy=\"127\" r=\"3.2\" class=\"af\"/><circle cx=\"333.3\" cy=\"107.9\" r=\"3.2\" class=\"af\"/><circle cx=\"378\" cy=\"89.9\" r=\"3.2\" class=\"af\"/><circle cx=\"449.5\" cy=\"74.7\" r=\"3.2\" class=\"af\"/><circle cx=\"395.9\" cy=\"83.6\" r=\"3.2\" class=\"af\"/><circle cx=\"415.6\" cy=\"152.6\" r=\"3.2\" class=\"af\"/><circle cx=\"442.9\" cy=\"63.7\" r=\"3.2\" class=\"af\"/><circle cx=\"439.8\" cy=\"61.5\" r=\"3.2\" class=\"af\"/><circle cx=\"380.8\" cy=\"110.4\" r=\"3.2\" class=\"af\"/><circle cx=\"345.5\" cy=\"81.6\" r=\"3.2\" class=\"af\"/><circle cx=\"340.4\" cy=\"151\" r=\"3.2\" class=\"af\"/><circle cx=\"358.4\" cy=\"139.3\" r=\"3.2\" class=\"af\"/><circle cx=\"374.4\" cy=\"152.8\" r=\"3.2\" class=\"af\"/><circle cx=\"332.8\" cy=\"140.7\" r=\"3.2\" class=\"af\"/><text x=\"394\" y=\"190\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">r close to 0<\/text><text x=\"240\" y=\"214\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">correlation doesn't prove causation<\/text><\/svg>"}, {"h": "Testing for correlation", "p": ["Hypotheses use **ρ** (rho), the population correlation coefficient: H₀: ρ = 0.", "H₁: ρ > 0 or ρ < 0 (one-tailed), or ρ ≠ 0 (two-tailed).", "Compare the sample r with the **critical value** from tables for the sample size n and significance level.", "If |r| is greater than the critical value (in the direction of H₁), **reject H₀**."]}, {"h": "Distribution of the sample mean", "p": ["If X ~ N(μ, σ²), the mean of a random sample of size n has `X̄ ~ N(μ, σ²/n)`.", "The standard deviation of X̄ is **σ/√n** (smaller for larger samples)."]}, {"h": "Testing a normal mean", "p": ["H₀: μ = μ₀. H₁: μ > μ₀, μ < μ₀ or μ ≠ μ₀.", "Under H₀, X̄ ~ N(μ₀, σ²/n). Find P(X̄ ≥ x̄) (or ≤) and compare with the significance level. Or use `z = (x̄ − μ₀)/(σ/√n)` and compare with the critical z-value.", "Conclude in context, without claiming proof."]}], "pitfalls": ["PMCC tests use **ρ** in hypotheses, not r.", "For X̄, divide the **variance** by n (or the standard deviation by √n).", "A significant correlation doesn't prove causation."], "examples": [{"q": "A sample of 10 pairs gives r = 0.72. Test at the 5% level for positive correlation (critical value 0.5494).", "steps": ["H₀: ρ = 0. H₁: ρ > 0.", "0.72 > 0.5494, so the result is significant."], "a": "Reject H₀: there is evidence of positive correlation."}, {"q": "X ~ N(μ, 10²). A sample of 25 has mean 84. Test H₀: μ = 80 against H₁: μ > 80 at 5%.", "steps": ["Under H₀, X̄ ~ N(80, 10²/25) = N(80, 2²).", "P(X̄ ≥ 84) = 0.0228.", "0.0228 < 0.05, so reject H₀."], "a": "There is evidence at the 5% level that the mean is greater than 80."}], "questions": [{"q": "What is the range of possible values of the PMCC?", "o": ["0 to 1", "−1 to 1", "−∞ to ∞", "0 to 100"], "a": 1, "e": "r = 1 or −1 means perfect linear correlation."}, {"q": "A PMCC of −0.92 indicates:", "o": ["Strong negative linear correlation", "Weak negative correlation", "No correlation", "Strong positive correlation"], "a": 0, "e": "Close to −1 means strong negative."}, {"q": "What symbol is used for the population correlation coefficient in hypotheses?", "o": ["r", "μ", "ρ", "σ"], "a": 2, "e": "ρ (rho) is the population parameter; r is the sample statistic."}, {"q": "What is the null hypothesis in a test for correlation?", "o": ["ρ = 1", "r = 0", "ρ > 0", "ρ = 0"], "a": 3, "e": "H₀ assumes no correlation in the population."}, {"q": "r = 0.45, n = 12, critical value for ρ > 0 at 5% is 0.4973. Conclusion?", "o": ["Do not reject H₀: insufficient evidence of positive correlation", "Reject H₀", "There is negative correlation", "Prove ρ = 0"], "a": 0, "e": "0.45 < 0.4973, so not significant."}, {"q": "A test for correlation is two-tailed. What is H₁?", "o": ["ρ > 0", "ρ ≠ 0", "ρ < 0", "r ≠ 0"], "a": 1, "e": "Testing for correlation of either sign."}, {"q": "X ~ N(μ, σ²). What is the distribution of the sample mean of n observations?", "o": ["N(μ, σ²)", "N(μ/n, σ²)", "N(μ, σ²/n)", "N(nμ, nσ²)"], "a": 2, "e": "The mean is unchanged; the variance is divided by n."}, {"q": "X ~ N(80, 10²). What is the standard deviation of the mean of 25 observations?", "o": ["10", "0.4", "4", "2"], "a": 3, "e": "σ/√n = 10/5 = 2."}, {"q": "Why does the sample mean have a smaller spread than individual values?", "o": ["Averaging reduces variability: extreme values tend to cancel out", "Samples are always biased", "The mean is always smaller", "It doesn't"], "a": 0, "e": "Var(X̄) = σ²/n decreases as n increases."}, {"q": "H₀: μ = 80, H₁: μ > 80, σ = 10, n = 25, x̄ = 84. P(X̄ ≥ 84) = 0.0228. Conclusion at 5%?", "o": ["Do not reject H₀", "Reject H₀: evidence that μ > 80", "Accept H₀", "The test is invalid"], "a": 1, "e": "0.0228 < 0.05."}, {"q": "H₀: μ = 100, H₁: μ < 100, σ = 12, n = 16, x̄ = 95.2. P(X̄ ≤ 95.2) = 0.0548. Conclusion at 5%?", "o": ["Reject H₀", "Accept H₁", "Do not reject H₀: insufficient evidence that μ < 100", "μ = 95.2"], "a": 2, "e": "0.0548 > 0.05, so not significant."}, {"q": "What is the test statistic z for testing a normal mean?", "o": ["(x̄ − μ₀)/σ", "(x̄ − μ₀) × √n", "x̄/σ", "(x̄ − μ₀)/(σ/√n)"], "a": 3, "e": "Standardise using the standard deviation of X̄."}, {"q": "For a one-tailed test (upper) at 5%, what is the critical z-value?", "o": ["1.6449", "1.96", "2.3263", "1.2816"], "a": 0, "e": "P(Z > 1.6449) = 0.05."}, {"q": "For a two-tailed test at 5%, what are the critical z-values?", "o": ["±1.6449", "±1.96", "±2.5758", "±1.2816"], "a": 1, "e": "2.5% in each tail."}, {"q": "Two variables have a significant positive correlation. What can you conclude?", "o": ["One causes the other", "The relationship is non-linear", "There is evidence of a linear association, but not necessarily causation", "They are independent"], "a": 2, "e": "Correlation doesn't imply causation."}, {"q": "A sample of 8 gives r = −0.81. Critical value for ρ < 0 at 1% is 0.7887. Conclusion?", "o": ["Not significant", "Positive correlation", "Test invalid", "Reject H₀: evidence of negative correlation at 1%"], "a": 3, "e": "|−0.81| = 0.81 > 0.7887 and r is negative, matching H₁."}, {"q": "Why does the PMCC only measure linear correlation?", "o": ["It measures how closely the points fit a straight line; a strong curved relationship can have r near 0", "It only works for positive data", "It ignores outliers", "It uses medians"], "a": 0, "e": "Always check a scatter diagram too."}, {"q": "z = 2.1 in an upper-tailed test of a mean at the 5% level. Conclusion?", "o": ["Do not reject H₀", "Reject H₀, since 2.1 > 1.6449", "Accept H₀", "Reject H₀ only at 10%"], "a": 1, "e": "The test statistic is in the critical region."}, {"q": "X ~ N(μ, 4²). A sample of 64 values is taken. What is Var(X̄)?", "o": ["16", "0.5", "0.25", "4"], "a": 2, "e": "σ²/n = 16/64 = 0.25."}, {"q": "Which hypothesis is correct for 'the mean weight has decreased from 500 g'?", "o": ["H₀: μ < 500", "H₁: μ > 500", "H₁: μ ≠ 500", "H₁: μ < 500"], "a": 3, "e": "H₀: μ = 500 and H₁: μ < 500."}, {"q": "What is assumed about the population when testing a mean using X̄ ~ N(μ, σ²/n)?", "o": ["The population is normally distributed with known σ", "The sample is biased", "n = 1", "σ = μ"], "a": 0, "e": "At A-level, the population is normal with a known standard deviation."}, {"q": "Increasing the sample size in a test for a mean makes it:", "o": ["Less sensitive", "More likely to detect a real difference, because σ/√n is smaller", "Impossible to reject H₀", "Two-tailed"], "a": 1, "e": "A smaller standard error means smaller differences become significant."}]}, {"id": "m3", "order": 32, "year": 2, "section": "M", "badge": "Q", "spec": "Q", "title": "Projectiles", "desc": "Modelling projectile motion by resolving velocity, time of flight, maximum height, range, and the equation of the trajectory.", "practicals": [], "summary": [{"h": "Modelling assumptions", "p": ["The projectile is a **particle**, there is **no air resistance**, and the only force is **gravity** (acceleration g downwards).", "Horizontal and vertical motion are treated **separately**, linked by **time**."]}, {"h": "Resolving the initial velocity", "fig": "projectile", "cap": "Split U into U cos θ (horizontal, constant: no acceleration) and U sin θ (vertical, acceleration g downwards). At maximum height the vertical velocity is 0; at the end of the range the vertical displacement is 0.", "p": ["A projectile launched at speed U at angle θ above the horizontal has components: horizontal `U cos θ`, vertical `U sin θ`.", "**Horizontal**: constant velocity, so `x = (U cos θ)t`.", "**Vertical**: constant acceleration −g, so use suvat: `y = (U sin θ)t − ½gt²` and `v_y = U sin θ − gt`."], "svg": "<svg role=\"img\" aria-label=\"Split U into U cos θ (horizontal, constant: no acceleration) and U sin θ (vertical, acceleration g downwards). At maximum height the vertical velocity is 0; at the end of the range the vertical displacement is 0.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 300\"><defs><marker id=\"f-projectile-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" or
