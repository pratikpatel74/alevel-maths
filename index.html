s always weak", "It uses the mean", "The relationship may not continue outside the range of the data"], "a": 3, "e": "We have no evidence about the relationship beyond the data collected."}, {"q": "Ice cream sales and drowning numbers are positively correlated. What is the most sensible conclusion?", "o": ["A third factor, such as hot weather, may affect both", "Ice cream causes drowning", "Drowning causes ice cream sales", "The data are wrong"], "a": 0, "e": "Correlation does not imply causation."}, {"q": "Find the median of 4, 9, 2, 7, 5, 11.", "o": ["7", "6", "5", "5.5"], "a": 1, "e": "Ordered: 2, 4, 5, 7, 9, 11. Median = (5 + 7)/2 = 6."}, {"q": "A value is more than 2 standard deviations above the mean. What might it be considered?", "o": ["The median", "The mode", "An outlier", "The upper quartile"], "a": 2, "e": "A common rule is that values beyond mean ± 2σ are outliers."}, {"q": "What is a sampling frame?", "o": ["The sample size", "A diagram", "The sampling method", "A list of all members of the population that can be sampled"], "a": 3, "e": "Simple random and systematic sampling need a sampling frame."}, {"q": "Which measure of location is least affected by outliers?", "o": ["Median", "Mean", "Range", "Standard deviation"], "a": 0, "e": "The median depends only on the middle values."}]}, {"id": "s2", "order": 12, "year": 1, "section": "S", "badge": "M", "spec": "M", "title": "Probability", "desc": "Mutually exclusive and independent events, Venn diagrams, tree diagrams, two-way tables and the addition rule.", "practicals": [], "summary": [{"h": "Basic rules", "p": ["Probabilities lie between 0 and 1. P(A′) = 1 − P(A), where A′ is 'not A'.", "`P(A ∪ B) = P(A) + P(B) − P(A ∩ B)` (addition rule).", "∪ means 'or' (union). ∩ means 'and' (intersection)."]}, {"h": "Mutually exclusive and independent events", "p": ["**Mutually exclusive**: A and B can't both happen. `P(A ∩ B) = 0`, so `P(A ∪ B) = P(A) + P(B)`.", "**Independent**: one event doesn't affect the other. `P(A ∩ B) = P(A) × P(B)`.", "To **test** for independence, check whether P(A) × P(B) equals P(A ∩ B)."]}, {"h": "Diagrams", "p": ["**Venn diagrams** show overlapping events. Fill in the intersection first, then work outwards. All regions add to 1.", "**Tree diagrams**: multiply along branches for 'and', add the end results for 'or'.", "**Without replacement**, probabilities on later branches change.", "**Two-way tables** show counts for two categories. Use totals to find probabilities."]}], "pitfalls": ["Don't add probabilities of events that can overlap without subtracting the intersection.", "Mutually exclusive and independent are **different** ideas. Mutually exclusive events (with non-zero probabilities) can't be independent.", "On a tree diagram, each set of branches from one point must sum to 1."], "examples": [{"q": "P(A) = 0.4, P(B) = 0.5 and P(A ∪ B) = 0.7. Are A and B independent?", "steps": ["P(A ∩ B) = 0.4 + 0.5 − 0.7 = 0.2.", "P(A) × P(B) = 0.4 × 0.5 = 0.2.", "These are equal."], "a": "Yes, A and B are independent."}, {"q": "A bag has 3 red and 2 blue balls. Two are taken without replacement. Find P(both red).", "steps": ["P(first red) = 3/5.", "P(second red | first red) = 2/4.", "Multiply: 3/5 × 2/4 = 6/20."], "a": "3/10"}], "questions": [{"q": "P(A) = 0.35. What is P(A′)?", "o": ["0.35", "0.65", "0.30", "1.35"], "a": 1, "e": "P(A′) = 1 − 0.35 = 0.65."}, {"q": "A and B are mutually exclusive, with P(A) = 0.2 and P(B) = 0.5. What is P(A ∪ B)?", "o": ["0.7", "0.1", "0.6", "0.3"], "a": 0, "e": "Add, since they can't both happen."}, {"q": "A and B are independent, with P(A) = 0.3 and P(B) = 0.6. What is P(A ∩ B)?", "o": ["0.9", "0.3", "0.18", "0.5"], "a": 2, "e": "Multiply: 0.3 × 0.6 = 0.18."}, {"q": "P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.1. Find P(A ∪ B).", "o": ["0.9", "1.0", "0.2", "0.8"], "a": 3, "e": "0.5 + 0.4 − 0.1 = 0.8."}, {"q": "For mutually exclusive events A and B, what is P(A ∩ B)?", "o": ["0", "1", "P(A) × P(B)", "P(A) + P(B)"], "a": 0, "e": "They can't both happen."}, {"q": "Which condition shows A and B are independent?", "o": ["P(A ∩ B) = 0", "P(A ∩ B) = P(A) × P(B)", "P(A) + P(B) = 1", "P(A ∪ B) = 1"], "a": 1, "e": "This is the definition of independence."}, {"q": "A fair die is rolled twice. What is the probability of two sixes?", "o": ["1/6", "1/12", "1/36", "2/6"], "a": 2, "e": "Independent rolls: 1/6 × 1/6 = 1/36."}, {"q": "A coin is tossed 3 times. What is the probability of at least one head?", "o": ["1/2", "3/8", "1/8", "7/8"], "a": 3, "e": "1 − P(no heads) = 1 − 1/8 = 7/8."}, {"q": "A bag has 4 red and 6 green sweets. Two are taken without replacement. What is P(both green)?", "o": ["1/3", "9/25", "3/5", "2/5"], "a": 0, "e": "6/10 × 5/9 = 30/90 = 1/3."}, {"q": "On a tree diagram, how do you find P(A and then B)?", "o": ["Add along the branches", "Multiply along the branches", "Subtract", "Divide"], "a": 1, "e": "Multiply along a path for 'and'."}, {"q": "In a Venn diagram, P(A only) = 0.3, P(A ∩ B) = 0.2 and P(B only) = 0.25. What is P(neither)?", "o": ["0.75", "0.5", "0.25", "0.2"], "a": 2, "e": "1 − (0.3 + 0.2 + 0.25) = 0.25."}, {"q": "From the previous question, what is P(B)?", "o": ["0.25", "0.2", "0.5", "0.45"], "a": 3, "e": "P(B) = B only + intersection = 0.25 + 0.2 = 0.45."}, {"q": "In a class of 30, 18 study French, 12 study Spanish and 5 study both. How many study neither?", "o": ["5", "0", "25", "10"], "a": 0, "e": "French or Spanish = 18 + 12 − 5 = 25. Neither = 30 − 25 = 5."}, {"q": "P(A) = 0.6, P(B) = 0.5, P(A ∩ B) = 0.3. Are A and B independent?", "o": ["No", "Yes, because 0.6 × 0.5 = 0.3", "No, because they overlap", "Cannot tell"], "a": 1, "e": "P(A) × P(B) = 0.3 = P(A ∩ B)."}, {"q": "Can two events with non-zero probabilities be both mutually exclusive and independent?", "o": ["Yes, always", "Only if P(A) = P(B)", "No, because P(A ∩ B) = 0 but P(A) × P(B) > 0", "Only for dice"], "a": 2, "e": "If one happens, the other definitely can't, so they affect each other."}, {"q": "On a tree diagram, what must the probabilities on branches from a single point add up to?", "o": ["0", "It depends", "0.5", "1"], "a": 3, "e": "One of the outcomes must happen."}, {"q": "Two-way table: 40 of 100 students are left-handed; 15 of these wear glasses. What is P(left-handed and glasses)?", "o": ["0.15", "0.375", "0.4", "0.55"], "a": 0, "e": "15 out of 100 students."}, {"q": "What does A ∪ B mean?", "o": ["A and B", "A or B (or both)", "Not A", "A given B"], "a": 1, "e": "Union means at least one of the events happens."}, {"q": "A spinner gives red with probability 0.3. It is spun twice. What is P(exactly one red)?", "o": ["0.09", "0.21", "0.42", "0.6"], "a": 2, "e": "P(RN) + P(NR) = 0.3 × 0.7 + 0.7 × 0.3 = 0.42."}, {"q": "What does A ∩ B′ mean?", "o": ["Neither A nor B", "A or B", "B but not A", "A but not B"], "a": 3, "e": "In A and not in B."}, {"q": "A card is drawn from a standard pack. What is P(red or a king)?", "o": ["28/52", "30/52", "26/52", "2/52"], "a": 0, "e": "26 + 4 − 2 = 28 cards (two red kings counted once)."}, {"q": "P(A) = 0.7. P(B) = 0.6. What is the smallest possible value of P(A ∩ B)?", "o": ["0", "0.3", "0.42", "0.1"], "a": 1, "e": "P(A ∪ B) ≤ 1, so P(A ∩ B) ≥ 0.7 + 0.6 − 1 = 0.3."}]}, {"id": "s3", "order": 13, "year": 1, "section": "S", "badge": "N", "spec": "N", "title": "The binomial distribution", "desc": "Discrete random variables, conditions for a binomial model, calculating binomial probabilities, cumulative probabilities, and the mean and variance.", "practicals": [], "summary": [{"h": "Discrete random variables", "p": ["A **discrete random variable** X takes separate values, each with a probability. The probabilities sum to 1.", "A probability distribution can be shown as a table or a function, e.g. P(X = x) = kx."]}, {"h": "Binomial model", "p": ["X ~ B(n, p) when there are: a **fixed number** of trials n; each trial has **two outcomes** (success/failure); a **constant probability** p of success; and trials are **independent**.", "`P(X = r) = ⁿCᵣ pʳ (1 − p)ⁿ⁻ʳ`", "Use your calculator's **binomial pdf** for P(X = r) and **binomial cdf** for P(X ≤ r)."]}, {"h": "Cumulative probabilities", "p": ["`P(X < r) = P(X ≤ r − 1)`", "`P(X ≥ r) = 1 − P(X ≤ r − 1)`", "`P(a ≤ X ≤ b) = P(X ≤ b) − P(X ≤ a − 1)`"]}, {"h": "Mean and variance", "p": ["`E(X) = np`", "`Var(X) = np(1 − p)` (Year 2 also uses this).", "Criticise models: e.g. trials may not be independent, or p may not be constant."]}], "pitfalls": ["P(X ≥ 4) = 1 − P(X ≤ **3**), not 1 − P(X ≤ 4).", "Check 'more than' (>) vs 'at least' (≥) carefully.", "State the distribution with its parameters, e.g. X ~ B(20, 0.3), before calculating."], "examples": [{"q": "X ~ B(10, 0.3). Find P(X = 3) to 4 d.p.", "steps": ["P(X = 3) = ¹⁰C₃ × 0.3³ × 0.7⁷.", "= 120 × 0.027 × 0.0823543..."], "a": "0.2668"}, {"q": "X ~ B(10, 0.3). Find P(X ≥ 4).", "steps": ["P(X ≥ 4) = 1 − P(X ≤ 3).", "P(X ≤ 3) = 0.6496 (calculator)."], "a": "0.3504"}], "questions": [{"q": "Which is NOT a condition for a binomial distribution?", "o": ["A fixed number of trials", "The outcomes must be equally likely", "Independent trials", "A constant probability of success"], "a": 1, "e": "p doesn't have to be 0.5; it just has to stay the same."}, {"q": "X ~ B(5, 0.5). What is P(X = 2)?", "o": ["0.3125", "0.5", "0.25", "0.1563"], "a": 0, "e": "⁵C₂ × 0.5² × 0.5³ = 10 × 1/32 = 0.3125."}, {"q": "X ~ B(8, 0.2). What is P(X = 0) to 4 d.p.?", "o": ["0.2", "0", "0.1678", "0.8322"], "a": 2, "e": "0.8⁸ = 0.1678."}, {"q": "X ~ B(8, 0.2). What is P(X ≥ 1) to 4 d.p.?", "o": ["0.2", "0.1678", "0.9", "0.8322"], "a": 3, "e": "1 − P(X = 0) = 1 − 0.1678 = 0.8322."}, {"q": "X ~ B(20, 0.25). What is E(X)?", "o": ["5", "20", "0.25", "3.75"], "a": 0, "e": "E(X) = np = 20 × 0.25 = 5."}, {"q": "X ~ B(20, 0.25). What is Var(X)?", "o": ["5", "3.75", "1.94", "15"], "a": 1, "e": "np(1 − p) = 20 × 0.25 × 0.75 = 3.75."}, {"q": "How is P(X ≥ 6) written using a cumulative probability?", "o": ["1 − P(X ≤ 6)", "P(X ≤ 6)", "1 − P(X ≤ 5)", "P(X ≤ 5)"], "a": 2, "e": "X ≥ 6 is the complement of X ≤ 5."}, {"q": "How is P(X < 4) written as a cumulative probability?", "o": ["P(X ≤ 4)", "1 − P(X ≤ 4)", "1 − P(X ≤ 3)", "P(X ≤ 3)"], "a": 3, "e": "For whole numbers, X < 4 means X ≤ 3."}, {"q": "X ~ B(10, 0.3). Find P(X ≤ 2) to 4 d.p.", "o": ["0.3828", "0.2335", "0.6172", "0.1493"], "a": 0, "e": "Using the binomial cdf: 0.3828."}, {"q": "X ~ B(10, 0.4). How do you find P(2 ≤ X ≤ 4)?", "o": ["P(X ≤ 4) − P(X ≤ 2)", "P(X ≤ 4) − P(X ≤ 1)", "P(X ≤ 4) + P(X ≤ 2)", "1 − P(X ≤ 4)"], "a": 1, "e": "Subtract everything up to 1 from everything up to 4. The value is 0.5867."}, {"q": "X ~ B(12, 0.1). Find P(X ≤ 1) to 3 d.p.", "o": ["0.282", "0.377", "0.659", "0.341"], "a": 2, "e": "P(0) + P(1) = 0.9¹² + 12 × 0.1 × 0.9¹¹ ≈ 0.282 + 0.377 = 0.659."}, {"q": "Why might the number of girls in families of 4 not be well modelled by B(4, 0.5)?", "o": ["n is too small", "There are more than two outcomes", "The trials are not fixed", "The probability of a girl may not be exactly 0.5, or births may not be independent"], "a": 3, "e": "Model assumptions should always be checked."}, {"q": "What is ⁿCᵣ pʳ (1 − p)ⁿ⁻ʳ?", "o": ["P(X = r) for X ~ B(n, p)", "E(X)", "Var(X)", "P(X ≤ r)"], "a": 0, "e": "This is the binomial probability formula."}, {"q": "A dice is rolled 12 times and X is the number of sixes. Which model is suitable?", "o": ["B(6, 1/12)", "B(12, 1/6)", "B(12, 1/2)", "B(1/6, 12)"], "a": 1, "e": "12 independent trials, p = 1/6 of a six each time."}, {"q": "X ~ B(n, 0.4) and E(X) = 8. What is n?", "o": ["8", "3.2", "20", "32"], "a": 2, "e": "np = 8, so n = 8 ÷ 0.4 = 20."}, {"q": "For a discrete random variable, what must the probabilities sum to?", "o": ["0", "The mean", "n", "1"], "a": 3, "e": "All possible outcomes together have probability 1."}, {"q": "P(X = x) = kx for x = 1, 2, 3, 4. Find k.", "o": ["1/10", "1/4", "1/24", "10"], "a": 0, "e": "k(1 + 2 + 3 + 4) = 10k = 1."}, {"q": "X ~ B(10, 0.3). Find P(X = 3) to 4 d.p.", "o": ["0.3", "0.2668", "0.6496", "0.0090"], "a": 1, "e": "¹⁰C₃ × 0.3³ × 0.7⁷ = 0.2668."}, {"q": "X ~ B(10, 0.3). P(X ≤ 3) = 0.6496. What is P(X ≥ 4)?", "o": ["0.6496", "0.2668", "0.3504", "0.0504"], "a": 2, "e": "1 − 0.6496 = 0.3504."}, {"q": "What does p represent in B(n, p)?", "o": ["The number of trials", "The number of successes", "The variance", "The probability of success on each trial"], "a": 3, "e": "n is the number of trials and p the probability of success."}, {"q": "X ~ B(6, 0.5). Which value of X is most likely?", "o": ["3", "0", "6", "1"], "a": 0, "e": "The distribution is symmetric about np = 3."}, {"q": "A multiple-choice test has 10 questions with 4 options each. A student guesses all. What is the expected number correct?", "o": ["4", "2.5", "10", "0.25"], "a": 1, "e": "E(X) = 10 × 0.25 = 2.5."}]}, {"id": "s4", "order": 14, "year": 1, "section": "S", "badge": "O", "spec": "O", "title": "Hypothesis testing (binomial)", "desc": "Null and alternative hypotheses, significance levels, one- and two-tailed tests, test statistics, p-values, critical regions and actual significance levels.", "practicals": [], "summary": [{"h": "Language of hypothesis testing", "p": ["A **hypothesis test** uses a sample to decide whether there is evidence to reject a claim about a population parameter, here p.", "**Null hypothesis H₀**: the assumed value, e.g. H₀: p = 0.3.", "**Alternative hypothesis H₁**: what you suspect: p > 0.3 or p < 0.3 (**one-tailed**), or p ≠ 0.3 (**two-tailed**).", "**Significance level**: the probability threshold for rejecting H₀, e.g. 5%.", "**Test statistic**: the observed value from the sample, e.g. X = 10."]}, {"h": "Carrying out a test", "p": ["Assume H₀ is true, so X ~ B(n, p).", "**p-value method**: find the probability of getting a result **at least as extreme** as the observed value. If it is **less than** the significance level, **reject H₀**.", "For a **two-tailed** test, compare each tail with **half** the significance level.", "Write a **conclusion in context**, using non-assertive language: 'There is sufficient evidence to suggest that...'"]}, {"h": "Critical regions", "p": ["The **critical region** is the set of values that would lead to rejecting H₀.", "The **critical value** is the first value in the critical region.", "The **actual significance level** is the probability of being in the critical region when H₀ is true. It is usually a bit less than the stated level."]}], "pitfalls": ["Hypotheses are about the **population parameter p**, not the sample.", "Compare P(X ≥ observed) for an upper test, or P(X ≤ observed) for a lower test, not P(X = observed).", "Never say 'H₀ is true' or 'proved'. Say there is or isn't sufficient evidence."], "examples": [{"q": "Past records say 30% of customers buy a dessert. In a sample of 20, 10 buy one. Test at the 5% level whether the proportion has increased.", "steps": ["H₀: p = 0.3. H₁: p > 0.3. Under H₀, X ~ B(20, 0.3).", "P(X ≥ 10) = 1 − P(X ≤ 9) = 0.0480.", "0.0480 < 0.05, so reject H₀."], "a": "There is sufficient evidence at the 5% level to suggest that the proportion buying a dessert has increased."}, {"q": "X ~ B(20, 0.4). Find the critical region for a lower-tailed test at the 5% level.", "steps": ["P(X ≤ 3) = 0.0160 and P(X ≤ 4) = 0.0510.", "0.0510 > 0.05, so 4 isn't in the critical region."], "a": "Critical region X ≤ 3 (actual significance level 1.6%)."}], "questions": [{"q": "What does the null hypothesis H₀ state?", "o": ["The value you suspect is true", "The assumed value of the parameter, which is tested", "That the result is significant", "The sample proportion"], "a": 1, "e": "H₀ is assumed true unless there is enough evidence against it."}, {"q": "A coin is suspected to be biased towards heads. Which hypotheses are correct?", "o": ["H₀: p = 0.5, H₁: p > 0.5", "H₀: p > 0.5, H₁: p = 0.5", "H₀: p = 0.5, H₁: p ≠ 0.5", "H₀: p = 0.5, H₁: p < 0.5"], "a": 0, "e": "The suspicion is specifically 'more heads', so a one-tailed upper test."}, {"q": "A test is set up to check whether a dice is biased (in either direction) for sixes. What type of test is this?", "o": ["One-tailed, upper", "One-tailed, lower", "Two-tailed", "Not a hypothesis test"], "a": 2, "e": "H₁: p ≠ 1/6, so two-tailed."}, {"q": "In a two-tailed test at the 5% level, what probability is each tail compared with?", "o": ["5%", "10%", "1%", "2.5%"], "a": 3, "e": "The significance level is split between the two tails."}, {"q": "H₀: p = 0.3, H₁: p > 0.3, n = 20, observed X = 10. P(X ≥ 10) = 0.048. Conclusion at 5%?", "o": ["Reject H₀: evidence that p > 0.3", "Accept H₁ as proved", "Do not reject H₀", "The test is invalid"], "a": 0, "e": "0.048 < 0.05, so there is sufficient evidence to reject H₀."}, {"q": "H₀: p = 0.5, H₁: p > 0.5, n = 15, X = 12. P(X ≥ 12) = 0.0176. Conclusion at 1%?", "o": ["Reject H₀", "Do not reject H₀: insufficient evidence at the 1% level", "Accept that p > 0.5", "Prove p = 0.5"], "a": 1, "e": "0.0176 > 0.01, so there is not enough evidence at the 1% level."}, {"q": "What is a critical region?", "o": ["The values of p", "The observed value", "The set of values of the test statistic that would lead to rejecting H₀", "The significance level"], "a": 2, "e": "If the observed value is in the critical region, reject H₀."}, {"q": "X ~ B(20, 0.3). P(X ≥ 9) = 0.1133, P(X ≥ 10) = 0.0480. What is the upper critical region at 5%?", "o": ["X ≥ 9", "X ≥ 11", "X ≤ 10", "X ≥ 10"], "a": 3, "e": "The smallest value where the tail probability is below 0.05 is 10."}, {"q": "For the critical region X ≥ 10 under B(20, 0.3), what is the actual significance level?", "o": ["4.8%", "5%", "11.3%", "10%"], "a": 0, "e": "The actual significance level is P(X ≥ 10) = 0.048."}, {"q": "X ~ B(20, 0.4). P(X ≤ 3) = 0.0160, P(X ≤ 4) = 0.0510. What is the lower critical region at 5%?", "o": ["X ≤ 4", "X ≤ 3", "X ≤ 5", "X ≥ 3"], "a": 1, "e": "P(X ≤ 4) exceeds 0.05, so the region is X ≤ 3."}, {"q": "What is the test statistic in a binomial hypothesis test?", "o": ["The significance level", "The value of p", "The observed number of successes in the sample", "The critical value"], "a": 2, "e": "E.g. X = 10 successes in the sample."}, {"q": "Which conclusion is correctly worded?", "o": ["H₀ is false", "This proves the coin is biased", "H₀ is true", "There is sufficient evidence at the 5% level to suggest the coin is biased"], "a": 3, "e": "Use non-assertive language and put the conclusion in context."}, {"q": "Why is the actual significance level often less than the stated level?", "o": ["Because the binomial distribution is discrete, so tail probabilities jump in steps", "Because of rounding errors", "Because n is too small", "It's always equal"], "a": 0, "e": "There's usually no value that gives exactly 5%."}, {"q": "In a hypothesis test, what is p?", "o": ["The sample proportion", "The population parameter (probability of success)", "The p-value", "The critical value"], "a": 1, "e": "Hypotheses are always about the population parameter."}, {"q": "A p-value is 0.03 in a one-tailed test at 5%. What do you do?", "o": ["Do not reject H₀", "Accept H₀", "Reject H₀", "Repeat the test"], "a": 2, "e": "0.03 < 0.05, so the result is significant."}, {"q": "In an upper-tailed test with X = 7 observed, which probability do you calculate?", "o": ["P(X = 7)", "P(X ≤ 7)", "P(X < 7)", "P(X ≥ 7)"], "a": 3, "e": "The probability of a result at least as extreme as the one observed."}, {"q": "A new drug is claimed to have a higher cure rate than 0.6. Which is H₁?", "o": ["p > 0.6", "p < 0.6", "p = 0.6", "p ≠ 0.6"], "a": 0, "e": "The claim is that the rate has increased."}, {"q": "What does a 5% significance level mean?", "o": ["There's a 5% chance H₁ is true", "There's a 5% probability of rejecting H₀ when it is actually true", "95% of samples are significant", "The sample is 5% of the population"], "a": 1, "e": "It's the threshold probability for deciding a result is unusual under H₀."}, {"q": "H₀: p = 0.4, H₁: p < 0.4, n = 20, X = 3 observed. P(X ≤ 3) = 0.016. Conclusion at 5%?", "o": ["Do not reject H₀", "Accept H₀", "Reject H₀: evidence that p < 0.4", "Inconclusive"], "a": 2, "e": "0.016 < 0.05, so reject H₀."}, {"q": "Why do we assume H₀ is true when calculating probabilities?", "o": ["Because it is always correct", "Because H₁ can't be tested", "To make the test two-tailed", "To see how unlikely the observed result would be if H₀ were true"], "a": 3, "e": "If the result would be very unlikely under H₀, that is evidence against it."}, {"q": "What happens to the critical region if the significance level is reduced from 5% to 1%?", "o": ["It gets smaller (more extreme values only)", "It gets bigger", "It stays the same", "It disappears"], "a": 0, "e": "Stronger evidence is needed, so fewer values are in the critical region."}, {"q": "Under H₀, X ~ B(20, 0.3). The critical region is X ≥ 10. Observed X = 9. Conclusion?", "o": ["Reject H₀", "Do not reject H₀: 9 is not in the critical region", "Accept H₁", "Change to a two-tailed test"], "a": 1, "e": "The observed value must be in the critical region to reject H₀."}]}, {"id": "m1", "order": 15, "year": 1, "section": "M", "badge": "P·Q", "spec": "P, Q", "title": "Units and kinematics", "desc": "SI units, modelling assumptions, displacement, velocity and acceleration, motion graphs, the constant acceleration (suvat) equations, and vertical motion under gravity.", "practicals": [], "summary": [{"h": "Quantities and modelling", "p": ["SI units: metre (m), second (s), kilogram (kg). Derived: velocity m s⁻¹, acceleration m s⁻², force newton (N = kg m s⁻²).", "**Scalars**: distance, speed, time, mass. **Vectors**: displacement, velocity, acceleration, force.", "Modelling assumptions: **particle** (no size, no rotation), **smooth** (no friction), **light** (no mass), **inextensible** string, **no air resistance**."]}, {"h": "Motion graphs", "p": ["**Displacement–time**: gradient = **velocity**.", "**Velocity–time**: gradient = **acceleration**. **Area under** the graph = **displacement**."]}, {"h": "Constant acceleration (suvat)", "p": ["s = displacement, u = initial velocity, v = final velocity, a = acceleration, t = time.", "`v = u + at`", "`s = ½(u + v)t`", "`s = ut + ½at²`", "`s = vt − ½at²`", "`v² = u² + 2as`", "Pick the equation with the four quantities you need (three known, one unknown)."]}, {"h": "Vertical motion", "p": ["Objects moving freely under gravity have acceleration **g = 9.8 m s⁻²** downwards (unless told otherwise).", "Choose a positive direction (e.g. up) and keep signs consistent: if up is positive, a = −9.8.", "At the **highest point**, the velocity is **zero**."]}], "pitfalls": ["Convert units first: km h⁻¹ to m s⁻¹ (divide by 3.6).", "Be consistent with **signs** in vertical motion.", "suvat only works for **constant** acceleration."], "examples": [{"q": "A car accelerates uniformly from 5 m s⁻¹ to 25 m s⁻¹ in 8 s. Find the acceleration and the distance travelled.", "steps": ["a = (v − u)/t = (25 − 5)/8 = 2.5 m s⁻².", "s = ½(u + v)t = ½(5 + 25)(8) = 120 m."], "a": "2.5 m s⁻², 120 m"}, {"q": "A ball is thrown vertically upwards at 14 m s⁻¹. Find its maximum height (g = 9.8 m s⁻²).", "steps": ["Up positive: u = 14, v = 0, a = −9.8.", "v² = u² + 2as: 0 = 196 − 19.6s."], "a": "s = 10 m"}], "questions": [{"q": "What is the SI unit of acceleration?", "o": ["m s⁻¹", "m s⁻²", "N", "kg m s⁻¹"], "a": 1, "e": "Acceleration is change in velocity (m s⁻¹) per second."}, {"q": "What does modelling an object as a particle mean?", "o": ["Its size can be ignored, and it doesn't rotate", "It has no mass", "It moves at constant speed", "It has no weight"], "a": 0, "e": "All its mass is treated as concentrated at a single point."}, {"q": "On a velocity–time graph, what does the area under the graph represent?", "o": ["Acceleration", "Speed", "Displacement", "Time"], "a": 2, "e": "Velocity × time gives displacement."}, {"q": "On a displacement–time graph, what does the gradient represent?", "o": ["Acceleration", "Distance", "Force", "Velocity"], "a": 3, "e": "Rate of change of displacement is velocity."}, {"q": "u = 3 m s⁻¹, a = 2 m s⁻², t = 5 s. Find v.", "o": ["13 m s⁻¹", "10 m s⁻¹", "8 m s⁻¹", "25 m s⁻¹"], "a": 0, "e": "v = u + at = 3 + 10 = 13 m s⁻¹."}, {"q": "u = 0, a = 4 m s⁻², t = 3 s. Find s.", "o": ["12 m", "18 m", "36 m", "6 m"], "a": 1, "e": "s = ut + ½at² = 0 + ½ × 4 × 9 = 18 m."}, {"q": "u = 10 m s⁻¹, v = 0, s = 25 m. Find a.", "o": ["−4 m s⁻²", "4 m s⁻²", "−2 m s⁻²", "2 m s⁻²"], "a": 2, "e": "v² = u² + 2as: 0 = 100 + 50a, so a = −2 m s⁻²."}, {"q": "Convert 72 km h⁻¹ into m s⁻¹.", "o": ["72 m s⁻¹", "7.2 m s⁻¹", "259 m s⁻¹", "20 m s⁻¹"], "a": 3, "e": "72 ÷ 3.6 = 20 m s⁻¹."}, {"q": "A stone is dropped from rest and falls for 2 s. How far does it fall? (g = 9.8)", "o": ["19.6 m", "9.8 m", "39.2 m", "4.9 m"], "a": 0, "e": "s = ½ × 9.8 × 2² = 19.6 m."}, {"q": "What is the velocity of a ball at the highest point of its vertical motion?", "o": ["9.8 m s⁻¹", "0", "Maximum", "Equal to the starting speed"], "a": 1, "e": "It momentarily stops before falling back."}, {"q": "A ball is thrown up at 19.6 m s⁻¹. How long does it take to reach its highest point?", "o": ["1 s", "4 s", "2 s", "19.6 s"], "a": 2, "e": "v = u + at: 0 = 19.6 − 9.8t, so t = 2 s."}, {"q": "Which suvat equation doesn't involve t?", "o": ["v = u + at", "s = ut + ½at²", "s = ½(u + v)t", "v² = u² + 2as"], "a": 3, "e": "Use v² = u² + 2as when time isn't given or needed."}, {"q": "Which suvat equation doesn't involve a?", "o": ["s = ½(u + v)t", "v = u + at", "v² = u² + 2as", "s = vt − ½at²"], "a": 0, "e": "s = ½(u + v)t uses average velocity."}, {"q": "A train decelerates from 30 m s⁻¹ to rest over 450 m. Find the deceleration.", "o": ["2 m s⁻²", "1 m s⁻²", "0.5 m s⁻²", "15 m s⁻²"], "a": 1, "e": "0 = 900 + 2a(450), so a = −1 m s⁻², a deceleration of 1 m s⁻²."}, {"q": "What does 'smooth' mean in a mechanics model?", "o": ["No air resistance", "Constant speed", "No friction", "No mass"], "a": 2, "e": "A smooth surface exerts no frictional force."}, {"q": "What does 'light' mean for a string or rod?", "o": ["It is inextensible", "It is smooth", "It is short", "Its mass can be ignored"], "a": 3, "e": "Tension is then the same throughout a light string."}, {"q": "A v–t graph is a straight line from (0, 4) to (6, 16). What is the acceleration?", "o": ["2 m s⁻²", "4 m s⁻²", "12 m s⁻²", "2.67 m s⁻²"], "a": 0, "e": "Gradient = (16 − 4) ÷ 6 = 2 m s⁻²."}, {"q": "Using the same graph, from (0, 4) to (6, 16), what is the displacement?", "o": ["96 m", "60 m", "120 m", "72 m"], "a": 1, "e": "Area of trapezium = ½(4 + 16) × 6 = 60 m."}, {"q": "Which quantity is a scalar?", "o": ["Velocity", "Displacement", "Speed", "Acceleration"], "a": 2, "e": "Speed has magnitude only."}, {"q": "A ball is thrown up at 7 m s⁻¹ from a cliff 14 m high. Taking up as positive, which values are correct for when it hits the sea?", "o": ["s = 14, a = 9.8", "s = 14, a = −9.8", "s = −14, a = 9.8", "s = −14, a = −9.8"], "a": 3, "e": "The sea is 14 m below the start (s = −14), and gravity acts downwards (a = −9.8)."}, {"q": "Why can't suvat be used when a car's acceleration varies?", "o": ["The suvat equations assume constant acceleration", "It needs radians", "It only works vertically", "It only works for particles at rest"], "a": 0, "e": "Variable acceleration needs calculus (Year 2)."}, {"q": "A cyclist travels at a constant 8 m s⁻¹ for 15 s. How far does she travel?", "o": ["23 m", "120 m", "60 m", "1.9 m"], "a": 1, "e": "Constant velocity: s = vt = 120 m."}]}, {"id": "m2", "order": 16, "year": 1, "section": "M", "badge": "R", "spec": "R", "title": "Forces and Newton's laws", "desc": "Types of force, force diagrams, resultant forces and equilibrium, Newton's three laws, F = ma, connected particles, lifts and pulleys.", "practicals": [], "summary": [{"h": "Forces", "p": ["**Weight** W = mg acts downwards. **Normal reaction** R acts perpendicular to a surface. **Tension** acts along a string, away from the object. **Thrust** pushes along a rod. **Friction** opposes motion.", "Draw a clear **force diagram** with all forces labelled.", "The **resultant force** is the vector sum of all forces. If it is zero, the object is in **equilibrium** (at rest or constant velocity)."]}, {"h": "Newton's laws", "p": ["**First law**: an object stays at rest or moves with constant velocity unless acted on by a resultant force.", "**Second law**: `F = ma`, where F is the **resultant** force in newtons.", "**Third law**: for every action there is an equal and opposite reaction (on a different object).", "Resolve forces in the direction of motion and use F = ma. Perpendicular to the motion, forces balance."]}, {"h": "Connected particles", "p": ["For two particles joined by a light inextensible string, both have the **same acceleration** and the **tension is the same** throughout.", "Write F = ma for **each particle** separately, or for the **whole system** (tension is then internal and cancels).", "**Smooth pulleys**: tension is the same on both sides.", "**Lifts**: for a person of mass m in a lift accelerating upwards at a, R − mg = ma."]}], "pitfalls": ["Use the **resultant** force in F = ma, not just one force.", "Mass in kg, weight in newtons: W = mg.", "Newton's third law pairs act on **different** objects, so they don't cancel on a single force diagram."], "examples": [{"q": "A 5 kg box is pulled along a smooth floor by a horizontal force of 20 N. Find its acceleration.", "steps": ["Resultant force = 20 N (smooth, so no friction).", "F = ma: 20 = 5a."], "a": "a = 4 m s⁻²"}, {"q": "Particles of mass 3 kg and 2 kg hang either side of a smooth pulley. Find the acceleration and tension (g = 9.8).", "steps": ["Whole system: (3 − 2)g = (3 + 2)a, so 9.8 = 5a, a = 1.96 m s⁻².", "For the 2 kg particle (moving up): T − 2g = 2a.", "T = 2(9.8) + 2(1.96) = 19.6 + 3.92 = 23.52."], "a": "a = 1.96 m s⁻², T = 23.5 N (3 s.f.)"}], "questions": [{"q": "What is the weight of a 6 kg mass? (g = 9.8)", "o": ["6 N", "58.8 N", "0.61 N", "15.8 N"], "a": 1, "e": "W = mg = 6 × 9.8 = 58.8 N."}, {"q": "What does Newton's first law state?", "o": ["An object stays at rest or moves with constant velocity unless acted on by a resultant force", "F = ma", "Every action has an equal and opposite reaction", "Weight = mg"], "a": 0, "e": "No resultant force means no change in velocity."}, {"q": "A 2 kg object has a resultant force of 10 N. What is its acceleration?", "o": ["20 m s⁻²", "0.2 m s⁻²", "5 m s⁻²", "12 m s⁻²"], "a": 2, "e": "a = F/m = 10/2 = 5 m s⁻²."}, {"q": "An object moves at constant velocity. What is the resultant force?", "o": ["Equal to its weight", "Positive", "Equal to friction", "Zero"], "a": 3, "e": "Constant velocity means zero acceleration, so the resultant force is zero."}, {"q": "Forces of 12 N (right) and 5 N (left) act on a 3.5 kg particle. Find its acceleration.", "o": ["2 m s⁻² to the right", "4.9 m s⁻² to the right", "2 m s⁻² to the left", "3.4 m s⁻² to the right"], "a": 0, "e": "Resultant = 7 N right. a = 7/3.5 = 2 m s⁻²."}, {"q": "What is the normal reaction on a 4 kg box resting on a horizontal floor? (g = 9.8)", "o": ["4 N", "39.2 N", "0 N", "9.8 N"], "a": 1, "e": "Vertical equilibrium: R = mg = 39.2 N."}, {"q": "Two particles connected by a light inextensible string. Which statement is true?", "o": ["They have different accelerations", "The tension is different at each end", "They have the same acceleration and the tension is the same throughout", "The string has weight"], "a": 2, "e": "Inextensible means equal accelerations; light means equal tension."}, {"q": "A car of mass 1200 kg accelerates at 1.5 m s⁻². The resistance is 400 N. Find the driving force.", "o": ["1800 N", "1400 N", "400 N", "2200 N"], "a": 3, "e": "F − 400 = 1200 × 1.5 = 1800, so F = 2200 N."}, {"q": "A 60 kg person stands in a lift accelerating upwards at 2 m s⁻². What is the normal reaction? (g = 9.8)", "o": ["708 N", "588 N", "468 N", "120 N"], "a": 0, "e": "R − 60g = 60 × 2, so R = 588 + 120 = 708 N."}, {"q": "The same 60 kg person is in a lift accelerating downwards at 2 m s⁻². What is the normal reaction?", "o": ["708 N", "468 N", "588 N", "120 N"], "a": 1, "e": "60g − R = 60 × 2, so R = 588 − 120 = 468 N."}, {"q": "What does Newton's third law say about the Earth pulling a ball down?", "o": ["Nothing pulls back", "The ball's weight cancels it", "The ball pulls the Earth up with an equal force", "The normal reaction is the pair"], "a": 2, "e": "Third-law pairs act on different bodies: the ball on the Earth, the Earth on the ball."}, {"q": "What is the SI unit of force?", "o": ["kg", "J", "W", "N"], "a": 3, "e": "1 N = 1 kg m s⁻²."}, {"q": "Particles of 5 kg and 3 kg hang over a smooth pulley. Find the acceleration. (g = 9.8)", "o": ["2.45 m s⁻²", "4.9 m s⁻²", "1.96 m s⁻²", "9.8 m s⁻²"], "a": 0, "e": "(5 − 3)g = 8a, so a = 19.6/8 = 2.45 m s⁻²."}, {"q": "For the 5 kg and 3 kg pulley system with a = 2.45 m s⁻², what is the tension?", "o": ["29.4 N", "36.75 N", "49 N", "7.35 N"], "a": 1, "e": "For the 3 kg particle: T − 3g = 3a, so T = 29.4 + 7.35 = 36.75 N."}, {"q": "A car (1000 kg) tows a trailer (500 kg) with a light rigid towbar. Driving force 3000 N, no resistance. Find the acceleration.", "o": ["3 m s⁻²", "6 m s⁻²", "2 m s⁻²", "1 m s⁻²"], "a": 2, "e": "Whole system: 3000 = 1500a, so a = 2 m s⁻²."}, {"q": "Using the previous question, what is the tension in the towbar?", "o": ["3000 N", "2000 N", "1500 N", "1000 N"], "a": 3, "e": "Trailer only: T = 500 × 2 = 1000 N."}, {"q": "What happens to the tension calculations if a string is modelled as light?", "o": ["Tension is the same throughout the string", "Tension is zero", "Tension equals weight", "The string can stretch"], "a": 0, "e": "A light string has no mass, so no force is needed to accelerate it."}, {"q": "A box is in equilibrium. Which is true?", "o": ["It must be at rest", "The resultant force is zero", "Only gravity acts", "It accelerates"], "a": 1, "e": "Equilibrium means the forces balance; it may be at rest or at constant velocity."}, {"q": "A force of 30 N acts on a 10 kg mass on a rough surface. Friction is 10 N. Find the acceleration.", "o": ["3 m s⁻²", "4 m s⁻²", "2 m s⁻²", "1 m s⁻²"], "a": 2, "e": "Resultant = 20 N, a = 20/10 = 2 m s⁻²."}, {"q": "A particle accelerates from rest at 3 m s⁻² for 4 s due to a 15 N resultant force. What is its mass?", "o": ["45 kg", "3 kg", "12 kg", "5 kg"], "a": 3, "e": "m = F/a = 15/3 = 5 kg."}, {"q": "On a force diagram, in which direction does the normal reaction act?", "o": ["Perpendicular to the surface, away from it", "Vertically down", "Along the surface", "In the direction of motion"], "a": 0, "e": "The surface pushes back on the object at right angles to the surface."}, {"q": "What does 'inextensible' mean for a string?", "o": ["It has no mass", "It doesn't stretch, so connected objects have the same acceleration", "It is smooth", "It can't break"], "a": 1, "e": "If the string can't stretch, both ends move together."}]}, {"id": "p11", "order": 17, "year": 2, "section": "P", "badge": "A·B", "spec": "A, B", "title": "Proof by contradiction and functions", "desc": "Proof by contradiction, domain and range, composite and inverse functions, modulus functions and combined transformations.", "practicals": [], "summary": [{"h": "Proof by contradiction", "p": ["Assume the **opposite** of what you want to prove, then show this leads to a **contradiction**.", "Classic proofs: √2 is irrational; there are infinitely many primes.", "Structure: 'Assume ... Then ... This contradicts ... So the original statement is true.'"]}, {"h": "Functions", "p": ["A **function** maps each input to exactly **one** output. **One-to-one** functions have an inverse; many-to-one functions don't (unless the domain is restricted).", "**Domain**: the set of allowed inputs. **Range**: the set of outputs.", "**Composite**: fg(x) means apply **g first**, then f: fg(x) = f(g(x)).", "**Inverse** f⁻¹(x): swap x and y, then rearrange. The graph of f⁻¹ is the **reflection of f in y = x**. Domain of f⁻¹ = range of f."]}, {"h": "Modulus", "p": ["|x| is the **absolute value** of x: always ≥ 0.", "**y = |f(x)|**: reflect the parts **below the x-axis** upwards.", "**y = f(|x|)**: take the part for x ≥ 0 and **reflect it in the y-axis**.", "Solve |f(x)| = g(x) by considering f(x) = g(x) and −f(x) = g(x), and **check** solutions (often with a sketch)."]}, {"h": "Combined transformations", "p": ["Apply transformations one at a time. Inside the bracket (x) changes happen in reverse order to how they appear; outside changes act on y.", "E.g. y = 2f(x − 3) + 1: translate right 3, stretch vertically by 2, then translate up 1."]}], "pitfalls": ["fg(x) means **g first**. Order matters.", "When solving modulus equations, always check solutions in the original equation.", "The domain of f⁻¹ is the **range** of f."], "examples": [{"q": "Prove by contradiction that √2 is irrational.", "steps": ["Assume √2 = a/b, where a and b are integers with no common factors.", "Then 2 = a²/b², so a² = 2b². So a² is even, so a is even: a = 2k.", "Then 4k² = 2b², so b² = 2k², so b is even.", "a and b are both even, contradicting 'no common factors'."], "a": "So √2 is irrational. ∎"}, {"q": "f(x) = 3x − 1 and g(x) = x². Find fg(2) and f⁻¹(x).", "steps": ["g(2) = 4, so fg(2) = f(4) = 11.", "y = 3x − 1, so x = (y + 1)/3."], "a": "fg(2) = 11, f⁻¹(x) = (x + 1)/3"}], "questions": [{"q": "In a proof by contradiction, what is the first step?", "o": ["Check a few examples", "Assume the opposite of what you want to prove", "Find a counter-example", "Use exhaustion"], "a": 1, "e": "Then show the assumption leads to something impossible."}, {"q": "f(x) = 2x + 1, g(x) = x². What is fg(3)?", "o": ["19", "49", "10", "13"], "a": 0, "e": "g(3) = 9, then f(9) = 19."}, {"q": "f(x) = 2x + 1, g(x) = x². What is gf(3)?", "o": ["19", "13", "49", "36"], "a": 2, "e": "f(3) = 7, then g(7) = 49."}, {"q": "Find the inverse of f(x) = (x − 5)/2.", "o": ["f⁻¹(x) = 2x − 5", "f⁻¹(x) = (x + 5)/2", "f⁻¹(x) = 2/(x − 5)", "f⁻¹(x) = 2x + 5"], "a": 3, "e": "y = (x − 5)/2, so x = 2y + 5."}, {"q": "How is the graph of y = f⁻¹(x) related to y = f(x)?", "o": ["Reflection in y = x", "Reflection in the x-axis", "Reflection in the y-axis", "Rotation by 90°"], "a": 0, "e": "Inputs and outputs swap, so x and y swap."}, {"q": "f(x) = x² for x ∈ ℝ. Why doesn't f have an inverse?", "o": ["It has no range", "It is many-to-one (e.g. f(2) = f(−2))", "It isn't continuous", "x² can't be rearranged"], "a": 1, "e": "An inverse needs a one-to-one function. Restricting the domain to x ≥ 0 fixes this."}, {"q": "f(x) = eˣ. What is the range of f?", "o": ["f(x) ∈ ℝ", "f(x) ≥ 0", "f(x) > 0", "f(x) ≥ 1"], "a": 2, "e": "eˣ is always positive but never reaches 0."}, {"q": "f(x) = ln x, x > 0. What is f⁻¹(x)?", "o": ["1/ln x", "−ln x", "ln(1/x)", "eˣ"], "a": 3, "e": "ln and exp are inverse functions."}, {"q": "Evaluate |−7| + |3|.", "o": ["10", "−4", "4", "−10"], "a": 0, "e": "|−7| = 7 and |3| = 3."}, {"q": "How is y = |f(x)| obtained from y = f(x)?", "o": ["Reflect the part for x < 0 in the y-axis", "Reflect any part below the x-axis in the x-axis", "Reflect the whole graph in y = x", "Translate up"], "a": 1, "e": "Negative y-values become positive."}, {"q": "How is y = f(|x|) obtained from y = f(x)?", "o": ["Reflect parts below the x-axis", "Reflect in y = x", "Keep the graph for x ≥ 0 and reflect it in the y-axis", "Translate left"], "a": 2, "e": "f(|x|) is symmetric about the y-axis."}, {"q": "Solve |2x − 3| = 5.", "o": ["x = 4 only", "x = −1 only", "x = 1 or x = −4", "x = 4 or x = −1"], "a": 3, "e": "2x − 3 = 5 gives x = 4. 2x − 3 = −5 gives x = −1."}, {"q": "Solve |x − 1| < 3.", "o": ["−2 < x < 4", "x < 4", "x < −2 or x > 4", "−4 < x < 2"], "a": 0, "e": "−3 < x − 1 < 3, so −2 < x < 4."}, {"q": "What is the domain of f⁻¹ if the range of f is f(x) ≥ 2?", "o": ["x ≤ 2", "x ≥ 2", "x ∈ ℝ", "x > 0"], "a": 1, "e": "The domain of the inverse is the range of the original."}, {"q": "y = f(x) has a maximum at (2, 3). Where is the maximum of y = 2f(x + 1)?", "o": ["(3, 6)", "(1, 3)", "(1, 6)", "(2, 6)"], "a": 2, "e": "Translate left 1: (1, 3). Then stretch vertically by 2: (1, 6)."}, {"q": "What is ff(x) if f(x) = 1/x (x ≠ 0)?", "o": ["1/x²", "x²", "1", "x"], "a": 3, "e": "f(f(x)) = 1/(1/x) = x. This function is self-inverse."}, {"q": "f(x) = x + 4 and g(x) = 3x. Solve fg(x) = gf(x).", "o": ["No solutions", "x = 0", "x = 4", "All x"], "a": 0, "e": "fg(x) = 3x + 4, gf(x) = 3x + 12. These are never equal."}, {"q": "Proof that there are infinitely many primes begins by assuming:", "o": ["There are infinitely many primes", "There is a largest prime (finitely many primes)", "All numbers are prime", "2 is the only even prime"], "a": 1, "e": "Then multiply all primes and add 1 to reach a contradiction."}, {"q": "f(x) = √(x − 2). What is the domain of f?", "o": ["x > 2", "x ∈ ℝ", "x ≥ 2", "x ≥ 0"], "a": 2, "e": "You can't take the square root of a negative number."}, {"q": "The function f(x) = 2x + 3 has domain 0 ≤ x ≤ 5. What is its range?", "o": ["0 ≤ f(x) ≤ 5", "f(x) ≥ 3", "2 ≤ f(x) ≤ 13", "3 ≤ f(x) ≤ 13"], "a": 3, "e": "f(0) = 3 and f(5) = 13, and f is increasing."}, {"q": "Solve |x| = 2x − 3.", "o": ["x = 3", "x = 1", "x = 3 or x = 1", "No solution"], "a": 0, "e": "x = 2x − 3 gives x = 3 ✓. −x = 2x − 3 gives x = 1, but then |1| = 1 and 2(1) − 3 = −1 ✗."}, {"q": "Which transformation maps y = f(x) to y = f(x − 2) + 5?", "o": ["Translation by (−2, 5)", "Translation by (2, 5)", "Translation by (2, −5)", "Stretch"], "a": 1, "e": "f(x − 2) moves right 2, + 5 moves up 5."}]}, {"id": "p12", "order": 18, "year": 2, "section": "P", "badge": "B·D", "spec": "B, D", "title": "Partial fractions and the general binomial expansion", "desc": "Splitting rational expressions into partial fractions, and expanding (a + bx)ⁿ for any rational n with its validity.", "practicals": [], "summary": [{"h": "Partial fractions", "p": ["Split a fraction with a factorised denominator into simpler fractions.", "Distinct linear factors: `(…)/[(x + a)(x + b)] = A/(x + a) + B/(x + b)`.", "Repeated factor: `(…)/[(x + a)(x + b)²] = A/(x + a) + B/(x + b) + C/(x + b)²`.", "Multiply through by the denominator, then **substitute** convenient values of x (or compare coefficients) to find A, B, C.", "If the numerator's degree ≥ the denominator's, divide first (improper fraction)."]}, {"h": "General binomial expansion", "p": ["`(1 + x)ⁿ = 1 + nx + n(n − 1)x²/2! + n(n − 1)(n − 2)x³/3! + ...` for **any rational n**.", "For negative or fractional n, the series is **infinite** and only **valid for |x| < 1**.", "For (a + bx)ⁿ, take out aⁿ first: `aⁿ(1 + bx/a)ⁿ`, valid for **|bx/a| < 1**, i.e. |x| < |a/b|.", "Partial fractions can be combined with binomial expansions to expand more complex expressions."]}], "pitfalls": ["Always state the **range of validity** for negative or fractional n.", "When taking out a factor, raise it to the power n: (4 + x)^(1/2) = 2(1 + x/4)^(1/2).", "Repeated factors need a term for **each** power of the repeated factor."], "examples": [{"q": "Express (5x + 1)/[(x + 1)(x − 1)] in partial fractions.", "steps": ["5x + 1 = A(x − 1) + B(x + 1).", "x = 1: 6 = 2B, so B = 3.", "x = −1: −4 = −2A, so A = 2."], "a": "2/(x + 1) + 3/(x − 1)"}, {"q": "Expand (1 − 2x)⁻¹ up to x³ and state the validity.", "steps": ["n = −1, replace x with −2x.", "1 + (−1)(−2x) + (−1)(−2)(−2x)²/2 + (−1)(−2)(−3)(−2x)³/6.", "= 1 + 2x + 4x² + 8x³."], "a": "1 + 2x + 4x² + 8x³ + ..., valid for |x| < ½"}], "questions": [{"q": "Express 1/[(x + 2)(x + 3)] in partial fractions.", "o": ["1/(x + 3) − 1/(x + 2)", "1/(x + 2) − 1/(x + 3)", "1/(x + 2) + 1/(x + 3)", "2/(x + 2) − 3/(x + 3)"], "a": 1, "e": "1 = A(x + 3) + B(x + 2). x = −2: A = 1. x = −3: B = −1."}, {"q": "What form of partial fractions is used for (3x + 2)/[(x − 1)(x + 2)²]?", "o": ["A/(x − 1) + B/(x + 2) + C/(x + 2)²", "A/(x − 1) + B/(x + 2)²", "A/(x − 1) + B/(x + 2)", "(Ax + B)/(x + 2)²"], "a": 0, "e": "A repeated factor needs terms for each power."}, {"q": "Express (x + 7)/[(x + 1)(x − 2)] in partial fractions.", "o": ["2/(x + 1) + 3/(x − 2)", "3/(x + 1) − 2/(x − 2)", "−2/(x + 1) + 3/(x − 2)", "2/(x + 1) − 3/(x − 2)"], "a": 2, "e": "x + 7 = A(x − 2) + B(x + 1). x = 2: 9 = 3B, B = 3. x = −1: 6 = −3A, A = −2."}, {"q": "When must you divide before finding partial fractions?", "o": ["Always", "When the denominator has a repeated factor", "When the numerator is negative", "When the degree of the numerator is at least the degree of the denominator"], "a": 3, "e": "Improper fractions need algebraic division first."}, {"q": "Expand (1 + x)⁻¹ up to x³.", "o": ["1 − x + x² − x³", "1 + x + x² + x³", "1 − x − x² − x³", "1 + x − x² + x³"], "a": 0, "e": "n = −1: 1 + (−1)x + (−1)(−2)x²/2 + (−1)(−2)(−3)x³/6."}, {"q": "For what values of x is the expansion of (1 + x)^(1/2) valid?", "o": ["All x", "|x| < 1", "x > 0", "|x| < 2"], "a": 1, "e": "For non-positive-integer n, the expansion is valid for |x| < 1."}, {"q": "Expand (1 + x)^(1/2) up to x².", "o": ["1 + x/2 + x²/4", "1 + x/2 + x²/8", "1 + x/2 − x²/8", "1 − x/2 − x²/8"], "a": 2, "e": "n(n − 1)/2 = (½)(−½)/2 = −1/8."}, {"q": "For what values of x is the expansion of (1 − 3x)⁻² valid?", "o": ["|x| < 3", "|x| < 1", "x < 1/3", "|x| < 1/3"], "a": 3, "e": "|−3x| < 1, so |x| < 1/3."}, {"q": "Write (4 + x)^(1/2) in the form k(1 + x/4)^(1/2). What is k?", "o": ["2", "4", "1/2", "16"], "a": 0, "e": "4^(1/2) = 2."}, {"q": "Expand (2 + x)⁻¹ up to x².", "o": ["½ + x/4 + x²/8", "½ − x/4 + x²/8", "2 − x + x²", "½ − x/2 + x²/2"], "a": 1, "e": "½(1 + x/2)⁻¹ = ½(1 − x/2 + x²/4) = ½ − x/4 + x²/8."}, {"q": "What is the validity of the expansion of (2 + x)⁻¹?", "o": ["|x| < 1", "|x| < ½", "|x| < 2", "All x"], "a": 2, "e": "|x/2| < 1, so |x| < 2."}, {"q": "What is the coefficient of x² in (1 − 2x)⁻¹?", "o": ["−4", "2", "−2", "4"], "a": 3, "e": "(1 − 2x)⁻¹ = 1 + 2x + 4x² + ..."}, {"q": "Expand (1 + 4x)^(−1/2) up to x.", "o": ["1 − 2x", "1 + 2x", "1 − x/2", "1 + 4x"], "a": 0, "e": "1 + (−½)(4x) = 1 − 2x."}, {"q": "Why does the expansion of (1 + x)ⁿ terminate when n is a positive integer?", "o": ["Because |x| < 1", "Because the coefficients eventually include a factor (n − n) = 0", "Because x is small", "It doesn't terminate"], "a": 1, "e": "From term n + 2 onwards, each coefficient contains a factor of zero."}, {"q": "Express (2x)/[(x − 1)(x + 1)] in partial fractions.", "o": ["2/(x − 1) + 2/(x + 1)", "1/(x − 1) − 1/(x + 1)", "1/(x − 1) + 1/(x + 1)", "2/(x − 1) − 2/(x + 1)"], "a": 2, "e": "2x = A(x + 1) + B(x − 1). x = 1: A = 1. x = −1: B = 1."}, {"q": "Use (1 + x)^(1/2) ≈ 1 + x/2 − x²/8 with x = 0.02 to estimate √1.02.", "o": ["1.0201", "1.01", "1.02", "1.00995"], "a": 3, "e": "1 + 0.01 − 0.00005 = 1.00995."}, {"q": "(3x + 4)/[x(x + 2)] = A/x + B/(x + 2). Find A.", "o": ["2", "1", "4", "−1"], "a": 0, "e": "3x + 4 = A(x + 2) + Bx. x = 0: 4 = 2A, so A = 2."}, {"q": "For the previous question, find B.", "o": ["2", "1", "3", "−2"], "a": 1, "e": "x = −2: −2 = −2B, so B = 1."}, {"q": "What is the coefficient of x² in (1 + x)^(−3)?", "o": ["−3", "3", "6", "−6"], "a": 2, "e": "(−3)(−4)/2 = 6."}, {"q": "Expand (1 − x)^(−2) up to x².", "o": ["1 − 2x + 3x²", "1 + 2x − 3x²", "1 − 2x − 3x²", "1 + 2x + 3x²"], "a": 3, "e": "1 + (−2)(−x) + (−2)(−3)(−x)²/2 = 1 + 2x + 3x²."}, {"q": "To expand (3x + 1)/[(1 + x)(1 − 2x)], what is the best first step?", "o": ["Split into partial fractions, then expand each term", "Multiply the denominators out", "Expand the numerator", "Divide by x"], "a": 0, "e": "Each partial fraction can then be expanded as a binomial."}, {"q": "The expansion of (1 + ax)ⁿ begins 1 − 6x + 27x². Which pair gives this?", "o": ["n = 2, a = −3", "n = −2, a = 3", "n = −3, a = 2", "n = 3, a = −2"], "a": 1, "e": "na = −6 and n(n − 1)a²/2 = 27. n = −2, a = 3: na = −6 ✓, (−2)(−3)(9)/2 = 27 ✓."}]}, {"id": "p13", "order": 19, "year": 2, "section": "P", "badge": "D", "spec": "D", "title": "Sequences and series", "desc": "nth terms and recurrence relations, increasing, decreasing and periodic sequences, sigma notation, arithmetic and geometric sequences and series, and sum to infinity.", "practicals": [], "summary": [{"h": "Sequences", "p": ["A sequence can be defined by an **nth term** formula, e.g. uₙ = 3n + 1, or a **recurrence relation**, e.g. uₙ₊₁ = 2uₙ − 1, u₁ = 3.", "**Increasing**: uₙ₊₁ > uₙ for all n. **Decreasing**: uₙ₊₁ < uₙ. **Periodic**: terms repeat with period k (uₙ₊ₖ = uₙ).", "**Sigma notation**: Σ (r = 1 to n) of f(r) means add f(1) + f(2) + ... + f(n)."]}, {"h": "Arithmetic sequences and series", "p": ["Constant **common difference d**.", "`uₙ = a + (n − 1)d`", "`Sₙ = n/2 [2a + (n − 1)d] = n/2 (a + l)`, where l is the last term.", "Sum of the first n integers: n(n + 1)/2."]}, {"h": "Geometric sequences and series", "p": ["Constant **common ratio r**.", "`uₙ = arⁿ⁻¹`", "`Sₙ = a(1 − rⁿ)/(1 − r)` (or a(rⁿ − 1)/(r − 1))", "A geometric series **converges** if **|r| < 1**. Then `S∞ = a/(1 − r)`.", "To find n in a geometric problem, you will usually need **logarithms**."]}], "pitfalls": ["The nth term uses **(n − 1)**, not n.", "S∞ only exists for |r| < 1.", "When solving rⁿ > k with logs and r < 1, log r is negative, so the inequality **reverses**."], "examples": [{"q": "An arithmetic series has first term 5 and common difference 3. Find the sum of the first 20 terms.", "steps": ["S₂₀ = 20/2 [2(5) + 19(3)].", "= 10 [10 + 57] = 670."], "a": "670"}, {"q": "A geometric series has a = 12 and r = 0.75. Find the sum to infinity.", "steps": ["|r| < 1, so it converges.", "S∞ = 12/(1 − 0.75) = 12/0.25."], "a": "48"}], "questions": [{"q": "Find the 10th term of the arithmetic sequence 4, 7, 10, ...", "o": ["30", "31", "34", "28"], "a": 1, "e": "u₁₀ = 4 + 9 × 3 = 31."}, {"q": "Find the sum of the first 10 terms of 4, 7, 10, ...", "o": ["175", "155", "310", "185"], "a": 0, "e": "S₁₀ = 5[8 + 27] = 175."}, {"q": "Find the common ratio of 81, 27, 9, ...", "o": ["3", "−3", "1/3", "54"], "a": 2, "e": "27/81 = 1/3."}, {"q": "Find the 6th term of the geometric sequence 2, 6, 18, ...", "o": ["162", "54", "1458", "486"], "a": 3, "e": "u₆ = 2 × 3⁵ = 486."}, {"q": "Find the sum of the first 5 terms of 3, 6, 12, ...", "o": ["93", "48", "96", "45"], "a": 0, "e": "S₅ = 3(2⁵ − 1)/(2 − 1) = 3 × 31 = 93."}, {"q": "For which values of r does a geometric series have a sum to infinity?", "o": ["r > 1", "|r| < 1", "r > 0", "All r"], "a": 1, "e": "The terms must get smaller for the series to converge."}, {"q": "Find S∞ for 8 + 4 + 2 + 1 + ...", "o": ["15", "∞", "16", "32"], "a": 2, "e": "a = 8, r = ½: S∞ = 8/(1 − ½) = 16."}, {"q": "uₙ₊₁ = 2uₙ − 1, u₁ = 3. Find u₃.", "o": ["5", "17", "11", "9"], "a": 3, "e": "u₂ = 5, u₃ = 9."}, {"q": "Evaluate Σ (r = 1 to 4) of r².", "o": ["30", "16", "10", "100"], "a": 0, "e": "1 + 4 + 9 + 16 = 30."}, {"q": "What is the sum of the integers from 1 to 100?", "o": ["10 000", "5050", "5000", "10 100"], "a": 1, "e": "n(n + 1)/2 = 100 × 101/2 = 5050."}, {"q": "uₙ₊₁ = 1/uₙ with u₁ = 2. Describe the sequence.", "o": ["Increasing", "Decreasing", "Periodic with period 2", "Arithmetic"], "a": 2, "e": "2, ½, 2, ½, ... repeats every 2 terms."}, {"q": "An arithmetic sequence has u₃ = 11 and u₇ = 23. Find d.", "o": ["12", "4", "6", "3"], "a": 3, "e": "4d = 23 − 11 = 12, so d = 3."}, {"q": "A geometric series has a = 5 and S∞ = 20. Find r.", "o": ["3/4", "1/4", "4", "−3/4"], "a": 0, "e": "20 = 5/(1 − r), so 1 − r = 1/4, r = 3/4."}, {"q": "How many terms of 2 + 4 + 8 + ... are needed for the sum to exceed 1000?", "o": ["10", "9", "8", "11"], "a": 1, "e": "Sₙ = 2(2ⁿ − 1) > 1000, so 2ⁿ > 501. 2⁹ = 512, so n = 9."}, {"q": "Which formula gives the sum of an arithmetic series with first term a and last term l?", "o": ["n(a + l)", "a(1 − rⁿ)/(1 − r)", "n/2 (a + l)", "a + (n − 1)d"], "a": 2, "e": "The average of the first and last term, times the number of terms."}, {"q": "Is the sequence uₙ = 5 − 2n increasing or decreasing?", "o": ["Increasing", "Periodic", "Neither", "Decreasing"], "a": 3, "e": "Each term is 2 less than the one before."}, {"q": "A ball bounces to 80% of its previous height, starting from 5 m. What is the total distance travelled downwards?", "o": ["25 m", "20 m", "4 m", "45 m"], "a": 0, "e": "Downward drops: 5 + 4 + 3.2 + ... = 5/(1 − 0.8) = 25 m."}, {"q": "Evaluate Σ (r = 1 to 20) of (3r + 2).", "o": ["660", "670", "630", "640"], "a": 1, "e": "Arithmetic: first term 5, last term 62, n = 20. S = 10(5 + 62) = 670."}, {"q": "A salary starts at £20 000 and rises by 3% each year. What is the salary in year 5?", "o": ["£23 000", "£23 185.48", "£22 510.18", "£24 000"], "a": 2, "e": "u₅ = 20 000 × 1.03⁴ = £22 510.18."}, {"q": "Solve 0.9ⁿ < 0.1 for the smallest integer n.", "o": ["n = 21", "n = 10", "n = 9", "n = 22"], "a": 3, "e": "n > ln 0.1 / ln 0.9 = 21.85 (inequality reverses since ln 0.9 < 0). So n = 22."}, {"q": "What is the nth term of an arithmetic sequence?", "o": ["a + (n − 1)d", "a + nd", "arⁿ⁻¹", "n/2(2a + (n − 1)d)"], "a": 0, "e": "Start at a and add d, (n − 1) times."}, {"q": "A geometric series has r = −½ and a = 6. Find S∞.", "o": ["12", "4", "3", "−12"], "a": 1, "e": "6/(1 − (−½)) = 6/1.5 = 4."}]}, {"id": "p14", "order": 20, "year": 2, "section": "P", "badge": "E", "spec": "E", "title": "Radians and trigonometric functions", "desc": "Radian measure, arc length and sector area, small-angle approximations, sec, cosec and cot, and inverse trig functions.", "practicals": [], "summary": [{"h": "Radians", "p": ["**π radians = 180°**. To convert degrees to radians, multiply by π/180.", "Key values: 30° = π/6, 45° = π/4, 60° = π/3, 90° = π/2, 360° = 2π.", "**Arc length**: `s = rθ`. **Sector area**: `A = ½r²θ` (θ in radians).", "**Segment area** = sector − triangle = ½r²(θ − sin θ)."]}, {"h": "Small-angle approximations (θ in radians)", "p": ["`sin θ ≈ θ`", "`cos θ ≈ 1 − θ²/2`", "`tan θ ≈ θ`"]}, {"h": "Reciprocal functions", "p": ["`sec θ = 1/cos θ`, `cosec θ = 1/sin θ`, `cot θ = 1/tan θ = cos θ/sin θ`.", "Identities: `1 + tan²θ = sec²θ` and `1 + cot²θ = cosec²θ`.", "Graphs of sec and cosec have asymptotes where cos or sin is zero, and range |y| ≥ 1."]}, {"h": "Inverse trig functions", "p": ["**arcsin x**: domain −1 ≤ x ≤ 1, range −π/2 ≤ y ≤ π/2.", "**arccos x**: domain −1 ≤ x ≤ 1, range 0 ≤ y ≤ π.", "**arctan x**: domain all real x, range −π/2 < y < π/2.", "Their graphs are reflections of the restricted sin, cos and tan graphs in y = x."]}], "pitfalls": ["Use **radians** in s = rθ, A = ½r²θ, small-angle approximations and calculus.", "sec is 1/cos (not 1/sin). Remember: the third letter matches: **s**e**c** → **c**os, **c**o**s**ec → **s**in.", "Check your calculator mode before every trig calculation."], "examples": [{"q": "A sector has radius 6 cm and angle 1.2 radians. Find the arc length and area.", "steps": ["s = rθ = 6 × 1.2 = 7.2 cm.", "A = ½r²θ = ½ × 36 × 1.2 = 21.6 cm²."], "a": "7.2 cm and 21.6 cm²"}, {"q": "Use small-angle approximations to simplify (1 − cos 2θ)/(θ sin θ).", "steps": ["cos 2θ ≈ 1 − (2θ)²/2 = 1 − 2θ².", "1 − cos 2θ ≈ 2θ².", "θ sin θ ≈ θ²."], "a": "≈ 2"}], "questions": [{"q": "Convert 120° to radians.", "o": ["π/3", "2π/3", "3π/2", "4π/3"], "a": 1, "e": "120 × π/180 = 2π/3."}, {"q": "Convert 5π/6 radians to degrees.", "o": ["150°", "120°", "300°", "135°"], "a": 0, "e": "5π/6 × 180/π = 150°."}, {"q": "Find the arc length of a sector with radius 10 cm and angle 0.5 radians.", "o": ["50 cm", "25 cm", "5 cm", "20 cm"], "a": 2, "e": "s = rθ = 10 × 0.5 = 5 cm."}, {"q": "Find the area of a sector with radius 4 cm and angle π/4.", "o": ["π cm²", "4π cm²", "8π cm²", "2π cm²"], "a": 3, "e": "A = ½ × 16 × π/4 = 2π cm²."}, {"q": "What is the small-angle approximation for cos θ?", "o": ["1 − θ²/2", "θ", "1", "1 − θ"], "a": 0, "e": "cos θ ≈ 1 − θ²/2 for small θ in radians."}, {"q": "Use small angles to approximate sin 0.1.", "o": ["0.01", "0.1", "0.995", "1"], "a": 1, "e": "sin θ ≈ θ = 0.1."}, {"q": "What is sec θ?", "o": ["1/sin θ", "1/tan θ", "1/cos θ", "sin θ/cos θ"], "a": 2, "e": "sec θ = 1/cos θ."}, {"q": "Which identity is correct?", "o": ["1 + sec²θ = tan²θ", "sin²θ + sec²θ = 1", "1 + cosec²θ = cot²θ", "1 + tan²θ = sec²θ"], "a": 3, "e": "Divide sin²θ + cos²θ = 1 by cos²θ."}, {"q": "What is the exact value of cosec(π/6)?", "o": ["2", "1/2", "2/√3", "√3"], "a": 0, "e": "sin(π/6) = ½, so cosec = 2."}, {"q": "What is the range of y = sec x?", "o": ["−1 ≤ y ≤ 1", "y ≤ −1 or y ≥ 1", "y > 0", "All real y"], "a": 1, "e": "Since |cos x| ≤ 1, |sec x| ≥ 1."}, {"q": "What is the range of arccos x?", "o": ["−π/2 ≤ y ≤ π/2", "−π ≤ y ≤ π", "0 ≤ y ≤ π", "0 ≤ y ≤ 2π"], "a": 2, "e": "The cos function is restricted to 0 to π so it's one-to-one."}, {"q": "Evaluate arcsin(½) in radians.", "o": ["π/3", "π/4", "5π/6", "π/6"], "a": 3, "e": "sin(π/6) = ½."}, {"q": "What is the domain of arctan x?", "o": ["All real x", "−1 ≤ x ≤ 1", "x ≥ 0", "−π/2 < x < π/2"], "a": 0, "e": "tan takes every real value, so arctan is defined for all real x."}, {"q": "Solve sec x = 2 for 0 ≤ x < 2π.", "o": ["π/6, 11π/6", "π/3, 5π/3", "π/3, 2π/3", "π/6, 5π/6"], "a": 1, "e": "cos x = ½, so x = π/3 or 2π − π/3 = 5π/3."}, {"q": "Simplify 1 + cot²θ.", "o": ["sec²θ", "tan²θ", "cosec²θ", "1"], "a": 2, "e": "Divide sin²θ + cos²θ = 1 by sin²θ."}, {"q": "Find the area of the segment cut off by a chord in a circle of radius 2, angle π/2.", "o": ["π", "π − 1", "2", "π − 2"], "a": 3, "e": "½r²(θ − sin θ) = 2(π/2 − 1) = π − 2."}, {"q": "Using small-angle approximations, simplify (sin 3θ)/(2θ).", "o": ["3/2", "3θ/2", "2/3", "1"], "a": 0, "e": "sin 3θ ≈ 3θ, so 3θ/2θ = 3/2."}, {"q": "Why must θ be in radians for small-angle approximations?", "o": ["Degrees are too large", "The approximations come from the radian definition of the functions (e.g. sin θ ≈ θ only for radians)", "Calculators require it", "They don't need radians"], "a": 1, "e": "In degrees, sin 1° ≈ 0.0175, not 1."}, {"q": "What is the exact value of cot(π/4)?", "o": ["0", "√2", "1", "√3"], "a": 2, "e": "tan(π/4) = 1, so cot = 1."}, {"q": "Solve cosec x = −2 for 0 ≤ x < 2π.", "o": ["π/6, 5π/6", "7π/6, 5π/3", "4π/3, 5π/3", "7π/6, 11π/6"], "a": 3, "e": "sin x = −½, so x = π + π/6 = 7π/6 or 2π − π/6 = 11π/6."}, {"q": "A sector has area 12 cm² and radius 4 cm. Find the angle.", "o": ["1.5 radians", "3 radians", "0.75 radians", "6 radians"], "a": 0, "e": "12 = ½ × 16 × θ, so θ = 1.5."}, {"q": "Solve tan²x = 3 for 0 ≤ x < π.", "o": ["π/3 only", "π/3 and 2π/3", "π/6 and 5π/6", "π/4 and 3π/4"], "a": 1, "e": "tan x = ±√3: x = π/3 or 2π/3 in [0, π)."}]}, {"id": "p15", "order": 21, "year": 2, "section": "P", "badge": "E", "spec": "E", "title": "Trigonometric identities", "desc": "Compound angle and double angle formulae, the R cos(θ ± α) and R sin(θ ± α) forms, proving identities and solving equations.", "practicals": [], "summary": [{"h": "Compound angle formulae", "p": ["`sin(A ± B) = sin A cos B ± cos A sin B`", "`cos(A ± B) = cos A cos B ∓ sin A sin B`", "`tan(A ± B) = (tan A ± tan B)/(1 ∓ tan A tan B)`"]}, {"h": "Double angle formulae", "p": ["`sin 2A = 2 sin A cos A`", "`cos 2A = cos²A − sin²A = 2cos²A − 1 = 1 − 2sin²A`", "`tan 2A = 2tan A/(1 − tan²A)`", "Choose the cos 2A version that leaves the equation in a single trig function."]}, {"h": "R cos(θ ± α) and R sin(θ ± α)", "p": ["`a sin θ + b cos θ = R sin(θ + α)`, where `R = √(a² + b²)` and `tan α = b/a`.", "Expand R sin(θ + α) = R sin θ cos α + R cos θ sin α, and compare coefficients: R cos α = a, R sin α = b.", "The maximum value is **R** and the minimum is **−R**. Use this to find max/min and to solve equations."]}, {"h": "Proving identities", "p": ["Start from **one side** (usually the more complicated) and work towards the other.", "Useful tools: sin²θ + cos²θ = 1, 1 + tan²θ = sec²θ, double angle formulae, writing everything in terms of sin and cos."]}], "pitfalls": ["The cos compound formula has the **opposite** sign: cos(A + B) has a minus.", "Find α from tan α = b/a, but check signs from R cos α and R sin α.", "When solving R sin(θ + α) = k, adjust the interval for θ + α first."], "examples": [{"q": "Express 3 sin θ + 4 cos θ in the form R sin(θ + α), with 0 < α < 90°.", "steps": ["R = √(9 + 16) = 5.", "R cos α = 3 and R sin α = 4, so tan α = 4/3.", "α = 53.13°."], "a": "5 sin(θ + 53.1°)"}, {"q": "Show that sin 75° = (√6 + √2)/4.", "steps": ["sin(45° + 30°) = sin 45° cos 30° + cos 45° sin 30°.", "= (√2/2)(√3/2) + (√2/2)(1/2) = (√6 + √2)/4."], "a": "As required. ∎"}], "questions": [{"q": "Expand sin(A + B).", "o": ["sin A sin B + cos A cos B", "sin A cos B + cos A sin B", "sin A cos B − cos A sin B", "cos A cos B − sin A sin B"], "a": 1, "e": "This is the compound angle formula for sine."}, {"q": "Expand cos(A + B).", "o": ["cos A cos B − sin A sin B", "cos A cos B + sin A sin B", "sin A cos B + cos A sin B", "cos A sin B − sin A cos B"], "a": 0, "e": "Note the minus sign for cos(A + B)."}, {"q": "What is sin 2A?", "o": ["2 sin A", "sin²A − cos²A", "2 sin A cos A", "sin A cos A"], "a": 2, "e": "From sin(A + A)."}, {"q": "Which is NOT an expression for cos 2A?", "o": ["cos²A − sin²A", "2cos²A − 1", "1 − 2sin²A", "2 sin A cos A"], "a": 3, "e": "2 sin A cos A is sin 2A."}, {"q": "Find the exact value of cos 15° using cos(45° − 30°).", "o": ["(√6 + √2)/4", "(√6 − √2)/4", "(√3 − 1)/2", "√2/4"], "a": 0, "e": "cos 45° cos 30° + sin 45° sin 30° = (√6 + √2)/4."}, {"q": "Express 4 sin θ + 3 cos θ as R sin(θ + α). Find R.", "o": ["7", "5", "1", "25"], "a": 1, "e": "R = √(16 + 9) = 5."}, {"q": "For 4 sin θ + 3 cos θ = R sin(θ + α), find tan α.", "o": ["4/3", "4/5", "3/4", "3/5"], "a": 2, "e": "R cos α = 4 and R sin α = 3, so tan α = 3/4."}, {"q": "What is the maximum value of 5 sin(θ + 0.6)?", "o": ["1", "0.6", "5.6", "5"], "a": 3, "e": "sin has maximum 1, so 5 sin(...) has maximum 5."}, {"q": "What is the minimum value of 2 + 3 cos(θ − α)?", "o": ["−1", "−3", "2", "5"], "a": 0, "e": "cos has minimum −1, so 2 − 3 = −1."}, {"q": "Write cos 2θ in terms of sin θ only.", "o": ["2sin²θ − 1", "1 − 2sin²θ", "sin²θ − 1", "1 − sin²θ"], "a": 1, "e": "cos 2θ = 1 − 2sin²θ."}, {"q": "Solve sin 2x = sin x for 0 ≤ x ≤ 180°.", "o": ["0°, 180° only", "60° only", "0°, 60°, 180°", "30°, 150°"], "a": 2, "e": "2 sin x cos x − sin x = 0, so sin x(2cos x − 1) = 0. sin x = 0: 0°, 180°. cos x = ½: 60°."}, {"q": "Simplify 2 sin 3x cos 3x.", "o": ["sin 3x", "cos 6x", "2 sin 6x", "sin 6x"], "a": 3, "e": "2 sin A cos A = sin 2A with A = 3x."}, {"q": "Simplify 1 − 2sin²(2θ).", "o": ["cos 4θ", "cos 2θ", "sin 4θ", "cos²2θ"], "a": 0, "e": "1 − 2sin²A = cos 2A with A = 2θ."}, {"q": "Find tan(A + B) when tan A = 1/2 and tan B = 1/3.", "o": ["5/6", "1", "1/6", "5/7"], "a": 1, "e": "(½ + ⅓)/(1 − ⅙) = (5/6)/(5/6) = 1."}, {"q": "When proving an identity, what is the usual strategy?", "o": ["Work on both sides at once and cross-multiply", "Substitute a value of θ", "Start from one side and manipulate it into the other side", "Square both sides"], "a": 2, "e": "Substituting a value only checks one case; it isn't a proof."}, {"q": "Express cos θ − √3 sin θ as R cos(θ + α). Find R.", "o": ["4", "√3", "1", "2"], "a": 3, "e": "R = √(1 + 3) = 2."}, {"q": "For cos θ − √3 sin θ = R cos(θ + α), find α (0 < α < π/2).", "o": ["π/3", "π/6", "π/4", "2π/3"], "a": 0, "e": "R cos α = 1, R sin α = √3, so tan α = √3, α = π/3."}, {"q": "Write sin²x in terms of cos 2x.", "o": ["(1 + cos 2x)/2", "(1 − cos 2x)/2", "1 − cos 2x", "cos 2x − 1"], "a": 1, "e": "From cos 2x = 1 − 2sin²x. This is useful for integrating sin²x."}, {"q": "Write cos²x in terms of cos 2x.", "o": ["(1 − cos 2x)/2", "2cos 2x − 1", "(1 + cos 2x)/2", "cos 2x + 1"], "a": 2, "e": "From cos 2x = 2cos²x − 1."}, {"q": "What is tan 2A?", "o": ["2 tan A", "tan²A − 1", "2tan A/(1 + tan²A)", "2tan A/(1 − tan²A)"], "a": 3, "e": "From tan(A + A)."}, {"q": "Solve cos 2x = cos x for 0 ≤ x < 360°.", "o": ["0°, 120°, 240°", "0° only", "60°, 300°", "120°, 240°"], "a": 0, "e": "2cos²x − cos x − 1 = 0, so (2cos x + 1)(cos x − 1) = 0. cos x = 1: 0°. cos x = −½: 120°, 240°."}, {"q": "What is sin(A − B)?", "o": ["sin A cos B + cos A sin B", "sin A cos B − cos A sin B", "cos A cos B − sin A sin B", "sin A sin B − cos A cos B"], "a": 1, "e": "Replace B with −B in the sin(A + B) formula."}]}, {"id": "p16", "order": 22, "year": 2, "section": "P", "badge": "C", "spec": "C", "title": "Parametric equations", "desc": "Defining curves parametrically, converting between parametric and Cartesian forms, sketching parametric curves and modelling with parametric equations.", "practicals": [], "summary": [{"h": "Parametric equations", "p": ["Both x and y are given in terms of a third variable, the **parameter** (often t or θ): x = f(t), y = g(t).", "Each value of t gives a point (x, y) on the curve. The **domain** of t controls which part of the curve is drawn."]}, {"h": "Converting to Cartesian form", "p": ["**Eliminate** the parameter: rearrange one equation for t and substitute into the other.", "For trig parameters, use identities: e.g. x = 3cos θ, y = 3sin θ gives x² + y² = 9 (circle).", "x = a + r cos θ, y = b + r sin θ is a circle centre (a, b), radius r.", "The range of x and y in Cartesian form comes from the parametric domain."]}, {"h": "Applications", "p": ["To find where a parametric curve meets a line or axis, substitute the parametric expressions into the line's equation and solve for t.", "Parametric equations are used to model motion, e.g. projectiles: x = ut cos α, y = ut sin α − ½gt².", "Differentiating parametric equations (dy/dx = (dy/dt)/(dx/dt)) is covered in Further differentiation."]}], "pitfalls": ["After converting, state any **restrictions** on x or y from the parameter's domain.", "Use the right trig identity: sin² + cos² = 1 or 1 + tan² = sec².", "To find where a curve crosses the x-axis, set **y = 0** and solve for t, then find x."], "examples": [{"q": "Find the Cartesian equation of x = t + 1, y = t² − 2.", "steps": ["t = x − 1.", "y = (x − 1)² − 2."], "a": "y = x² − 2x − 1"}, {"q": "A curve has x = 2cos t, y = 5sin t. Find its Cartesian equation.", "steps": ["cos t = x/2 and sin t = y/5.", "cos²t + sin²t = 1 gives x²/4 + y²/25 = 1."], "a": "x²/4 + y²/25 = 1 (an ellipse)"}], "questions": [{"q": "What is a parameter in parametric equations?", "o": ["A constant", "A third variable that both x and y depend on", "The gradient", "The y-intercept"], "a": 1, "e": "E.g. t in x = t², y = 2t."}, {"q": "x = 2t, y = t². Find the point where t = 3.", "o": ["(6, 9)", "(9, 6)", "(3, 9)", "(6, 6)"], "a": 0, "e": "x = 6, y = 9."}, {"q": "Find the Cartesian equation of x = 2t, y = t².", "o": ["y = 2x²", "y = x/2", "y = x²/4", "y = 4x²"], "a": 2, "e": "t = x/2, so y = x²/4."}, {"q": "Find the Cartesian equation of x = 3cos θ, y = 3sin θ.", "o": ["x + y = 3", "y = 3x", "x² − y² = 9", "x² + y² = 9"], "a": 3, "e": "x² + y² = 9(cos²θ + sin²θ) = 9."}, {"q": "x = 1 + 2cos θ, y = −3 + 2sin θ describes what?", "o": ["A circle, centre (1, −3), radius 2", "A circle, centre (−1, 3), radius 2", "A circle, centre (1, −3), radius 4", "An ellipse"], "a": 0, "e": "(x − 1)² + (y + 3)² = 4."}, {"q": "x = t + 2, y = 3t − 1. Find the Cartesian equation.", "o": ["y = 3x + 5", "y = 3x − 7", "y = x + 1", "y = 3x − 1"], "a": 1, "e": "t = x − 2, so y = 3(x − 2) − 1 = 3x − 7."}, {"q": "x = t², y = 2t − 1. Where does the curve cross the y-axis?", "o": ["(1, 0)", "(0, 1)", "(0, −1)", "(−1, 0)"], "a": 2, "e": "x = 0 gives t = 0, so y = −1."}, {"q": "x = t², y = t³. Find the Cartesian equation.", "o": ["y = x^(2/3)", "y = x²", "y = x³", "y² = x³"], "a": 3, "e": "t = y^(1/3), x = y^(2/3), so x³ = y²."}, {"q": "x = sec t, y = tan t. Which identity gives the Cartesian equation?", "o": ["1 + tan²t = sec²t, so x² − y² = 1", "sin²t + cos²t = 1", "1 + cot²t = cosec²t", "cos 2t = 1 − 2sin²t"], "a": 0, "e": "sec²t − tan²t = 1, so x² − y² = 1."}, {"q": "x = 2t, y = 4/t (t ≠ 0). Find the Cartesian equation.", "o": ["y = 2x", "xy = 8", "y = 8x", "xy = 2"], "a": 1, "e": "t = x/2, so y = 4/(x/2) = 8/x."}, {"q": "x = 3t − 1, y = t + 4. Where does the curve meet the line y = x?", "o": ["(4, 4)", "(5, 5)", "(6.5, 6.5)", "(2, 2)"], "a": 2, "e": "t + 4 = 3t − 1, so t = 2.5. x = 6.5, y = 6.5."}, {"q": "x = cos t, y = sin 2t. Write y in terms of x (for sin t ≥ 0).", "o": ["y = 2x", "y = x²", "y = 2x²", "y = 2x√(1 − x²)"], "a": 3, "e": "sin 2t = 2 sin t cos t = 2x√(1 − x²) when sin t ≥ 0."}, {"q": "x = t², 0 ≤ t ≤ 3. What is the range of x?", "o": ["0 ≤ x ≤ 9", "0 ≤ x ≤ 3", "x ≥ 0", "−9 ≤ x ≤ 9"], "a": 0, "e": "x increases from 0 to 9 as t goes from 0 to 3."}, {"q": "A projectile moves with x = 20t, y = 15t − 4.9t². When does it land (y = 0, t > 0)?", "o": ["t = 15 s", "t ≈ 3.06 s", "t ≈ 1.53 s", "t = 20 s"], "a": 1, "e": "t(15 − 4.9t) = 0, so t = 15/4.9 ≈ 3.06 s."}, {"q": "For the projectile x = 20t, y = 15t − 4.9t², how far does it travel horizontally?", "o": ["30.6 m", "15.3 m", "61.2 m", "300 m"], "a": 2, "e": "x = 20 × 3.061 ≈ 61.2 m."}, {"q": "x = 4cos θ, y = 3sin θ. What shape is the curve?", "o": ["A circle", "A parabola", "A straight line", "An ellipse"], "a": 3, "e": "x²/16 + y²/9 = 1, an ellipse."}, {"q": "x = t − 1, y = t² + 1. Find where the curve meets the x-axis.", "o": ["It never meets the x-axis", "(−1, 0)", "(0, 1)", "(1, 0)"], "a": 0, "e": "y = t² + 1 is always at least 1."}, {"q": "x = e^t, y = e^(2t). Find the Cartesian equation.", "o": ["y = 2x", "y = x², x > 0", "y = eˣ", "y = ln x"], "a": 1, "e": "e^(2t) = (e^t)² = x². Since e^t > 0, x > 0."}, {"q": "Why might parametric equations be useful for modelling motion?", "o": ["They avoid all calculation", "They only work for circles", "They give both x and y positions as functions of time", "They remove gravity"], "a": 2, "e": "The parameter t can represent time."}, {"q": "x = 2t + 1, y = t − 3 for −1 ≤ t ≤ 2. What is the domain of x in the Cartesian form?", "o": ["−1 ≤ x ≤ 2", "−3 ≤ x ≤ 2", "x ≥ −1", "−1 ≤ x ≤ 5"], "a": 3, "e": "t = −1 gives x = −1; t = 2 gives x = 5."}, {"q": "x = 3 + t, y = 2 − 2t. What is the gradient of this line?", "o": ["−2", "2", "−1/2", "3"], "a": 0, "e": "t = x − 3, y = 2 − 2(x − 3) = 8 − 2x. Gradient −2."}, {"q": "x = cos 2t, y = sin t. Find the Cartesian equation.", "o": ["x = 1 − y", "x = 1 − 2y²", "x² + y² = 1", "x = 2y² − 1"], "a": 1, "e": "cos 2t = 1 − 2sin²t."}]}, {"id": "p17", "order": 23, "year": 2, "section": "P", "badge": "G", "spec": "G", "title": "Differentiation techniques", "desc": "Derivatives of eˣ, ln x, aˣ and trig functions, the chain, product and quotient rules, and differentiating inverse functions.", "practicals": [], "summary": [{"h": "Standard derivatives", "p": ["`d/dx (eᵏˣ) = keᵏˣ`, `d/dx (ln x) = 1/x`, `d/dx (aˣ) = aˣ ln a`.", "`d/dx (sin kx) = k cos kx`, `d/dx (cos kx) = −k sin kx`, `d/dx (tan kx) = k sec²kx`.", "Also from the formula book: d/dx (sec x) = sec x tan x, d/dx (cosec x) = −cosec x cot x, d/dx (cot x) = −cosec²x.", "Trig derivatives only work with x in **radians**.", "sin x and cos x can be differentiated from first principles using small-angle approximations."]}, {"h": "Chain rule", "p": ["For a function of a function: `dy/dx = dy/du × du/dx`.", "E.g. y = (3x + 1)⁵: dy/dx = 5(3x + 1)⁴ × 3 = 15(3x + 1)⁴.", "`d/dx [ln f(x)] = f′(x)/f(x)` and `d/dx [e^f(x)] = f′(x)e^f(x)`.", "Inverse: `dx/dy = 1 ÷ (dy/dx)`."]}, {"h": "Product and quotient rules", "p": ["**Product rule**: y = uv, `dy/dx = u dv/dx + v du/dx`.", "**Quotient rule**: y = u/v, `dy/dx = (v du/dx − u dv/dx)/v²`."]}], "pitfalls": ["Don't forget to multiply by the **derivative of the inside** in the chain rule.", "The quotient rule has a **minus** and the order matters: v u′ − u v′.", "d/dx (ln 3x) = 1/x, not 3/x, because ln 3x = ln 3 + ln x."], "examples": [{"q": "Differentiate y = x² sin x.", "steps": ["u = x², v = sin x; u′ = 2x, v′ = cos x.", "dy/dx = x² cos x + 2x sin x."], "a": "x² cos x + 2x sin x"}, {"q": "Differentiate y = eˣ/(x + 1).", "steps": ["u = eˣ, v = x + 1; u′ = eˣ, v′ = 1.", "dy/dx = [(x + 1)eˣ − eˣ]/(x + 1)²."], "a": "xeˣ/(x + 1)²"}], "questions": [{"q": "Differentiate y = e^(5x).", "o": ["e^(5x)", "5e^(5x)", "5x e^(5x)", "e^(5x)/5"], "a": 1, "e": "d/dx (eᵏˣ) = keᵏˣ."}, {"q": "Differentiate y = ln x.", "o": ["1/x", "ln x/x", "x", "eˣ"], "a": 0, "e": "A standard result."}, {"q": "Differentiate y = sin 3x.", "o": ["cos 3x", "−3 cos 3x", "3 cos 3x", "3 sin 3x"], "a": 2, "e": "d/dx (sin kx) = k cos kx."}, {"q": "Differentiate y = cos 2x.", "o": ["2 sin 2x", "sin 2x", "−sin 2x", "−2 sin 2x"], "a": 3, "e": "d/dx (cos kx) = −k sin kx."}, {"q": "Differentiate y = (2x + 1)⁴.", "o": ["8(2x + 1)³", "4(2x + 1)³", "2(2x + 1)³", "8(2x + 1)⁴"], "a": 0, "e": "Chain rule: 4(2x + 1)³ × 2."}, {"q": "Differentiate y = ln(x² + 1).", "o": ["1/(x² + 1)", "2x/(x² + 1)", "2x ln(x² + 1)", "x/(x² + 1)"], "a": 1, "e": "f′(x)/f(x) = 2x/(x² + 1)."}, {"q": "Differentiate y = e^(x²).", "o": ["e^(x²)", "x²e^(x²−1)", "2x e^(x²)", "2e^(x²)"], "a": 2, "e": "Chain rule: e^(x²) × 2x."}, {"q": "Differentiate y = 2ˣ.", "o": ["x 2ˣ⁻¹", "2ˣ", "2ˣ/ln 2", "2ˣ ln 2"], "a": 3, "e": "d/dx (aˣ) = aˣ ln a."}, {"q": "Differentiate y = x eˣ.", "o": ["eˣ(x + 1)", "eˣ", "x eˣ", "eˣ + 1"], "a": 0, "e": "Product rule: x eˣ + eˣ."}, {"q": "Differentiate y = x³ ln x.", "o": ["3x²/x", "3x² ln x + x²", "x² ln x", "3x² ln x + x³"], "a": 1, "e": "u = x³, v = ln x. 3x² ln x + x³ × 1/x = 3x² ln x + x²."}, {"q": "Differentiate y = sin x/x.", "o": ["cos x/1", "(x cos x + sin x)/x²", "(x cos x − sin x)/x²", "(sin x − x cos x)/x²"], "a": 2, "e": "Quotient rule: (v u′ − u v′)/v² = (x cos x − sin x)/x²."}, {"q": "Differentiate y = tan 4x.", "o": ["sec²4x", "4 tan 4x", "−4 sec²4x", "4 sec²4x"], "a": 3, "e": "d/dx (tan kx) = k sec²kx."}, {"q": "Differentiate y = ln(5x).", "o": ["1/x", "5/x", "1/(5x)", "5 ln x"], "a": 0, "e": "ln 5x = ln 5 + ln x, so the derivative is 1/x."}, {"q": "x = y³ + y. Find dy/dx in terms of y.", "o": ["3y² + 1", "1/(3y² + 1)", "3y²", "y³"], "a": 1, "e": "dx/dy = 3y² + 1, so dy/dx = 1/(3y² + 1)."}, {"q": "Differentiate y = √(1 + 2x).", "o": ["½(1 + 2x)^(−1/2)", "2(1 + 2x)^(−1/2)", "(1 + 2x)^(−1/2)", "(1 + 2x)^(1/2)"], "a": 2, "e": "½(1 + 2x)^(−1/2) × 2 = (1 + 2x)^(−1/2)."}, {"q": "Find the gradient of y = eˣ sin x at x = 0.", "o": ["0", "2", "e", "1"], "a": 3, "e": "dy/dx = eˣ sin x + eˣ cos x = 0 + 1 = 1 at x = 0."}, {"q": "What is the quotient rule for y = u/v?", "o": ["(v u′ − u v′)/v²", "(u v′ − v u′)/v²", "u′/v′", "(u′v + uv′)/v²"], "a": 0, "e": "Remember the order: v du/dx minus u dv/dx, over v squared."}, {"q": "Differentiate y = sin²x.", "o": ["cos²x", "2 sin x cos x", "2 cos x", "−2 sin x cos x"], "a": 1, "e": "Chain rule: 2 sin x × cos x (= sin 2x)."}, {"q": "Why must x be in radians when differentiating trig functions?", "o": ["Calculators require it", "Degrees don't have derivatives", "The results like d/dx(sin x) = cos x come from small-angle approximations, which only hold in radians", "It's a convention only"], "a": 2, "e": "In degrees, extra factors of π/180 would appear."}, {"q": "Differentiate y = e^(−x) cos x.", "o": ["e^(−x) sin x", "−e^(−x)(cos x − sin x)", "e^(−x)(cos x − sin x)", "−e^(−x)(cos x + sin x)"], "a": 3, "e": "−e^(−x) cos x + e^(−x)(−sin x) = −e^(−x)(cos x + sin x)."}, {"q": "Differentiate y = sec x.", "o": ["sec x tan x", "sec²x", "−sec x tan x", "cosec x"], "a": 0, "e": "A standard result from the formula book."}, {"q": "Differentiate y = 1/(x² + 3).", "o": ["1/(2x)", "−2x/(x² + 3)²", "2x/(x² + 3)²", "−1/(x² + 3)²"], "a": 1, "e": "(x² + 3)⁻¹ → −(x² + 3)⁻² × 2x."}]}, {"id": "p18", "order": 24, "year": 2, "section": "P", "badge": "G", "spec": "G", "title": "Further differentiation", "desc": "Parametric and implicit differentiation, connected rates of change, points of inflection, and convex and concave curves.", "practicals": [], "summary": [{"h": "Parametric differentiation", "p": ["`dy/dx = (dy/dt) ÷ (dx/dt)`", "Find tangents and normals by evaluating at a particular t."]}, {"h": "Implicit differentiation", "p": ["Differentiate every term with respect to x. When differentiating a function of y, multiply by **dy/dx**: `d/dx (y²) = 2y dy/dx`.", "Use the **product rule** for terms like xy: `d/dx (xy) = x dy/dx + y`.", "Collect dy/dx terms on one side and factorise."]}, {"h": "Connected rates of change", "p": ["Link rates using the chain rule, e.g. `dV/dt = dV/dr × dr/dt`.", "Form differential equations from statements like 'the rate of change of P is proportional to P': dP/dt = kP."]}, {"h": "Second derivatives, concavity and inflection", "p": ["**Convex** (curving upwards, like ∪): f″(x) > 0. **Concave** (like ∩): f″(x) < 0.", "A **point of inflection** is where the curve changes from convex to concave (or vice versa): f″(x) = 0 **and changes sign**.", "A **stationary point of inflection** also has f′(x) = 0."]}], "pitfalls": ["In implicit differentiation, don't forget dy/dx on **every** y term, and the product rule for xy.", "f″(x) = 0 alone doesn't guarantee an inflection: check the **sign changes**.", "In connected rates of change, write the chain of rates clearly so units cancel."], "examples": [{"q": "x = t², y = t³. Find dy/dx when t = 2.", "steps": ["dx/dt = 2t, dy/dt = 3t².", "dy/dx = 3t²/(2t) = 3t/2."], "a": "3 at t = 2"}, {"q": "Find dy/dx for x² + y² + 3xy = 5.", "steps": ["2x + 2y dy/dx + 3(x dy/dx + y) = 0.", "dy/dx(2y + 3x) = −2x − 3y."], "a": "dy/dx = −(2x + 3y)/(2y + 3x)"}], "questions": [{"q": "x = 3t, y = t². Find dy/dx.", "o": ["2t", "2t/3", "3/(2t)", "t²/3"], "a": 1, "e": "dy/dx = (2t)/(3)."}, {"q": "x = cos t, y = sin t. Find dy/dx.", "o": ["−cot t", "tan t", "cot t", "−tan t"], "a": 0, "e": "dy/dx = cos t/(−sin t) = −cot t."}, {"q": "Differentiate y³ with respect to x.", "o": ["3y²", "3y²x", "3y² dy/dx", "y³ dy/dx"], "a": 2, "e": "Chain rule: d/dy (y³) × dy/dx."}, {"q": "Differentiate xy with respect to x.", "o": ["y", "x dy/dx", "dy/dx", "x dy/dx + y"], "a": 3, "e": "Product rule on x and y."}, {"q": "Find dy/dx for x² + y² = 25.", "o": ["−x/y", "x/y", "−y/x", "2x + 2y"], "a": 0, "e": "2x + 2y dy/dx = 0, so dy/dx = −x/y."}, {"q": "For x² + y² = 25, what is the gradient at (3, 4)?", "o": ["3/4", "−3/4", "4/3", "−4/3"], "a": 1, "e": "−x/y = −3/4."}, {"q": "Find dy/dx for eʸ = x.", "o": ["eʸ", "x", "1/x", "ln x"], "a": 2, "e": "eʸ dy/dx = 1, so dy/dx = 1/eʸ = 1/x."}, {"q": "A sphere's radius increases at 0.1 cm s⁻¹. How fast is the volume increasing when r = 5 cm? (V = 4πr³/3)", "o": ["100π cm³ s⁻¹", "π cm³ s⁻¹", "20π cm³ s⁻¹", "10π cm³ s⁻¹"], "a": 3, "e": "dV/dr = 4πr² = 100π. dV/dt = 100π × 0.1 = 10π."}, {"q": "The rate of decrease of temperature T is proportional to T. Which equation is correct?", "o": ["dT/dt = −kT", "dT/dt = kT", "T = −kt", "dT/dt = −k"], "a": 0, "e": "'Decrease' gives a negative sign, with k > 0."}, {"q": "When is a curve convex?", "o": ["When f′(x) > 0", "When f″(x) > 0", "When f″(x) < 0", "When f(x) > 0"], "a": 1, "e": "Convex curves bend upwards, so the gradient increases."}, {"q": "What is a point of inflection?", "o": ["Any point where f′(x) = 0", "A maximum", "A point where the curve changes between convex and concave", "Where f(x) = 0"], "a": 2, "e": "f″(x) changes sign there."}, {"q": "Find the x-coordinate of the point of inflection of y = x³ − 6x².", "o": ["x = 0", "x = 4", "x = 6", "x = 2"], "a": 3, "e": "y″ = 6x − 12 = 0 at x = 2, and it changes sign."}, {"q": "For y = x⁴, f″(0) = 0. Is x = 0 a point of inflection?", "o": ["No, because f″(x) = 12x² doesn't change sign", "Yes, because f″(0) = 0", "Yes, because it's stationary", "Cannot tell"], "a": 0, "e": "y = x⁴ is convex on both sides of 0, so x = 0 is a minimum, not an inflection."}, {"q": "On what interval is y = x³ concave?", "o": ["x > 0", "x < 0", "All x", "x = 0 only"], "a": 1, "e": "y″ = 6x < 0 when x < 0."}, {"q": "x = t + 1/t, y = t − 1/t. Find dy/dx at t = 2.", "o": ["1", "3/5", "5/3", "−1"], "a": 2, "e": "dx/dt = 1 − 1/t² = 3/4, dy/dt = 1 + 1/t² = 5/4. dy/dx = 5/3."}, {"q": "Find dy/dx for y² = 4x.", "o": ["4", "2y", "y/2", "2/y"], "a": 3, "e": "2y dy/dx = 4, so dy/dx = 2/y."},
