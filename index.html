<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AQA Maths Study Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: Finance Study Hub design carried over — dark-first, gold brand accent, one colour per AQA spec section. */
:root {
  color-scheme: dark;
  --bg:#09090f; --surface:#111118; --card:#16161e; --card-hover:#1c1c26;
  --border:#2a2a38; --border-hi:#3d3d52; --text:#f0efff; --muted:#8b8aab; --dim:#6a6985;
  --gold:#e8b84b; --gold-dim:#a8832a; --gold-bg:rgba(232,184,75,0.08);
  --topbar:rgba(9,9,15,0.85);
  --correct:#34d399; --correct-bg:rgba(52,211,153,0.12); --wrong:#f87171; --wrong-bg:rgba(248,113,113,0.12);
  --on-accent:#0b0b12;
  --s1:#818cf8; --s2:#38bdf8; --s3:#2dd4bf; --s4:#a78bfa; --s5:#fbbf24; --s6:#fb7185; --s7:#34d399; --s8:#e879f9;
  --font:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#f5f4f0; --surface:#eeede8; --card:#ffffff; --card-hover:#fafaf8;
    --border:#dddbd4; --border-hi:#c8c5bc; --text:#1a1814; --muted:#635f54; --dim:#8a867a;
    --gold:#9a6f12; --gold-dim:#c9982c; --gold-bg:rgba(184,134,26,0.08);
    --topbar:rgba(245,244,240,0.9);
    --correct:#047857; --correct-bg:rgba(5,150,105,0.10); --wrong:#c81e1e; --wrong-bg:rgba(220,38,38,0.09);
    --on-accent:#ffffff;
    --s1:#4f46e5; --s2:#0369a1; --s3:#0f766e; --s4:#6d28d9; --s5:#b45309; --s6:#be123c; --s7:#047857; --s8:#a21caf;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#f5f4f0; --surface:#eeede8; --card:#ffffff; --card-hover:#fafaf8;
  --border:#dddbd4; --border-hi:#c8c5bc; --text:#1a1814; --muted:#635f54; --dim:#8a867a;
  --gold:#9a6f12; --gold-dim:#c9982c; --gold-bg:rgba(184,134,26,0.08);
  --topbar:rgba(245,244,240,0.9);
  --correct:#047857; --correct-bg:rgba(5,150,105,0.10); --wrong:#c81e1e; --wrong-bg:rgba(220,38,38,0.09);
  --on-accent:#ffffff;
  --s1:#4f46e5; --s2:#0369a1; --s3:#0f766e; --s4:#6d28d9; --s5:#b45309; --s6:#be123c; --s7:#047857; --s8:#a21caf;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.5; min-height:100%; }
button { font-family:inherit; }
a { color:inherit; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

.sec1{--acc:var(--s1)} .sec2{--acc:var(--s2)} .sec3{--acc:var(--s3)} .sec4{--acc:var(--s4)}
.sec5{--acc:var(--s5)} .sec6{--acc:var(--s6)} .sec7{--acc:var(--s7)} .sec8{--acc:var(--s8)}

/* Top bar */
.topbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--topbar);
  backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--border); height:52px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.brand { font-size:0.92rem; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; color:var(--text); }
.brand span { font-size:0.66rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; background:var(--gold-bg); color:var(--gold); border:1px solid var(--gold-dim); border-radius:4px; padding:2px 8px; white-space:nowrap; }
.brand b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
.top-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.icon-btn, .pill-btn { background:var(--surface); border:1px solid var(--border); border-radius:8px; height:34px; cursor:pointer; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
.icon-btn { width:34px; }
.icon-btn svg { width:16px; height:16px; }
.pill-btn { padding:0 12px; font-size:0.74rem; font-weight:700; white-space:nowrap; }
.icon-btn:hover, .pill-btn:hover { border-color:var(--border-hi); color:var(--text); }
.pill-btn.active { border-color:var(--correct); color:var(--correct); background:var(--correct-bg); }

.wrap { padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }

/* Hero */
.hero { padding-block:64px 52px; text-align:center; position:relative; overflow:hidden; }
.hero::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 80% 60% at 50% 0%, var(--gold-bg) 0%, transparent 70%); pointer-events:none; }
.eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:0.7rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); margin-bottom:20px; }
.eyebrow::before, .eyebrow::after { content:''; width:28px; height:1px; background:var(--gold-dim); }
.hero h1 { font-size:clamp(2.2rem, 7vw, 3.8rem); font-weight:800; line-height:1.05; letter-spacing:-0.03em; margin-bottom:14px; text-wrap:balance; }
.hero h1 em { font-style:italic; color:var(--gold); }
.hero-sub { color:var(--muted); font-size:1rem; max-width:470px; margin:0 auto 34px; line-height:1.7; }
.stats { display:inline-flex; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); position:relative; }
.stat { padding:14px 26px; text-align:center; border-right:1px solid var(--border); }
.stat:last-child { border-right:none; }
.stat-num { font-size:1.6rem; font-weight:800; color:var(--gold); line-height:1; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
.stat-label { font-size:0.66rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--dim); margin-top:4px; }

/* Hub */
.main { max-width:900px; margin:0 auto; padding-block:24px 72px; }
.year-tabs { display:flex; gap:8px; margin-bottom:32px; flex-wrap:wrap; }
.year-tab { background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:8px 16px; font-size:0.8rem; font-weight:700; cursor:pointer; }
.year-tab[aria-pressed="true"] { background:var(--gold-bg); color:var(--gold); border-color:var(--gold-dim); }
.year-tab small { font-weight:500; opacity:0.8; margin-left:4px; }
.sec-block { margin-bottom:40px; }
.section-head { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.section-head .code { font-size:0.72rem; font-weight:800; color:var(--acc); letter-spacing:0.04em; font-variant-numeric:tabular-nums; }
.section-head .label { font-size:0.72rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); }
.section-head .line { flex:1; height:1px; background:var(--border); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap:14px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .2s, transform .2s, background .2s; min-width:0; }
.card:hover { border-color:var(--border-hi); background:var(--card-hover); transform:translateY(-2px); }
.card-accent { height:2px; background:var(--acc); }
.card-body { padding:20px; flex:1; display:flex; flex-direction:column; }
.card-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
.sec-badge { width:44px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:color-mix(in srgb, var(--acc) 12%, transparent); color:var(--acc); font-size:0.78rem; font-weight:800; font-variant-numeric:tabular-nums; }
.card-meta { min-width:0; flex:1; }
.card-num { font-size:0.64rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }
.card-title { font-size:1rem; font-weight:700; line-height:1.25; letter-spacing:-0.01em; text-wrap:balance; }
.score { font-size:0.66rem; font-weight:700; padding:2px 8px; border-radius:5px; letter-spacing:0.04em; margin-top:3px; white-space:nowrap; }
.score.pass { background:var(--correct-bg); color:var(--correct); }
.score.fail { background:var(--wrong-bg); color:var(--wrong); }
.divider { height:1px; background:var(--border); margin-bottom:12px; }
.card-desc { color:var(--muted); font-size:0.835rem; line-height:1.6; flex:1; margin-bottom:18px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-size:0.78rem; font-weight:600; text-decoration:none; border:1px solid var(--border); cursor:pointer; background:var(--surface); color:var(--muted); transition:opacity .15s, transform .12s, border-color .15s, color .15s; }
.btn:hover { border-color:var(--border-hi); color:var(--text); transform:translateY(-1px); }
.btn.primary { background:var(--acc); border-color:var(--acc); color:var(--on-accent); }
.btn.primary:hover { color:var(--on-accent); opacity:0.88; }
.btn.off { opacity:0.4; pointer-events:none; }
.rp-banner { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:36px; }
.rp-banner h2 { font-size:1rem; font-weight:700; }
.rp-banner p { color:var(--muted); font-size:0.84rem; }
.pending { border:1px dashed var(--border-hi); border-radius:14px; padding:20px; color:var(--dim); font-size:0.85rem; }

/* Reading views */
.page { max-width:720px; margin:0 auto; padding-block:40px 80px; }
.page-head { margin-bottom:32px; }
.page-eyebrow { font-size:0.68rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--acc, var(--gold)); margin-bottom:10px; }
.page-title { font-size:clamp(1.6rem, 5vw, 2.1rem); font-weight:800; letter-spacing:-0.03em; line-height:1.15; text-wrap:balance; margin-bottom:8px; }
.page-sub { color:var(--muted); font-size:0.92rem; max-width:62ch; }
.sum-sec { margin-bottom:30px; }
.sum-sec h2 { font-size:1.08rem; font-weight:700; letter-spacing:-0.01em; margin-bottom:12px; display:flex; gap:10px; align-items:baseline; }
.sum-sec h2 .n { color:var(--acc); font-size:0.8rem; font-weight:800; font-variant-numeric:tabular-nums; }
.sum-sec ul { list-style:none; display:flex; flex-direction:column; gap:8px; }
.sum-sec li { position:relative; padding-left:18px; font-size:0.93rem; line-height:1.65; max-width:68ch; }
.sum-sec li::before { content:''; position:absolute; left:2px; top:0.68em; width:6px; height:6px; border-radius:2px; background:var(--acc); opacity:0.7; }
.sum-sec li strong, .rp li strong { font-weight:700; color:var(--text); }
/* Diagrams: inline SVG from src/diagrams, themed by these classes */
.fig { margin:18px 0 6px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 16px 12px; max-width:640px; }
.fig svg { display:block; width:100%; height:auto; color:var(--text); font-family:var(--font); overflow:visible; }
@media (max-width:540px) { .fig { padding:12px 8px 10px; margin-left:-8px; margin-right:-8px; } }
.fig figcaption { color:var(--muted); font-size:0.82rem; line-height:1.55; margin-top:10px; max-width:62ch; }
.fig text { fill:currentColor; font-size:15px; font-weight:500; }
.fig .tm { fill:var(--muted); font-size:13px; }
.fig .ta { fill:var(--acc); font-weight:700; }
.fig .tg { fill:var(--gold); font-weight:700; }
.fig .ln { fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.fig .lm { fill:none; stroke:var(--muted); stroke-width:1.3; stroke-dasharray:5 5; }
.fig .bx { fill:var(--surface); stroke:var(--border-hi); stroke-width:1.5; }
.fig .ac { fill:none; stroke:var(--acc); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
.fig .gl { fill:none; stroke:var(--gold); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
.fig .at { fill:color-mix(in srgb, var(--acc) 16%, transparent); stroke:var(--acc); stroke-width:1.6; }
.fig .gt { fill:color-mix(in srgb, var(--gold) 16%, transparent); stroke:var(--gold); stroke-width:1.6; }
.fig .gap { fill:none; stroke:var(--card); stroke-width:9; }
.fig .thick { stroke-width:4.5; }
.fig .nt { fill:color-mix(in srgb, var(--text) 12%, transparent); stroke:var(--muted); stroke-width:1.2; }
.fig .af { fill:var(--acc); } .fig .gf { fill:var(--gold); } .fig .cf { fill:currentColor; } .fig .mf { fill:var(--muted); }
.ex { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--acc); border-radius:12px; padding:18px 20px; margin-bottom:18px; min-width:0; }
.ex-tag { font-size:0.66rem; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--acc); margin-bottom:8px; }
.ex-q { font-weight:600; font-size:0.95rem; margin-bottom:10px; line-height:1.55; }
.ex ol { padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:0.9rem; line-height:1.6; font-variant-numeric:tabular-nums; }
.ex-a { margin-top:10px; font-size:0.92rem; }
.ex-a b { color:var(--acc); }
.callout { background:var(--wrong-bg); border:1px solid color-mix(in srgb, var(--wrong) 40%, transparent); border-radius:12px; padding:18px 20px; margin-bottom:30px; }
.callout h2 { font-size:0.74rem; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--wrong); margin-bottom:10px; }
.callout ul { padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:0.9rem; line-height:1.6; }
.eq { font-variant-numeric:tabular-nums; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:1px 6px; overflow-wrap:anywhere; }
.page-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }

.rp { scroll-margin-top:68px; min-width:0; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:16px; }
.rp-top { display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; }
.rp-no { font-size:0.7rem; font-weight:800; letter-spacing:0.08em; background:color-mix(in srgb, var(--acc) 14%, transparent); color:var(--acc); border-radius:6px; padding:4px 8px; white-space:nowrap; }
.rp-top h3 { font-size:1rem; font-weight:700; line-height:1.3; }
.rp-top .spec { font-size:0.74rem; color:var(--dim); margin-top:2px; }
.rp h4 { font-size:0.68rem; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin:14px 0 6px; }
.rp ol, .rp ul { padding-left:20px; display:flex; flex-direction:column; gap:5px; font-size:0.9rem; line-height:1.6; }
.vids { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,300px),1fr)); gap:14px; }
.vid { min-width:0; }
.vid-frame { position:relative; display:block; width:100%; aspect-ratio:16/9; border:0; padding:0; border-radius:10px; overflow:hidden; background:#000; cursor:pointer; }
.vid-frame img { width:100%; height:100%; object-fit:cover; display:block; opacity:0.85; transition:opacity .15s; }
.vid-frame:hover img, .vid-frame:focus-visible img { opacity:1; }
.vid-frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
.vid-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px; height:44px; border-radius:12px; background:rgba(0,0,0,0.72); display:grid; place-items:center; }
.vid-frame:hover .vid-play, .vid-frame:focus-visible .vid-play { background:#e62117; }
.vid-cap { font-size:0.8rem; color:var(--muted); margin-top:6px; line-height:1.45; }
.vid-cap b { color:var(--text); font-weight:600; }
.vid-note { font-size:0.72rem; color:var(--dim); margin-top:8px; }
.vars { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,180px),1fr)); gap:8px; }
.var { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:0.84rem; min-width:0; }
.var b { display:block; font-size:0.64rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }

/* Quiz */
.quiz { max-width:680px; margin:0 auto; padding-block:40px 80px; }
.quiz-head { text-align:center; margin-bottom:34px; }
.quiz-head .page-sub { margin:0 auto; }
.prog-label { display:flex; justify-content:space-between; font-size:0.74rem; color:var(--dim); margin-bottom:8px; font-variant-numeric:tabular-nums; }
.prog { background:var(--surface); border-radius:99px; height:6px; margin-bottom:26px; overflow:hidden; }
.prog > div { height:100%; background:var(--acc); border-radius:99px; transition:width .4s ease; }
.q-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:26px; margin-bottom:18px; }
.q-num { font-size:0.68rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin-bottom:10px; display:flex; justify-content:space-between; }
.q-timer { color:var(--acc); font-variant-numeric:tabular-nums; }
.q-timer.warn { color:var(--wrong); }
.q-text { font-size:1.04rem; font-weight:600; line-height:1.5; margin-bottom:20px; }
.options { display:flex; flex-direction:column; gap:10px; }
.option { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:0.9rem; font-weight:500; cursor:pointer; text-align:left; color:var(--text); display:flex; align-items:center; gap:12px; line-height:1.45; }
.option:hover:not(:disabled) { border-color:var(--border-hi); background:var(--card-hover); }
.option:disabled { cursor:default; }
.option.correct { border-color:var(--correct); background:var(--correct-bg); color:var(--correct); }
.option.wrong { border-color:var(--wrong); background:var(--wrong-bg); color:var(--wrong); }
.letter { width:24px; height:24px; border-radius:6px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; flex-shrink:0; }
.option.correct .letter { background:var(--correct); border-color:var(--correct); color:var(--on-accent); }
.option.wrong .letter { background:var(--wrong); border-color:var(--wrong); color:var(--on-accent); }
.feedback { margin-top:14px; padding:12px 16px; border-radius:8px; font-size:0.87rem; line-height:1.6; }
.feedback.correct { background:var(--correct-bg); border:1px solid var(--correct); }
.feedback.wrong { background:var(--wrong-bg); border:1px solid var(--wrong); }
.feedback b { color:var(--correct); }
.feedback.wrong b { color:var(--wrong); }
.quiz-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.key-hint { font-size:0.72rem; color:var(--dim); }
.btn-next { background:var(--acc); color:var(--on-accent); border:none; border-radius:10px; padding:11px 26px; font-size:0.88rem; font-weight:700; cursor:pointer; margin-left:auto; }
.result { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:36px 24px; text-align:center; }
.result-score { font-size:3.4rem; font-weight:800; letter-spacing:-0.04em; color:var(--acc); line-height:1; font-variant-numeric:tabular-nums; }
.result-pct { color:var(--muted); margin:6px 0 4px; }
.result-msg { font-size:1.04rem; font-weight:600; margin-bottom:24px; }
.result .actions { justify-content:center; }
.btn.warn { color:var(--wrong); border-color:var(--wrong); background:var(--wrong-bg); }

.footer { text-align:center; padding-block:26px 44px; border-top:1px solid var(--border); color:var(--dim); font-size:0.76rem; }

@media (max-width:540px) {
  .hero { padding-block:44px 36px; }
  .stats { display:flex; width:100%; }
  .stat { flex:1; padding:12px 8px; }
  .brand span { display:none; }
  .q-card { padding:20px 16px; }
}
</style>

<script>
const DATA = {"meta": {"subject": "Maths", "code": "7357", "title": "AQA Maths Study Hub", "prefix": "maths_", "rpBlurb": "", "rpIntro": "", "secColors": {"P": "1", "S": "5", "M": "6"}, "banner": {"h": "How to use this hub", "p": "Read the summary and try the worked examples with a pen and paper before checking the steps. Then take the quiz: every explanation shows the working."}, "heroSub": "Topic summaries with worked examples, and quizzes for every section of the specification. Each quiz draws 10 questions from a pool of 22."}, "plan": [{"code": "P", "name": "Pure mathematics", "year": 1, "units": 10}, {"code": "S", "name": "Statistics", "year": 1, "units": 4}, {"code": "M", "name": "Mechanics", "year": 1, "units": 2}, {"code": "P", "name": "Pure mathematics", "year": 2, "units": 12}, {"code": "S", "name": "Statistics", "year": 2, "units": 3}, {"code": "M", "name": "Mechanics", "year": 2, "units": 4}], "sections": {"P": "Pure mathematics", "S": "Statistics", "M": "Mechanics"}, "units": [{"id": "p1", "order": 1, "year": 1, "section": "P", "badge": "A·B", "spec": "A, B", "title": "Proof, indices and surds", "desc": "Proof by deduction, exhaustion and counter-example, the laws of indices, simplifying surds and rationalising denominators.", "practicals": [], "summary": [{"h": "Proof", "p": ["**Proof by deduction**: start from known facts and use logical steps to reach the conclusion. E.g. show (n + 1)² − (n − 1)² = 4n by expanding.", "**Proof by exhaustion**: split into a finite set of cases and check **every** case, e.g. odd and even n.", "**Disproof by counter-example**: find **one** example that makes the statement false.", "Use n for any integer: **even** = 2n, **odd** = 2n + 1, **consecutive** = n, n + 1.", "Use the symbols ⇒ (implies), ⇐ (is implied by) and ⇔ (if and only if) correctly. End with a clear conclusion."]}, {"h": "Laws of indices", "p": ["`aᵐ × aⁿ = aᵐ⁺ⁿ`, `aᵐ ÷ aⁿ = aᵐ⁻ⁿ`, `(aᵐ)ⁿ = aᵐⁿ`", "`a⁰ = 1`, `a⁻ⁿ = 1/aⁿ`, `a^(1/n) = ⁿ√a`, `a^(m/n) = (ⁿ√a)ᵐ`", "Example: 8^(2/3) = (∛8)² = 2² = 4. And 16^(−1/2) = 1/√16 = 1/4."]}, {"h": "Surds", "p": ["`√(ab) = √a × √b` and `√(a/b) = √a / √b`", "Simplify by taking out square factors: √48 = √16 × √3 = 4√3.", "**Rationalise** a denominator: multiply top and bottom by the surd, e.g. 6/√3 = 6√3/3 = 2√3.", "For a denominator like a + √b, multiply top and bottom by the **conjugate** a − √b, using (a + √b)(a − √b) = a² − b."]}], "pitfalls": ["A counter-example only needs **one** case. Checking a few cases is **not** a proof that something is true.", "In proof by exhaustion, every possible case must be covered and stated.", "√a + √b is **not** √(a + b).", "Negative index means **reciprocal**, not a negative number: 2⁻³ = 1/8."], "examples": [{"q": "Prove that the sum of any two consecutive odd numbers is a multiple of 4.", "steps": ["Let the numbers be 2n + 1 and 2n + 3, where n is an integer.", "Sum = (2n + 1) + (2n + 3) = 4n + 4.", "4n + 4 = 4(n + 1), and n + 1 is an integer."], "a": "So the sum is a multiple of 4. ∎"}, {"q": "Simplify (3 + √5)/(2 − √5), giving your answer in the form a + b√5.", "steps": ["Multiply top and bottom by the conjugate 2 + √5.", "Numerator: (3 + √5)(2 + √5) = 6 + 3√5 + 2√5 + 5 = 11 + 5√5.", "Denominator: (2 − √5)(2 + √5) = 4 − 5 = −1.", "(11 + 5√5) ÷ (−1) = −11 − 5√5."], "a": "−11 − 5√5"}], "questions": [{"q": "Simplify x⁵ × x³.", "o": ["x¹⁵", "x⁸", "x²", "2x⁸"], "a": 1, "e": "Add indices when multiplying: x⁵⁺³ = x⁸."}, {"q": "Evaluate 27^(2/3).", "o": ["9", "18", "3", "81"], "a": 0, "e": "27^(2/3) = (∛27)² = 3² = 9."}, {"q": "Evaluate 4^(−3/2).", "o": ["−8", "8", "1/8", "−1/8"], "a": 2, "e": "4^(3/2) = (√4)³ = 8, so 4^(−3/2) = 1/8."}, {"q": "Simplify (2x³)⁴.", "o": ["8x¹²", "2x¹²", "16x⁷", "16x¹²"], "a": 3, "e": "2⁴ = 16 and (x³)⁴ = x¹²."}, {"q": "Write √75 in its simplest form.", "o": ["5√3", "3√5", "25√3", "15√5"], "a": 0, "e": "√75 = √25 × √3 = 5√3."}, {"q": "Simplify √12 + √27.", "o": ["√39", "5√3", "6√3", "13√3"], "a": 1, "e": "√12 = 2√3 and √27 = 3√3, so the sum is 5√3."}, {"q": "Rationalise the denominator of 10/√5.", "o": ["10√5", "√5/2", "2√5", "5√2"], "a": 2, "e": "10/√5 × √5/√5 = 10√5/5 = 2√5."}, {"q": "Rationalise 1/(3 + √2).", "o": ["(3 + √2)/7", "(3 − √2)/11", "3 − √2", "(3 − √2)/7"], "a": 3, "e": "Multiply by (3 − √2): denominator = 9 − 2 = 7. So (3 − √2)/7."}, {"q": "Expand and simplify (2 + √3)(2 − √3).", "o": ["1", "7", "4 − √3", "−1"], "a": 0, "e": "Difference of two squares: 4 − 3 = 1."}, {"q": "Expand (1 + √2)².", "o": ["3", "3 + 2√2", "1 + 2√2", "3 + √2"], "a": 1, "e": "1 + 2√2 + 2 = 3 + 2√2."}, {"q": "Write 1/x² as a power of x.", "o": ["x²", "x^(1/2)", "x⁻²", "−x²"], "a": 2, "e": "A negative index means reciprocal: 1/x² = x⁻²."}, {"q": "Write √x as a power of x.", "o": ["x²", "x⁻¹", "x⁻²", "x^(1/2)"], "a": 3, "e": "A square root is a power of one half."}, {"q": "Solve 2ˣ = 32.", "o": ["x = 5", "x = 16", "x = 6", "x = 4"], "a": 0, "e": "2⁵ = 32."}, {"q": "Simplify (x^(1/2) × x^(3/2)) ÷ x.", "o": ["x²", "x", "1", "x³"], "a": 1, "e": "x^(1/2 + 3/2) = x², then ÷ x gives x."}, {"q": "Which is a counter-example to 'n² + n + 41 is prime for every positive integer n'?", "o": ["n = 1", "n = 10", "n = 40", "n = 2"], "a": 2, "e": "40² + 40 + 41 = 1681 = 41². One counter-example disproves the statement."}, {"q": "To prove 'n² − n is even for all integers n' by exhaustion, which cases are needed?", "o": ["n = 1, 2, 3", "n positive only", "n = 0 only", "n even and n odd"], "a": 3, "e": "Every integer is either even or odd, so checking both cases covers everything."}, {"q": "Which expression represents any odd number, where n is an integer?", "o": ["2n + 1", "2n", "n + 1", "n²"], "a": 0, "e": "2n is always even, so 2n + 1 is always odd."}, {"q": "What is needed to disprove a statement?", "o": ["A general algebraic proof", "One counter-example", "Checking ten cases", "A diagram"], "a": 1, "e": "A single case where it fails shows the statement isn't always true."}, {"q": "Simplify 9^(1/2) × 8^(1/3).", "o": ["5", "17", "6", "72"], "a": 2, "e": "9^(1/2) = 3 and 8^(1/3) = 2, so 3 × 2 = 6."}, {"q": "Simplify √50 − √18.", "o": ["√32", "4√2", "8√2", "2√2"], "a": 3, "e": "√50 = 5√2 and √18 = 3√2, so the difference is 2√2."}, {"q": "Express 8^x as a power of 2.", "o": ["2^(3x)", "2^(x+3)", "2^(x/3)", "6^x"], "a": 0, "e": "8 = 2³, so 8ˣ = (2³)ˣ = 2³ˣ."}, {"q": "Simplify (4x²y)^(1/2), for x, y > 0.", "o": ["2xy", "2x√y", "4x√y", "2x²√y"], "a": 1, "e": "√4 × √x² × √y = 2x√y."}]}, {"id": "p2", "order": 2, "year": 1, "section": "P", "badge": "B", "spec": "B", "title": "Quadratics, simultaneous equations and inequalities", "desc": "Solving quadratics, completing the square, the discriminant, simultaneous equations (linear and quadratic) and linear and quadratic inequalities.", "practicals": [], "summary": [{"h": "Solving quadratics", "p": ["Solve ax² + bx + c = 0 by **factorising**, **completing the square** or the **quadratic formula**.", "`x = [−b ± √(b² − 4ac)] / 2a`", "**Completing the square**: x² + bx + c = (x + b/2)² − (b/2)² + c.", "The completed square form a(x + p)² + q gives the **turning point** (−p, q)."]}, {"h": "The discriminant", "fig": "discriminant", "cap": "The discriminant b² − 4ac tells you how many times the graph of y = ax² + bx + c meets the x-axis: twice (positive), touching once (zero) or not at all (negative).", "p": ["`Discriminant = b² − 4ac`", "**b² − 4ac > 0**: two distinct real roots. **= 0**: one repeated root (the graph touches the x-axis). **< 0**: no real roots.", "Use this to find unknown constants, e.g. 'the equation has equal roots'."], "svg": "<svg role=\"img\" aria-label=\"The discriminant b² − 4ac tells you how many times the graph of y = ax² + bx + c meets the x-axis: twice (positive), touching once (zero) or not at all (negative).\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 226\"><defs><marker id=\"f-discriminant-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-re ind the **critical values** (roots), sketch the graph, then read off the required region.", "For a positive quadratic, `> 0` gives **x < smaller root or x > larger root**. `< 0` gives **between the roots**.", "Set notation: e.g. {x : x < 2} ∪ {x : x > 5} or {x : 2 < x < 5}."]}], "pitfalls": ["Don't divide both sides of an equation by x: you lose the solution x = 0.", "For quadratic inequalities, **sketch** the graph rather than guessing which region.", "When using the discriminant to find a constant, solve the **inequality** carefully (it may itself be quadratic)."], "examples": [{"q": "Find the values of k for which x² + kx + 9 = 0 has equal roots.", "steps": ["Equal roots means b² − 4ac = 0.", "k² − 4(1)(9) = 0, so k² = 36."], "a": "k = 6 or k = −6"}, {"q": "Solve the simultaneous equations y = x + 1 and x² + y² = 13.", "steps": ["Substitute: x² + (x + 1)² = 13.", "2x² + 2x + 1 = 13, so 2x² + 2x − 12 = 0, so x² + x − 6 = 0.", "(x + 3)(x − 2) = 0, so x = −3 or x = 2.", "y = x + 1 gives y = −2 or y = 3."], "a": "(−3, −2) and (2, 3)"}, {"q": "Solve x² − 5x + 4 < 0.", "steps": ["Critical values: (x − 1)(x − 4) = 0, so x = 1 or x = 4.", "The graph is a positive (U-shaped) parabola, below the axis between its roots."], "a": "1 < x < 4"}], "questions": [{"q": "Solve x² − 7x + 12 = 0.", "o": ["x = −3 or x = −4", "x = 3 or x = 4", "x = 2 or x = 6", "x = 1 or x = 12"], "a": 1, "e": "(x − 3)(x − 4) = 0."}, {"q": "Write x² + 6x + 5 in completed square form.", "o": ["(x + 3)² − 4", "(x + 3)² + 5", "(x + 6)² − 31", "(x + 3)² − 14"], "a": 0, "e": "(x + 3)² = x² + 6x + 9, so x² + 6x + 5 = (x + 3)² − 4."}, {"q": "What are the coordinates of the turning point of y = (x − 2)² + 7?", "o": ["(−2, 7)", "(2, −7)", "(2, 7)", "(7, 2)"], "a": 2, "e": "In a(x + p)² + q, the turning point is (−p, q). Here p = −2, so (2, 7)."}, {"q": "What is the discriminant of 2x² + 3x − 5?", "o": ["−31", "1", "9", "49"], "a": 3, "e": "b² − 4ac = 9 − 4(2)(−5) = 9 + 40 = 49."}, {"q": "The discriminant of a quadratic is negative. What does this tell you?", "o": ["There are no real roots", "There are two distinct real roots", "There is one repeated root", "The graph crosses the x-axis twice"], "a": 0, "e": "b² − 4ac < 0 means the square root has no real value."}, {"q": "Use the quadratic formula to solve x² + 2x − 1 = 0.", "o": ["x = 1 ± √2", "x = −1 ± √2", "x = −2 ± √2", "x = −1 ± 2√2"], "a": 1, "e": "x = [−2 ± √(4 + 4)]/2 = [−2 ± 2√2]/2 = −1 ± √2."}, {"q": "For which value of k does x² + 4x + k = 0 have exactly one (repeated) root?", "o": ["k = 2", "k = −4", "k = 4", "k = 16"], "a": 2, "e": "16 − 4k = 0, so k = 4."}, {"q": "x² + kx + 4 = 0 has two distinct real roots. What is the range of k?", "o": ["−4 < k < 4", "k > 4 only", "k = ±4", "k < −4 or k > 4"], "a": 3, "e": "k² − 16 > 0, so k² > 16, giving k < −4 or k > 4."}, {"q": "Solve 3x − 5 > 7.", "o": ["x > 4", "x < 4", "x > 2/3", "x > 12"], "a": 0, "e": "3x > 12, so x > 4."}, {"q": "Solve −2x ≤ 8.", "o": ["x ≤ −4", "x ≥ −4", "x ≥ 4", "x ≤ 4"], "a": 1, "e": "Dividing by −2 reverses the inequality: x ≥ −4."}, {"q": "Solve x² − 9 > 0.", "o": ["−3 < x < 3", "x > 3 only", "x < −3 or x > 3", "x > 9"], "a": 2, "e": "Roots ±3. A U-shaped graph is above the axis outside the roots."}, {"q": "Solve x² + x − 6 ≤ 0.", "o": ["x ≤ −3 or x ≥ 2", "−2 ≤ x ≤ 3", "x ≥ 2", "−3 ≤ x ≤ 2"], "a": 3, "e": "(x + 3)(x − 2) ≤ 0 between the roots: −3 ≤ x ≤ 2."}, {"q": "Solve: x + y = 7 and x − y = 1.", "o": ["x = 4, y = 3", "x = 3, y = 4", "x = 5, y = 2", "x = 6, y = 1"], "a": 0, "e": "Adding gives 2x = 8, so x = 4, then y = 3."}, {"q": "Solve: y = 2x and x² + y = 8.", "o": ["x = 2 only", "x = 2 or x = −4", "x = −2 or x = 4", "x = 4 only"], "a": 1, "e": "x² + 2x − 8 = 0, so (x + 4)(x − 2) = 0."}, {"q": "The line y = 2x + c is a tangent to y = x² + 1. What is c?", "o": ["c = 1", "c = 2", "c = 0", "c = −1"], "a": 2, "e": "x² − 2x + (1 − c) = 0 must have equal roots: 4 − 4(1 − c) = 0, so c = 0."}, {"q": "What do the solutions of a pair of simultaneous equations represent graphically?", "o": ["The gradients", "The y-intercepts", "The turning points", "The points where the graphs intersect"], "a": 3, "e": "Each solution is a point on both graphs."}, {"q": "What is the minimum value of y = x² − 8x + 20?", "o": ["4", "20", "−4", "8"], "a": 0, "e": "y = (x − 4)² + 4, so the minimum is 4 (at x = 4)."}, {"q": "Solve 2x² = 8x.", "o": ["x = 4 only", "x = 0 or x = 4", "x = 0 only", "x = ±2"], "a": 1, "e": "2x² − 8x = 0, so 2x(x − 4) = 0. Don't divide by x, or you lose x = 0."}, {"q": "How many times does y = x² − 6x + 9 meet the x-axis?", "o": ["Twice", "Never", "Once (it touches the axis)", "Three times"], "a": 2, "e": "Discriminant = 36 − 36 = 0, so one repeated root: (x − 3)²."}, {"q": "Write {x : x < 1} ∪ {x : x > 5} in words.", "o": ["x is between 1 and 5", "x is greater than 1 and less than 5", "x equals 1 or 5", "x is less than 1 or greater than 5"], "a": 3, "e": "∪ means 'or' (union of the two sets)."}, {"q": "Write 2x² − 12x + 3 in the form a(x + p)² + q.", "o": ["2(x − 3)² − 15", "2(x − 3)² + 3", "2(x − 6)² − 69", "2(x + 3)² − 15"], "a": 0, "e": "2(x² − 6x) + 3 = 2[(x − 3)² − 9] + 3 = 2(x − 3)² − 15."}, {"q": "Solve x² − 4x − 1 = 0, giving answers to 2 decimal places.", "o": ["x = 3.73 or x = 0.27", "x = 4.24 or x = −0.24", "x = 2.24 or x = −2.24", "x = 4.45 or x = −0.45"], "a": 1, "e": "x = [4 ± √20]/2 = 2 ± √5 ≈ 4.24 or −0.24."}]}, {"id": "p3", "order": 3, "year": 1, "section": "P", "badge": "B", "spec": "B", "title": "Polynomials and graphs", "desc": "Expanding and dividing polynomials, the factor theorem, sketching curves, proportion, and transformations of graphs.", "practicals": [], "summary": [{"h": "Polynomials", "p": ["Expand brackets carefully, collecting like terms. A **cubic** has highest power 3.", "**Algebraic division**: divide a polynomial by (x − a), e.g. by long division or by comparing coefficients.", "**Factor theorem**: if f(a) = 0, then (x − a) is a **factor** of f(x). More generally, if f(b/a) = 0, then (ax − b) is a factor.", "To factorise a cubic: find one root by trial (try factors of the constant term), divide, then factorise the quadratic."]}, {"h": "Sketching curves", "p": ["Find where the curve meets the axes (set x = 0, then y = 0) and its general shape.", "Cubic with positive x³ coefficient: starts bottom left, ends top right. A **repeated root** means the curve **touches** the axis.", "**Reciprocal graphs** y = k/x and y = k/x² have **asymptotes** at x = 0 and y = 0.", "**Proportion**: y ∝ x means y = kx (straight line through the origin). y ∝ 1/x means y = k/x."]}, {"h": "Transformations of y = f(x)", "fig": "transformations", "cap": "Adding outside the function moves the graph **up**: f(x) + 3 is 3 units up. Changing x inside moves it **sideways the opposite way** to the sign: f(x − 2) is 2 units to the right.", "p": ["`y = f(x) + a`: translation by **(0, a)**, i.e. up a.", "`y = f(x + a)`: translation by **(−a, 0)**, i.e. left a.", "`y = af(x)`: stretch **parallel to the y-axis**, scale factor a.", "`y = f(ax)`: stretch **parallel to the x-axis**, scale factor **1/a**.", "`y = −f(x)`: reflection in the **x-axis**. `y = f(−x)`: reflection in the **y-axis**."], "svg": "<svg role=\"img\" aria-label=\"Adding outside the function moves the graph up: f(x) + 3 is 3 units up. Changing x inside moves it sideways the opposite way to the sign: f(x − 2) is 2 units to the right.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 326\"><defs><marker id=\"f-transformations-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-transformations-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-transformations-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" mar 7,245 L345.6,244 L347.4,243.1 L349.3,242 L351.2,240.9 L353.1,239.8 L355,238.6 L356.9,237.4 L358.8,236.1 L360.7,234.8 L362.6,233.4 L364.4,232 L366.3,230.6 L368.2,229.1 L370.1,227.5 L372,225.9 L373.9,224.3 L375.8,222.6 L377.7,220.8 L379.6,219 L381.4,217.2 L383.3,215.3 L385.2,213.4 L387.1,211.4 L389,209.4 L390.9,207.3 L392.8,205.2 L394.7,203 L396.6,200.8 L398.4,198.6 L400.3,196.3 L402.2,193.9 L404.1,191.5 L406,189.1 L407.9,186.6 L409.8,184 L411.7,181.4 L413.6,178.8 L415.4,176.1 L417.3,173.4 L419.2,170.6 L421.1,167.8 L423,164.9 L424.9,162 L426.8,159.1 L428.7,156 L430.6,153 L432.4,149.9 L434.3,146.7 L436.2,143.5 L438.1,140.3 L440,137\" class=\"gl\"/><line x1=\"40\" y1=\"312\" x2=\"62\" y2=\"312\" class=\"ln\"/><text x=\"68\" y=\"317\" font-size=\"13\">y = f(x)<\/text><line x1=\"180\" y1=\"312\" x2=\"202\" y2=\"312\" class=\"ac\"/><text x=\"208\" y=\"317\" class=\"ta\" font-size=\"13\">y = f(x) + 3<\/text><line x1=\"320\" y1=\"312\" x2=\"342\" y2=\"312\" class=\"gl\"/><text x=\"348\" y=\"317\" class=\"tg\" font-size=\"13\">y = f(x − 2)<\/text><line x1=\"217.8\" y1=\"254\" x2=\"217.8\" y2=\"179\" class=\"ac\" marker-end=\"url(#f-transformations-aa)\"/><line x1=\"217.8\" y1=\"244\" x2=\"303.7\" y2=\"244\" class=\"gl\" marker-end=\"url(#f-transformations-ag)\"/><text x=\"211.1\" y=\"212.4\" class=\"ta\" text-anchor=\"end\" font-size=\"12\">up 3<\/text><text x=\"262.2\" y=\"272\" class=\"tg\" text-anchor=\"middle\" font-size=\"12\">right 2<\/text><\/svg>"}], "pitfalls": ["Changes **inside** the bracket affect x and do the **opposite** of what you'd expect: f(x + 2) moves **left** 2.", "f(2x) is a stretch with scale factor **½**, not 2.", "For the factor theorem, f(2) = 0 means (x − 2) is a factor, not (x + 2)."], "examples": [{"q": "Show that (x − 2) is a factor of f(x) = x³ − 3x² − 4x + 12 and hence factorise f(x) fully.", "steps": ["f(2) = 8 − 12 − 8 + 12 = 0, so (x − 2) is a factor.", "Divide: x³ − 3x² − 4x + 12 = (x − 2)(x² − x − 6).", "x² − x − 6 = (x − 3)(x + 2)."], "a": "f(x) = (x − 2)(x − 3)(x + 2)"}, {"q": "The curve y = f(x) has a maximum at (2, 5). Find the maximum of y = f(x − 3) + 1.", "steps": ["f(x − 3) translates the curve 3 right: (5, 5).", "+ 1 translates it up 1: (5, 6)."], "a": "(5, 6)"}], "questions": [{"q": "Expand (x + 2)(x² − 3x + 1).", "o": ["x³ − x² − 5x + 2", "x³ − x² + 2", "x³ − 5x² − 5x + 2", "x³ + 2x² − 3x + 2"], "a": 0, "e": "x³ − 3x² + x + 2x² − 6x + 2 = x³ − x² − 5x + 2."}, {"q": "f(x) = x³ + 2x² − 5x − 6. Which is a factor?", "o": ["(x − 1)", "(x + 1)", "(x + 2)", "(x − 3)"], "a": 1, "e": "f(−1) = −1 + 2 + 5 − 6 = 0, so (x + 1) is a factor."}, {"q": "What does the factor theorem state?", "o": ["If f(a) = 1, (x − a) is a factor", "If f(0) = 0, x is a root", "If f(a) = 0, then (x − a) is a factor of f(x)", "If f(a) = 0, then (x + a) is a factor"], "a": 2, "e": "A root at x = a means (x − a) divides exactly."}, {"q": "Find the remainder when x³ − 4x + 1 is divided by (x − 2).", "o": ["−1", "0", "9", "1"], "a": 3, "e": "f(2) = 8 − 8 + 1 = 1 (the remainder theorem gives the remainder as f(2))."}, {"q": "f(x) = 2x³ − x² − 8x + 4. Show (2x − 1) is a factor. Which value should you substitute?", "o": ["x = 1/2", "x = −1/2", "x = 2", "x = 1"], "a": 0, "e": "(2x − 1) = 0 when x = 1/2. f(1/2) = 1/4 − 1/4 − 4 + 4 = 0."}, {"q": "x³ − 6x² + 11x − 6 = 0 has root x = 1. What are the other roots?", "o": ["x = −2 and x = −3", "x = 2 and x = 3", "x = 1 and x = 6", "x = 3 and x = −2"], "a": 1, "e": "Dividing by (x − 1) gives x² − 5x + 6 = (x − 2)(x − 3)."}, {"q": "What does a repeated root look like on a graph?", "o": ["The curve crosses the axis at a steep angle", "An asymptote", "The curve touches the x-axis (turning point on the axis)", "A gap in the curve"], "a": 2, "e": "E.g. y = (x − 1)²(x + 2) touches the x-axis at x = 1."}, {"q": "Where does y = (x − 1)(x + 2)(x − 3) cross the y-axis?", "o": ["(0, −6)", "(0, 1)", "(0, −1)", "(0, 6)"], "a": 3, "e": "x = 0: (−1)(2)(−3) = 6."}, {"q": "What are the asymptotes of y = 3/x?", "o": ["x = 0 and y = 0", "x = 3 and y = 0", "y = 3 only", "x = 0 only"], "a": 0, "e": "The curve approaches both axes but never meets them."}, {"q": "y is inversely proportional to x. When x = 4, y = 5. Find y when x = 10.", "o": ["12.5", "2", "8", "0.5"], "a": 1, "e": "y = k/x, so k = 20. When x = 10, y = 2."}, {"q": "Describe the transformation from y = f(x) to y = f(x) − 4.", "o": ["Translation 4 right", "Stretch, scale factor 4", "Translation 4 down", "Translation 4 left"], "a": 2, "e": "Subtracting outside the function moves the graph by (0, −4)."}, {"q": "Describe the transformation from y = f(x) to y = f(x + 3).", "o": ["Translation 3 right", "Translation 3 up", "Stretch, scale factor 3", "Translation 3 left"], "a": 3, "e": "f(x + 3) is a translation by (−3, 0)."}, {"q": "Describe the transformation from y = f(x) to y = 2f(x).", "o": ["Stretch parallel to the y-axis, scale factor 2", "Stretch parallel to the x-axis, scale factor 2", "Stretch parallel to the x-axis, scale factor 1/2", "Translation 2 up"], "a": 0, "e": "Multiplying outside the function stretches y-values."}, {"q": "Describe the transformation from y = f(x) to y = f(3x).", "o": ["Stretch parallel to the x-axis, scale factor 3", "Stretch parallel to the x-axis, scale factor 1/3", "Stretch parallel to the y-axis, scale factor 3", "Translation 3 left"], "a": 1, "e": "Inside changes do the opposite: f(3x) squashes the graph by a factor of 1/3 horizontally."}, {"q": "Describe the transformation from y = f(x) to y = −f(x).", "o": ["Reflection in the y-axis", "Rotation 180°", "Reflection in the x-axis", "Translation down"], "a": 2, "e": "All y-values change sign."}, {"q": "y = f(x) passes through (4, 2). Which point is on y = f(−x)?", "o": ["(4, −2)", "(−4, −2)", "(2, 4)", "(−4, 2)"], "a": 3, "e": "Reflection in the y-axis changes the sign of x."}, {"q": "y = f(x) has a minimum at (1, −3). Where is the minimum of y = 2f(x)?", "o": ["(1, −6)", "(2, −3)", "(1, −3)", "(0.5, −3)"], "a": 0, "e": "A vertical stretch doubles the y-coordinate."}, {"q": "y = f(x) has a minimum at (6, 2). Where is the minimum of y = f(2x)?", "o": ["(12, 2)", "(3, 2)", "(6, 4)", "(6, 1)"], "a": 1, "e": "Horizontal stretch, scale factor 1/2: x-coordinate halves."}, {"q": "What is the general shape of y = −x³ for large positive x?", "o": ["It goes up to +∞", "It levels off", "It goes down to −∞", "It approaches zero"], "a": 2, "e": "A negative cubic starts top left and ends bottom right."}, {"q": "Divide x³ + x² − 10x + 8 by (x − 1).", "o": ["x² − 2x − 8", "x² + 2x + 8", "x² + x − 10", "x² + 2x − 8"], "a": 3, "e": "(x − 1)(x² + 2x − 8) = x³ + 2x² − 8x − x² − 2x + 8 = x³ + x² − 10x + 8."}, {"q": "y is directly proportional to x². When x = 3, y = 18. What is y when x = 5?", "o": ["50", "30", "25", "45"], "a": 0, "e": "y = kx², so k = 2. When x = 5, y = 2 × 25 = 50."}, {"q": "Where does y = x²(x − 4) meet the x-axis?", "o": ["x = 4 only", "x = 0 (touches) and x = 4 (crosses)", "x = 0 and x = −4", "x = 2 and x = 4"], "a": 1, "e": "x = 0 is a repeated root, so the curve touches there."}]}, {"id": "p4", "order": 4, "year": 1, "section": "P", "badge": "C", "spec": "C", "title": "Coordinate geometry: lines and circles", "desc": "Equations of straight lines, gradients, parallel and perpendicular lines, midpoints and distances, and the equation of a circle with tangents and chords.", "practicals": [], "summary": [{"h": "Straight lines", "p": ["`gradient m = (y₂ − y₁) / (x₂ − x₁)`", "Equation forms: `y = mx + c`, `y − y₁ = m(x − x₁)`, and `ax + by + c = 0` (a, b, c integers).", "**Parallel** lines have **equal gradients**. **Perpendicular** lines have gradients that multiply to **−1**: m₂ = −1/m₁.", "`Midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2)`", "`Distance = √[(x₂ − x₁)² + (y₂ − y₁)²]`"]}, {"h": "Circles", "fig": "circle", "cap": "A circle with centre (a, b) and radius r has equation (x − a)² + (y − b)² = r². The tangent at any point is perpendicular to the radius there, so its gradient is −1 ÷ (gradient of the radius).", "p": ["Centre (a, b), radius r: `(x − a)² + (y − b)² = r²`", "If given in expanded form x² + y² + 2fx + 2gy + c = 0, **complete the square** in x and in y to find the centre and radius.", "Centre of x² + y² − 6x + 4y − 12 = 0: (x − 3)² + (y + 2)² = 25, so centre (3, −2), radius 5."], "svg": "<svg role=\"img\" aria-label=\"A circle with centre (a, b) and radius r has equation (x − a)² + (y − b)² = r². The tangent at any point is perpendicular to the radius there, so its gradient is −1 ÷ (gradient of the radius).\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 310\"><defs><marker id=\"f-circle-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-circle-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-circle-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-circle-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"30\" y1=\"290\" x2=\"450\" y2=\"290\" class=\"ln\" marker-end=\"url(#f-circle-ah)\"/><line x1=\"40\" y1=\"300\" x2=\"40\" y2=\"12\" class=\"ln\" marker-end=\"url(#f-circle-ah)\"/><text x=\"450\" y=\"282\" class=\"tm\" text-anchor=\"end\">x<\/text><text x=\"48\" y=\"20\" class=\"tm\">y<\/text><circle cx=\"220\" cy=\"160\" r=\"110\" class=\"ac\"/><circle cx=\"220\" cy=\"160\" r=\"3.5\" class=\"cf\"/><text x=\"212\" y=\"180\" text-anchor=\"end\" font-size=\"14\">(a, b)<\/text><line x1=\"220\" y1=\"160\" x2=\"304.3\" y2=\"89.3\" class=\"ln\"/><text x=\"252.1\" y=\"116.6\" text-anchor=\"end\" font-size=\"16\">r<\/text><circle cx=\"304.3\" cy=\"89.3\" r=\"3.5\" class=\"cf\"/><line x1=\"349.3\" y1=\"142.9\" x2=\"246.4\" y2=\"20.3\" class=\"gl\"/><text x=\"314.3\" y=\"39.3\" class=\"tg\" font-size=\"13\">tangent ⟂ radius<\/text><text x=\"220\" y=\"296\"><\/text><text x=\"450\" y=\"262\" text-anchor=\"end\" font-size=\"15\">(x − a)² + (y − b)² = r²<\/text><\/svg>"}, {"h": "Circle properties", "p": ["The **tangent** at a point is **perpendicular** to the **radius** at that point.", "The **perpendicular bisector of a chord** passes through the **centre**.", "The angle in a semicircle is a **right angle**: if AB is a diameter, angle ACB = 90°.", "To find where a line meets a circle, substitute and solve the quadratic. Use the discriminant to decide if the line crosses, touches or misses."]}], "pitfalls": ["The circle equation has r², so take the **square root** for the radius.", "Watch signs: (x + 3)² means the centre's x-coordinate is **−3**.", "For a tangent, find the gradient of the **radius** first, then use the negative reciprocal."], "examples": [{"q": "Find the equation of the line through (2, 5) perpendicular to y = 3x − 1.", "steps": ["Gradient of the given line is 3, so the perpendicular gradient is −1/3.", "y − 5 = −1/3 (x − 2).", "Multiply by 3: 3y − 15 = −x + 2, so x + 3y − 17 = 0."], "a": "x + 3y − 17 = 0"}, {"q": "The circle (x − 1)² + (y − 2)² = 25 passes through P(4, 6). Find the tangent at P.", "steps": ["Gradient of radius from (1, 2) to (4, 6) = 4/3.", "Tangent gradient = −3/4.", "y − 6 = −3/4 (x − 4), so 4y − 24 = −3x + 12."], "a": "3x + 4y − 36 = 0"}], "questions": [{"q": "Find the gradient of the line through (1, 3) and (4, 12).", "o": ["9", "3", "1/3", "−3"], "a": 1, "e": "(12 − 3) ÷ (4 − 1) = 9 ÷ 3 = 3."}, {"q": "Find the equation of the line with gradient 2 through (3, 1).", "o": ["y = 2x − 5", "y = 2x + 1", "y = 2x − 1", "y = 2x + 5"], "a": 0, "e": "y − 1 = 2(x − 3), so y = 2x − 5."}, {"q": "What is the gradient of a line perpendicular to y = −4x + 7?", "o": ["4", "−4", "1/4", "−1/4"], "a": 2, "e": "m₂ = −1/(−4) = 1/4."}, {"q": "Which line is parallel to y = 3x + 2?", "o": ["y = −3x + 2", "y = (1/3)x + 2", "3y = x", "y = 3x − 5"], "a": 3, "e": "Parallel lines have the same gradient, 3."}, {"q": "Find the midpoint of (−2, 5) and (6, 1).", "o": ["(2, 3)", "(4, 6)", "(8, −4)", "(2, 2)"], "a": 0, "e": "((−2 + 6)/2, (5 + 1)/2) = (2, 3)."}, {"q": "Find the distance between (1, 2) and (7, 10).", "o": ["14", "10", "100", "√28"], "a": 1, "e": "√(6² + 8²) = √100 = 10."}, {"q": "What is the gradient of 2x + 5y − 10 = 0?", "o": ["2", "5/2", "−2/5", "−5/2"], "a": 2, "e": "5y = −2x + 10, so y = −(2/5)x + 2."}, {"q": "What are the centre and radius of (x − 3)² + (y + 1)² = 16?", "o": ["Centre (−3, 1), radius 4", "Centre (3, −1), radius 16", "Centre (−3, 1), radius 16", "Centre (3, −1), radius 4"], "a": 3, "e": "Centre (a, b) = (3, −1). r² = 16 so r = 4."}, {"q": "Write the equation of the circle with centre (−2, 5) and radius 3.", "o": ["(x + 2)² + (y − 5)² = 9", "(x − 2)² + (y + 5)² = 9", "(x + 2)² + (y − 5)² = 3", "(x − 2)² + (y − 5)² = 9"], "a": 0, "e": "(x − (−2))² + (y − 5)² = 3²."}, {"q": "Find the centre of x² + y² − 8x + 2y + 8 = 0.", "o": ["(−4, 1)", "(4, −1)", "(8, −2)", "(−8, 2)"], "a": 1, "e": "(x − 4)² + (y + 1)² = 16 + 1 − 8 = 9. Centre (4, −1)."}, {"q": "Find the radius of x² + y² − 8x + 2y + 8 = 0.", "o": ["9", "8", "3", "√8"], "a": 2, "e": "(x − 4)² + (y + 1)² = 9, so r = 3."}, {"q": "What is the angle between a tangent and the radius at the point of contact?", "o": ["45°", "180°", "60°", "90°"], "a": 3, "e": "A tangent is perpendicular to the radius at that point."}, {"q": "The perpendicular bisector of a chord of a circle always passes through:", "o": ["The centre", "The tangent point", "The midpoint of the radius", "The origin"], "a": 0, "e": "This is used to find the centre from two chords."}, {"q": "AB is a diameter of a circle and C is on the circle. What is angle ACB?", "o": ["180°", "90°", "45°", "It depends on C"], "a": 1, "e": "The angle in a semicircle is a right angle."}, {"q": "Does the point (5, 1) lie inside, on or outside the circle (x − 2)² + (y − 1)² = 9?", "o": ["Inside", "Outside", "On", "Cannot tell"], "a": 2, "e": "(5 − 2)² + 0² = 9 = r², so it is on the circle."}, {"q": "A line meets a circle and the resulting quadratic has discriminant zero. What does this mean?", "o": ["The line misses the circle", "The line crosses twice", "The line passes through the centre", "The line is a tangent"], "a": 3, "e": "One repeated solution means one point of contact."}, {"q": "Find the equation of the line through (0, 4) and (2, 0).", "o": ["y = −2x + 4", "y = 2x + 4", "y = −x/2 + 4", "y = 2x − 4"], "a": 0, "e": "Gradient = (0 − 4)/(2 − 0) = −2, intercept 4."}, {"q": "Write y = (2/3)x − 4 in the form ax + by + c = 0 with integer coefficients.", "o": ["2x + 3y − 12 = 0", "2x − 3y − 12 = 0", "2x − 3y + 12 = 0", "3x − 2y − 4 = 0"], "a": 1, "e": "Multiply by 3: 3y = 2x − 12, so 2x − 3y − 12 = 0."}, {"q": "The radius from centre (1, 1) to P(4, 5) has gradient 4/3. What is the gradient of the tangent at P?", "o": ["4/3", "3/4", "−3/4", "−4/3"], "a": 2, "e": "Tangent is perpendicular to the radius: −1 ÷ (4/3) = −3/4."}, {"q": "Lines y = 2x + 1 and y = −x + 7 intersect at:", "o": ["(3, 4)", "(1, 3)", "(4, 3)", "(2, 5)"], "a": 3, "e": "2x + 1 = −x + 7 so x = 2, y = 5."}, {"q": "Do the lines y = 3x + 1 and 3y + x = 6 meet at right angles?", "o": ["Yes: 3 × (−1/3) = −1", "No: the gradients are equal", "No: 3 × 1/3 = 1", "Cannot tell"], "a": 0, "e": "The second line has gradient −1/3, and 3 × (−1/3) = −1."}, {"q": "A circle has diameter from (0, 0) to (6, 8). What is its equation?", "o": ["(x − 6)² + (y − 8)² = 100", "(x − 3)² + (y − 4)² = 25", "(x − 3)² + (y − 4)² = 100", "x² + y² = 25"], "a": 1, "e": "Centre is the midpoint (3, 4). Diameter = 10, so r = 5 and r² = 25."}]}, {"id": "p5", "order": 5, "year": 1, "section": "P", "badge": "D", "spec": "D", "title": "Binomial expansion", "desc": "Pascal's triangle, the binomial expansion of (a + b)ⁿ for positive integer n, nCr notation, finding particular terms and using expansions for approximations.", "practicals": [], "summary": [{"h": "Pascal's triangle and nCr", "fig": "pascal", "cap": "Each entry is the sum of the two above it. Row n gives the binomial coefficients nCr, so row 4 gives the coefficients of (a + b)⁴.", "p": ["The coefficients in the expansion of (a + b)ⁿ are found in row n of **Pascal's triangle**: 1; 1 1; 1 2 1; 1 3 3 1; 1 4 6 4 1; ...", "`ⁿCᵣ = n! / [r!(n − r)!]`, also written (n r).", "`n! = n × (n − 1) × ... × 2 × 1`, and 0! = 1."], "svg": "<svg role=\"img\" aria-label=\"Each entry is the sum of the two above it. Row n gives the binomial coefficients nCr, so row 4 gives the coefficients of (a + b)⁴.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 292\"><defs><marker id=\"f-pascal-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-pascal-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-pascal-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-pascal-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><text x=\"30\" y=\"35\" class=\"tm\" font-size=\"12\">n = 0<\/text><circle cx=\"260\" cy=\"30\" r=\"17\" class=\"bx\"/><text x=\"260\" y=\"35\" text-anchor=\"middle\" font-size=\"14\">1<\/text><text x=\"30\" y=\"73\" class=\"tm\" font-size=\"12\">n = 1<\/text><circle cx=\"234\" cy=\"68\" r=\"17\" class=\"bx\"/><text x=\"234\" y=\"73\" text-anchor=\"middle\" font-size=\"14\">1<\/text><circle cx=\"286\" cy=\"68\" r=\"17\" class=\"bx\"/><text x=\"286\" y=\"73\" text-anchor=\"middle\" font-size=\"14\">1<\/text><text x=\"30\" y=\"111\" class=\"tm\" font-size=\"12\">n = 2<\/text><circle cx=\"208\" cy=\"106\" r=\"17\" class=\"bx\"/><text x=\"208\" y=\"111\" text-anchor=\"middle\" font-size=\"14\">1<\/text><circle cx=\"260\" cy=\"106\" r=\"17\" class=\"bx\"/><text x=\"260\" y=\"111\" text-anchor=\"middle\" font-size=\"14\">2<\/text><circle cx=\"312\" cy=\"106\" r=\"17\" class=\"bx\"/><text x=\"312\" y=\"111\" text-anchor=\"middle\" font-size=\"14\">1<\/text><text x=\"30\" y=\"149\" class=\"tm\" font-size=\"12\">n = 3<\/text><circle cx=\"182\" cy=\"144\" r=\"17\" class=\"bx\"/><text x=\"182\" y=\"149\" text-anchor=\"middle\" font-size=\"14\">1<\/text><circle cx=\"234\" cy=\"144\" r=\"17\" class=\"bx\"/><text x=\"234\" y=\"149\" text-anchor=\"middle\" font-size=\"14\">3<\/text><circle cx=\"286\" cy=\"144\" r=\"17\" class=\"bx\"/><text x=\"286\" y=\"149\" text-anchor=\"middle\" font-size=\"14\">3<\/text><circle cx=\"338\" cy=\"144\" r=\"17\" class=\"bx\"/><text x=\"338\" y=\"149\" text-anchor=\"middle\" font-size=\"14\">1<\/text><text x=\"30\" y=\"187\" class=\"tm\" font-size=\"12\">n = 4<\/text><circle cx=\"156\" cy=\"182\" r=\"17\" class=\"at\"/><text x=\"156\" y=\"187\" class=\"ta\" text-anchor=\"middle\" font-size=\"14\">1<\/text><circle cx=\"208\" cy=\"182\" r=\"17\" class=\"at\"/><text x=\"208\" y=\"187\" class=\"ta\" text-anchor=\"middle\" font-size=\"14\">4<\/text><circle cx=\"260\" cy=\"182\" r=\"17\" class=\"at\"/><text x=\"260\" y=\"187\" class=\"ta\" text-anchor=\"middle\" font-size=\"14\">6<\/text><circle cx=\"312\" cy=\"182\" r=\"17\" class=\"at\"/><text x=\"312\" y=\"187\" class=\"ta\" text-anchor=\"middle\" font-size=\"14\">4<\/text><circle cx=\"364\" cy=\"182\" r=\"17\" class=\"at\"/><text x=\"364\" y=\"187\" class=\"ta\" text-anchor=\"middle\" font-size=\"14\">1<\/text><text x=\"30\" y=\"225\" class=\"tm\" font-size=\"12\">n = 5<\/text><circle cx=\"130\" cy=\"220\" r=\"17\" class=\"bx\"/><text x=\"130\" y=\"225\" text-anchor=\"middle\" font-size=\"14\">1<\/text><circle cx=\"182\" cy=\"220\" r=\"17\" class=\"bx\"/><text x=\"182\" y=\"225\" text-anchor=\"middle\" font-size=\"14\">5<\/text><circle cx=\"234\" cy=\"220\" r=\"17\" class=\"bx\"/><text x=\"234\" y=\"225\" text-anchor=\"middle\" font-size=\"14\">10<\/text><circle cx=\"286\" cy=\"220\" r=\"17\" class=\"bx\"/><text x=\"286\" y=\"225\" text-anchor=\"middle\" font-size=\"14\">10<\/text><circle cx=\"338\" cy=\"220\" r=\"17\" class=\"bx\"/><text x=\"338\" y=\"225\" text-anchor=\"middle\" font-size=\"14\">5<\/text><circle cx=\"390\" cy=\"220\" r=\"17\" class=\"bx\"/><text x=\"390\" y=\"225\" text-anchor=\"middle\" font-size=\"14\">1<\/text><text x=\"240\" y=\"262\" class=\"ta\" text-anchor=\"middle\" font-size=\"14\">(a + b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴<\/text><text x=\"240\" y=\"282\" class=\"tm\" text-anchor=\"middle\" font-size=\"12\">each number = sum of the two above; row n gives nC0 … nCn<\/text><\/svg>"}, {"h": "Binomial expansion", "p": ["`(a + b)ⁿ = aⁿ + ⁿC₁aⁿ⁻¹b + ⁿC₂aⁿ⁻²b² + ... + bⁿ`", "The general term is **ⁿCᵣ aⁿ⁻ʳ bʳ**.", "`(1 + x)ⁿ = 1 + nx + [n(n − 1)/2!]x² + [n(n − 1)(n − 2)/3!]x³ + ...`", "Put brackets around terms with coefficients or negative signs, e.g. (2 − 3x)⁵ uses a = 2 and b = (−3x)."]}, {"h": "Approximations", "p": ["Substitute a suitable small value of x into an expansion to estimate a number, e.g. (1.02)⁸ using (1 + x)⁸ with x = 0.02.", "The approximation is better when x is small, because higher powers of x become negligible."]}], "pitfalls": ["Raise the **whole** term to the power, including its coefficient: (3x)² = 9x², not 3x².", "Keep the **negative sign** inside the bracket for b.", "The term in xʳ uses ⁿCᵣ, and the (r + 1)th term is the xʳ term."], "examples": [{"q": "Find the first three terms of (2 + x)⁶ in ascending powers of x.", "steps": ["Term 1: 2⁶ = 64.", "Term 2: ⁶C₁ × 2⁵ × x = 6 × 32x = 192x.", "Term 3: ⁶C₂ × 2⁴ × x² = 15 × 16x² = 240x²."], "a": "64 + 192x + 240x² + ..."}, {"q": "Find the coefficient of x³ in the expansion of (1 − 2x)⁷.", "steps": ["Term: ⁷C₃ × (−2x)³.", "⁷C₃ = 35 and (−2)³ = −8.", "35 × (−8) = −280."], "a": "−280"}], "questions": [{"q": "What is ⁵C₂?", "o": ["20", "10", "5", "15"], "a": 1, "e": "5! / (2! 3!) = 120 / (2 × 6) = 10."}, {"q": "What is row 4 of Pascal's triangle (for (a + b)⁴)?", "o": ["1 4 6 4 1", "1 3 3 1", "1 4 4 1", "1 5 10 10 5 1"], "a": 0, "e": "Each number is the sum of the two above it."}, {"q": "Expand (1 + x)³.", "o": ["1 + 3x + 3x²", "1 + x³", "1 + 3x + 3x² + x³", "1 + 3x + x²"], "a": 2, "e": "Coefficients 1, 3, 3, 1."}, {"q": "What is the coefficient of x² in (1 + x)⁸?", "o": ["8", "56", "16", "28"], "a": 3, "e": "⁸C₂ = 28."}, {"q": "What is the coefficient of x² in (1 + 3x)⁵?", "o": ["90", "30", "10", "45"], "a": 0, "e": "⁵C₂ × 3² = 10 × 9 = 90."}, {"q": "What is the first term of (2 + x)⁵?", "o": ["2", "32", "10", "5"], "a": 1, "e": "2⁵ = 32."}, {"q": "What is the coefficient of x in (3 − x)⁴?", "o": ["108", "12", "−108", "−27"], "a": 2, "e": "⁴C₁ × 3³ × (−1) = 4 × 27 × (−1) = −108."}, {"q": "What is the coefficient of x³ in (1 + 2x)⁶?", "o": ["40", "120", "20", "160"], "a": 3, "e": "⁶C₃ × 2³ = 20 × 8 = 160."}, {"q": "What is 0!?", "o": ["1", "0", "Undefined", "Infinity"], "a": 0, "e": "0! is defined as 1, so formulas like ⁿC₀ = 1 work."}, {"q": "What is ⁷C₇?", "o": ["7", "1", "0", "5040"], "a": 1, "e": "There is exactly one way to choose all 7."}, {"q": "The first three terms of (1 + x)ⁿ are 1 + 12x + 66x². What is n?", "o": ["66", "11", "12", "6"], "a": 2, "e": "nx = 12x gives n = 12. Check: ¹²C₂ = 66."}, {"q": "Which is the general term of (a + b)ⁿ?", "o": ["n aⁿ bʳ", "ⁿCᵣ aʳ bʳ", "aⁿ⁻ʳ bⁿ", "ⁿCᵣ aⁿ⁻ʳ bʳ"], "a": 3, "e": "The power of a decreases as the power of b increases."}, {"q": "Use (1 + x)¹⁰ ≈ 1 + 10x + 45x² to estimate 1.01¹⁰.", "o": ["1.1045", "1.1", "1.0145", "1.45"], "a": 0, "e": "x = 0.01: 1 + 0.1 + 0.0045 = 1.1045."}, {"q": "Why is an approximation using the first few terms better for small x?", "o": ["Larger x makes nCr smaller", "Higher powers of a small x are very small, so the ignored terms are negligible", "Small x gives exact answers", "It doesn't matter"], "a": 1, "e": "E.g. 0.01³ = 0.000001, which contributes very little."}, {"q": "What is the constant term in (x + 2/x)⁴?", "o": ["16", "8", "24", "32"], "a": 2, "e": "Term ⁴Cᵣ x⁴⁻ʳ (2/x)ʳ has power 4 − 2r = 0 when r = 2: ⁴C₂ × 4 = 24."}, {"q": "How many terms are in the expansion of (a + b)⁹?", "o": ["9", "8", "11", "10"], "a": 3, "e": "There are n + 1 terms."}, {"q": "What is the coefficient of x² in (2 − x)⁵?", "o": ["80", "−80", "40", "10"], "a": 0, "e": "⁵C₂ × 2³ × (−1)² = 10 × 8 × 1 = 80."}, {"q": "Evaluate ⁶C₃.", "o": ["120", "20", "18", "36"], "a": 1, "e": "720 / (6 × 6) = 20."}, {"q": "What is the coefficient of x in (1 − 4x)⁵?", "o": ["20", "−4", "−20", "5"], "a": 2, "e": "⁵C₁ × (−4) = −20."}, {"q": "Which statement about ⁿCᵣ is true?", "o": ["ⁿCᵣ = ⁿCₙ", "ⁿCᵣ = n × r", "ⁿC₁ = 1", "ⁿCᵣ = ⁿCₙ₋ᵣ"], "a": 3, "e": "Pascal's triangle is symmetric."}, {"q": "Expand (1 − x)⁴.", "o": ["1 − 4x + 6x² − 4x³ + x⁴", "1 − 4x − 6x² − 4x³ − x⁴", "1 + 4x + 6x² + 4x³ + x⁴", "1 − 4x + 6x² − 4x³ − x⁴"], "a": 0, "e": "Signs alternate because b = −x."}, {"q": "In the expansion of (1 + kx)⁶, the coefficient of x is 18. What is k?", "o": ["18", "3", "6", "1/3"], "a": 1, "e": "6k = 18, so k = 3."}]}, {"id": "p6", "order": 6, "year": 1, "section": "P", "badge": "E", "spec": "E", "title": "Trigonometry", "desc": "Sine and cosine rules, area of a triangle, trig graphs and exact values, the identities tan θ = sin θ/cos θ and sin²θ + cos²θ = 1, and solving trig equations.", "practicals": [], "summary": [{"h": "Triangles", "p": ["**Sine rule**: `a/sin A = b/sin B = c/sin C`. Use when you know a side and its opposite angle.", "**Cosine rule**: `a² = b² + c² − 2bc cos A`. Use with two sides and the included angle, or three sides.", "**Area**: `Area = ½ab sin C`.", "**Ambiguous case**: when using the sine rule to find an angle, there may be two possible angles, θ and 180° − θ."]}, {"h": "Exact values and graphs", "fig": "trig-graphs", "cap": "Both graphs repeat every 360° and stay between −1 and 1. cos x is sin x shifted 90° to the left. Use the symmetry to find second solutions: sin x = sin(180° − x) and cos x = cos(360° − x).", "p": ["sin 30° = ½, sin 45° = √2/2, sin 60° = √3/2. cos 30° = √3/2, cos 45° = √2/2, cos 60° = ½. tan 30° = 1/√3, tan 45° = 1, tan 60° = √3.", "y = sin x and y = cos x have **period 360°** and range −1 to 1. y = tan x has **period 180°** and asymptotes at x = 90°, 270°, ...", "Symmetries: sin(180° − θ) = sin θ, cos(360° − θ) = cos θ, tan(180° + θ) = tan θ."], "svg": "<svg role=\"img\" aria-label=\"Both graphs repeat every 360° and stay between −1 and 1. cos x is sin x shifted 90° to the left. Use the symmetry to find second solutions: sin x = sin(180° − x) and cos x = cos(360° − x).\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 282\"><defs><marker id=\"f-triggraphs-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-triggraphs-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"af\"/><\/marker><marker id=\"f-triggraphs-ag\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"gf\"/><\/marker><marker id=\"f-triggraphs-am\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"mf\"/><\/marker><\/defs><line x1=\"50\" y1=\"120\" x2=\"458\" y2=\"120\" class=\"ln\ 80,188.5 L282.5,187.1 L285,185.6 L287.5,184 L290,182.2 L292.5,180.4 L295,178.5 L297.5,176.5 L300,174.4 L302.5,172.2 L305,170 L307.5,167.6 L310,165.2 L312.5,162.7 L315,160.2 L317.5,157.6 L320,154.9 L322.5,152.2 L325,149.4 L327.5,146.6 L330,143.8 L332.5,140.9 L335,138 L337.5,135 L340,132 L342.5,129 L345,126 L347.5,123 L350,120 L352.5,117 L355,114 L357.5,111 L360,108 L362.5,105 L365,102 L367.5,99.1 L370,96.2 L372.5,93.4 L375,90.6 L377.5,87.8 L380,85.1 L382.5,82.4 L385,79.8 L387.5,77.3 L390,74.8 L392.5,72.4 L395,70 L397.5,67.8 L400,65.6 L402.5,63.5 L405,61.5 L407.5,59.6 L410,57.8 L412.5,56 L415,54.4 L417.5,52.9 L420,51.5 L422.5,50.1 L425,48.9 L427.5,47.8 L430,46.8 L432.5,46 L435,45.2 L437.5,44.6 L440,44 L442.5,43.6 L445,43.3 L447.5,43.1 L450,43.1\" class=\"gl\"/><line x1=\"60\" y1=\"266\" x2=\"82\" y2=\"266\" class=\"ac\"/><text x=\"88\" y=\"271\" class=\"ta\" font-size=\"13\">y = sin x<\/text><line x1=\"200\" y1=\"266\" x2=\"222\" y2=\"266\" class=\"gl\"/><text x=\"228\" y=\"271\" class=\"tg\" font-size=\"13\">y = cos x<\/text><line x1=\"150\" y1=\"220\" x2=\"150\" y2=\"20\" class=\"lm\" stroke-opacity=\"0.35\"/><line x1=\"250\" y1=\"220\" x2=\"250\" y2=\"20\" class=\"lm\" stroke-opacity=\"0.35\"/><line x1=\"350\" y1=\"220\" x2=\"350\" y2=\"20\" class=\"lm\" stroke-opacity=\"0.35\"/><line x1=\"450\" y1=\"220\" x2=\"450\" y2=\"20\" class=\"lm\" stroke-opacity=\"0.35\"/><\/svg>"}, {"h": "Identities", "p": ["`tan θ = sin θ / cos θ`", "`sin²θ + cos²θ = 1`", "Use these to rewrite equations in a single trig function."]}, {"h": "Solving trig equations", "p": ["Find the **principal value** with a calculator, then use the graph or CAST diagram to find all solutions in the given interval.", "For sin x = k: x = α and 180° − α. For cos x = k: x = α and 360° − α. For tan x = k: x = α and α + 180°.", "For sin 2x = k in 0 ≤ x < 360°, solve for 2x in **0 ≤ 2x < 720°**, then halve.", "Quadratics in sin or cos: factorise, then solve each factor. Reject values outside −1 to 1."]}], "pitfalls": ["Make sure your calculator is in **degrees** (or radians for Year 2 questions).", "Don't divide by sin x or cos x: you lose solutions. Factorise instead.", "Adjust the interval when the angle is 2x, x + 30°, etc."], "examples": [{"q": "Solve 2cos²x + 3sin x − 3 = 0 for 0° ≤ x < 360°.", "steps": ["Replace cos²x with 1 − sin²x: 2 − 2sin²x + 3sin x − 3 = 0.", "So 2sin²x − 3sin x + 1 = 0, giving (2sin x − 1)(sin x − 1) = 0.", "sin x = ½: x = 30° or 150°. sin x = 1: x = 90°."], "a": "x = 30°, 90°, 150°"}, {"q": "In triangle ABC, a = 7 cm, b = 5 cm and angle C = 60°. Find c.", "steps": ["c² = 7² + 5² − 2(7)(5)cos 60°.", "c² = 49 + 25 − 35 = 39."], "a": "c = √39 ≈ 6.24 cm"}], "questions": [{"q": "What is the exact value of sin 60°?", "o": ["1/2", "√3/2", "√2/2", "√3"], "a": 1, "e": "From the equilateral triangle: sin 60° = √3/2."}, {"q": "What is the exact value of tan 45°?", "o": ["1", "√2/2", "0", "√3"], "a": 0, "e": "In a right isosceles triangle, opposite = adjacent."}, {"q": "Which formula is the cosine rule?", "o": ["a/sin A = b/sin B", "Area = ½ab sin C", "a² = b² + c² − 2bc cos A", "sin²A + cos²A = 1"], "a": 2, "e": "Use it for two sides and the included angle, or three sides."}, {"q": "Find the area of a triangle with sides 6 cm and 8 cm and included angle 30°.", "o": ["48 cm²", "24 cm²", "6 cm²", "12 cm²"], "a": 3, "e": "½ × 6 × 8 × sin 30° = 24 × ½ = 12 cm²."}, {"q": "What is the period of y = tan x (in degrees)?", "o": ["180°", "360°", "90°", "720°"], "a": 0, "e": "tan repeats every 180°."}, {"q": "Solve sin x = 0.5 for 0° ≤ x < 360°.", "o": ["30° only", "30° and 150°", "30° and 330°", "60° and 120°"], "a": 1, "e": "sin x = ½ at 30° and 180° − 30° = 150°."}, {"q": "Solve cos x = −0.5 for 0° ≤ x < 360°.", "o": ["60° and 300°", "120° only", "120° and 240°", "150° and 210°"], "a": 2, "e": "Principal value 120°; the other is 360° − 120° = 240°."}, {"q": "Solve tan x = √3 for 0° ≤ x < 360°.", "o": ["60° only", "60° and 120°", "30° and 210°", "60° and 240°"], "a": 3, "e": "tan x = √3 at 60°, and again 180° later at 240°."}, {"q": "Which identity is always true?", "o": ["sin²θ + cos²θ = 1", "sin θ + cos θ = 1", "tan θ = cos θ / sin θ", "sin²θ − cos²θ = 1"], "a": 0, "e": "This comes from Pythagoras on the unit circle."}, {"q": "Simplify sin x / cos x.", "o": ["cot x", "tan x", "1", "sec x"], "a": 1, "e": "By definition, tan x = sin x / cos x."}, {"q": "In triangle ABC, a = 10, A = 30° and B = 45°. Find b (exact).", "o": ["5√2", "20", "10√2", "10√3"], "a": 2, "e": "b = a sin B / sin A = 10 × (√2/2) ÷ ½ = 10√2."}, {"q": "Find angle A if a = 7, b = 5, c = 3.", "o": ["60°", "90°", "30°", "120°"], "a": 3, "e": "cos A = (25 + 9 − 49)/(2 × 5 × 3) = −15/30 = −½, so A = 120°."}, {"q": "Solve sin 2x = 1 for 0° ≤ x < 360°.", "o": ["45° and 225°", "90° only", "45° only", "90° and 270°"], "a": 0, "e": "2x = 90° or 450° (range 0° to 720°), so x = 45° or 225°."}, {"q": "Solve 3 tan x = √3 for 0° ≤ x < 360°.", "o": ["60° and 240°", "30° and 210°", "30° and 150°", "30° only"], "a": 1, "e": "tan x = 1/√3, so x = 30° or 210°."}, {"q": "Why can sin x = 2 not be solved?", "o": ["It needs radians", "2 is irrational", "The range of sin x is −1 ≤ sin x ≤ 1", "It has infinitely many solutions"], "a": 2, "e": "Sine never exceeds 1."}, {"q": "Write 4 − 3cos²x in terms of sin x.", "o": ["1 + 3sin x", "4 − 3sin²x", "7 − 3sin²x", "1 + 3sin²x"], "a": 3, "e": "cos²x = 1 − sin²x, so 4 − 3 + 3sin²x = 1 + 3sin²x."}, {"q": "How many solutions does cos x = 0.3 have for 0° ≤ x < 720°?", "o": ["4", "2", "1", "3"], "a": 0, "e": "Two solutions in each 360° cycle."}, {"q": "What is the exact value of cos 30°?", "o": ["1/2", "√3/2", "√2/2", "1/√3"], "a": 1, "e": "cos 30° = sin 60° = √3/2."}, {"q": "Solve sin x cos x = sin x for 0° ≤ x ≤ 360°. Which method is correct?", "o": ["Divide by sin x to get cos x = 1", "Square both sides", "Rearrange to sin x(cos x − 1) = 0 and solve both factors", "Use the sine rule"], "a": 2, "e": "Dividing by sin x loses the solutions where sin x = 0. Answers: 0°, 180°, 360°."}, {"q": "What is the maximum value of y = 3 sin x?", "o": ["1", "1/3", "−3", "3"], "a": 3, "e": "sin x has maximum 1, so 3 sin x has maximum 3."}, {"q": "Using the sine rule to find angle B gives sin B = 0.8. Which angles are possible?", "o": ["53.1° or 126.9°", "53.1° only", "36.9° or 143.1°", "53.1° or 233.1°"], "a": 0, "e": "sin⁻¹ 0.8 = 53.1°, and 180° − 53.1° = 126.9°. Check each fits the triangle."}, {"q": "What is the exact value of sin 45°?", "o": ["1/2", "√2/2", "√3/2", "1"], "a": 1, "e": "sin 45° = 1/√2 = √2/2."}]}, {"id": "p7", "order": 7, "year": 1, "section": "P", "badge": "F", "spec": "F", "title": "Exponentials and logarithms", "desc": "Exponential graphs and eˣ, gradient of eᵏˣ, laws of logarithms, ln x, solving exponential equations, and modelling with exponentials and log-linear graphs.", "practicals": [], "summary": [{"h": "Exponential functions", "p": ["y = aˣ (a > 0) passes through (0, 1) and has the x-axis as an asymptote.", "**e ≈ 2.718** is the special base for which the gradient of eˣ equals eˣ.", "`d/dx (eᵏˣ) = keᵏˣ`, so the rate of change is proportional to the value."]}, {"h": "Logarithms", "fig": "exp-log-graphs", "cap": "y = ln x is the inverse of y = eˣ, so its graph is the reflection in y = x. eˣ is always positive and passes through (0, 1); ln x is only defined for x > 0 and passes through (1, 0).", "p": ["`logₐ b = c ⇔ aᶜ = b`", "`logₐ x + logₐ y = logₐ (xy)`", "`logₐ x − logₐ y = logₐ (x/y)`", "`k logₐ x = logₐ (xᵏ)`", "`logₐ a = 1` and `logₐ 1 = 0`.", "**ln x** = logₑ x. ln and eˣ are **inverse functions**: e^(ln x) = x and ln(eˣ) = x."], "svg": "<svg role=\"img\" aria-label=\"y = ln x is the inverse of y = eˣ, so its graph is the reflection in y = x. eˣ is always positive and passes through (0, 1); ln x is only defined for x &gt; 0 and passes through (1, 0).\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 336\"><defs><marker id=\"f-exploggraphs-ah\" viewBox=\"0 0 10 10\" refX=\"8. growth and decay: e.g. N = N₀e^(kt) (k > 0 growth, k < 0 decay).", "If **y = axⁿ**, then **log y = log a + n log x**. Plotting log y against log x gives a straight line with gradient **n** and intercept **log a**.", "If **y = kbˣ**, then **log y = log k + x log b**. Plotting log y against x gives gradient **log b** and intercept **log k**.", "Consider limitations of models, e.g. exponential growth can't continue forever."]}], "pitfalls": ["log(x + y) is **not** log x + log y.", "ln of a negative number or zero is undefined. Check solutions.", "Read which variables are on each axis of a log graph before finding a and n (or k and b)."], "examples": [{"q": "Solve 3ˣ = 20, giving your answer to 3 s.f.", "steps": ["Take logs: x ln 3 = ln 20.", "x = ln 20 / ln 3 = 2.9957... / 1.0986..."], "a": "x ≈ 2.73"}, {"q": "Solve e²ˣ − 7eˣ + 12 = 0.", "steps": ["Let u = eˣ: u² − 7u + 12 = 0, so (u − 3)(u − 4) = 0.", "eˣ = 3 or eˣ = 4."], "a": "x = ln 3 or x = ln 4"}], "questions": [{"q": "Write log₂ 8 = 3 in index form.", "o": ["8² = 3", "2³ = 8", "3² = 8", "8³ = 2"], "a": 1, "e": "logₐ b = c means aᶜ = b."}, {"q": "Evaluate log₃ 81.", "o": ["4", "27", "3", "9"], "a": 0, "e": "3⁴ = 81."}, {"q": "Simplify log 5 + log 4.", "o": ["log 9", "log 1.25", "log 20", "2 log 9"], "a": 2, "e": "log x + log y = log(xy) = log 20."}, {"q": "Simplify 3 log 2 − log 4.", "o": ["log 2/3", "log 4", "log 6", "log 2"], "a": 3, "e": "3 log 2 = log 8. log 8 − log 4 = log 2."}, {"q": "What is ln e?", "o": ["1", "0", "e", "2.718"], "a": 0, "e": "ln e = logₑ e = 1."}, {"q": "Simplify e^(ln 5).", "o": ["ln 5", "5", "e⁵", "1/5"], "a": 1, "e": "eˣ and ln x are inverse functions."}, {"q": "Solve eˣ = 10.", "o": ["x = 10/e", "x = log 10", "x = ln 10", "x = e¹⁰"], "a": 2, "e": "Take ln of both sides."}, {"q": "Solve 5ˣ = 30 to 3 s.f.", "o": ["6.00", "1.48", "0.473", "2.11"], "a": 3, "e": "x = ln 30 / ln 5 = 3.401 / 1.609 ≈ 2.11."}, {"q": "What is the derivative of e^(3x)?", "o": ["3e^(3x)", "e^(3x)", "3x e^(3x−1)", "e^(3x)/3"], "a": 0, "e": "d/dx (eᵏˣ) = keᵏˣ."}, {"q": "Where does y = 4eˣ cross the y-axis?", "o": ["(0, 1)", "(0, 4)", "(0, e)", "(0, 0)"], "a": 1, "e": "At x = 0, y = 4e⁰ = 4."}, {"q": "What is the asymptote of y = eˣ?", "o": ["x = 0", "y = 1", "y = 0", "x = 1"], "a": 2, "e": "As x → −∞, eˣ → 0 but never reaches it."}, {"q": "Solve ln x = 2.", "o": ["x = 2/e", "x = ln 2", "x = 2e", "x = e²"], "a": 3, "e": "x = e²."}, {"q": "Solve log₂(x + 1) = 5.", "o": ["x = 31", "x = 32", "x = 9", "x = 4"], "a": 0, "e": "x + 1 = 2⁵ = 32, so x = 31."}, {"q": "If y = axⁿ, which graph gives a straight line?", "o": ["y against x", "log y against log x", "log y against x", "y against log x"], "a": 1, "e": "log y = log a + n log x has the form Y = mX + c."}, {"q": "For y = axⁿ, a graph of log y against log x has gradient 3 and intercept 0.6. What is a (base 10)?", "o": ["0.6", "3", "≈ 3.98", "≈ 1.82"], "a": 2, "e": "log a = 0.6, so a = 10⁰·⁶ ≈ 3.98. And n = 3."}, {"q": "For y = kbˣ, what does the gradient of a graph of log y against x equal?", "o": ["log k", "k", "b", "log b"], "a": 3, "e": "log y = log k + x log b."}, {"q": "A population is modelled by P = 200e^(0.05t). What is the initial population?", "o": ["200", "210", "0.05", "10"], "a": 0, "e": "At t = 0, e⁰ = 1, so P = 200."}, {"q": "P = 200e^(0.05t). When does P reach 400? (3 s.f.)", "o": ["40.0", "13.9", "6.93", "20.0"], "a": 1, "e": "e^(0.05t) = 2, so t = ln 2 / 0.05 ≈ 13.9."}, {"q": "Simplify 2 ln x + ln 3.", "o": ["ln(6x)", "ln(2x + 3)", "ln(3x²)", "2 ln(3x)"], "a": 2, "e": "2 ln x = ln x², then ln x² + ln 3 = ln 3x²."}, {"q": "Solve 2^(x+1) = 3ˣ to 3 s.f.", "o": ["0.585", "1.71", "2.41", "1.71 × 10⁻¹"], "a": 1, "e": "(x + 1) ln 2 = x ln 3, so x = ln 2 / (ln 3 − ln 2) ≈ 1.71."}, {"q": "Why might an exponential growth model become unrealistic over long times?", "o": ["e is irrational", "Real growth is limited by resources, so it can't continue forever", "Logarithms stop working", "Growth always speeds up"], "a": 1, "e": "Models need limits, e.g. space or food for populations."}, {"q": "Solve e²ˣ = 9.", "o": ["x = ln 3", "x = 4.5", "x = ln 9", "x = 3"], "a": 0, "e": "2x = ln 9, so x = ½ ln 9 = ln 3."}]}, {"id": "p8", "order": 8, "year": 1, "section": "P", "badge": "G", "spec": "G", "title": "Differentiation", "desc": "Differentiation from first principles, differentiating xⁿ, tangents and normals, increasing and decreasing functions, stationary points and optimisation.", "practicals": [], "summary": [{"h": "First principles", "p": ["The derivative is the **gradient of the tangent**, the limit of the gradient of a chord as h → 0.", "`f′(x) = lim (h→0) [f(x + h) − f(x)] / h`", "E.g. for f(x) = x²: [(x + h)² − x²]/h = (2xh + h²)/h = 2x + h → 2x."]}, {"h": "Rules", "p": ["`d/dx (xⁿ) = nxⁿ⁻¹` for any rational n.", "`d/dx (kxⁿ) = knxⁿ⁻¹`. Constants differentiate to 0.", "Rewrite roots and fractions as powers first: √x = x^(1/2), 1/x² = x⁻².", "dy/dx is the gradient function. d²y/dx² is the **second derivative**."]}, {"h": "Tangents and normals", "fig": "tangent-normal", "cap": "For y = ½x², dy/dx = x, so at (2, 2) the tangent has gradient 2. The normal is perpendicular, so its gradient is −1 ÷ 2 = −½. Then use y − y₁ = m(x − x₁).", "p": ["Gradient of the **tangent** at x = a is f′(a).", "The **normal** is perpendicular to the tangent: gradient −1/f′(a).", "Then use y − y₁ = m(x − x₁)."], "svg": "<svg role=\"img\" aria-label=\"For y = ½x², dy/dx = x, so at (2, 2) the tangent has gradient 2. The normal is perpendicular, so its gradient is −1 ÷ 2 = −½. Then use y − y₁ = m(x − x₁).\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 300\"><defs><marker id=\"f-tangentnormal-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-tangentnormal-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">
