0 (minimum). At x = −1 it's −6 < 0 (maximum)."], "a": "Minimum (1, 0); maximum (−1, 4)"}, {"q": "Find the equation of the normal to y = x² + 1 at (2, 5).", "steps": ["dy/dx = 2x = 4 at x = 2.", "Normal gradient = −1/4.", "y − 5 = −¼(x − 2), so 4y − 20 = −x + 2."], "a": "x + 4y − 22 = 0"}], "questions": [{"q": "Differentiate y = 5x³.", "o": ["5x²", "15x²", "15x³", "3x²"], "a": 1, "e": "dy/dx = 5 × 3x² = 15x²."}, {"q": "Differentiate y = 4√x.", "o": ["2x^(−1/2)", "4x^(1/2)", "2x^(1/2)", "8x^(−1/2)"], "a": 0, "e": "4x^(1/2) differentiates to 4 × ½ x^(−1/2) = 2x^(−1/2) = 2/√x."}, {"q": "Differentiate y = 3/x².", "o": ["−3/x", "6/x³", "−6/x³", "3/(2x)"], "a": 2, "e": "3x⁻² → −6x⁻³ = −6/x³."}, {"q": "Find the gradient of y = x² − 4x at x = 3.", "o": ["−3", "−1", "5", "2"], "a": 3, "e": "dy/dx = 2x − 4 = 2 at x = 3."}, {"q": "Differentiate y = 7.", "o": ["0", "7", "7x", "1"], "a": 0, "e": "A constant has zero gradient."}, {"q": "What is f′(x) defined as from first principles?", "o": ["[f(x) − f(h)]/x", "lim (h→0) [f(x + h) − f(x)]/h", "f(x + 1) − f(x)", "lim (h→∞) f(x)/h"], "a": 1, "e": "The gradient of a chord as its width h shrinks to zero."}, {"q": "From first principles for f(x) = x², what is [f(x + h) − f(x)]/h?", "o": ["2x", "x + h", "2x + h", "h²"], "a": 2, "e": "(x² + 2xh + h² − x²)/h = 2x + h, which tends to 2x."}, {"q": "The tangent to a curve at a point has gradient 2. What is the gradient of the normal?", "o": ["2", "−2", "1/2", "−1/2"], "a": 3, "e": "Normal gradient = −1/2."}, {"q": "Find the equation of the tangent to y = x² at (3, 9).", "o": ["y = 6x − 9", "y = 6x + 9", "y = 3x", "y = 9x − 18"], "a": 0, "e": "dy/dx = 6 at x = 3. y − 9 = 6(x − 3), so y = 6x − 9."}, {"q": "For what values of x is y = x² − 6x increasing?", "o": ["x < 3", "x > 3", "x > 6", "x < 0"], "a": 1, "e": "dy/dx = 2x − 6 > 0 when x > 3."}, {"q": "Find the x-coordinate of the stationary point of y = x² − 10x + 3.", "o": ["10", "−5", "5", "3"], "a": 2, "e": "2x − 10 = 0, so x = 5."}, {"q": "d²y/dx² is positive at a stationary point. What type is it?", "o": ["Maximum", "Point of inflection", "Cannot tell", "Minimum"], "a": 3, "e": "Positive second derivative means the curve is U-shaped there."}, {"q": "Find d²y/dx² for y = x⁴ − 2x³.", "o": ["12x² − 12x", "4x³ − 6x²", "12x² − 6x", "4x² − 6x"], "a": 0, "e": "dy/dx = 4x³ − 6x², then d²y/dx² = 12x² − 12x."}, {"q": "Differentiate y = (x + 2)(x − 3) by expanding first.", "o": ["2x − 6", "2x − 1", "x − 1", "2x + 1"], "a": 1, "e": "y = x² − x − 6, so dy/dx = 2x − 1."}, {"q": "Differentiate y = (x³ + x)/x.", "o": ["3x² + 1", "2x + 1", "2x", "x²"], "a": 2, "e": "Simplify first: y = x² + 1, so dy/dx = 2x."}, {"q": "y = x³ − 12x. Find the coordinates of the maximum point.", "o": ["(2, −16)", "(0, 0)", "(−2, −16)", "(−2, 16)"], "a": 3, "e": "3x² − 12 = 0 gives x = ±2. At x = −2, y = −8 + 24 = 16, and d²y/dx² = −12 < 0."}, {"q": "A rectangle has perimeter 20 cm. What is its maximum area?", "o": ["25 cm²", "20 cm²", "100 cm²", "24 cm²"], "a": 0, "e": "A = x(10 − x). dA/dx = 10 − 2x = 0 at x = 5, giving A = 25 cm² (a square)."}, {"q": "What does dy/dx represent?", "o": ["The area under the curve", "The rate of change of y with respect to x (gradient)", "The y-intercept", "The value of y"], "a": 1, "e": "dy/dx is the gradient function."}, {"q": "Differentiate y = x^(3/2).", "o": ["(2/3)x^(1/2)", "x^(1/2)", "(3/2)x^(1/2)", "(3/2)x^(5/2)"], "a": 2, "e": "Multiply by the power, then reduce it by 1."}, {"q": "Find the gradient of y = 2/x at x = 2.", "o": ["1", "−1", "1/2", "−1/2"], "a": 3, "e": "y = 2x⁻¹, dy/dx = −2x⁻² = −2/4 = −½."}, {"q": "At a stationary point, what is the value of dy/dx?", "o": ["0", "1", "Undefined", "Positive"], "a": 0, "e": "The tangent is horizontal at a stationary point."}, {"q": "Find the equation of the normal to y = 2x² at (1, 2).", "o": ["y = 4x − 2", "x + 4y − 9 = 0", "4x + y − 6 = 0", "x − 4y + 7 = 0"], "a": 1, "e": "dy/dx = 4x = 4. Normal gradient −1/4. y − 2 = −¼(x − 1) gives x + 4y − 9 = 0."}]}, {"id": "p9", "order": 9, "year": 1, "section": "P", "badge": "H", "spec": "H", "title": "Integration", "desc": "Integration as the reverse of differentiation, integrating xⁿ, finding constants, definite integrals and areas between curves and the x-axis.", "practicals": [], "summary": [{"h": "Indefinite integration", "p": ["Integration is the **reverse of differentiation**.", "`∫ xⁿ dx = xⁿ⁺¹/(n + 1) + c`, for n ≠ −1.", "Always add **+ c** for indefinite integrals.", "Rewrite roots and fractions as powers first, and expand brackets.", "If you know a point on the curve, substitute it to find c."]}, {"h": "Definite integrals", "p": ["`∫ₐᵇ f(x) dx = F(b) − F(a)`, where F is the integral of f. No + c needed.", "The **Fundamental Theorem of Calculus** links differentiation and integration."]}, {"h": "Areas", "fig": "area-under-curve", "cap": "An integral counts area below the x-axis as negative. When a curve crosses the axis, integrate each part separately (here 0 to 3, then 3 to 4) and add the sizes of the areas.", "p": ["The area between a curve and the **x-axis** from x = a to x = b is ∫ₐᵇ y dx.", "Areas **below** the x-axis give **negative** integrals. Find each part separately and add the magnitudes.", "**Area between two curves**: ∫ (upper − lower) dx between their intersection points.", "For a line and a curve, you can also subtract the area of a triangle or trapezium."], "svg": "<svg role=\"img\" aria-label=\"An integral counts area below the x-axis as negative. When a curve crosses the axis, integrate each part separately (here 0 to 3, then 3 to 4) and add the sizes of the areas.\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 290\"><defs><marker id=\"f-areaundercurve-ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"cf\"/><\/marker><marker id=\"f-areaundercurve-aa\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6\" markerHeigh
