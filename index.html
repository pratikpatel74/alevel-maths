 {"q": "Area A = πr². dr/dt = 2. Find dA/dt when r = 3.", "o": ["12π", "6π", "18π", "9π"], "a": 0, "e": "dA/dr = 2πr = 6π. dA/dt = 6π × 2 = 12π."}, {"q": "A stationary point of inflection must satisfy:", "o": ["f′(x) ≠ 0", "f′(x) = 0 and f″(x) changes sign", "f″(x) > 0", "f(x) = 0"], "a": 1, "e": "E.g. y = x³ at x = 0."}, {"q": "Find dy/dx for x²y = 6.", "o": ["−x/(2y)", "6/x²", "−2y/x", "−y/(2x)"], "a": 2, "e": "2xy + x² dy/dx = 0, so dy/dx = −2xy/x² = −2y/x."}, {"q": "For a parametric curve, how do you find where the tangent is horizontal?", "o": ["Set dx/dt = 0", "Set x = 0", "Set y = 0", "Set dy/dt = 0 (with dx/dt ≠ 0)"], "a": 3, "e": "Horizontal tangent means dy/dx = 0."}, {"q": "y = sin x on 0 < x < 2π. Where is the point of inflection?", "o": ["x = π", "x = π/2", "x = 3π/2", "There isn't one"], "a": 0, "e": "y″ = −sin x = 0 at x = π, and it changes sign there."}, {"q": "x = e^t, y = e^(2t). Find dy/dx.", "o": ["e^t", "2e^t", "2", "e^(2t)"], "a": 1, "e": "dy/dx = 2e^(2t)/e^t = 2e^t."}]}, {"id": "p19", "order": 25, "year": 2, "section": "P", "badge": "H", "spec": "H", "title": "Integration techniques", "desc": "Integrating eˣ, 1/x and trig functions, reverse chain rule, integration by substitution, integration by parts, and integrating using partial fractions and identities.", "practicals": [], "summary": [{"h": "Standard integrals", "p": ["`∫ eᵏˣ dx = (1/k)eᵏˣ + c`", "`∫ 1/x dx = ln|x| + c`", "`∫ cos kx dx = (1/k) sin kx + c` and `∫ sin kx dx = −(1/k) cos kx + c`", "`∫ sec²kx dx = (1/k) tan kx + c`", "`∫ (ax + b)ⁿ dx = (ax + b)ⁿ⁺¹/[a(n + 1)] + c`"]}, {"h": "Reverse chain rule", "p": ["`∫ f′(x)/f(x) dx = ln|f(x)| + c`", "`∫ f′(x)[f(x)]ⁿ dx = [f(x)]ⁿ⁺¹/(n + 1) + c`", "Spot when the numerator is (a multiple of) the derivative of the denominator."]}, {"h": "Substitution and parts", "p": ["**Substitution**: let u = g(x), find du/dx, replace dx and all x terms. For definite integrals, **change the limits** too.", "**Integration by parts**: `∫ u (dv/dx) dx = uv − ∫ v (du/dx) dx`.", "Choose u to be the part that gets **simpler** when differentiated (e.g. a polynomial), except with ln x, where u = ln x.", "Sometimes parts is used twice (e.g. x² eˣ)."]}, {"h": "Using identities and partial fractions", "p": ["Use partial fractions to split rational functions, then integrate each term to get logs.", "Use trig identities: e.g. `sin²x = ½(1 − cos 2x)` and `cos²x = ½(1 + cos 2x)`. tan²x = sec²x − 1."]}], "pitfalls": ["∫ 1/x dx = ln|x|. Use modulus when x could be negative.", "Change the limits in a definite substitution, or substitute back before using the original limits.", "In integration by parts, the derivative of u should be simpler than u."], "examples": [{"q": "Find ∫ x eˣ dx.", "steps": ["u = x, dv/dx = eˣ, so du/dx = 1, v = eˣ.", "∫ x eˣ dx = x eˣ − ∫ eˣ dx."], "a": "x eˣ − eˣ + c"}, {"q": "Find ∫₀^(π/2) sin²x dx.", "steps": ["sin²x = ½(1 − cos 2x).", "∫ = [½x − ¼ sin 2x] from 0 to π/2.", "= (π/4 − 0) − 0."], "a": "π/4"}], "questions": [{"q": "Find ∫ e^(3x) dx.", "o": ["3e^(3x) + c", "⅓e^(3x) + c", "e^(3x) + c", "e^(4x)/4 + c"], "a": 1, "e": "∫ eᵏˣ dx = (1/k)eᵏˣ + c."}, {"q": "Find ∫ 5/x dx.", "o": ["5 ln|x| + c", "5x⁻² + c", "ln|5x| + c", "−5/x² + c"], "a": 0, "e": "∫ 1/x dx = ln|x|, multiplied by 5."}, {"q": "Find ∫ cos 2x dx.", "o": ["2 sin 2x + c", "−½ sin 2x + c", "½ sin 2x + c", "sin 2x + c"], "a": 2, "e": "∫ cos kx dx = (1/k) sin kx."}, {"q": "Find ∫ sin 3x dx.", "o": ["⅓ cos 3x + c", "−3 cos 3x + c", "3 cos 3x + c", "−⅓ cos 3x + c"], "a": 3, "e": "∫ sin kx dx = −(1/k) cos kx."}, {"q": "Find ∫ 2x/(x² + 1) dx.", "o": ["ln(x² + 1) + c", "2 ln(x² + 1) + c", "x² ln x + c", "1/(x² + 1) + c"], "a": 0, "e": "The numerator is the derivative of the denominator."}, {"q": "Find ∫ (2x + 1)⁵ dx.", "o": ["(2x + 1)⁶/6 + c", "(2x + 1)⁶/12 + c", "10(2x + 1)⁴ + c", "(2x + 1)⁶ + c"], "a": 1, "e": "(2x + 1)⁶/(2 × 6)."}, {"q": "Find ∫ sec²x dx.", "o": ["sec x tan x + c", "sec³x/3 + c", "tan x + c", "−cot x + c"], "a": 2, "e": "d/dx (tan x) = sec²x."}, {"q": "Find ∫ x eˣ dx.", "o": ["x eˣ + c", "x² eˣ/2 + c", "eˣ + c", "x eˣ − eˣ + c"], "a": 3, "e": "By parts with u = x."}, {"q": "For ∫ x ln x dx by parts, which should be u?", "o": ["u = ln x", "u = x", "u = x ln x", "Either"], "a": 0, "e": "ln x is hard to integrate but easy to differentiate."}, {"q": "Find ∫ x ln x dx.", "o": ["x² ln x + c", "½x² ln x − ¼x² + c", "ln x/x + c", "½x² ln x + c"], "a": 1, "e": "u = ln x, v = x²/2: ½x² ln x − ∫ ½x dx = ½x² ln x − ¼x² + c."}, {"q": "Evaluate ∫₁^e 1/x dx.", "o": ["e", "0", "1", "e − 1"], "a": 2, "e": "[ln x]₁^e = 1 − 0 = 1."}, {"q": "Which identity helps to integrate cos²x?", "o": ["cos²x = 1 − sin x", "cos²x = 2cos x", "cos²x = sec²x − 1", "cos²x = ½(1 + cos 2x)"], "a": 3, "e": "This turns cos²x into terms that integrate directly."}, {"q": "Find ∫ tan²x dx.", "o": ["tan x − x + c", "tan³x/3 + c", "sec²x + c", "tan x + x + c"], "a": 0, "e": "tan²x = sec²x − 1."}, {"q": "Using u = x² + 1, find ∫ 2x (x² + 1)³ dx.", "o": ["(x² + 1)⁴ + c", "(x² + 1)⁴/4 + c", "2(x² + 1)⁴ + c", "x²(x² + 1)⁴ + c"], "a": 1, "e": "du = 2x dx, so ∫ u³ du = u⁴/4."}, {"q": "Find ∫ 1/(2x + 3) dx.", "o": ["ln|2x + 3| + c", "2 ln|2x + 3| + c", "½ ln|2x + 3| + c", "−1/(2x + 3)² + c"], "a": 2, "e": "∫ 1/(ax + b) dx = (1/a) ln|ax + b|."}, {"q": "Express and integrate 1/[(x + 1)(x + 2)].", "o": ["ln|x + 1| + ln|x + 2| + c", "ln|(x + 1)(x + 2)| + c", "1/(x + 1) − 1/(x + 2) + c", "ln|(x + 1)/(x + 2)| + c"], "a": 3, "e": "1/(x + 1) − 1/(x + 2), so ln|x + 1| − ln|x + 2|."}, {"q": "Evaluate ∫₀^(π/2) cos x dx.", "o": ["1", "0", "−1", "π/2"], "a": 0, "e": "[sin x]₀^(π/2) = 1 − 0."}, {"q": "In a definite integral by substitution, what must you do with the limits?", "o": ["Leave them unchanged", "Change them to the corresponding values of u", "Double them", "Remove them"], "a": 1, "e": "Or substitute back to x before using the original limits."}, {"q": "Find ∫ cos x/sin x dx.", "o": ["−ln|sin x| + c", "ln|cos x| + c", "ln|sin x| + c", "tan x + c"], "a": 2, "e": "The numerator is the derivative of the denominator."}, {"q": "Evaluate ∫₀^(π/2) sin²x dx.", "o": ["π/2", "1", "½", "π/4"], "a": 3, "e": "[½x − ¼ sin 2x]₀^(π/2) = π/4."}, {"q": "How many times is integration by parts needed for ∫ x² eˣ dx?", "o": ["Twice", "Once", "Three times", "It can't be done"], "a": 0, "e": "Each application reduces the power of x by 1."}, {"q": "Find ∫ e^(2x) + 1/x dx.", "o": ["2e^(2x) + ln x + c", "½e^(2x) + ln|x| + c", "e^(2x) − 1/x² + c", "½e^(2x) − 1/x² + c"], "a": 1, "e": "Integrate each term separately."}]}, {"id": "p20", "order": 26, "year": 2, "section": "P", "badge": "H", "spec": "H", "title": "Differential equations and areas", "desc": "Integration as the limit of a sum, areas between curves, areas under parametric curves, and solving first-order separable differential equations in context.", "practicals": [], "summary": [{"h": "Integration as the limit of a sum", "p": ["The area under a curve is the limit of the sum of thin rectangles: `∫ₐᵇ y dx = lim (δx→0) Σ y δx`."]}, {"h": "Areas", "p": ["**Between two curves**: ∫ (upper − lower) dx between intersection points.", "**Parametric curves**: `Area = ∫ y (dx/dt) dt`, with limits in **t**."]}, {"h": "Separable differential equations", "p": ["A **first-order separable** equation can be written `dy/dx = f(x) g(y)`.", "**Separate** the variables: `∫ 1/g(y) dy = ∫ f(x) dx`, then integrate both sides and add **one** constant.", "The **general solution** contains a constant. A **particular solution** uses given values to find it.", "Example: dy/dx = ky gives ln|y| = kx + c, so y = Aeᵏˣ (exponential growth or decay)."]}, {"h": "Modelling", "p": ["Form the equation from words: 'rate of change of N is proportional to N' gives dN/dt = kN.", "Interpret the solution in context, including limitations (e.g. a population can't grow forever)."]}], "pitfalls": ["Only one + c is needed after integrating both sides.", "When exponentiating ln|y| = kx + c, the constant becomes a **multiplier**: y = Aeᵏˣ.", "For parametric areas, change the limits to t values."], "examples": [{"q": "Solve dy/dx = 2xy, given y = 3 when x = 0.", "steps": ["Separate: ∫ 1/y dy = ∫ 2x dx.", "ln|y| = x² + c, so y = Ae^(x²).", "y = 3 at x = 0 gives A = 3."], "a": "y = 3e^(x²)"}, {"q": "Find the area enclosed by y = x² and y = 2x.", "steps": ["Intersections: x² = 2x, so x = 0 and x = 2.", "∫₀² (2x − x²) dx = [x² − x³/3]₀².", "= 4 − 8/3."], "a": "4/3"}], "questions": [{"q": "Which is a separable differential equation?", "o": ["dy/dx = x + y", "dy/dx = xy²", "dy/dx = sin(x + y)", "dy/dx = x² + y²"], "a": 1, "e": "xy² is a product of a function of x and a function of y."}, {"q": "What is the general solution of dy/dx = 3y?", "o": ["y = Ae^(3x)", "y = 3x + c", "y = e^(3x)", "y = 3eˣ + c"], "a": 0, "e": "ln|y| = 3x + c, so y = Ae^(3x)."}, {"q": "Solve dy/dx = x/y.", "o": ["y = x + c", "y² = x + c", "y² = x² + c", "y = ln x + c"], "a": 2, "e": "∫ y dy = ∫ x dx gives y²/2 = x²/2 + c, so y² = x² + C."}, {"q": "What is the difference between a general and a particular solution?", "o": ["There is no difference", "A particular solution has more constants", "A general solution has no constant", "A general solution contains an arbitrary constant; a particular solution uses given conditions to find it"], "a": 3, "e": "Initial conditions pin down the constant."}, {"q": "A population grows at a rate proportional to its size. Which equation models this?", "o": ["dP/dt = kP", "dP/dt = k", "P = kt", "dP/dt = −kP²"], "a": 0, "e": "Proportional to its size means dP/dt = kP, k > 0."}, {"q": "dP/dt = 0.2P, P = 100 when t = 0. Find P when t = 5.", "o": ["200", "100e ≈ 272", "100e^0.2 ≈ 122", "500"], "a": 1, "e": "P = 100e^(0.2t). At t = 5, P = 100e¹ ≈ 272."}, {"q": "Find the area enclosed between y = x and y = x².", "o": ["1/2", "1/3", "1/6", "1"], "a": 2, "e": "∫₀¹ (x − x²) dx = ½ − ⅓ = 1/6."}, {"q": "What is the formula for the area under a parametric curve?", "o": ["∫ x dy", "∫ y dt", "∫ (dy/dt) dx", "∫ y (dx/dt) dt"], "a": 3, "e": "Since dx = (dx/dt) dt."}, {"q": "x = t², y = 2t for 0 ≤ t ≤ 2. Find the area under the curve.", "o": ["32/3", "16/3", "8", "4"], "a": 0, "e": "∫₀² 2t × 2t dt = ∫ 4t² dt = [4t³/3]₀² = 32/3."}, {"q": "Solve dy/dx = eˣ/y, given y = 2 when x = 0.", "o": ["y = eˣ + 1", "y² = 2eˣ + 2", "y = 2eˣ", "y² = eˣ + 3"], "a": 1, "e": "y²/2 = eˣ + c. At (0, 2): 2 = 1 + c, c = 1. So y² = 2eˣ + 2."}, {"q": "What does integration as the limit of a sum mean?", "o": ["Integration adds constants", "Integration is the same as differentiation", "Area is the limit of the sum of thin rectangles as their width tends to zero", "The integral is always a whole number"], "a": 2, "e": "∫ y dx = lim Σ y δx."}, {"q": "How many arbitrary constants appear in the general solution of a first-order separable equation?", "o": ["Two", "None", "It depends on the equation", "One"], "a": 3, "e": "Combine the constants from both sides into one."}, {"q": "A liquid cools at a rate proportional to the temperature difference with the room: dθ/dt = −k(θ − 20). What happens as t → ∞?", "o": ["θ → 20", "θ → 0", "θ → ∞", "θ oscillates"], "a": 0, "e": "The solution is θ = 20 + Ae^(−kt), which tends to room temperature."}, {"q": "Solve dy/dx = y cos x.", "o": ["y = A cos x", "y = Ae^(sin x)", "y = sin x + c", "y = Ae^(cos x)"], "a": 1, "e": "ln|y| = sin x + c."}, {"q": "The area between y = 4 − x² and y = 0 is split by the y-axis. What is the area for x from 0 to 2?", "o": ["32/3", "8", "16/3", "4"], "a": 2, "e": "[4x − x³/3]₀² = 8 − 8/3 = 16/3."}, {"q": "Why might an exponential model for population growth become inaccurate?", "o": ["The constant is wrong", "Integration is approximate", "Populations always decrease", "Resources are limited, so growth slows over time"], "a": 3, "e": "Real populations level off at a carrying capacity."}, {"q": "Solve dy/dx = 2y, y = 5 when x = 0.", "o": ["y = 5e^(2x)", "y = 2e^(5x)", "y = 5 + 2x", "y = e^(2x) + 4"], "a": 0, "e": "y = Ae^(2x), A = 5."}, {"q": "To solve dy/dx = (1 + y²)/x, what is the first step?", "o": ["Integrate both sides directly", "Separate: ∫ 1/(1 + y²) dy = ∫ 1/x dx", "Multiply by x²", "Differentiate again"], "a": 1, "e": "Get all y terms with dy and all x terms with dx."}, {"q": "The rate at which a radioactive mass m decays is proportional to m. If m halves in 10 years, what is k in dm/dt = −km?", "o": ["0.1", "10 ln 2", "(ln 2)/10", "ln 10"], "a": 2, "e": "m = m₀e^(−kt). ½ = e^(−10k), so k = ln 2/10 ≈ 0.0693."}, {"q": "Find the area enclosed by y = x² and y = 4.", "o": ["8", "16", "16/3", "32/3"], "a": 3, "e": "∫₋₂² (4 − x²) dx = 32/3."}, {"q": "In ln|y| = 2x + c, what is y in terms of x?", "o": ["y = Ae^(2x)", "y = e^(2x) + c", "y = 2x + eᶜ", "y = A + e^(2x)"], "a": 0, "e": "y = e^(2x + c) = eᶜ e^(2x) = Ae^(2x)."}, {"q": "What is the area between y = sin x and the x-axis from 0 to π?", "o": ["1", "2", "0", "π"], "a": 1, "e": "[−cos x]₀^π = 1 + 1 = 2."}]}, {"id": "p21", "order": 27, "year": 2, "section": "P", "badge": "I", "spec": "I", "title": "Numerical methods", "desc": "Locating roots by change of sign, fixed-point iteration with staircase and cobweb diagrams, the Newton–Raphson method, and the trapezium rule.", "practicals": [], "summary": [{"h": "Locating roots", "p": ["If f(x) is **continuous** on [a, b] and f(a) and f(b) have **opposite signs**, there is a root between a and b.", "Change of sign can fail if the function is discontinuous (e.g. an asymptote) or if there are two roots close together."]}, {"h": "Iteration", "p": ["Rearrange f(x) = 0 into **x = g(x)**, then use `xₙ₊₁ = g(xₙ)`.", "**Staircase** diagrams (converging from one side) and **cobweb** diagrams (alternating sides) show convergence.", "Iteration converges if |g′(x)| < 1 near the root. Different rearrangements can converge or diverge."]}, {"h": "Newton–Raphson", "p": ["`xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ)`", "Uses the tangent at xₙ to estimate where the curve meets the x-axis.", "It **fails** if f′(xₙ) = 0 (stationary point) and can be unreliable if the starting value is near a turning point."]}, {"h": "Trapezium rule", "p": ["`∫ₐᵇ y dx ≈ (h/2)[y₀ + 2(y₁ + y₂ + ... + yₙ₋₁) + yₙ]`, where `h = (b − a)/n`.", "**Overestimates** for convex curves (curving up) and **underestimates** for concave curves.", "Increasing the number of strips improves accuracy."]}], "pitfalls": ["To show a root to a given accuracy, test the **bounds** (e.g. 1.235 and 1.245) for a sign change.", "In the trapezium rule, n strips need n + 1 ordinates.", "Use radians in calculus-based numerical methods with trig functions."], "examples": [{"q": "Use Newton–Raphson with x₀ = 2 to find x₁ for f(x) = x² − 5.", "steps": ["f(2) = −1 and f′(x) = 2x, so f′(2) = 4.", "x₁ = 2 − (−1)/4 = 2.25."], "a": "x₁ = 2.25"}, {"q": "Use the trapezium rule with 2 strips to estimate ∫₀² x² dx.", "steps": ["h = 1. Ordinates: y₀ = 0, y₁ = 1, y₂ = 4.", "≈ ½[0 + 2(1) + 4] = 3.", "The exact value is 8/3, so it's an overestimate (the curve is convex)."], "a": "3"}], "questions": [{"q": "f(1) = −2 and f(2) = 3, and f is continuous. What can you conclude?", "o": ["There is no root", "There is a root between 1 and 2", "The root is 1.5", "f has a turning point"], "a": 1, "e": "A sign change for a continuous function means a root lies in the interval."}, {"q": "Why might the change of sign method fail for f(x) = 1/(x − 3) between 2 and 4?", "o": ["The function has a discontinuity (asymptote) at x = 3", "f(2) = f(4)", "There are two roots", "It is continuous"], "a": 0, "e": "The sign changes but there's no root, only an asymptote."}, {"q": "What is the Newton–Raphson formula?", "o": ["xₙ₊₁ = f(xₙ)/f′(xₙ)", "xₙ₊₁ = xₙ + f(xₙ)/f′(xₙ)", "xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ)", "xₙ₊₁ = g(xₙ)"], "a": 2, "e": "Subtract f over f′ from the current estimate."}, {"q": "When does Newton–Raphson fail?", "o": ["When f(xₙ) = 0", "When x₀ is negative", "When f is continuous", "When f′(xₙ) = 0"], "a": 3, "e": "You'd divide by zero: the tangent is horizontal and never meets the x-axis."}, {"q": "f(x) = x³ − 2x − 5, x₀ = 2. Find x₁ using Newton–Raphson.", "o": ["2.1", "2.2", "1.9", "2.05"], "a": 0, "e": "f(2) = −1, f′(x) = 3x² − 2 = 10. x₁ = 2 + 0.1 = 2.1."}, {"q": "xₙ₊₁ = √(xₙ + 3), x₀ = 2. Find x₁ to 3 d.p.", "o": ["2.000", "2.236", "2.302", "5.000"], "a": 1, "e": "√5 = 2.236."}, {"q": "What does a cobweb diagram show?", "o": ["Divergence only", "Convergence from one side", "Iterations that alternate either side of the root", "A trapezium rule estimate"], "a": 2, "e": "Staircase diagrams approach from one side; cobwebs spiral in."}, {"q": "When does fixed-point iteration xₙ₊₁ = g(xₙ) converge near a root?", "o": ["When g′(x) > 1", "Always", "Never", "When |g′(x)| < 1 near the root"], "a": 3, "e": "If the gradient of g is too steep, the iterates move away."}, {"q": "Using the trapezium rule with 4 strips on [0, 2], what is h?", "o": ["0.5", "2", "4", "0.25"], "a": 0, "e": "h = (2 − 0)/4 = 0.5."}, {"q": "The trapezium rule is used on a convex curve. Is the estimate an over- or underestimate?", "o": ["Underestimate", "Overestimate", "Exact", "Cannot tell"], "a": 1, "e": "The chords lie above a convex curve."}, {"q": "How can the trapezium rule's accuracy be improved?", "o": ["Use fewer strips", "Use degrees", "Use more strips (smaller h)", "Subtract h"], "a": 2, "e": "Thinner trapezia fit the curve more closely."}, {"q": "To show a root is 1.24 to 2 d.p., which values do you test?", "o": ["1.23 and 1.25", "1.2 and 1.3", "1.24 only", "1.235 and 1.245"], "a": 3, "e": "A sign change between these bounds shows the root rounds to 1.24."}, {"q": "Using the trapezium rule with ordinates y₀ = 1, y₁ = 2, y₂ = 5 and h = 1, estimate the integral.", "o": ["5", "8", "10", "4"], "a": 0, "e": "½[1 + 2(2) + 5] = ½ × 10 = 5."}, {"q": "x³ − x − 1 = 0 is rearranged as x = ∛(x + 1). With x₀ = 1, find x₁ to 3 d.p.", "o": ["1.000", "1.260", "1.325", "2.000"], "a": 1, "e": "∛2 = 1.260."}, {"q": "Newton–Raphson uses which geometric idea?", "o": ["The area under the curve", "A chord between two points", "The tangent at the current point meeting the x-axis", "Reflection in y = x"], "a": 2, "e": "The tangent's x-intercept gives the next estimate."}, {"q": "f(x) = x² − 2, x₀ = 1. Find x₁ using Newton–Raphson.", "o": ["1", "2", "1.414", "1.5"], "a": 3, "e": "f(1) = −1, f′(1) = 2, x₁ = 1 + 0.5 = 1.5."}, {"q": "Why might change of sign fail to detect roots?", "o": ["If two roots are close together, there may be no sign change over the interval", "Because f is continuous", "Because roots are integers", "It never fails"], "a": 0, "e": "E.g. a curve dipping below the axis and back within the interval."}, {"q": "Estimate ∫₀¹ eˣ dx using the trapezium rule with 1 strip.", "o": ["1.718", "1.859", "2.718", "1"], "a": 1, "e": "½(e⁰ + e¹) = ½(1 + 2.718) = 1.859 (exact value 1.718)."}, {"q": "How many ordinates are needed for the trapezium rule with 6 strips?", "o": ["6", "5", "7", "12"], "a": 2, "e": "n strips need n + 1 ordinates."}, {"q": "An iteration gives x₁ = 1.5, x₂ = 1.8, x₃ = 2.5, x₄ = 4.1. What is happening?", "o": ["It is converging", "It is periodic", "It has found the root", "It is diverging"], "a": 3, "e": "The values are moving further apart."}, {"q": "A curve is concave on [a, b]. The trapezium rule gives:", "o": ["An underestimate", "An overestimate", "The exact value", "A negative value"], "a": 0, "e": "The chords lie below a concave curve."}, {"q": "f(x) = eˣ − 3, x₀ = 1. Find x₁ using Newton–Raphson to 3 d.p.", "o": ["1.000", "1.104", "1.099", "0.896"], "a": 1, "e": "f(1) = e − 3 = −0.2817, f′(1) = e = 2.7183. x₁ = 1 + 0.1036 = 1.104."}]}, {"id": "p22", "order": 28, "year": 2, "section": "P", "badge": "J", "spec": "J", "title": "Vectors in three dimensions", "desc": "3D vectors using i, j, k, magnitude, distance between points, position vectors, and solving geometric problems in 3D.", "practicals": [], "summary": [{"h": "3D vectors", "p": ["In 3D, vectors are written **ai + bj + ck** or as a column (a, b, c). k is the unit vector in the z-direction.", "Add, subtract and multiply by scalars component by component, as in 2D.", "`|ai + bj + ck| = √(a² + b² + c²)`", "Distance between (x₁, y₁, z₁) and (x₂, y₂, z₂) = √[(x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²]."]}, {"h": "Geometry with vectors", "p": ["Position vectors: **AB = b − a**.", "Points are **collinear** if AB is a multiple of BC (sharing point B).", "Use vectors to show shapes are parallelograms (opposite sides equal vectors) and to find midpoints.", "The angle a vector makes with an axis: cos θₓ = a/|v| for the x-axis.", "Vectors are also used in mechanics for forces, velocities and accelerations."]}], "pitfalls": ["Include the k component in every magnitude calculation.", "AB = b − a (end minus start).", "A vector parallel to another must have **all** components in the same ratio."], "examples": [{"q": "Find the distance between A(1, 2, 3) and B(4, −2, 15).", "steps": ["AB = 3i − 4j + 12k.", "|AB| = √(9 + 16 + 144) = √169."], "a": "13"}, {"q": "Find the angle between 2i + 3j − k and the positive x-axis.", "steps": ["|v| = √(4 + 9 + 1) = √14.", "cos θ = 2/√14."], "a": "θ ≈ 57.7°"}], "questions": [{"q": "Find (2i − j + 3k) + (i + 4j − k).", "o": ["i + 3j + 2k", "3i + 3j + 2k", "3i + 5j + 4k", "2i − 4j − 3k"], "a": 1, "e": "Add component by component."}, {"q": "Find |2i + 3j + 6k|.", "o": ["7", "11", "49", "√11"], "a": 0, "e": "√(4 + 9 + 36) = √49 = 7."}, {"q": "A = (1, 0, 2), B = (3, 4, 2). Find AB.", "o": ["4i + 4j + 4k", "−2i − 4j", "2i + 4j", "2i + 4j + 2k"], "a": 2, "e": "b − a = (2, 4, 0) = 2i + 4j."}, {"q": "Find the distance between (0, 0, 0) and (1, 2, 2).", "o": ["5", "√5", "9", "3"], "a": 3, "e": "√(1 + 4 + 4) = 3."}, {"q": "Which vector is parallel to i − 2j + 3k?", "o": ["−2i + 4j − 6k", "2i − 4j + 3k", "i + 2j + 3k", "3i − 2j + k"], "a": 0, "e": "−2(i − 2j + 3k)."}, {"q": "Find the unit vector in the direction of 2i − 2j + k.", "o": ["2i − 2j + k", "(2i − 2j + k)/3", "(2i − 2j + k)/9", "(2i − 2j + k)/√5"], "a": 1, "e": "Magnitude = √(4 + 4 + 1) = 3."}, {"q": "OA = 3i + j − 2k and OB = i + 5j + 4k. What is the position vector of the midpoint of AB?", "o": ["4i + 6j + 2k", "−2i + 4j + 6k", "2i + 3j + k", "i + 2j + 3k"], "a": 2, "e": "½(a + b) = ½(4i + 6j + 2k)."}, {"q": "What is the unit vector in the z-direction?", "o": ["i", "j", "z", "k"], "a": 3, "e": "i, j and k are along the x, y and z axes."}, {"q": "AB = 2i + j − k and BC = 6i + 3j − 3k. What can you conclude about A, B, C?", "o": ["They are collinear", "They form a right angle", "AB = BC", "Nothing"], "a": 0, "e": "BC = 3AB, so they are parallel and share point B."}, {"q": "Find the angle between 3i + 4k and the z-axis.", "o": ["53.1°", "36.9°", "90°", "45°"], "a": 1, "e": "|v| = 5, cos θ = 4/5, θ ≈ 36.9°."}, {"q": "Find 2(i − j + k) − (3i + j).", "o": ["−i − 3j", "−i − j + 2k", "−i − 3j + 2k", "5i − j + 2k"], "a": 2, "e": "2i − 2j + 2k − 3i − j = −i − 3j + 2k."}, {"q": "ABCD is a parallelogram. Which must be true?", "o": ["AB = CD", "AB = AC", "AB = BD", "AB = DC"], "a": 3, "e": "Opposite sides are equal and parallel, in the same direction: AB = DC."}, {"q": "Find |−i + 4j − 8k|.", "o": ["9", "√65", "81", "11"], "a": 0, "e": "√(1 + 16 + 64) = √81 = 9."}, {"q": "The vector ai + 2j + 3k has magnitude 7. Find the positive value of a.", "o": ["2", "6", "4", "√20"], "a": 1, "e": "a² + 4 + 9 = 49, so a² = 36."}, {"q": "Find the distance between (2, −1, 3) and (5, 3, 3).", "o": ["7", "25", "5", "√7"], "a": 2, "e": "√(9 + 16 + 0) = 5."}, {"q": "pi + 4j + qk is parallel to 2i + 8j − 6k. Find p and q.", "o": ["p = 2, q = −6", "p = 4, q = 3", "p = 1, q = 3", "p = 1, q = −3"], "a": 3, "e": "Half of 2i + 8j − 6k is i + 4j − 3k."}, {"q": "What is the position vector of the point (3, −1, 5)?", "o": ["3i − j + 5k", "3i + j + 5k", "−3i + j − 5k", "3i − 5k"], "a": 0, "e": "The coordinates become the i, j, k components."}, {"q": "Which formula gives the magnitude of a 3D vector ai + bj + ck?", "o": ["a + b + c", "√(a² + b² + c²)", "a² + b² + c²", "√(a + b + c)"], "a": 1, "e": "Pythagoras in three dimensions."}, {"q": "OA = i + 2j + 3k. M is the midpoint of OA. What is OM?", "o": ["2i + 4j + 6k", "i + 2j + 3k", "0.5i + j + 1.5k", "−i − 2j − 3k"], "a": 2, "e": "OM = ½OA."}, {"q": "Find the angle between 2i + 3j − k and the positive x-axis.", "o": ["74.5°", "36.7°", "105.5°", "57.7°"], "a": 3, "e": "cos θ = 2/√14 ≈ 0.5345, θ ≈ 57.7°."}, {"q": "A force F = 3i − 2j + 6k N. What is its magnitude?", "o": ["7 N", "49 N", "11 N", "√13 N"], "a": 0, "e": "√(9 + 4 + 36) = 7."}, {"q": "Points A(1, 1, 1) and B(3, 5, 7). Which point is on the line AB, beyond B, with AC = 2AB?", "o": ["(4, 9, 13)", "(5, 9, 13)", "(3, 5, 7)", "(6, 10, 14)"], "a": 1, "e": "AB = 2i + 4j + 6k. OC = a + 2AB = (1 + 4, 1 + 8, 1 + 12) = (5, 9, 13)."}]}, {"id": "s5", "order": 29, "year": 2, "section": "S", "badge": "M", "spec": "M", "title": "Conditional probability", "desc": "Conditional probability notation and formula, using Venn diagrams, tree diagrams and two-way tables, testing independence, and modelling with probability.", "practicals": [], "summary": [{"h": "Conditional probability", "p": ["P(A | B) means 'the probability of A **given** that B has happened'.", "`P(A | B) = P(A ∩ B) / P(B)`", "Rearranged: `P(A ∩ B) = P(A | B) × P(B)`.", "From a two-way table, restrict to the row or column for B, then find the proportion that are also A.", "From a Venn diagram, P(A | B) = (region in both A and B) ÷ (total of B)."]}, {"h": "Tree diagrams", "p": ["Second-stage branches are **conditional** probabilities, e.g. P(late | rain).", "To find P(first event | outcome), use P(A | B) = P(A ∩ B)/P(B), adding all paths that give B."]}, {"h": "Independence", "p": ["A and B are independent if `P(A | B) = P(A)`, or equivalently P(A ∩ B) = P(A) × P(B)."]}, {"h": "Modelling", "p": ["Probability models make assumptions, e.g. equally likely outcomes, independence. Discuss whether these are realistic."]}], "pitfalls": ["P(A | B) is not the same as P(B | A).", "Divide by P(B), the event that is **given**, not P(A).", "In a two-way table, the 'given' restricts you to one row or column total."], "examples": [{"q": "P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.1. Find P(A | B) and P(B | A).", "steps": ["P(A | B) = 0.1/0.4 = 0.25.", "P(B | A) = 0.1/0.5 = 0.2."], "a": "0.25 and 0.2"}, {"q": "It rains on 30% of days. If it rains, P(late) = 0.4; if not, P(late) = 0.1. Given she was late, find P(rain).", "steps": ["P(rain and late) = 0.3 × 0.4 = 0.12.", "P(late) = 0.12 + 0.7 × 0.1 = 0.19.", "P(rain | late) = 0.12/0.19."], "a": "≈ 0.632"}], "questions": [{"q": "What does P(A | B) mean?", "o": ["P(A and B)", "The probability of A given that B has occurred", "The probability of B given A", "P(A or B)"], "a": 1, "e": "The vertical line means 'given'."}, {"q": "What is the formula for P(A | B)?", "o": ["P(A ∩ B)/P(B)", "P(A ∩ B)/P(A)", "P(A) × P(B)", "P(A) + P(B)"], "a": 0, "e": "Divide the joint probability by the probability of the given event."}, {"q": "P(A ∩ B) = 0.12, P(B) = 0.3. Find P(A | B).", "o": ["0.036", "0.42", "0.4", "0.18"], "a": 2, "e": "0.12/0.3 = 0.4."}, {"q": "P(A | B) = 0.6 and P(B) = 0.5. Find P(A ∩ B).", "o": ["1.1", "0.1", "1.2", "0.3"], "a": 3, "e": "P(A ∩ B) = P(A | B) × P(B) = 0.3."}, {"q": "Of 50 students, 20 play football. 8 of the footballers also play tennis. Find P(tennis | football).", "o": ["0.4", "0.16", "0.8", "0.2"], "a": 0, "e": "8 out of the 20 footballers."}, {"q": "In the same group, 15 students play tennis in total. Find P(football | tennis).", "o": ["8/20", "8/15", "15/50", "8/50"], "a": 1, "e": "8 out of the 15 tennis players."}, {"q": "Which condition shows A and B are independent?", "o": ["P(A | B) = P(B)", "P(A | B) = 0", "P(A | B) = P(A)", "P(A | B) = 1"], "a": 2, "e": "Knowing B happened doesn't change the probability of A."}, {"q": "P(A) = 0.4, P(B) = 0.5, P(A ∩ B) = 0.2. Find P(A | B).", "o": ["0.2", "0.5", "0.8", "0.4"], "a": 3, "e": "0.2/0.5 = 0.4, which equals P(A), so A and B are independent."}, {"q": "In a Venn diagram, A only = 0.2, A ∩ B = 0.15, B only = 0.35. Find P(A | B).", "o": ["0.3", "0.15", "0.43", "0.5"], "a": 0, "e": "P(B) = 0.5. P(A | B) = 0.15/0.5 = 0.3."}, {"q": "Using the same Venn diagram, find P(B | A).", "o": ["0.15", "0.43", "0.35", "0.5"], "a": 1, "e": "P(A) = 0.35. P(B | A) = 0.15/0.35 ≈ 0.43."}, {"q": "On a tree diagram, what do the second-stage branches usually show?", "o": ["Joint probabilities", "Unconditional probabilities", "Conditional probabilities given the first outcome", "Cumulative probabilities"], "a": 2, "e": "E.g. P(late | rain)."}, {"q": "P(rain) = 0.3, P(late | rain) = 0.4, P(late | no rain) = 0.1. Find P(late).", "o": ["0.5", "0.12", "0.07", "0.19"], "a": 3, "e": "0.3 × 0.4 + 0.7 × 0.1 = 0.12 + 0.07 = 0.19."}, {"q": "Using the previous question, find P(rain | late) to 3 d.p.", "o": ["0.632", "0.12", "0.4", "0.368"], "a": 0, "e": "0.12/0.19 ≈ 0.632."}, {"q": "Is P(A | B) always equal to P(B | A)?", "o": ["Yes, always", "No, only when P(A) = P(B) (or P(A ∩ B) = 0)", "Only for independent events", "Only for mutually exclusive events"], "a": 1, "e": "They have different denominators: P(B) and P(A)."}, {"q": "A bag has 5 red and 3 blue counters. Two are drawn without replacement. Find P(second red | first red).", "o": ["5/8", "5/7", "4/7", "4/8"], "a": 2, "e": "After a red is removed, 4 red remain out of 7."}, {"q": "P(A | B′) means:", "o": ["P(A and not B)", "P(not A given B)", "P(B given A)", "P(A given that B did not happen)"], "a": 3, "e": "B′ is the complement of B."}, {"q": "P(A) = 0.6, P(B | A) = 0.5, P(B | A′) = 0.25. Find P(B).", "o": ["0.4", "0.75", "0.3", "0.1"], "a": 0, "e": "0.6 × 0.5 + 0.4 × 0.25 = 0.3 + 0.1 = 0.4."}, {"q": "Using the previous question, find P(A | B).", "o": ["0.5", "0.75", "0.3", "0.6"], "a": 1, "e": "P(A ∩ B) = 0.3. P(A | B) = 0.3/0.4 = 0.75."}, {"q": "P(A | B) = 0 for events with non-zero probabilities. What can you say?", "o": ["A and B are independent", "A always happens", "A and B are mutually exclusive", "B never happens"], "a": 2, "e": "If B happens, A can't, so P(A ∩ B) = 0."}, {"q": "A test detects a disease 95% of the time when present. 2% have the disease. 5% of healthy people test positive. Find P(positive).", "o": ["0.95", "0.05", "0.019", "0.068"], "a": 3, "e": "0.02 × 0.95 + 0.98 × 0.05 = 0.019 + 0.049 = 0.068."}, {"q": "Using the previous question, what is P(disease | positive) to 2 d.p.?", "o": ["0.28", "0.95", "0.02", "0.72"], "a": 0, "e": "0.019/0.068 ≈ 0.28. Most positives are false positives when a disease is rare."}, {"q": "What is a common assumption in probability models that might not hold in practice?", "o": ["Probabilities add to 1", "Events are independent", "P(A) ≥ 0", "There are outcomes"], "a": 1, "e": "Real events, like weather on consecutive days, are often linked."}]}, {"id": "s6", "order": 30, "year": 2, "section": "S", "badge": "N", "spec": "N", "title": "The normal distribution", "desc": "Properties of the normal distribution, finding probabilities, the standard normal Z, inverse normal, finding unknown μ or σ, and the normal approximation to the binomial.", "practicals": [], "summary": [{"h": "Properties", "p": ["X ~ N(μ, σ²) is a **continuous** distribution: bell-shaped, **symmetric** about the mean μ, with mean = median = mode.", "About **68%** of values lie within 1σ of μ, **95%** within 2σ, and **99.7%** within 3σ.", "Points of inflection are at μ ± σ.", "For continuous distributions, P(X = a) = 0, so P(X < a) = P(X ≤ a)."]}, {"h": "Calculating probabilities", "p": ["Use your calculator's **normal cdf** with lower bound, upper bound, μ and σ (not σ²).", "**Standard normal**: Z ~ N(0, 1). `Z = (X − μ)/σ`.", "**Inverse normal**: find the value with a given probability below it.", "To find an unknown μ or σ: write the probability using Z, find the z-value with inverse normal, then solve `(x − μ)/σ = z`."]}, {"h": "Normal approximation to the binomial", "p": ["If X ~ B(n, p) with **n large** and **p close to 0.5**, then X ≈ N(np, np(1 − p)).", "Use a **continuity correction**: P(X ≤ 45) becomes P(Y < 45.5); P(X < 45) becomes P(Y < 44.5).", "Judge whether a normal model is suitable from the shape of the data, e.g. a histogram that is roughly symmetric and bell-shaped."]}], "pitfalls": ["Enter **σ**, not σ², into your calculator.", "Use a continuity correction when approximating a **discrete** distribution with the normal.", "Sketch the curve and shade the region to check your answer is sensible."], "examples": [{"q": "X ~ N(50, 4²). Find P(45 < X < 55).", "steps": ["Normal cdf with lower 45, upper 55, μ = 50, σ = 4."], "a": "0.7887"}, {"q": "X ~ N(μ, 3²) and P(X < 20) = 0.8. Find μ.", "steps": ["P(Z < (20 − μ)/3) = 0.8.", "Inverse normal: z = 0.8416.", "(20 − μ)/3 = 0.8416, so μ = 20 − 2.525."], "a": "μ ≈ 17.48"}], "questions": [{"q": "Which is a property of the normal distribution?", "o": ["It is skewed", "It is symmetric about the mean", "The mean is larger than the median", "It is discrete"], "a": 1, "e": "Mean = median = mode, and the curve is bell-shaped."}, {"q": "Approximately what percentage of a normal distribution lies within 2 standard deviations of the mean?", "o": ["95%", "68%", "99.7%", "50%"], "a": 0, "e": "The 68–95–99.7 rule."}, {"q": "X ~ N(50, 4²). Find P(X < 55) to 4 d.p.", "o": ["0.1056", "0.7887", "0.8944", "0.9772"], "a": 2, "e": "Using the normal cdf: 0.8944."}, {"q": "X ~ N(50, 16). Find P(X > 58) to 4 d.p.", "o": ["0.9772", "0.1587", "0.0456", "0.0228"], "a": 3, "e": "58 is 2σ above the mean (σ = 4). P = 0.0228."}, {"q": "X ~ N(50, 16). What value of σ should you enter into your calculator?", "o": ["4", "16", "256", "8"], "a": 0, "e": "The second parameter is the variance σ² = 16, so σ = 4."}, {"q": "For a continuous distribution, what is P(X = 30)?", "o": ["It depends on μ", "0", "1", "0.5"], "a": 1, "e": "A single point has zero width, so zero probability."}, {"q": "What is the standard normal distribution?", "o": ["N(1, 0)", "N(0, 0)", "N(0, 1)", "N(1, 1)"], "a": 2, "e": "Z ~ N(0, 1), with mean 0 and standard deviation 1."}, {"q": "X ~ N(100, 15²). Find the z-value for x = 130.", "o": ["1", "30", "0.5", "2"], "a": 3, "e": "z = (130 − 100)/15 = 2."}, {"q": "Find P(Z < 1.5) to 4 d.p.", "o": ["0.9332", "0.0668", "0.8664", "0.5"], "a": 0, "e": "From the standard normal cdf."}, {"q": "Find a such that P(Z < a) = 0.95.", "o": ["1.96", "1.6449", "1.2816", "0.95"], "a": 1, "e": "Inverse normal of 0.95 gives 1.6449."}, {"q": "Find a such that P(−a < Z < a) = 0.95.", "o": ["1.6449", "2.5758", "1.96", "1.2816"], "a": 2, "e": "Each tail is 0.025, so P(Z < a) = 0.975, giving a = 1.96."}, {"q": "X ~ N(μ, 3²) and P(X < 20) = 0.8. Find μ to 2 d.p.", "o": ["22.52", "20.84", "17.60", "17.48"], "a": 3, "e": "(20 − μ)/3 = 0.8416, so μ = 20 − 2.52 = 17.48."}, {"q": "X ~ N(30, σ²) and P(X > 36) = 0.1. Find σ to 3 s.f.", "o": ["4.68", "6.00", "2.34", "7.69"], "a": 0, "e": "(36 − 30)/σ = 1.2816, so σ = 6/1.2816 ≈ 4.68."}, {"q": "When can B(n, p) be approximated by a normal distribution?", "o": ["When n is small", "When n is large and p is close to 0.5", "When p is close to 0 or 1", "Always"], "a": 1, "e": "Then the binomial is roughly symmetric and bell-shaped."}, {"q": "X ~ B(100, 0.4). Which normal distribution approximates it?", "o": ["N(40, 40)", "N(100, 0.4)", "N(40, 24)", "N(40, 0.24)"], "a": 2, "e": "μ = np = 40, σ² = np(1 − p) = 24."}, {"q": "Using a continuity correction, P(X ≤ 45) for binomial X becomes what for normal Y?", "o": ["P(Y < 44.5)", "P(Y < 45)", "P(Y > 45.5)", "P(Y < 45.5)"], "a": 3, "e": "X ≤ 45 includes 45, so extend half a unit to 45.5."}, {"q": "Using a continuity correction, P(X > 20) for binomial X becomes:", "o": ["P(Y > 20.5)", "P(Y > 19.5)", "P(Y > 20)", "P(Y < 20.5)"], "a": 0, "e": "X > 20 means X ≥ 21, which starts at 20.5."}, {"q": "Why is a continuity correction needed?", "o": ["Because the normal is skewed", "Because a discrete distribution is being approximated by a continuous one", "To make the mean larger", "Because σ is unknown"], "a": 1, "e": "Each whole number is represented by an interval of width 1."}, {"q": "X ~ N(50, 4²). Find P(45 < X < 55) to 4 d.p.", "o": ["0.8944", "0.6827", "0.7887", "0.9545"], "a": 2, "e": "Normal cdf between 45 and 55: 0.7887."}, {"q": "Where are the points of inflection on a normal curve?", "o": ["At μ", "At μ ± 2σ", "At μ ± 3σ", "At μ ± σ"], "a": 3, "e": "The curve changes from concave to convex one standard deviation from the mean."}, {"q": "Find P(Z > −0.8) to 4 d.p.", "o": ["0.7881", "0.2119", "0.5", "0.8"], "a": 0, "e": "By symmetry, P(Z > −0.8) = P(Z < 0.8) = 0.7881."}, {"q": "A data set has a histogram that is strongly skewed to the right. Is a normal model suitable?", "o": ["Yes, always", "No, because the normal distribution is symmetric", "Yes, if the mean is positive", "Only for large samples"], "a": 1, "e": "A normal model needs a roughly symmetric, bell-shaped distribution."}]}, {"id": "s7", "order": 31, "year": 2, "section": "S", "badge": "O", "spec": "L, O", "title": "Correlation and hypothesis testing", "desc": "The product moment correlation coefficient, testing for correlation, the distribution of the sample mean, and testing a normal mean.", "practicals": [], "summary": [{"h": "Correlation", "p": ["The **product moment correlation coefficient (PMCC)**, r, measures the strength of **linear** correlation: −1 ≤ r ≤ 1.", "r close to 1: strong positive. Close to −1: strong negative. Close to 0: little or no linear correlation.", "Calculate r using a calculator's statistics mode."]}, {"h": "Testing for correlation", "p": ["Hypotheses use **ρ** (rho), the population correlation coefficient: H₀: ρ = 0.", "H₁: ρ > 0 or ρ < 0 (one-tailed), or ρ ≠ 0 (two-tailed).", "Compare the sample r with the **critical value** from tables for the sample size n and significance level.", "If |r| is greater than the critical value (in the direction of H₁), **reject H₀**."]}, {"h": "Distribution of the sample mean", "p": ["If X ~ N(μ, σ²), the mean of a random sample of size n has `X̄ ~ N(μ, σ²/n)`.", "The standard deviation of X̄ is **σ/√n** (smaller for larger samples)."]}, {"h": "Testing a normal mean", "p": ["H₀: μ = μ₀. H₁: μ > μ₀, μ < μ₀ or μ ≠ μ₀.", "Under H₀, X̄ ~ N(μ₀, σ²/n). Find P(X̄ ≥ x̄) (or ≤) and compare with the significance level. Or use `z = (x̄ − μ₀)/(σ/√n)` and compare with the critical z-value.", "Conclude in context, without claiming proof."]}], "pitfalls": ["PMCC tests use **ρ** in hypotheses, not r.", "For X̄, divide the **variance** by n (or the standard deviation by √n).", "A significant correlation doesn't prove causation."], "examples": [{"q": "A sample of 10 pairs gives r = 0.72. Test at the 5% level for positive correlation (critical value 0.5494).", "steps": ["H₀: ρ = 0. H₁: ρ > 0.", "0.72 > 0.5494, so the result is significant."], "a": "Reject H₀: there is evidence of positive correlation."}, {"q": "X ~ N(μ, 10²). A sample of 25 has mean 84. Test H₀: μ = 80 against H₁: μ > 80 at 5%.", "steps": ["Under H₀, X̄ ~ N(80, 10²/25) = N(80, 2²).", "P(X̄ ≥ 84) = 0.0228.", "0.0228 < 0.05, so reject H₀."], "a": "There is evidence at the 5% level that the mean is greater than 80."}], "questions": [{"q": "What is the range of possible values of the PMCC?", "o": ["0 to 1", "−1 to 1", "−∞ to ∞", "0 to 100"], "a": 1, "e": "r = 1 or −1 means perfect linear correlation."}, {"q": "A PMCC of −0.92 indicates:", "o": ["Strong negative linear correlation", "Weak negative correlation", "No correlation", "Strong positive correlation"], "a": 0, "e": "Close to −1 means strong negative."}, {"q": "What symbol is used for the population correlation coefficient in hypotheses?", "o": ["r", "μ", "ρ", "σ"], "a": 2, "e": "ρ (rho) is the population parameter; r is the sample statistic."}, {"q": "What is the null hypothesis in a test for correlation?", "o": ["ρ = 1", "r = 0", "ρ > 0", "ρ = 0"], "a": 3, "e": "H₀ assumes no correlation in the population."}, {"q": "r = 0.45, n = 12, critical value for ρ > 0 at 5% is 0.4973. Conclusion?", "o": ["Do not reject H₀: insufficient evidence of positive correlation", "Reject H₀", "There is negative correlation", "Prove ρ = 0"], "a": 0, "e": "0.45 < 0.4973, so not significant."}, {"q": "A test for correlation is two-tailed. What is H₁?", "o": ["ρ > 0", "ρ ≠ 0", "ρ < 0", "r ≠ 0"], "a": 1, "e": "Testing for correlation of either sign."}, {"q": "X ~ N(μ, σ²). What is the distribution of the sample mean of n observations?", "o": ["N(μ, σ²)", "N(μ/n, σ²)", "N(μ, σ²/n)", "N(nμ, nσ²)"], "a": 2, "e": "The mean is unchanged; the variance is divided by n."}, {"q": "X ~ N(80, 10²). What is the standard deviation of the mean of 25 observations?", "o": ["10", "0.4", "4", "2"], "a": 3, "e": "σ/√n = 10/5 = 2."}, {"q": "Why does the sample mean have a smaller spread than individual values?", "o": ["Averaging reduces variability: extreme values tend to cancel out", "Samples are always biased", "The mean is always smaller", "It doesn't"], "a": 0, "e": "Var(X̄) = σ²/n decreases as n increases."}, {"q": "H₀: μ = 80, H₁: μ > 80, σ = 10, n = 25, x̄ = 84. P(X̄ ≥ 84) = 0.0228. Conclusion at 5%?", "o": ["Do not reject H₀", "Reject H₀: evidence that μ > 80", "Accept H₀", "The test is invalid"], "a": 1, "e": "0.0228 < 0.05."}, {"q": "H₀: μ = 100, H₁: μ < 100, σ = 12, n = 16, x̄ = 95.2. P(X̄ ≤ 95.2) = 0.0548. Conclusion at 5%?", "o": ["Reject H₀", "Accept H₁", "Do not reject H₀: insufficient evidence that μ < 100", "μ = 95.2"], "a": 2, "e": "0.0548 > 0.05, so not significant."}, {"q": "What is the test statistic z for testing a normal mean?", "o": ["(x̄ − μ₀)/σ", "(x̄ − μ₀) × √n", "x̄/σ", "(x̄ − μ₀)/(σ/√n)"], "a": 3, "e": "Standardise using the standard deviation of X̄."}, {"q": "For a one-tailed test (upper) at 5%, what is the critical z-value?", "o": ["1.6449", "1.96", "2.3263", "1.2816"], "a": 0, "e": "P(Z > 1.6449) = 0.05."}, {"q": "For a two-tailed test at 5%, what are the critical z-values?", "o": ["±1.6449", "±1.96", "±2.5758", "±1.2816"], "a": 1, "e": "2.5% in each tail."}, {"q": "Two variables have a significant positive correlation. What can you conclude?", "o": ["One causes the other", "The relationship is non-linear", "There is evidence of a linear association, but not necessarily causation", "They are independent"], "a": 2, "e": "Correlation doesn't imply causation."}, {"q": "A sample of 8 gives r = −0.81. Critical value for ρ < 0 at 1% is 0.7887. Conclusion?", "o": ["Not significant", "Positive correlation", "Test invalid", "Reject H₀: evidence of negative correlation at 1%"], "a": 3, "e": "|−0.81| = 0.81 > 0.7887 and r is negative, matching H₁."}, {"q": "Why does the PMCC only measure linear correlation?", "o": ["It measures how closely the points fit a straight line; a strong curved relationship can have r near 0", "It only works for positive data", "It ignores outliers", "It uses medians"], "a": 0, "e": "Always check a scatter diagram too."}, {"q": "z = 2.1 in an upper-tailed test of a mean at the 5% level. Conclusion?", "o": ["Do not reject H₀", "Reject H₀, since 2.1 > 1.6449", "Accept H₀", "Reject H₀ only at 10%"], "a": 1, "e": "The test statistic is in the critical region."}, {"q": "X ~ N(μ, 4²). A sample of 64 values is taken. What is Var(X̄)?", "o": ["16", "0.5", "0.25", "4"], "a": 2, "e": "σ²/n = 16/64 = 0.25."}, {"q": "Which hypothesis is correct for 'the mean weight has decreased from 500 g'?", "o": ["H₀: μ < 500", "H₁: μ > 500", "H₁: μ ≠ 500", "H₁: μ < 500"], "a": 3, "e": "H₀: μ = 500 and H₁: μ < 500."}, {"q": "What is assumed about the population when testing a mean using X̄ ~ N(μ, σ²/n)?", "o": ["The population is normally distributed with known σ", "The sample is biased", "n = 1", "σ = μ"], "a": 0, "e": "At A-level, the population is normal with a known standard deviation."}, {"q": "Increasing the sample size in a test for a mean makes it:", "o": ["Less sensitive", "More likely to detect a real difference, because σ/√n is smaller", "Impossible to reject H₀", "Two-tailed"], "a": 1, "e": "A smaller standard error means smaller differences become significant."}]}, {"id": "m3", "order": 32, "year": 2, "section": "M", "badge": "Q", "spec": "Q", "title": "Projectiles", "desc": "Modelling projectile motion by resolving velocity, time of flight, maximum height, range, and the equation of the trajectory.", "practicals": [], "summary": [{"h": "Modelling assumptions", "p": ["The projectile is a **particle**, there is **no air resistance**, and the only force is **gravity** (acceleration g downwards).", "Horizontal and vertical motion are treated **separately**, linked by **time**."]}, {"h": "Resolving the initial velocity", "p": ["A projectile launched at speed U at angle θ above the horizontal has components: horizontal `U cos θ`, vertical `U sin θ`.", "**Horizontal**: constant velocity, so `x = (U cos θ)t`.", "**Vertical**: constant acceleration −g, so use suvat: `y = (U sin θ)t − ½gt²` and `v_y = U sin θ − gt`."]}, {"h": "Key results", "p": ["**Maximum height**: vertical velocity is zero. `0 = (U sin θ)² − 2gH`, so `H = U² sin²θ / 2g`.", "**Time of flight** (landing at the same level): y = 0, so `T = 2U sin θ / g`.", "**Range**: `R = (U cos θ) × T = U² sin 2θ / g`. Maximum range at θ = 45°.", "**Trajectory equation**: eliminate t to get `y = x tan θ − gx² / (2U² cos²θ)`.", "Speed at any time: `√(v_x² + v_y²)`. Direction: `tan α = v_y / v_x`."]}], "pitfalls": ["Horizontal acceleration is **zero**. Only the vertical motion uses g.", "Take **upwards as positive** and use a = −g, or be consistent with your chosen direction.", "Range and time-of-flight formulas only apply when landing at the **same height**. Otherwise use suvat directly."], "examples": [{"q": "A ball is kicked from the ground at 20 m s⁻¹ at 30° above the horizontal. Find the time of flight and the range (g = 9.8).", "steps": ["Vertical component: 20 sin 30° = 10 m s⁻¹. Horizontal: 20 cos 30° = 17.32 m s⁻¹.", "Vertically, y = 0: 0 = 10t − 4.9t², so t = 10/4.9 = 2.04 s.", "Range = 17.32 × 2.041 = 35.3 m."], "a": "Time ≈ 2.04 s, range ≈ 35.3 m"}, {"q": "A stone is thrown horizontally at 15 m s⁻¹ from the top of a 20 m cliff. How far from the base does it land? (g = 9.8)", "steps": ["Vertically: initial vertical velocity 0. 20 = ½(9.8)t², so t² = 4.08, t = 2.02 s.", "Horizontally: x = 15 × 2.02 = 30.3 m."], "a": "About 30.3 m from the base"}], "questions": [{"q": "In projectile motion (no air resistance), what is the horizontal acceleration?", "o": ["g", "0", "−g", "Depends on the angle"], "a": 1, "e": "No horizontal force acts, so horizontal velocity is constant."}, {"q": "A projectile is launched at 30 m s⁻¹ at 60° above the horizontal. What is the horizontal component of velocity?", "o": ["15 m s⁻¹", "26.0 m s⁻¹", "30 m s⁻¹", "17.3 m s⁻¹"], "a": 0, "e": "30 cos 60° = 15 m s⁻¹."}, {"q": "A projectile is launched at 30 m s⁻¹ at 60° above the horizontal. What is the vertical component?", "o": ["15 m s⁻¹", "17.3 m s⁻¹", "26.0 m s⁻¹", "30 m s⁻¹"], "a": 2, "e": "30 sin 60° = 25.98 ≈ 26.0 m s⁻¹."}, {"q": "At the maximum height of a projectile, what is true?", "o": ["Speed is zero", "Horizontal velocity is zero", "Acceleration is zero", "Vertical velocity is zero"], "a": 3, "e": "It is still moving horizontally, but momentarily has no vertical velocity."}, {"q": "A ball is projected with vertical component 14.7 m s⁻¹. How long does it take to reach maximum height? (g = 9.8)", "o": ["1.5 s", "3.0 s", "0.67 s", "14.7 s"], "a": 0, "e": "v = u + at: 0 = 14.7 − 9.8t, so t = 1.5 s."}, {"q": "Using the same vertical component of 14.7 m s⁻¹, what is the maximum height? (g = 9.8)", "o": ["22.05 m", "11.0 m", "7.35 m", "14.7 m"], "a": 1, "e": "v² = u² + 2as: 0 = 14.7² − 19.6H, so H = 216.09/19.6 = 11.0 m."}, {"q": "What is the formula for the time of flight of a projectile landing at its launch height?", "o": ["U sin θ / g", "U cos θ / g", "2U sin θ / g", "U² sin 2θ / g"], "a": 2, "e": "Solve 0 = (U sin θ)t − ½gt² for the non-zero t."}, {"q": "At what angle of projection is the range greatest (same launch and landing height)?", "o": ["30°", "60°", "90°", "45°"], "a": 3, "e": "R = U² sin 2θ / g is greatest when sin 2θ = 1, so θ = 45°."}, {"q": "A stone is thrown horizontally from a cliff. What is its initial vertical velocity?", "o": ["0", "g", "The throw speed", "It depends on the cliff height"], "a": 0, "e": "Thrown horizontally means all initial velocity is horizontal."}, {"q": "A ball falls 44.1 m from rest. How long does it take? (g = 9.8)", "o": ["9.0 s", "3.0 s", "4.5 s", "2.1 s"], "a": 1, "e": "44.1 = 4.9t², t² = 9, t = 3 s."}, {"q": "A ball is thrown horizontally at 12 m s⁻¹ and lands after 2.5 s. How far does it travel horizontally?", "o": ["4.8 m", "14.5 m", "30 m", "60 m"], "a": 2, "e": "x = 12 × 2.5 = 30 m."}, {"q": "Which is a modelling assumption for projectiles?", "o": ["The projectile spins", "Air resistance is large", "g changes with height", "The projectile is a particle with no air resistance"], "a": 3, "e": "These simplify the model so only gravity acts."}, {"q": "After 2 s, a projectile has v_x = 8 m s⁻¹ and v_y = −6 m s⁻¹. What is its speed?", "o": ["10 m s⁻¹", "14 m s⁻¹", "2 m s⁻¹", "48 m s⁻¹"], "a": 0, "e": "√(8² + 6²) = 10 m s⁻¹."}, {"q": "With v_x = 8 m s⁻¹ and v_y = −6 m s⁻¹, what angle does the velocity make with the horizontal?", "o": ["53.1° above", "36.9° below", "36.9° above", "53.1° below"], "a": 1, "e": "tan α = 6/8, α = 36.9°. v_y is negative, so it's moving below the horizontal."}, {"q": "What is the range of a projectile launched at 20 m s⁻¹ at 45° (g = 9.8)?", "o": ["20.4 m", "28.9 m", "40.8 m", "81.6 m"], "a": 2, "e": "R = U² sin 90° / g = 400/9.8 = 40.8 m."}, {"q": "Which equation gives the vertical displacement of a projectile at time t?", "o": ["y = (U cos θ)t", "y = U sin θ − gt", "y = ½gt²", "y = (U sin θ)t − ½gt²"], "a": 3, "e": "Constant acceleration −g with initial vertical velocity U sin θ."}, {"q": "Doubling the launch speed of a projectile (same angle) multiplies the range by:", "o": ["4", "2", "√2", "8"], "a": 0, "e": "R ∝ U², so doubling U gives 4 times the range."}, {"q": "Two balls are released at the same time from the same height: one dropped, one thrown horizontally. Which lands first?", "o": ["The dropped ball", "They land at the same time", "The thrown ball", "It depends on the throw speed"], "a": 1, "e": "Vertical motion is identical (both start with zero vertical velocity)."}, {"q": "What is the trajectory of a projectile (no air resistance)?", "o": ["A straight line", "A circle", "A parabola", "A hyperbola"], "a": 2, "e": "y is a quadratic function of x."}, {"q": "A projectile is launched at 25 m s⁻¹ at 30°. What is its time of flight to the same level? (g = 9.8)", "o": ["1.28 s", "4.42 s", "5.10 s", "2.55 s"], "a": 3, "e": "T = 2 × 25 sin 30° / 9.8 = 25/9.8 = 2.55 s."}, {"q": "How does air resistance affect the real range compared with the model?", "o": ["The real range is shorter", "The real range is longer", "No difference", "It doubles"], "a": 0, "e": "Air resistance slows the projectile, reducing its range."}, {"q": "A ball is projected at 10 m s⁻¹ at 30° from a height of 2 m. When it lands on the ground, what is its vertical displacement?", "o": ["+2 m", "−2 m", "0 m", "10 m"], "a": 1, "e": "Taking up as positive from the launch point, the ground is 2 m below: s = −2 m."}]}, {"id": "m4", "order": 33, "year": 2, "section": "M", "badge": "Q", "spec": "Q", "title": "Variable acceleration and vectors in kinematics", "desc": "Using calculus for displacement, velocity and acceleration as functions of time, and kinematics with vectors in two dimensions.", "practicals": [], "summary": [{"h": "Calculus in kinematics", "p": ["When acceleration is **not constant**, suvat can't be used. Use calculus.", "**Differentiate** to go down: `v = ds/dt`, `a = dv/dt = d²s/dt²`.", "**Integrate** to go up: `v = ∫a dt`, `s = ∫v dt`. Use **initial conditions** to find the constant of integration.", "**Maximum or minimum displacement**: set v = 0. **Maximum velocity**: set a = 0.", "Distance travelled may differ from displacement if the particle **changes direction**: find when v = 0 and split the integral."]}, {"h": "Vectors in kinematics", "p": ["Position, velocity and acceleration can be vectors, e.g. `r = (2t² i + 3t j)` m.", "Differentiate or integrate **each component** separately: `v = dr/dt`, `a = dv/dt`.", "With constant acceleration, suvat works in vector form: `v = u + at`, `r = ut + ½at²`.", "**Speed** is the magnitude of velocity: `|v| = √(x² + y²)`."]}], "pitfalls": ["Don't use suvat unless acceleration is **constant**.", "Always add **+ c** when integrating, then use given conditions to find it.", "Speed is the **magnitude** of the velocity vector. Direction is found with tan."], "examples": [{"q": "A particle moves in a straight line with v = 3t² − 12t + 9 m s⁻¹. Find when it is instantaneously at rest and its acceleration at t = 4.", "steps": ["At rest: 3t² − 12t + 9 = 0, so t² − 4t + 3 = 0, (t − 1)(t − 3) = 0.", "t = 1 s and t = 3 s.", "a = dv/dt = 6t − 12. At t = 4: a = 24 − 12 = 12."], "a": "At rest at t = 1 s and t = 3 s; a = 12 m s⁻² at t = 4"}, {"q": "A particle has a = (2i − 4j) m s⁻² and starts at rest at the origin. Find its velocity and speed at t = 3.", "steps": ["v = u + at = 0 + 3(2i − 4j) = 6i − 12j.", "Speed = √(6² + 12²) = √180 = 13.4 m s⁻¹."], "a": "v = 6i − 12j m s⁻¹, speed ≈ 13.4 m s⁻¹"}], "questions": [{"q": "How is velocity found from displacement s(t)?", "o": ["Integrate s", "Differentiate s with respect to t", "Divide s by t", "Multiply s by t"], "a": 1, "e": "v = ds/dt."}, {"q": "s = t³ − 6t² + 4. What is v?", "o": ["3t² − 12t", "t⁴/4 − 2t³ + 4t", "3t² − 12t + 4", "6t − 12"], "a": 0, "e": "Differentiate each term: 3t² − 12t."}, {"q": "v = 4t − 3. What is a?", "o": ["4t", "2t² − 3t", "4", "−3"], "a": 2, "e": "a = dv/dt = 4."}, {"q": "a = 6t and the particle starts from rest. What is v?", "o": ["6", "6t + c with c unknown", "3t", "3t²"], "a": 3, "e": "v = ∫6t dt = 3t² + c. At t = 0, v = 0, so c = 0."}, {"q": "Why can't suvat be used when a = 2t?", "o": ["The acceleration isn't constant", "The acceleration is negative", "It is a vector", "t must be positive"], "a": 0, "e": "suvat equations assume constant acceleration."}, {"q": "v = 3t² − 12. When is the particle at rest (t > 0)?", "o": ["t = 4", "t = 2", "t = 12", "t = 3"], "a": 1, "e": "3t² = 12, t² = 4, t = 2."}, {"q": "v = 2t + 1 and s = 0 when t = 0. What is s at t = 3?", "o": ["7 m", "9 m", "12 m", "10 m"], "a": 2, "e": "s = t² + t, so s(3) = 9 + 3 = 12 m."}, {"q": "How is maximum velocity found when v is a function of t?", "o": ["Set v = 0", "Set s = 0", "Integrate a", "Set a = 0 and solve"], "a": 3, "e": "At a maximum of v, dv/dt = a = 0."}, {"q": "v = 6t − t². What is the maximum velocity?", "o": ["9 m s⁻¹", "6 m s⁻¹", "3 m s⁻¹", "12 m s⁻¹"], "a": 0, "e": "a = 6 − 2t = 0 at t = 3. v(3) = 18 − 9 = 9 m s⁻¹."}, {"q": "r = (t² i + 4t j) m. What is the velocity?", "o": ["(t i + 4 j)", "(2t i + 4 j)", "(2 i)", "(2t i + 4t j)"], "a": 1, "e": "Differentiate each component: 2t and 4."}, {"q": "v = (3i + 4j) m s⁻¹. What is the speed?", "o": ["7 m s⁻¹", "12 m s⁻¹", "5 m s⁻¹", "25 m s⁻¹"], "a": 2, "e": "√(3² + 4²) = 5 m s⁻¹."}, {"q": "u = (2i + j), a = (i − j), t = 2. What is v (constant acceleration)?", "o": ["(3i)", "(2i + j)", "(i + 3j)", "(4i − j)"], "a": 3, "e": "v = u + at = (2i + j) + 2(i − j) = 4i − j."}, {"q": "u = 0, a = (2i + 6j), t = 3. What is the displacement r (constant acceleration)?", "o": ["(9i + 27j)", "(6i + 18j)", "(3i + 9j)", "(18i + 54j)"], "a": 0, "e": "r = ½at² = ½(2i + 6j)(9) = 9i + 27j."}, {"q": "v = (4t i − 3 j). What is the acceleration?", "o": ["(4t i)", "(4 i)", "(2t² i − 3t j)", "(4 i − 3 j)"], "a": 1, "e": "Differentiate: 4 and 0."}, {"q": "v = 4 − t². Why might the distance travelled in 0 ≤ t ≤ 3 differ from the displacement?", "o": ["Acceleration is constant", "v is always positive", "The particle changes direction at t = 2", "Distance is always smaller"], "a": 2, "e": "v = 0 at t = 2, so the integral must be split to find total distance."}, {"q": "a = 2t − 4. The particle starts with v = 3 at t = 0. What is v?", "o": ["2t − 4", "t² − 4t", "t² + 3", "t² − 4t + 3"], "a": 3, "e": "v = t² − 4t + c, with c = 3."}, {"q": "s = 2t³ − 9t² + 12t. At which times is the particle at rest?", "o": ["t = 1 and t = 2", "t = 2 and t = 3", "t = 0 only", "t = 1.5"], "a": 0, "e": "v = 6t² − 18t + 12 = 6(t − 1)(t − 2) = 0."}, {"q": "What does the gradient of a velocity–time graph represent?", "o": ["Displacement", "Acceleration", "Speed", "Distance"], "a": 1, "e": "a = dv/dt is the gradient."}, {"q": "What does the area under a velocity–time graph represent?", "o": ["Acceleration", "Speed", "Displacement", "Force"], "a": 2, "e": "s = ∫v dt is the area under the graph."}, {"q": "r = (3t i + (2t² − 5) j). When is the particle due east of the origin (j-component zero)?", "o": ["t = 5", "t = 2.5", "t = 0", "t = √2.5 ≈ 1.58"], "a": 3, "e": "2t² − 5 = 0 gives t² = 2.5, t ≈ 1.58 s."}, {"q": "v = (6i − 8j). What angle does the velocity make with the i direction?", "o": ["53.1° below i", "36.9° below i", "53.1° above i", "36.9° above i"], "a": 0, "e": "tan α = 8/6, α = 53.1°. The j-component is negative, so it's below."}, {"q": "a = 12t² and v = 0, s = 0 at t = 0. What is s?", "o": ["4t³", "t⁴", "12t⁴", "24t"], "a": 1, "e": "v = 4t³, then s = t⁴."}]}, {"id": "m5", "order": 34, "year": 2, "section": "M", "badge": "R", "spec": "R", "title": "Friction, inclined planes and resolving forces", "desc": "Resolving forces into components, equilibrium, the model of friction F ≤ μR, motion on rough and smooth inclined planes, and connected particles with friction.", "practicals": [], "summary": [{"h": "Resolving forces", "p": ["A force F at angle θ to the horizontal has components `F cos θ` (horizontal) and `F sin θ` (vertical).", "In **equilibrium**, the resultant force is zero, so components balance in **each** direction.", "On an **inclined plane** at angle α, resolve **parallel** and **perpendicular** to the slope. Weight has components `mg sin α` down the slope and `mg cos α` into the slope."]}, {"h": "Friction", "p": ["Friction **opposes** motion or the tendency to move.", "**Model**: `F ≤ μR`, where μ is the **coefficient of friction** and R is the normal reaction.", "When the object is moving or on the point of moving (**limiting equilibrium**), `F = μR`.", "Smooth surface: μ = 0."]}, {"h": "Inclined planes", "p": ["Perpendicular to the slope: `R = mg cos α` (plus or minus components of any other forces).", "Parallel: use `F = ma` along the slope, with friction acting up or down the slope opposite to the motion.", "A particle on a rough slope is on the point of sliding when `mg sin α = μ mg cos α`, so `μ = tan α`."]}], "pitfalls": ["R isn't always mg. Find it by resolving perpendicular to the surface, including other forces.", "Friction acts **opposite** to the direction of motion (or of the tendency to move).", "Use `F = μR` only when moving or on the point of moving. Otherwise `F ≤ μR`."], "examples": [{"q": "A 4 kg block rests on a rough horizontal surface (μ = 0.3). A horizontal force of 20 N is applied. Find the acceleration (g = 9.8).", "steps": ["R = 4g = 39.2 N.", "Maximum friction = 0.3 × 39.2 = 11.76 N. 20 > 11.76, so the block moves.", "F = ma: 20 − 11.76 = 4a, so a = 2.06 m s⁻²."], "a": "a ≈ 2.06 m s⁻²"}, {"q": "A 2 kg particle slides down a smooth slope at 30°. Find its acceleration (g = 9.8).", "steps": ["Component of weight down the slope = 2g sin 30° = 9.8 N.", "F = ma: 9.8 = 2a."], "a": "a = 4.9 m s⁻²"}], "questions": [{"q": "A force of 50 N acts at 30° to the horizontal. What is its horizontal component?", "o": ["25 N", "43.3 N", "50 N", "28.9 N"], "a": 1, "e": "50 cos 30° = 43.3 N."}, {"q": "A force of 50 N acts at 30° to the horizontal. What is its vertical component?", "o": ["25 N", "43.3 N", "57.7 N", "86.6 N"], "a": 0, "e": "50 sin 30° = 25 N."}, {"q": "What is the model of friction?", "o": ["F = mg", "F = ma", "F ≤ μR", "F = μmg always"], "a": 2, "e": "Friction can take any value up to the limiting value μR."}, {"q": "When does F = μR?", "o": ["Always", "Only when at rest", "Only on smooth surfaces", "When the object is moving or on the point of moving"], "a": 3, "e": "This is limiting friction."}, {"q": "A 5 kg block is on a rough horizontal surface with μ = 0.4. What is the maximum friction? (g = 9.8)", "o": ["19.6 N", "2 N", "49 N", "12.25 N"], "a": 0, "e": "R = 5 × 9.8 = 49 N. F = 0.4 × 49 = 19.6 N."}, {"q": "What is the component of weight acting down a slope at angle α?", "o": ["mg cos α", "mg sin α", "mg tan α", "mg"], "a": 1, "e": "The component parallel to the slope is mg sin α."}, {"q": "What is the normal reaction on a particle of mass m resting on a slope at angle α (no other forces)?", "o": ["mg", "mg sin α", "mg cos α", "mg tan α"], "a": 2, "e": "Resolving perpendicular to the slope: R = mg cos α."}, {"q": "A particle is on the point of sliding down a rough slope at angle α. What is μ?", "o": ["sin α", "cos α", "1/tan α", "tan α"], "a": 3, "e": "mg sin α = μ mg cos α, so μ = tan α."}, {"q": "A 3 kg particle slides down a smooth slope inclined at 20°. What is its acceleration? (g = 9.8)", "o": ["3.35 m s⁻²", "9.21 m s⁻²", "9.8 m s⁻²", "1.12 m s⁻²"], "a": 0, "e": "a = g sin 20° = 9.8 × 0.342 = 3.35 m s⁻²."}, {"q": "What does a smooth surface mean in modelling?", "o": ["μ = 1", "No friction (μ = 0)", "Very rough", "The object is light"], "a": 1, "e": "A smooth surface exerts no friction."}, {"q": "In which direction does friction act on a block being pulled to the right?", "o": ["Right", "Up", "Left", "Down"], "a": 2, "e": "Friction opposes the motion."}, {"q": "A 10 kg block is pulled by a force of 40 N at 30° above the horizontal on a rough surface. What is R? (g = 9.8)", "o": ["98 N", "118 N", "78 N", "64.4 N"], "a": 2, "e": "Vertically: R + 40 sin 30° = 98, so R = 98 − 20 = 78 N."}, {"q": "In equilibrium, what is the resultant   $('#app').innerHTML = topbar(`<a class="pill-btn" href="#hub">← Hub</a>`) + `
  <main class="page wrap"><div class="page-head"><div class="page-eyebrow">Practical skills · Apparatus and techniques</div><h1 class="page-title">Required practicals</h1>
  <p class="page-sub">${DATA.meta.rpIntro}</p></div>
  ${list.map(rpCard).join('')}${list.length < 12 ? `<div class="pending">${12 - list.length} more practicals being written.</div>` : ''}</main>` + footer();
  if (focus) { const el = document.getElementById('rp-card-' + focus); if (el) el.scrollIntoView(); }
}

/* ---------- Quiz ---------- */
const DRAW = 10;
let Q = null, timerInterval = null;
function renderQuiz(u, retry) {
  clearInterval(timerInterval);
  let pool = u.questions.map((q, i) => Object.assign({ _id: i }, q));
  if (retry) {
    const m = store.get('missed_' + u.id, []);
    const p2 = pool.filter(q => m.includes(q._id));
    if (p2.length) pool = p2;
  } else store.del('missed_' + u.id);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  Q = { u, qs: pool.slice(0, Math.min(DRAW, pool.length)), cur: 0, score: 0, answered: false, done: false, timer: store.get('timer', false), secs: 60 };
  const cls = secClass(u);
  $('#app').innerHTML = topbar(`<button class="pill-btn ${Q.timer ? 'active' : ''}" id="timer-btn" onclick="toggleTimer()">Timer: ${Q.timer ? 'On' : 'Off'}</button><a class="pill-btn" href="#hub">← Hub</a>`) + `
  <main class="quiz wrap ${cls}"><div class="quiz-head"><div class="page-eyebrow">${esc(u.section.includes('.') ? u.section : SEC_NAMES[u.section])} · Spec ${esc(u.spec)}</div><h1 class="page-title">${esc(u.title)}</h1>
  <p class="page-sub">${retry ? 'Retrying the questions you missed' : `10 questions drawn from a pool of ${u.questions.length}`} · <a href="#s-${u.id}">Read the summary</a></p></div>
  <div id="qa"></div></main>` + footer();
  drawQ();
}
function drawQ() {
  const q = Q.qs[Q.cur], L = ['A', 'B', 'C', 'D'];
  Q.answered = false;
  $('#qa').innerHTML = `<div class="prog-label"><span>Question ${Q.cur + 1} of ${Q.qs.length}</span><span>Score: ${Q.score}</span></div>
  <div class="prog"><div style="width:${(Q.cur + 1) / Q.qs.length * 100}%"></div></div>
  <div class="q-card"><div class="q-num"><span>Question ${Q.cur + 1}</span>${Q.timer ? `<span class="q-timer" id="q-timer">60s</span>` : ''}</div>
  <div class="q-text">${fmt(q.q)}</div><div class="options">${q.o.map((o, i) => `<button class="option" id="opt${i}" onclick="pick(${i})"><span class="letter">${L[i]}</span><span>${fmt(o)}</span></button>`).join('')}</div>
  <div id="fb"></div></div>
  <div class="quiz-foot"><span class="key-hint">Keys: 1–4 to answer · Enter for next</span><button class="btn-next" id="next" hidden onclick="nextQ()">Next →</button></div>`;
  if (Q.timer) startTimer();
}
function startTimer() {
  clearInterval(timerInterval); Q.secs = 60;
  timerInterval = setInterval(() => {
    Q.secs--; const el = $('#q-timer');
    if (el) { el.textContent = Q.secs + 's'; if (Q.secs <= 10) el.classList.add('warn'); }
    if (Q.secs <= 0) { clearInterval(timerInterval); pick(-1); }
  }, 1000);
}
function pick(i) {
  if (!Q || Q.answered || Q.done) return;
  Q.answered = true; clearInterval(timerInterval);
  const q = Q.qs[Q.cur];
  document.querySelectorAll('.option').forEach(b => b.disabled = true);
  const ok = i === q.a;
  if (ok) Q.score++;
  else {
    if (i >= 0) $('#opt' + i).classList.add('wrong');
    const m = store.get('missed_' + Q.u.id, []); if (!m.includes(q._id)) { m.push(q._id); store.set('missed_' + Q.u.id, m); }
  }
  $('#opt' + q.a).classList.add('correct');
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'correct' : 'wrong'}"><b>${ok ? 'Correct.' : i === -1 ? "Time's up." : 'Not quite.'}</b> ${fmt(q.e)}</div>`;
  const nb = $('#next'); nb.hidden = false; nb.textContent = Q.cur < Q.qs.length - 1 ? 'Next →' : 'See results'; nb.focus({ preventScroll: true });
  document.querySelector('.prog-label span:last-child').textContent = 'Score: ' + Q.score;
}
function nextQ() { if (!Q.answered) return; Q.cur++; if (Q.cur >= Q.qs.length) return showResult(); drawQ(); window.scrollTo(0, 0); }
function showResult() {
  Q.done = true; clearInterval(timerInterval);
  const pct = Math.round(Q.score / Q.qs.length * 100);
  store.set('last_' + Q.u.id, { score: Q.score, total: Q.qs.length, pct, date: new Date().toISOString() });
  const missed = store.get('missed_' + Q.u.id, []).length;
  const msg = pct >= 80 ? 'Excellent. This topic is in good shape.' : pct >= 60 ? 'Good effort. Read the explanations for the ones you missed.' : 'Worth another pass through the summary, then retry.';
  $('#qa').innerHTML = `<div class="result"><div class="result-score">${Q.score}/${Q.qs.length}</div><div class="result-pct">${pct}% correct</div><div class="result-msg">${msg}</div>
  <div class="actions"><button class="btn primary" onclick="renderQuiz(Q.u,false)">New quiz</button>${missed ? `<button class="btn warn" onclick="renderQuiz(Q.u,true)">Retry ${missed} missed</button>` : ''}<a class="btn" href="#s-${Q.u.id}">Summary</a><a class="btn" href="#hub">Hub</a></div></div>`;
}
function toggleTimer() {
  Q.timer = !Q.timer; store.set('timer', Q.timer);
  const b = $('#timer-btn'); b.textContent = 'Timer: ' + (Q.timer ? 'On' : 'Off'); b.classList.toggle('active', Q.timer);
}
document.addEventListener('keydown', e => {
  if (!Q || Q.done || !$('#qa')) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (!Q.answered && ['1', '2', '3', '4'].includes(e.key)) pick(+e.key - 1);
  else if (Q.answered && (e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.id !== 'next') { e.preventDefault(); nextQ(); }
});

/* ---------- Router ---------- */
function route() {
  clearInterval(timerInterval); Q = null;
  const h = location.hash.replace('#', '');
  let m;
  if ((m = h.match(/^q-(.+)$/)) && unitById(m[1])) renderQuiz(unitById(m[1]), false);
  else if ((m = h.match(/^s-(.+)$/)) && unitById(m[1])) renderSummary(unitById(m[1]));
  else if (h === 'practicals') renderPracticals();
  else if ((m = h.match(/^rp-(\d+)$/))) renderPracticals(m[1]);
  else renderHub();
  if (!/^rp-/.test(h)) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
