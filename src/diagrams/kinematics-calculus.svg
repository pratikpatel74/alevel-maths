<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 288"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cf"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="af"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="gf"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mf"/></marker></defs><rect x="120" y="18" width="240" height="50" rx="6" class="bx"/><text x="240" y="39" text-anchor="middle" font-size="14">displacement s</text><text x="240" y="58" class="tm" text-anchor="middle" font-size="12">s = t³ − 6t²</text><rect x="120" y="108" width="240" height="50" rx="6" class="bx"/><text x="240" y="129" text-anchor="middle" font-size="14">velocity v</text><text x="240" y="148" class="tm" text-anchor="middle" font-size="12">v = ds/dt = 3t² − 12t</text><rect x="120" y="198" width="240" height="50" rx="6" class="bx"/><text x="240" y="219" text-anchor="middle" font-size="14">acceleration a</text><text x="240" y="238" class="tm" text-anchor="middle" font-size="12">a = dv/dt = 6t − 12</text><line x1="120" y1="68" x2="120" y2="108" class="ac" marker-end="url(#aa)"/><text x="112" y="94" class="ta" text-anchor="end" font-size="12">differentiate</text><line x1="360" y1="108" x2="360" y2="68" class="gl" marker-end="url(#ag)"/><text x="368" y="94" class="tg" font-size="12">integrate</text><text x="368" y="110" class="tg" font-size="11">(+ c)</text><line x1="120" y1="158" x2="120" y2="198" class="ac" marker-end="url(#aa)"/><text x="112" y="184" class="ta" text-anchor="end" font-size="12">differentiate</text><line x1="360" y1="198" x2="360" y2="158" class="gl" marker-end="url(#ag)"/><text x="368" y="184" class="tg" font-size="12">integrate</text><text x="368" y="200" class="tg" font-size="11">(+ c)</text><text x="240" y="276" text-anchor="middle" font-size="13">at rest: v = 0 → t = 0 or t = 4</text></svg>
