<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 256"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cf"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="af"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="gf"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mf"/></marker></defs><path d="M60,220 L360,220 L360,60 Z" class="at"/><rect x="344" y="204" width="16" height="16" rx="0" class="lm"/><text x="210" y="244" text-anchor="middle" font-size="13">R cos α = a  (here a = 4)</text><text x="372" y="145" font-size="13">R sin α = b</text><text x="372" y="163" class="tm" font-size="12">(here b = 3)</text><text x="196" y="126" class="ta" text-anchor="end" font-size="16">R</text><path d="M120,220 A60,60 0 0 0 112.9,191.8" class="ln"/><text x="130" y="210" font-size="15">α</text><text x="20" y="28" font-size="14">4 sin θ + 3 cos θ = R sin(θ + α)</text><text x="20" y="48" class="tm" font-size="12">R = √(4² + 3²) = 5, tan α = 3 ÷ 4, α ≈ 36.9°</text></svg>
