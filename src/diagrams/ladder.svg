<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cf"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="af"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="gf"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mf"/></marker></defs><line x1="30" y1="300" x2="450" y2="300" class="ln thick"/><line x1="400" y1="300" x2="400" y2="20" class="ln thick"/><text x="408" y="34" class="tm" font-size="12">smooth wall</text><text x="40" y="318" class="tm" font-size="12">rough ground</text><line x1="170" y1="300" x2="400" y2="60" class="ln" stroke-width="7" stroke-linecap="round"/><line x1="285" y1="180" x2="285" y2="260" class="gl" marker-end="url(#ag)"/><text x="293" y="258" class="tg" font-size="15">W</text><circle cx="285" cy="180" r="4" class="gf"/><line x1="400" y1="60" x2="320" y2="60" class="ac" marker-end="url(#aa)"/><text x="316" y="52" class="ta" text-anchor="end" font-size="15">S</text><line x1="170" y1="300" x2="170" y2="210" class="ac" marker-end="url(#aa)"/><text x="162" y="208" class="ta" text-anchor="end" font-size="15">R</text><line x1="170" y1="294" x2="250" y2="294" class="ac" marker-end="url(#aa)"/><text x="256" y="290" class="ta" font-size="15">F</text><path d="M216,300 A46,46 0 0 0 201.8,266.8" class="ln"/><text x="224" y="286" font-size="14">θ</text><text x="30" y="40" font-size="14">Resolve: F = S, R = W</text><text x="30" y="60" font-size="14">Moments about the foot:</text><text x="30" y="80" font-size="14">W × (L/2) cos θ = S × L sin θ</text></svg>
