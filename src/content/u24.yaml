id: "p18"
order: 24
year: 2
section: "P"
badge: "G"
spec: "G"
title: "Further differentiation"
desc: "Parametric and implicit differentiation, connected rates of change, points of inflection, and convex and concave curves."
practicals: []
summary:
  - h: "Parametric differentiation"
    p:
      - "`dy/dx = (dy/dt) ÷ (dx/dt)`"
      - "Find tangents and normals by evaluating at a particular t."
  - h: "Implicit differentiation"
    p:
      - "Differentiate every term with respect to x. When differentiating a function of y, multiply by **dy/dx**: `d/dx (y²) = 2y dy/dx`."
      - "Use the **product rule** for terms like xy: `d/dx (xy) = x dy/dx + y`."
      - "Collect dy/dx terms on one side and factorise."
  - h: "Connected rates of change"
    p:
      - "Link rates using the chain rule, e.g. `dV/dt = dV/dr × dr/dt`."
      - "Form differential equations from statements like 'the rate of change of P is proportional to P': dP/dt = kP."
  - h: "Second derivatives, concavity and inflection"
    p:
      - "**Convex** (curving upwards, like ∪): f″(x) > 0. **Concave** (like ∩): f″(x) < 0."
      - "A **point of inflection** is where the curve changes from convex to concave (or vice versa): f″(x) = 0 **and changes sign**."
      - "A **stationary point of inflection** also has f′(x) = 0."
pitfalls:
  - "In implicit differentiation, don't forget dy/dx on **every** y term, and the product rule for xy."
  - "f″(x) = 0 alone doesn't guarantee an inflection: check the **sign changes**."
  - "In connected rates of change, write the chain of rates clearly so units cancel."
examples:
  - q: "x = t², y = t³. Find dy/dx when t = 2."
    steps:
      - "dx/dt = 2t, dy/dt = 3t²."
      - "dy/dx = 3t²/(2t) = 3t/2."
    a: "3 at t = 2"
  - q: "Find dy/dx for x² + y² + 3xy = 5."
    steps:
      - "2x + 2y dy/dx + 3(x dy/dx + y) = 0."
      - "dy/dx(2y + 3x) = −2x − 3y."
    a: "dy/dx = −(2x + 3y)/(2y + 3x)"
questions:
  - q: "x = 3t, y = t². Find dy/dx."
    o: ["2t", "2t/3", "3/(2t)", "t²/3"]
    a: 1
    e: "dy/dx = (2t)/(3)."
  - q: "x = cos t, y = sin t. Find dy/dx."
    o: ["−cot t", "tan t", "cot t", "−tan t"]
    a: 0
    e: "dy/dx = cos t/(−sin t) = −cot t."
  - q: "Differentiate y³ with respect to x."
    o: ["3y²", "3y²x", "3y² dy/dx", "y³ dy/dx"]
    a: 2
    e: "Chain rule: d/dy (y³) × dy/dx."
  - q: "Differentiate xy with respect to x."
    o: ["y", "x dy/dx", "dy/dx", "x dy/dx + y"]
    a: 3
    e: "Product rule on x and y."
  - q: "Find dy/dx for x² + y² = 25."
    o: ["−x/y", "x/y", "−y/x", "2x + 2y"]
    a: 0
    e: "2x + 2y dy/dx = 0, so dy/dx = −x/y."
  - q: "For x² + y² = 25, what is the gradient at (3, 4)?"
    o: ["3/4", "−3/4", "4/3", "−4/3"]
    a: 1
    e: "−x/y = −3/4."
  - q: "Find dy/dx for eʸ = x."
    o: ["eʸ", "x", "1/x", "ln x"]
    a: 2
    e: "eʸ dy/dx = 1, so dy/dx = 1/eʸ = 1/x."
  - q: "A sphere's radius increases at 0.1 cm s⁻¹. How fast is the volume increasing when r = 5 cm? (V = 4πr³/3)"
    o: ["100π cm³ s⁻¹", "π cm³ s⁻¹", "20π cm³ s⁻¹", "10π cm³ s⁻¹"]
    a: 3
    e: "dV/dr = 4πr² = 100π. dV/dt = 100π × 0.1 = 10π."
  - q: "The rate of decrease of temperature T is proportional to T. Which equation is correct?"
    o: ["dT/dt = −kT", "dT/dt = kT", "T = −kt", "dT/dt = −k"]
    a: 0
    e: "'Decrease' gives a negative sign, with k > 0."
  - q: "When is a curve convex?"
    o: ["When f′(x) > 0", "When f″(x) > 0", "When f″(x) < 0", "When f(x) > 0"]
    a: 1
    e: "Convex curves bend upwards, so the gradient increases."
  - q: "What is a point of inflection?"
    o: ["Any point where f′(x) = 0", "A maximum", "A point where the curve changes between convex and concave", "Where f(x) = 0"]
    a: 2
    e: "f″(x) changes sign there."
  - q: "Find the x-coordinate of the point of inflection of y = x³ − 6x²."
    o: ["x = 0", "x = 4", "x = 6", "x = 2"]
    a: 3
    e: "y″ = 6x − 12 = 0 at x = 2, and it changes sign."
  - q: "For y = x⁴, f″(0) = 0. Is x = 0 a point of inflection?"
    o: ["No, because f″(x) = 12x² doesn't change sign", "Yes, because f″(0) = 0", "Yes, because it's stationary", "Cannot tell"]
    a: 0
    e: "y = x⁴ is convex on both sides of 0, so x = 0 is a minimum, not an inflection."
  - q: "On what interval is y = x³ concave?"
    o: ["x > 0", "x < 0", "All x", "x = 0 only"]
    a: 1
    e: "y″ = 6x < 0 when x < 0."
  - q: "x = t + 1/t, y = t − 1/t. Find dy/dx at t = 2."
    o: ["1", "3/5", "5/3", "−1"]
    a: 2
    e: "dx/dt = 1 − 1/t² = 3/4, dy/dt = 1 + 1/t² = 5/4. dy/dx = 5/3."
  - q: "Find dy/dx for y² = 4x."
    o: ["4", "2y", "y/2", "2/y"]
    a: 3
    e: "2y dy/dx = 4, so dy/dx = 2/y."
  - q: "Area A = πr². dr/dt = 2. Find dA/dt when r = 3."
    o: ["12π", "6π", "18π", "9π"]
    a: 0
    e: "dA/dr = 2πr = 6π. dA/dt = 6π × 2 = 12π."
  - q: "A stationary point of inflection must satisfy:"
    o: ["f′(x) ≠ 0", "f′(x) = 0 and f″(x) changes sign", "f″(x) > 0", "f(x) = 0"]
    a: 1
    e: "E.g. y = x³ at x = 0."
  - q: "Find dy/dx for x²y = 6."
    o: ["−x/(2y)", "6/x²", "−2y/x", "−y/(2x)"]
    a: 2
    e: "2xy + x² dy/dx = 0, so dy/dx = −2xy/x² = −2y/x."
  - q: "For a parametric curve, how do you find where the tangent is horizontal?"
    o: ["Set dx/dt = 0", "Set x = 0", "Set y = 0", "Set dy/dt = 0 (with dx/dt ≠ 0)"]
    a: 3
    e: "Horizontal tangent means dy/dx = 0."
  - q: "y = sin x on 0 < x < 2π. Where is the point of inflection?"
    o: ["x = π", "x = π/2", "x = 3π/2", "There isn't one"]
    a: 0
    e: "y″ = −sin x = 0 at x = π, and it changes sign there."
  - q: "x = e^t, y = e^(2t). Find dy/dx."
    o: ["e^t", "2e^t", "2", "e^(2t)"]
    a: 1
    e: "dy/dx = 2e^(2t)/e^t = 2e^t."
