id: "p22"
order: 28
year: 2
section: "P"
badge: "J"
spec: "J"
title: "Vectors in three dimensions"
desc: "3D vectors using i, j, k, magnitude, distance between points, position vectors, and solving geometric problems in 3D."
practicals: []
summary:
  - h: "3D vectors"
    p:
      - "In 3D, vectors are written **ai + bj + ck** or as a column (a, b, c). k is the unit vector in the z-direction."
      - "Add, subtract and multiply by scalars component by component, as in 2D."
      - "`|ai + bj + ck| = √(a² + b² + c²)`"
      - "Distance between (x₁, y₁, z₁) and (x₂, y₂, z₂) = √[(x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²]."
  - h: "Geometry with vectors"
    p:
      - "Position vectors: **AB = b − a**."
      - "Points are **collinear** if AB is a multiple of BC (sharing point B)."
      - "Use vectors to show shapes are parallelograms (opposite sides equal vectors) and to find midpoints."
      - "The angle a vector makes with an axis: cos θₓ = a/|v| for the x-axis."
      - "Vectors are also used in mechanics for forces, velocities and accelerations."
pitfalls:
  - "Include the k component in every magnitude calculation."
  - "AB = b − a (end minus start)."
  - "A vector parallel to another must have **all** components in the same ratio."
examples:
  - q: "Find the distance between A(1, 2, 3) and B(4, −2, 15)."
    steps:
      - "AB = 3i − 4j + 12k."
      - "|AB| = √(9 + 16 + 144) = √169."
    a: "13"
  - q: "Find the angle between 2i + 3j − k and the positive x-axis."
    steps:
      - "|v| = √(4 + 9 + 1) = √14."
      - "cos θ = 2/√14."
    a: "θ ≈ 57.7°"
questions:
  - q: "Find (2i − j + 3k) + (i + 4j − k)."
    o: ["i + 3j + 2k", "3i + 3j + 2k", "3i + 5j + 4k", "2i − 4j − 3k"]
    a: 1
    e: "Add component by component."
  - q: "Find |2i + 3j + 6k|."
    o: ["7", "11", "49", "√11"]
    a: 0
    e: "√(4 + 9 + 36) = √49 = 7."
  - q: "A = (1, 0, 2), B = (3, 4, 2). Find AB."
    o: ["4i + 4j + 4k", "−2i − 4j", "2i + 4j", "2i + 4j + 2k"]
    a: 2
    e: "b − a = (2, 4, 0) = 2i + 4j."
  - q: "Find the distance between (0, 0, 0) and (1, 2, 2)."
    o: ["5", "√5", "9", "3"]
    a: 3
    e: "√(1 + 4 + 4) = 3."
  - q: "Which vector is parallel to i − 2j + 3k?"
    o: ["−2i + 4j − 6k", "2i − 4j + 3k", "i + 2j + 3k", "3i − 2j + k"]
    a: 0
    e: "−2(i − 2j + 3k)."
  - q: "Find the unit vector in the direction of 2i − 2j + k."
    o: ["2i − 2j + k", "(2i − 2j + k)/3", "(2i − 2j + k)/9", "(2i − 2j + k)/√5"]
    a: 1
    e: "Magnitude = √(4 + 4 + 1) = 3."
  - q: "OA = 3i + j − 2k and OB = i + 5j + 4k. What is the position vector of the midpoint of AB?"
    o: ["4i + 6j + 2k", "−2i + 4j + 6k", "2i + 3j + k", "i + 2j + 3k"]
    a: 2
    e: "½(a + b) = ½(4i + 6j + 2k)."
  - q: "What is the unit vector in the z-direction?"
    o: ["i", "j", "z", "k"]
    a: 3
    e: "i, j and k are along the x, y and z axes."
  - q: "AB = 2i + j − k and BC = 6i + 3j − 3k. What can you conclude about A, B, C?"
    o: ["They are collinear", "They form a right angle", "AB = BC", "Nothing"]
    a: 0
    e: "BC = 3AB, so they are parallel and share point B."
  - q: "Find the angle between 3i + 4k and the z-axis."
    o: ["53.1°", "36.9°", "90°", "45°"]
    a: 1
    e: "|v| = 5, cos θ = 4/5, θ ≈ 36.9°."
  - q: "Find 2(i − j + k) − (3i + j)."
    o: ["−i − 3j", "−i − j + 2k", "−i − 3j + 2k", "5i − j + 2k"]
    a: 2
    e: "2i − 2j + 2k − 3i − j = −i − 3j + 2k."
  - q: "ABCD is a parallelogram. Which must be true?"
    o: ["AB = CD", "AB = AC", "AB = BD", "AB = DC"]
    a: 3
    e: "Opposite sides are equal and parallel, in the same direction: AB = DC."
  - q: "Find |−i + 4j − 8k|."
    o: ["9", "√65", "81", "11"]
    a: 0
    e: "√(1 + 16 + 64) = √81 = 9."
  - q: "The vector ai + 2j + 3k has magnitude 7. Find the positive value of a."
    o: ["2", "6", "4", "√20"]
    a: 1
    e: "a² + 4 + 9 = 49, so a² = 36."
  - q: "Find the distance between (2, −1, 3) and (5, 3, 3)."
    o: ["7", "25", "5", "√7"]
    a: 2
    e: "√(9 + 16 + 0) = 5."
  - q: "pi + 4j + qk is parallel to 2i + 8j − 6k. Find p and q."
    o: ["p = 2, q = −6", "p = 4, q = 3", "p = 1, q = 3", "p = 1, q = −3"]
    a: 3
    e: "Half of 2i + 8j − 6k is i + 4j − 3k."
  - q: "What is the position vector of the point (3, −1, 5)?"
    o: ["3i − j + 5k", "3i + j + 5k", "−3i + j − 5k", "3i − 5k"]
    a: 0
    e: "The coordinates become the i, j, k components."
  - q: "Which formula gives the magnitude of a 3D vector ai + bj + ck?"
    o: ["a + b + c", "√(a² + b² + c²)", "a² + b² + c²", "√(a + b + c)"]
    a: 1
    e: "Pythagoras in three dimensions."
  - q: "OA = i + 2j + 3k. M is the midpoint of OA. What is OM?"
    o: ["2i + 4j + 6k", "i + 2j + 3k", "0.5i + j + 1.5k", "−i − 2j − 3k"]
    a: 2
    e: "OM = ½OA."
  - q: "Find the angle between 2i + 3j − k and the positive x-axis."
    o: ["74.5°", "36.7°", "105.5°", "57.7°"]
    a: 3
    e: "cos θ = 2/√14 ≈ 0.5345, θ ≈ 57.7°."
  - q: "A force F = 3i − 2j + 6k N. What is its magnitude?"
    o: ["7 N", "49 N", "11 N", "√13 N"]
    a: 0
    e: "√(9 + 4 + 36) = 7."
  - q: "Points A(1, 1, 1) and B(3, 5, 7). Which point is on the line AB, beyond B, with AC = 2AB?"
    o: ["(4, 9, 13)", "(5, 9, 13)", "(3, 5, 7)", "(6, 10, 14)"]
    a: 1
    e: "AB = 2i + 4j + 6k. OC = a + 2AB = (1 + 4, 1 + 8, 1 + 12) = (5, 9, 13)."
