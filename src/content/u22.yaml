id: "p16"
order: 22
year: 2
section: "P"
badge: "C"
spec: "C"
title: "Parametric equations"
desc: "Defining curves parametrically, converting between parametric and Cartesian forms, sketching parametric curves and modelling with parametric equations."
practicals: []
summary:
  - h: "Parametric equations"
    fig: parametric
    cap: "Each value of the parameter t gives one point (t², 2t). Eliminating t (t = y ÷ 2, so x = y² ÷ 4) gives the Cartesian equation y² = 4x."
    p:
      - "Both x and y are given in terms of a third variable, the **parameter** (often t or θ): x = f(t), y = g(t)."
      - "Each value of t gives a point (x, y) on the curve. The **domain** of t controls which part of the curve is drawn."
  - h: "Converting to Cartesian form"
    p:
      - "**Eliminate** the parameter: rearrange one equation for t and substitute into the other."
      - "For trig parameters, use identities: e.g. x = 3cos θ, y = 3sin θ gives x² + y² = 9 (circle)."
      - "x = a + r cos θ, y = b + r sin θ is a circle centre (a, b), radius r."
      - "The range of x and y in Cartesian form comes from the parametric domain."
  - h: "Applications"
    p:
      - "To find where a parametric curve meets a line or axis, substitute the parametric expressions into the line's equation and solve for t."
      - "Parametric equations are used to model motion, e.g. projectiles: x = ut cos α, y = ut sin α − ½gt²."
      - "Differentiating parametric equations (dy/dx = (dy/dt)/(dx/dt)) is covered in Further differentiation."
pitfalls:
  - "After converting, state any **restrictions** on x or y from the parameter's domain."
  - "Use the right trig identity: sin² + cos² = 1 or 1 + tan² = sec²."
  - "To find where a curve crosses the x-axis, set **y = 0** and solve for t, then find x."
examples:
  - q: "Find the Cartesian equation of x = t + 1, y = t² − 2."
    steps:
      - "t = x − 1."
      - "y = (x − 1)² − 2."
    a: "y = x² − 2x − 1"
  - q: "A curve has x = 2cos t, y = 5sin t. Find its Cartesian equation."
    steps:
      - "cos t = x/2 and sin t = y/5."
      - "cos²t + sin²t = 1 gives x²/4 + y²/25 = 1."
    a: "x²/4 + y²/25 = 1 (an ellipse)"
questions:
  - q: "What is a parameter in parametric equations?"
    o: ["A constant", "A third variable that both x and y depend on", "The gradient", "The y-intercept"]
    a: 1
    e: "E.g. t in x = t², y = 2t."
  - q: "x = 2t, y = t². Find the point where t = 3."
    o: ["(6, 9)", "(9, 6)", "(3, 9)", "(6, 6)"]
    a: 0
    e: "x = 6, y = 9."
  - q: "Find the Cartesian equation of x = 2t, y = t²."
    o: ["y = 2x²", "y = x/2", "y = x²/4", "y = 4x²"]
    a: 2
    e: "t = x/2, so y = x²/4."
  - q: "Find the Cartesian equation of x = 3cos θ, y = 3sin θ."
    o: ["x + y = 3", "y = 3x", "x² − y² = 9", "x² + y² = 9"]
    a: 3
    e: "x² + y² = 9(cos²θ + sin²θ) = 9."
  - q: "x = 1 + 2cos θ, y = −3 + 2sin θ describes what?"
    o: ["A circle, centre (1, −3), radius 2", "A circle, centre (−1, 3), radius 2", "A circle, centre (1, −3), radius 4", "An ellipse"]
    a: 0
    e: "(x − 1)² + (y + 3)² = 4."
  - q: "x = t + 2, y = 3t − 1. Find the Cartesian equation."
    o: ["y = 3x + 5", "y = 3x − 7", "y = x + 1", "y = 3x − 1"]
    a: 1
    e: "t = x − 2, so y = 3(x − 2) − 1 = 3x − 7."
  - q: "x = t², y = 2t − 1. Where does the curve cross the y-axis?"
    o: ["(1, 0)", "(0, 1)", "(0, −1)", "(−1, 0)"]
    a: 2
    e: "x = 0 gives t = 0, so y = −1."
  - q: "x = t², y = t³. Find the Cartesian equation."
    o: ["y = x^(2/3)", "y = x²", "y = x³", "y² = x³"]
    a: 3
    e: "t = y^(1/3), x = y^(2/3), so x³ = y²."
  - q: "x = sec t, y = tan t. Which identity gives the Cartesian equation?"
    o: ["1 + tan²t = sec²t, so x² − y² = 1", "sin²t + cos²t = 1", "1 + cot²t = cosec²t", "cos 2t = 1 − 2sin²t"]
    a: 0
    e: "sec²t − tan²t = 1, so x² − y² = 1."
  - q: "x = 2t, y = 4/t (t ≠ 0). Find the Cartesian equation."
    o: ["y = 2x", "xy = 8", "y = 8x", "xy = 2"]
    a: 1
    e: "t = x/2, so y = 4/(x/2) = 8/x."
  - q: "x = 3t − 1, y = t + 4. Where does the curve meet the line y = x?"
    o: ["(4, 4)", "(5, 5)", "(6.5, 6.5)", "(2, 2)"]
    a: 2
    e: "t + 4 = 3t − 1, so t = 2.5. x = 6.5, y = 6.5."
  - q: "x = cos t, y = sin 2t. Write y in terms of x (for sin t ≥ 0)."
    o: ["y = 2x", "y = x²", "y = 2x²", "y = 2x√(1 − x²)"]
    a: 3
    e: "sin 2t = 2 sin t cos t = 2x√(1 − x²) when sin t ≥ 0."
  - q: "x = t², 0 ≤ t ≤ 3. What is the range of x?"
    o: ["0 ≤ x ≤ 9", "0 ≤ x ≤ 3", "x ≥ 0", "−9 ≤ x ≤ 9"]
    a: 0
    e: "x increases from 0 to 9 as t goes from 0 to 3."
  - q: "A projectile moves with x = 20t, y = 15t − 4.9t². When does it land (y = 0, t > 0)?"
    o: ["t = 15 s", "t ≈ 3.06 s", "t ≈ 1.53 s", "t = 20 s"]
    a: 1
    e: "t(15 − 4.9t) = 0, so t = 15/4.9 ≈ 3.06 s."
  - q: "For the projectile x = 20t, y = 15t − 4.9t², how far does it travel horizontally?"
    o: ["30.6 m", "15.3 m", "61.2 m", "300 m"]
    a: 2
    e: "x = 20 × 3.061 ≈ 61.2 m."
  - q: "x = 4cos θ, y = 3sin θ. What shape is the curve?"
    o: ["A circle", "A parabola", "A straight line", "An ellipse"]
    a: 3
    e: "x²/16 + y²/9 = 1, an ellipse."
  - q: "x = t − 1, y = t² + 1. Find where the curve meets the x-axis."
    o: ["It never meets the x-axis", "(−1, 0)", "(0, 1)", "(1, 0)"]
    a: 0
    e: "y = t² + 1 is always at least 1."
  - q: "x = e^t, y = e^(2t). Find the Cartesian equation."
    o: ["y = 2x", "y = x², x > 0", "y = eˣ", "y = ln x"]
    a: 1
    e: "e^(2t) = (e^t)² = x². Since e^t > 0, x > 0."
  - q: "Why might parametric equations be useful for modelling motion?"
    o: ["They avoid all calculation", "They only work for circles", "They give both x and y positions as functions of time", "They remove gravity"]
    a: 2
    e: "The parameter t can represent time."
  - q: "x = 2t + 1, y = t − 3 for −1 ≤ t ≤ 2. What is the domain of x in the Cartesian form?"
    o: ["−1 ≤ x ≤ 2", "−3 ≤ x ≤ 2", "x ≥ −1", "−1 ≤ x ≤ 5"]
    a: 3
    e: "t = −1 gives x = −1; t = 2 gives x = 5."
  - q: "x = 3 + t, y = 2 − 2t. What is the gradient of this line?"
    o: ["−2", "2", "−1/2", "3"]
    a: 0
    e: "t = x − 3, y = 2 − 2(x − 3) = 8 − 2x. Gradient −2."
  - q: "x = cos 2t, y = sin t. Find the Cartesian equation."
    o: ["x = 1 − y", "x = 1 − 2y²", "x² + y² = 1", "x = 2y² − 1"]
    a: 1
    e: "cos 2t = 1 − 2sin²t."
