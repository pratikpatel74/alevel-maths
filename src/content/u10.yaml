id: "p10"
order: 10
year: 1
section: "P"
badge: "J"
spec: "J"
title: "Vectors"
desc: "Vectors in two dimensions, magnitude and direction, unit vectors, position vectors, and using vectors to solve geometric problems."
practicals: []
summary:
  - h: "Vector basics"
    p:
      - "A **vector** has **magnitude** and **direction**. A **scalar** has only magnitude."
      - "Write vectors as **ai + bj** or as column vectors (a, b)."
      - "Add and subtract component by component. Multiplying by a scalar changes the length (and reverses direction if negative)."
      - "Two vectors are **parallel** if one is a scalar multiple of the other."
  - h: "Magnitude and direction"
    p:
      - "`|ai + bj| = √(a² + b²)`"
      - "Direction: the angle with the positive x-axis is found using tan θ = b/a (draw a sketch to check the quadrant)."
      - "A **unit vector** has magnitude 1: unit vector in the direction of **a** is **a**/|**a**|."
  - h: "Position vectors and geometry"
    fig: vectors
    cap: "With position vectors a and b, the vector from A to B is b − a (go back along a, then along b). The midpoint M of AB has position vector a + ½(b − a) = ½(a + b)."
    p:
      - "The **position vector** of A is **OA** = **a**."
      - "`AB = OB − OA = b − a`"
      - "Distance between A and B = |**b** − **a**|."
      - "Midpoint M of AB: **OM** = ½(**a** + **b**)."
      - "Points are **collinear** if the vectors between them are parallel and share a point."
pitfalls:
  - "AB = **b − a**, not a − b. Think 'end minus start'."
  - "For direction, check the quadrant: tan⁻¹ gives an angle between −90° and 90°."
  - "Parallel vectors can point in opposite directions (negative scalar multiple)."
examples:
  - q: "A has position vector 2i + 3j and B has position vector 6i − j. Find |AB|."
    steps:
      - "AB = (6 − 2)i + (−1 − 3)j = 4i − 4j."
      - "|AB| = √(16 + 16) = √32."
    a: "4√2"
  - q: "Find the unit vector in the direction of 3i − 4j."
    steps:
      - "|3i − 4j| = √(9 + 16) = 5."
      - "Divide by 5."
    a: "(3/5)i − (4/5)j"
questions:
  - q: "Find (3i + 2j) + (i − 5j)."
    o: ["2i + 7j", "4i − 3j", "4i + 7j", "3i − 10j"]
    a: 1
    e: "Add components: (3 + 1)i + (2 − 5)j."
  - q: "Find the magnitude of 5i + 12j."
    o: ["13", "17", "√17", "169"]
    a: 0
    e: "√(25 + 144) = √169 = 13."
  - q: "Find 3(2i − j)."
    o: ["5i + 2j", "6i − j", "6i − 3j", "2i − 3j"]
    a: 2
    e: "Multiply each component by 3."
  - q: "Which vector is parallel to 2i − 3j?"
    o: ["3i − 2j", "2i + 3j", "−3i + 2j", "−4i + 6j"]
    a: 3
    e: "−4i + 6j = −2(2i − 3j)."
  - q: "What is the unit vector in the direction of 6i + 8j?"
    o: ["0.6i + 0.8j", "6i + 8j", "0.8i + 0.6j", "i + j"]
    a: 0
    e: "Magnitude 10, so divide each component by 10."
  - q: "A = (1, 4) and B = (5, 2). What is vector AB?"
    o: ["−4i + 2j", "4i − 2j", "6i + 6j", "4i + 2j"]
    a: 1
    e: "b − a = (5 − 1)i + (2 − 4)j."
  - q: "Find the angle 3i + 3j makes with the positive x-axis."
    o: ["30°", "60°", "45°", "90°"]
    a: 2
    e: "tan θ = 3/3 = 1, so θ = 45°."
  - q: "What is the position vector of the midpoint of A(2i + 6j) and B(4i − 2j)?"
    o: ["6i + 4j", "i − 4j", "2i − 8j", "3i + 2j"]
    a: 3
    e: "½(a + b) = ½(6i + 4j) = 3i + 2j."
  - q: "What is a scalar?"
    o: ["A quantity with magnitude only", "A quantity with direction only", "A unit vector", "A position vector"]
    a: 0
    e: "E.g. speed and distance are scalars; velocity and displacement are vectors."
  - q: "Find |−2i + j|."
    o: ["√3", "√5", "3", "1"]
    a: 1
    e: "√(4 + 1) = √5."
  - q: "Find the distance between A(1, 1) and B(4, 5) using vectors."
    o: ["7", "25", "5", "√7"]
    a: 2
    e: "AB = 3i + 4j, |AB| = 5."
  - q: "2i + kj is parallel to 4i + 10j. Find k."
    o: ["10", "20", "2", "5"]
    a: 3
    e: "4i + 10j = 2(2i + 5j), so k = 5."
  - q: "Find the angle between 4i − 3j and the positive x-axis (below the axis)."
    o: ["36.9° below the x-axis", "53.1° below", "36.9° above", "143.1°"]
    a: 0
    e: "tan θ = 3/4, θ ≈ 36.9°, and the j-component is negative."
  - q: "Points A, B, C with AB = 2i + j and BC = 6i + 3j. What can you conclude?"
    o: ["AB is perpendicular to BC", "A, B and C are collinear", "AB = BC", "Nothing"]
    a: 1
    e: "BC = 3AB, so they're parallel, and they share point B."
  - q: "Find a − b if a = 4i + j and b = i − 2j."
    o: ["5i − j", "3i − j", "3i + 3j", "−3i − 3j"]
    a: 2
    e: "(4 − 1)i + (1 − (−2))j = 3i + 3j."
  - q: "A vector has magnitude 10 and direction 30° above the positive x-axis. What is it in component form?"
    o: ["5i + 5√3j", "10i + 10j", "8.66i − 5j", "5√3i + 5j"]
    a: 3
    e: "10cos 30° = 5√3 and 10sin 30° = 5."
  - q: "What is the magnitude of a unit vector?"
    o: ["1", "0", "It depends", "√2"]
    a: 0
    e: "By definition, a unit vector has length 1."
  - q: "OA = a and OB = b. What is BA?"
    o: ["b − a", "a − b", "a + b", "−a − b"]
    a: 1
    e: "BA = OA − OB = a − b."
  - q: "Find |3i − 4j| × 2."
    o: ["14", "7", "10", "25"]
    a: 2
    e: "|3i − 4j| = 5, so 10."
  - q: "M is the midpoint of AB. Which is OM?"
    o: ["b − a", "a + b", "2(a + b)", "a + ½(b − a)"]
    a: 3
    e: "OM = OA + ½AB = a + ½(b − a) = ½(a + b)."
  - q: "Which of these is a vector quantity?"
    o: ["Velocity", "Speed", "Mass", "Time"]
    a: 0
    e: "Velocity has size and direction."
  - q: "Find the angle between −i + √3 j and the positive x-axis."
    o: ["60°", "120°", "30°", "150°"]
    a: 1
    e: "The vector is in the second quadrant. tan⁻¹(√3) = 60°, so the angle is 180° − 60° = 120°."
