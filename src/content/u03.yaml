id: "p3"
order: 3
year: 1
section: "P"
badge: "B"
spec: "B"
title: "Polynomials and graphs"
desc: "Expanding and dividing polynomials, the factor theorem, sketching curves, proportion, and transformations of graphs."
practicals: []
summary:
  - h: "Polynomials"
    p:
      - "Expand brackets carefully, collecting like terms. A **cubic** has highest power 3."
      - "**Algebraic division**: divide a polynomial by (x − a), e.g. by long division or by comparing coefficients."
      - "**Factor theorem**: if f(a) = 0, then (x − a) is a **factor** of f(x). More generally, if f(b/a) = 0, then (ax − b) is a factor."
      - "To factorise a cubic: find one root by trial (try factors of the constant term), divide, then factorise the quadratic."
  - h: "Sketching curves"
    p:
      - "Find where the curve meets the axes (set x = 0, then y = 0) and its general shape."
      - "Cubic with positive x³ coefficient: starts bottom left, ends top right. A **repeated root** means the curve **touches** the axis."
      - "**Reciprocal graphs** y = k/x and y = k/x² have **asymptotes** at x = 0 and y = 0."
      - "**Proportion**: y ∝ x means y = kx (straight line through the origin). y ∝ 1/x means y = k/x."
  - h: "Transformations of y = f(x)"
    p:
      - "`y = f(x) + a`: translation by **(0, a)**, i.e. up a."
      - "`y = f(x + a)`: translation by **(−a, 0)**, i.e. left a."
      - "`y = af(x)`: stretch **parallel to the y-axis**, scale factor a."
      - "`y = f(ax)`: stretch **parallel to the x-axis**, scale factor **1/a**."
      - "`y = −f(x)`: reflection in the **x-axis**. `y = f(−x)`: reflection in the **y-axis**."
pitfalls:
  - "Changes **inside** the bracket affect x and do the **opposite** of what you'd expect: f(x + 2) moves **left** 2."
  - "f(2x) is a stretch with scale factor **½**, not 2."
  - "For the factor theorem, f(2) = 0 means (x − 2) is a factor, not (x + 2)."
examples:
  - q: "Show that (x − 2) is a factor of f(x) = x³ − 3x² − 4x + 12 and hence factorise f(x) fully."
    steps:
      - "f(2) = 8 − 12 − 8 + 12 = 0, so (x − 2) is a factor."
      - "Divide: x³ − 3x² − 4x + 12 = (x − 2)(x² − x − 6)."
      - "x² − x − 6 = (x − 3)(x + 2)."
    a: "f(x) = (x − 2)(x − 3)(x + 2)"
  - q: "The curve y = f(x) has a maximum at (2, 5). Find the maximum of y = f(x − 3) + 1."
    steps:
      - "f(x − 3) translates the curve 3 right: (5, 5)."
      - "+ 1 translates it up 1: (5, 6)."
    a: "(5, 6)"
questions:
  - q: "Expand (x + 2)(x² − 3x + 1)."
    o: ["x³ − x² − 5x + 2", "x³ − x² + 2", "x³ − 5x² − 5x + 2", "x³ + 2x² − 3x + 2"]
    a: 0
    e: "x³ − 3x² + x + 2x² − 6x + 2 = x³ − x² − 5x + 2."
  - q: "f(x) = x³ + 2x² − 5x − 6. Which is a factor?"
    o: ["(x − 1)", "(x + 1)", "(x + 2)", "(x − 3)"]
    a: 1
    e: "f(−1) = −1 + 2 + 5 − 6 = 0, so (x + 1) is a factor."
  - q: "What does the factor theorem state?"
    o: ["If f(a) = 1, (x − a) is a factor", "If f(0) = 0, x is a root", "If f(a) = 0, then (x − a) is a factor of f(x)", "If f(a) = 0, then (x + a) is a factor"]
    a: 2
    e: "A root at x = a means (x − a) divides exactly."
  - q: "Find the remainder when x³ − 4x + 1 is divided by (x − 2)."
    o: ["−1", "0", "9", "1"]
    a: 3
    e: "f(2) = 8 − 8 + 1 = 1 (the remainder theorem gives the remainder as f(2))."
  - q: "f(x) = 2x³ − x² − 8x + 4. Show (2x − 1) is a factor. Which value should you substitute?"
    o: ["x = 1/2", "x = −1/2", "x = 2", "x = 1"]
    a: 0
    e: "(2x − 1) = 0 when x = 1/2. f(1/2) = 1/4 − 1/4 − 4 + 4 = 0."
  - q: "x³ − 6x² + 11x − 6 = 0 has root x = 1. What are the other roots?"
    o: ["x = −2 and x = −3", "x = 2 and x = 3", "x = 1 and x = 6", "x = 3 and x = −2"]
    a: 1
    e: "Dividing by (x − 1) gives x² − 5x + 6 = (x − 2)(x − 3)."
  - q: "What does a repeated root look like on a graph?"
    o: ["The curve crosses the axis at a steep angle", "An asymptote", "The curve touches the x-axis (turning point on the axis)", "A gap in the curve"]
    a: 2
    e: "E.g. y = (x − 1)²(x + 2) touches the x-axis at x = 1."
  - q: "Where does y = (x − 1)(x + 2)(x − 3) cross the y-axis?"
    o: ["(0, −6)", "(0, 1)", "(0, −1)", "(0, 6)"]
    a: 3
    e: "x = 0: (−1)(2)(−3) = 6."
  - q: "What are the asymptotes of y = 3/x?"
    o: ["x = 0 and y = 0", "x = 3 and y = 0", "y = 3 only", "x = 0 only"]
    a: 0
    e: "The curve approaches both axes but never meets them."
  - q: "y is inversely proportional to x. When x = 4, y = 5. Find y when x = 10."
    o: ["12.5", "2", "8", "0.5"]
    a: 1
    e: "y = k/x, so k = 20. When x = 10, y = 2."
  - q: "Describe the transformation from y = f(x) to y = f(x) − 4."
    o: ["Translation 4 right", "Stretch, scale factor 4", "Translation 4 down", "Translation 4 left"]
    a: 2
    e: "Subtracting outside the function moves the graph by (0, −4)."
  - q: "Describe the transformation from y = f(x) to y = f(x + 3)."
    o: ["Translation 3 right", "Translation 3 up", "Stretch, scale factor 3", "Translation 3 left"]
    a: 3
    e: "f(x + 3) is a translation by (−3, 0)."
  - q: "Describe the transformation from y = f(x) to y = 2f(x)."
    o: ["Stretch parallel to the y-axis, scale factor 2", "Stretch parallel to the x-axis, scale factor 2", "Stretch parallel to the x-axis, scale factor 1/2", "Translation 2 up"]
    a: 0
    e: "Multiplying outside the function stretches y-values."
  - q: "Describe the transformation from y = f(x) to y = f(3x)."
    o: ["Stretch parallel to the x-axis, scale factor 3", "Stretch parallel to the x-axis, scale factor 1/3", "Stretch parallel to the y-axis, scale factor 3", "Translation 3 left"]
    a: 1
    e: "Inside changes do the opposite: f(3x) squashes the graph by a factor of 1/3 horizontally."
  - q: "Describe the transformation from y = f(x) to y = −f(x)."
    o: ["Reflection in the y-axis", "Rotation 180°", "Reflection in the x-axis", "Translation down"]
    a: 2
    e: "All y-values change sign."
  - q: "y = f(x) passes through (4, 2). Which point is on y = f(−x)?"
    o: ["(4, −2)", "(−4, −2)", "(2, 4)", "(−4, 2)"]
    a: 3
    e: "Reflection in the y-axis changes the sign of x."
  - q: "y = f(x) has a minimum at (1, −3). Where is the minimum of y = 2f(x)?"
    o: ["(1, −6)", "(2, −3)", "(1, −3)", "(0.5, −3)"]
    a: 0
    e: "A vertical stretch doubles the y-coordinate."
  - q: "y = f(x) has a minimum at (6, 2). Where is the minimum of y = f(2x)?"
    o: ["(12, 2)", "(3, 2)", "(6, 4)", "(6, 1)"]
    a: 1
    e: "Horizontal stretch, scale factor 1/2: x-coordinate halves."
  - q: "What is the general shape of y = −x³ for large positive x?"
    o: ["It goes up to +∞", "It levels off", "It goes down to −∞", "It approaches zero"]
    a: 2
    e: "A negative cubic starts top left and ends bottom right."
  - q: "Divide x³ + x² − 10x + 8 by (x − 1)."
    o: ["x² − 2x − 8", "x² + 2x + 8", "x² + x − 10", "x² + 2x − 8"]
    a: 3
    e: "(x − 1)(x² + 2x − 8) = x³ + 2x² − 8x − x² − 2x + 8 = x³ + x² − 10x + 8."
  - q: "y is directly proportional to x². When x = 3, y = 18. What is y when x = 5?"
    o: ["50", "30", "25", "45"]
    a: 0
    e: "y = kx², so k = 2. When x = 5, y = 2 × 25 = 50."
  - q: "Where does y = x²(x − 4) meet the x-axis?"
    o: ["x = 4 only", "x = 0 (touches) and x = 4 (crosses)", "x = 0 and x = −4", "x = 2 and x = 4"]
    a: 1
    e: "x = 0 is a repeated root, so the curve touches there."
