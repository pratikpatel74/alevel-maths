id: "p1"
order: 1
year: 1
section: "P"
badge: "A·B"
spec: "A, B"
title: "Proof, indices and surds"
desc: "Proof by deduction, exhaustion and counter-example, the laws of indices, simplifying surds and rationalising denominators."
practicals: []
summary:
  - h: "Proof"
    p:
      - "**Proof by deduction**: start from known facts and use logical steps to reach the conclusion. E.g. show (n + 1)² − (n − 1)² = 4n by expanding."
      - "**Proof by exhaustion**: split into a finite set of cases and check **every** case, e.g. odd and even n."
      - "**Disproof by counter-example**: find **one** example that makes the statement false."
      - "Use n for any integer: **even** = 2n, **odd** = 2n + 1, **consecutive** = n, n + 1."
      - "Use the symbols ⇒ (implies), ⇐ (is implied by) and ⇔ (if and only if) correctly. End with a clear conclusion."
  - h: "Laws of indices"
    p:
      - "`aᵐ × aⁿ = aᵐ⁺ⁿ`, `aᵐ ÷ aⁿ = aᵐ⁻ⁿ`, `(aᵐ)ⁿ = aᵐⁿ`"
      - "`a⁰ = 1`, `a⁻ⁿ = 1/aⁿ`, `a^(1/n) = ⁿ√a`, `a^(m/n) = (ⁿ√a)ᵐ`"
      - "Example: 8^(2/3) = (∛8)² = 2² = 4. And 16^(−1/2) = 1/√16 = 1/4."
  - h: "Surds"
    p:
      - "`√(ab) = √a × √b` and `√(a/b) = √a / √b`"
      - "Simplify by taking out square factors: √48 = √16 × √3 = 4√3."
      - "**Rationalise** a denominator: multiply top and bottom by the surd, e.g. 6/√3 = 6√3/3 = 2√3."
      - "For a denominator like a + √b, multiply top and bottom by the **conjugate** a − √b, using (a + √b)(a − √b) = a² − b."
pitfalls:
  - "A counter-example only needs **one** case. Checking a few cases is **not** a proof that something is true."
  - "In proof by exhaustion, every possible case must be covered and stated."
  - "√a + √b is **not** √(a + b)."
  - "Negative index means **reciprocal**, not a negative number: 2⁻³ = 1/8."
examples:
  - q: "Prove that the sum of any two consecutive odd numbers is a multiple of 4."
    steps:
      - "Let the numbers be 2n + 1 and 2n + 3, where n is an integer."
      - "Sum = (2n + 1) + (2n + 3) = 4n + 4."
      - "4n + 4 = 4(n + 1), and n + 1 is an integer."
    a: "So the sum is a multiple of 4. ∎"
  - q: "Simplify (3 + √5)/(2 − √5), giving your answer in the form a + b√5."
    steps:
      - "Multiply top and bottom by the conjugate 2 + √5."
      - "Numerator: (3 + √5)(2 + √5) = 6 + 3√5 + 2√5 + 5 = 11 + 5√5."
      - "Denominator: (2 − √5)(2 + √5) = 4 − 5 = −1."
      - "(11 + 5√5) ÷ (−1) = −11 − 5√5."
    a: "−11 − 5√5"
questions:
  - q: "Simplify x⁵ × x³."
    o: ["x¹⁵", "x⁸", "x²", "2x⁸"]
    a: 1
    e: "Add indices when multiplying: x⁵⁺³ = x⁸."
  - q: "Evaluate 27^(2/3)."
    o: ["9", "18", "3", "81"]
    a: 0
    e: "27^(2/3) = (∛27)² = 3² = 9."
  - q: "Evaluate 4^(−3/2)."
    o: ["−8", "8", "1/8", "−1/8"]
    a: 2
    e: "4^(3/2) = (√4)³ = 8, so 4^(−3/2) = 1/8."
  - q: "Simplify (2x³)⁴."
    o: ["8x¹²", "2x¹²", "16x⁷", "16x¹²"]
    a: 3
    e: "2⁴ = 16 and (x³)⁴ = x¹²."
  - q: "Write √75 in its simplest form."
    o: ["5√3", "3√5", "25√3", "15√5"]
    a: 0
    e: "√75 = √25 × √3 = 5√3."
  - q: "Simplify √12 + √27."
    o: ["√39", "5√3", "6√3", "13√3"]
    a: 1
    e: "√12 = 2√3 and √27 = 3√3, so the sum is 5√3."
  - q: "Rationalise the denominator of 10/√5."
    o: ["10√5", "√5/2", "2√5", "5√2"]
    a: 2
    e: "10/√5 × √5/√5 = 10√5/5 = 2√5."
  - q: "Rationalise 1/(3 + √2)."
    o: ["(3 + √2)/7", "(3 − √2)/11", "3 − √2", "(3 − √2)/7"]
    a: 3
    e: "Multiply by (3 − √2): denominator = 9 − 2 = 7. So (3 − √2)/7."
  - q: "Expand and simplify (2 + √3)(2 − √3)."
    o: ["1", "7", "4 − √3", "−1"]
    a: 0
    e: "Difference of two squares: 4 − 3 = 1."
  - q: "Expand (1 + √2)²."
    o: ["3", "3 + 2√2", "1 + 2√2", "3 + √2"]
    a: 1
    e: "1 + 2√2 + 2 = 3 + 2√2."
  - q: "Write 1/x² as a power of x."
    o: ["x²", "x^(1/2)", "x⁻²", "−x²"]
    a: 2
    e: "A negative index means reciprocal: 1/x² = x⁻²."
  - q: "Write √x as a power of x."
    o: ["x²", "x⁻¹", "x⁻²", "x^(1/2)"]
    a: 3
    e: "A square root is a power of one half."
  - q: "Solve 2ˣ = 32."
    o: ["x = 5", "x = 16", "x = 6", "x = 4"]
    a: 0
    e: "2⁵ = 32."
  - q: "Simplify (x^(1/2) × x^(3/2)) ÷ x."
    o: ["x²", "x", "1", "x³"]
    a: 1
    e: "x^(1/2 + 3/2) = x², then ÷ x gives x."
  - q: "Which is a counter-example to 'n² + n + 41 is prime for every positive integer n'?"
    o: ["n = 1", "n = 10", "n = 40", "n = 2"]
    a: 2
    e: "40² + 40 + 41 = 1681 = 41². One counter-example disproves the statement."
  - q: "To prove 'n² − n is even for all integers n' by exhaustion, which cases are needed?"
    o: ["n = 1, 2, 3", "n positive only", "n = 0 only", "n even and n odd"]
    a: 3
    e: "Every integer is either even or odd, so checking both cases covers everything."
  - q: "Which expression represents any odd number, where n is an integer?"
    o: ["2n + 1", "2n", "n + 1", "n²"]
    a: 0
    e: "2n is always even, so 2n + 1 is always odd."
  - q: "What is needed to disprove a statement?"
    o: ["A general algebraic proof", "One counter-example", "Checking ten cases", "A diagram"]
    a: 1
    e: "A single case where it fails shows the statement isn't always true."
  - q: "Simplify 9^(1/2) × 8^(1/3)."
    o: ["5", "17", "6", "72"]
    a: 2
    e: "9^(1/2) = 3 and 8^(1/3) = 2, so 3 × 2 = 6."
  - q: "Simplify √50 − √18."
    o: ["√32", "4√2", "8√2", "2√2"]
    a: 3
    e: "√50 = 5√2 and √18 = 3√2, so the difference is 2√2."
  - q: "Express 8^x as a power of 2."
    o: ["2^(3x)", "2^(x+3)", "2^(x/3)", "6^x"]
    a: 0
    e: "8 = 2³, so 8ˣ = (2³)ˣ = 2³ˣ."
  - q: "Simplify (4x²y)^(1/2), for x, y > 0."
    o: ["2xy", "2x√y", "4x√y", "2x²√y"]
    a: 1
    e: "√4 × √x² × √y = 2x√y."
